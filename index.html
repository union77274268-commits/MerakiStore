/* ============================= STORAGE ============================= */

function useLocalState(key, initial){
  const [state, setState] = useState(()=>{
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    }catch(e){ return initial; }
  });
  useEffect(()=>{
    try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
  },[key,state]);
  return [state,setState];
}

/* ============================= ROUTER ============================= */

function useHashRoute(){
  const [hash, setHash] = useState(()=> window.location.hash || '#/home');
  useEffect(()=>{
    const onHash = () => setHash(window.location.hash || '#/home');
    window.addEventListener('hashchange', onHash);
    return ()=> window.removeEventListener('hashchange', onHash);
  },[]);
  return hash;
}
function navigate(path){
  window.location.hash = path;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function parseRoute(hash){
  const clean = hash.replace(/^#/,'');
  const [pathPart, queryPart] = clean.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart){
    queryPart.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
  }
  return {parts, query};
}

  const [upiAppChoice, setUpiAppChoice] = useLocalState('meraki_upi_app_choice', null);
  const [loggedIn, setLoggedIn] = useLocalState('meraki_logged_in', true);
  const [darkMode, setDarkMode] = useLocalState('meraki_dark_mode', false);
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark', darkMode);
    const meta = document.getElementById('themeColorMeta');
    if(meta) meta.setAttribute('content', darkMode ? '#151022' : '#ffffff');
  },[darkMode]);

  const showToast = useCallback((msg, icon)=>{
    setToast({msg, icon, key: uid()});
    clearTimeout(window.__meraki_toast_timer);
    window.__meraki_toast_timer = setTimeout(()=> setToast(null), 1800);
  },[]);

  const productMap = useMemo(()=>{
    const m = {}; products.forEach(p=> m[p.id]=p); return m;
  },[products]);

  const addToCart = useCallback((id, qty=1)=>{
    setCart(prev=>{
      const existing = prev.find(c=>c.id===id);
      if(existing){
        return prev.map(c=> c.id===id ? {...c, qty: clamp(c.qty+qty,1,20)} : c);
      }
      return [...prev, {id, qty}];
    });
    showToast('Added to cart', '🛒');
  },[setCart, showToast]);

  const setCartQty = useCallback((id, qty)=>{
    setCart(prev=>{
      if(qty<=0) return prev.filter(c=>c.id!==id);
      return prev.map(c=> c.id===id ? {...c, qty: clamp(qty,1,20)} : c);
    });
  },[setCart]);

  const removeFromCart = useCallback((id)=>{
    setCart(prev=> prev.filter(c=>c.id!==id));
    showToast('Removed from cart','🗑️');
  },[setCart, showToast]);

  const toggleWishlist = useCallback((id)=>{
    setWishlist(prev=>{
      if(prev.includes(id)){ showToast('Removed from wishlist','💔'); return prev.filter(x=>x!==id); }
      showToast('Added to wishlist','💜'); return [...prev, id];
    });
  },[setWishlist, showToast]);

  const moveWishlistToCart = useCallback((id)=>{
    addToCart(id,1);
    setWishlist(prev=> prev.filter(x=>x!==id));
  },[addToCart, setWishlist]);

  const cartLines = useMemo(()=> cart

    .filter(c=> c.product), [cart, productMap]);

  const subtotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.price*c.qty, 0), [cartLines]);
  const mrpTotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.mrp*c.qty, 0), [cartLines]);
  const savings = mrpTotal - subtotal;
  const deliveryCharge = subtotal===0 ? 0 : (subtotal >= FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_CHARGE);
  const packagingCharge = subtotal===0 ? 0 : PACKAGING_CHARGE;
  const total = subtotal + deliveryCharge + packagingCharge;
  const amountToFreeDelivery = Math.max(0, FREE_DELIVERY_THRESHOLD - subtotal);
  const cartCount = cart.reduce((s,c)=> s+c.qty, 0);

  const placeOrder = useCallback(()=>{
    const orderId = 'MERAKI' + Math.floor(20260000 + Math.random()*9999);
    const now = new Date();
    const needsVerification = paymentMethod==='upi' || paymentMethod==='upiApps';
    const paymentLabel = paymentMethod==='upiApps' && upiAppChoice ? upiAppChoice.label : PAYMENT_LABELS[paymentMethod] || paymentMethod;
    const order = {
      id: orderId,
      date: now.toISOString(),
      items: cartLines.map(c=> ({id:c.id, name:c.product.name, qty:c.qty, price:c.product.price, emoji:c.product.emoji, bg:c.product.bg})),
      subtotal, deliveryCharge, packagingCharge, total,
      deliveryType, paymentMethod, paymentLabel,
      paymentVerified: !needsVerification,
      address: {...address},
      status: 'Order Confirmed',
      statusSteps: ['Order Confirmed','Preparing Your Order','Out for Delivery','Delivered'],
      statusIndex: 0,
    };
    setOrders(prev=> [order, ...prev]);
    setCart([]);
    setUpiAppChoice(null);
    return order;
  },[cartLines, subtotal, deliveryCharge, packagingCharge, total, deliveryType, paymentMethod, upiAppChoice, address, setOrders, setCart, setUpiAppChoice]);

  const verifyOrderPayment = useCallback((orderId)=>{
    setOrders(prev=> prev.map(o=> o.id===orderId ? {...o, paymentVerified:true} : o));
  },[setOrders]);

  const updateOrderStatus = useCallback((orderId, newIndex)=>{
    setOrders(prev=> prev.map(o=>{
      if(o.id!==orderId) return o;
      const cancelled = newIndex===-1;
      return {...o, statusIndex: cancelled?0:newIndex, status: cancelled?'Cancelled':o.statusSteps[newIndex]};
    }));
  },[setOrders]);

  const upsertProduct = useCallback((product)=>{
    setProducts(prev=>{
      const exists = prev.some(p=>p.id===product.id);
      if(exists) return prev.map(p=> p.id===product.id ? product : p);
      return [product, ...prev];
    });
  },[setProducts]);

  const deleteProduct = useCallback((id)=>{
    setProducts(prev=> prev.filter(p=>p.id!==id));
  },[setProducts]);

  const upsertBanner = useCallback((banner)=>{
    setBanners(prev=>{
      const exists = prev.some(b=>b.id===banner.id);
      if(exists) return prev.map(b=> b.id===banner.id ? banner : b);
      return [...prev, banner];
    });
  },[setBanners]);

  const deleteBanner = useCallback((id)=>{
    setBanners(prev=> prev.filter(b=>b.id!==id));
  },[setBanners]);

  const reorderBanner = useCallback((id, direction)=>{
    setBanners(prev=>{
      const idx = prev.findIndex(b=>b.id===id);
      const swapIdx = idx + direction;
      if(idx<0 || swapIdx<0 || swapIdx>=prev.length) return prev;
      const next = [...prev];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      return next;
    });
  },[setBanners]);

  const value = {
    cart, cartLines, cartCount, subtotal, mrpTotal, savings, deliveryCharge, packagingCharge, total, amountToFreeDelivery,
    addToCart, setCartQty, removeFromCart,
    wishlist, toggleWishlist, moveWishlistToCart,
    orders, placeOrder, updateOrderStatus, verifyOrderPayment,
    address, setAddress, deliveryType, setDeliveryType, paymentMethod, setPaymentMethod,
    upiAppChoice, setUpiAppChoice,
    loggedIn, setLoggedIn, darkMode, setDarkMode,
    showToast, toast, productMap,
    products, setProducts, upsertProduct, deleteProduct,
    banners, setBanners, upsertBanner, deleteBanner, reorderBanner,
    storeSettings, setStoreSettings,
    viewMode, setViewMode,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function Toast(){
  const {toast} = useApp();
  const [current, setCurrent] = useState(null);
  const [visible, setVisible] = useState(false);
  const hideTimer = useRef(null);

  useEffect(()=>{
    if(toast){
      clearTimeout(hideTimer.current);
      setCurrent(toast);
      requestAnimationFrame(()=> requestAnimationFrame(()=> setVisible(true)));
    } else if(current){
      setVisible(false);
      hideTimer.current = setTimeout(()=> setCurrent(null), 320);
    }
    return ()=> clearTimeout(hideTimer.current);
  },[toast]);

  if(!current) return null;
  return (
    <div className={"fixed z-[80] left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 bg-[var(--ink)] text-white px-4 py-2.5 rounded-full shadow-xl text-sm font-semibold flex items-center gap-2 transition-all duration-300 ease-[cubic-bezier(.34,1.56,.64,1)] "+(visible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-3 scale-90')}>
      <span>{current.icon}</span><span>{current.msg}</span>
    </div>
  );
}

function CartButton(){
  const {cartCount} = useApp();
  const [bounce, setBounce] = useState(false);
  const prevCount = useRef(cartCount);
  useEffect(()=>{
    if(cartCount !== prevCount.current){
      setBounce(true);
      const t = setTimeout(()=> setBounce(false), 500);
      prevCount.current = cartCount;
      return ()=> clearTimeout(t);
    }
  },[cartCount]);
  return (
    <a href="#/cart" aria-label="Cart" className="relative w-10 h-10 rounded-full hover:bg-[var(--purple-light)] flex items-center justify-center focus-ring">
      <span className={"inline-block "+(bounce?'wiggle':'')}><Icon.Cart /></span>

  );
}

function ChangeLocationModal({onClose}){
  const {address, setAddress} = useApp();
  const [pin, setPin] = useState(address.pincode);
  const [area, setArea] = useState(address.area);
  const [autoDetected, setAutoDetected] = useState(false);

  const isComplete = /^\d{6}$/.test(pin);
  const serviceable = isServiceablePin(pin);

  useEffect(()=>{
    if(isComplete && PIN_TO_AREA[pin]){
      setArea(PIN_TO_AREA[pin]);
      setAutoDetected(true);
    } else {
      setAutoDetected(false);
    }
  },[pin]);

  return (
    <Modal onClose={onClose} title="Change delivery location">
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">PIN Code</label>
          <div className="relative mt-1">
            <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,6))}
              className={"w-full border rounded-lg pl-3 pr-9 py-2 text-sm focus-ring "+(isComplete && !serviceable ? 'border-[var(--danger)]' : 'border-[var(--line)]')} />
            {pin && (
              <button aria-label="Clear PIN code" onClick={()=>{setPin(''); setAutoDetected(false);}}
                className="absolute right-2 top-1/2 -translate-y-1/2 text-[var(--muted)] hover:text-[var(--ink)] w-5 h-5 flex items-center justify-center rounded-full hover:bg-black/5 focus-ring">
                <Icon.Close />
              </button>
            )}
          </div>
          {isComplete && !serviceable && (
            <div className="text-xs text-[var(--danger)] font-semibold mt-1.5 flex items-center gap-1">🚫 Sorry, we don't deliver to this PIN code yet. We currently serve Jaipur only.</div>
          )}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)] flex items-center gap-1.5">
            Area {autoDetected && <span className="text-[var(--green)] font-bold">· Auto-detected ✨</span>}
          </label>
          <input value={area} onChange={e=>{setArea(e.target.value); setAutoDetected(false);}} disabled={isComplete && !serviceable}
            className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring disabled:bg-gray-50 disabled:text-gray-400" />
        </div>
        <button onClick={()=>{ setAddress({...address, pincode:pin, area:area}); onClose(); }}
          disabled={!serviceable}
          className="btn-primary w-full py-2.5 focus-ring">{serviceable ? 'Save Location' : 'Not Serviceable'}</button>
      </div>
    </Modal>
  );
}

function Modal({onClose, title, children}){
  const [mounted, setMounted] = useState(false);
  const [closing, setClosing] = useState(false);

  useEffect(()=>{
    const raf = requestAnimationFrame(()=> requestAnimationFrame(()=> setMounted(true)));
    return ()=> cancelAnimationFrame(raf);
  },[]);

  const requestClose = useCallback(()=>{
    setClosing(true);
    setTimeout(()=> onClose(), 260);
  },[onClose]);

  useEffect(()=>{
    const onEsc = (e)=>{ if(e.key==='Escape') requestClose(); };
    document.addEventListener('keydown', onEsc);
    return ()=> document.removeEventListener('keydown', onEsc);
  },[requestClose]);

  const visible = mounted && !closing;

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] flex items-end md:items-center justify-center">
      <div className={"absolute inset-0 bg-black/40 transition-opacity duration-300 "+(visible?'opacity-100':'opacity-0')} onClick={requestClose}></div>
      <div className={"relative bg-white w-full md:w-[420px] md:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto transition-all duration-300 ease-[cubic-bezier(.22,.9,.32,1)] "+
        (visible ? 'translate-y-0 md:scale-100 opacity-100' : 'translate-y-full md:translate-y-3 md:scale-95 opacity-0')}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display font-bold text-lg">{title}</h3>
          <button onClick={requestClose} aria-label="Close" className="focus-ring w-7 h-7 flex items-center justify-center rounded-full hover:bg-black/5"><Icon.Close /></button>
        </div>
        {children}
      </div>
    </div>,
    document.body
  );
}

function BannerCarousel({banners}){
  const scrollRef = useRef(null);
  const [active, setActive] = useState(0);
  const [storeOpen, setStoreOpen] = useState(false);

  const onScroll = ()=>{
    const el = scrollRef.current;
    if(!el || el.clientWidth===0) return;
    setActive(Math.round(el.scrollLeft / el.clientWidth));
  };

  const goTo = (i)=>{
    const el = scrollRef.current;
    if(!el) return;
    el.scrollTo({left: i*el.clientWidth, behavior:'smooth'});
  };

  return (
    <div className="px-4 md:container-max md:mx-auto mt-4 relative group">
      <div ref={scrollRef} onScroll={onScroll} className="flex gap-3 overflow-x-auto scrollbar-none snap-x-row pb-1">
        {banners.map(banner=> (
          <div key={banner.id} className="snap-item flex-shrink-0 w-full rounded-2xl overflow-hidden relative bg-cover bg-center"
            style={{background: banner.image ? `url(${banner.image}) center/cover` : (banner.bg || 'linear-gradient(120deg,#EFE6FF,#F6EEFF)')}}>
            <div className="p-6 md:p-12 md:flex md:items-center md:justify-between relative z-10">
              <div className="max-w-md">
                <h1 className="font-display font-extrabold text-2xl md:text-4xl leading-tight">
                  {banner.title} <span className="text-[var(--danger)]">{banner.highlight}</span>
                </h1>
                <p className="text-sm md:text-base text-[var(--muted)] mt-3">{banner.subtitle}</p>
                <div className="flex gap-3 mt-5">
                  <a href={banner.ctaLink || '#/category/stationery'} className="btn-primary px-5 py-2.5 text-sm focus-ring">{banner.ctaLabel || 'Shop Now'}</a>
                  <button onClick={()=>setStoreOpen(true)} className="btn-secondary px-5 py-2.5 text-sm focus-ring">🏬 Store Pickup</button>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-3 text-7xl mt-6 md:mt-0">
                <span>🎒</span><span>🧸</span><span>🖍️</span>
              </div>
            </div>
          </div>
        ))}
      </div>
      {banners.length>1 && (
        <React.Fragment>
          <div className="flex justify-center gap-1.5 mt-3">
            {banners.map((b,i)=> (
              <button key={b.id} aria-label={"Go to banner "+(i+1)} onClick={()=>goTo(i)} className={"h-1.5 rounded-full transition-all focus-ring "+(i===active?'w-5 bg-[var(--purple)]':'w-1.5 bg-[var(--line)]')}></button>
            ))}
          </div>
          <button aria-label="Previous banner" onClick={()=>goTo(Math.max(0,active-1))} className="desktop-only absolute left-2 top-[40%] -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity focus-ring">‹</button>
          <button aria-label="Next banner" onClick={()=>goTo(Math.min(banners.length-1,active+1))} className="desktop-only absolute right-2 top-[40%] -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity focus-ring">›</button>
        </React.Fragment>
      )}
      {storeOpen && <StoreDetailsModal onClose={()=>setStoreOpen(false)} />}
    </div>
  );
}

function ExitIntentGuard(){
  const [show, setShow] = useState(false);

  useEffect(()=>{
    window.history.pushState({merakiExitGuard:true}, '');
    const onPopState = ()=>{
      setShow(true);
      window.history.pushState({merakiExitGuard:true}, '');
    };
    window.addEventListener('popstate', onPopState);
    return ()=> window.removeEventListener('popstate', onPopState);
  },[]);

  const onStay = ()=> setShow(false);
  const onLeave = ()=>{
    setShow(false);
    setTimeout(()=>{ window.history.go(-2); }, 50);
  };

  if(!show) return null;
  return (
    <Modal onClose={onStay} title="Leaving so soon? 🥺">
      <div className="text-center">
        <div className="text-4xl mb-2">🧸</div>
        <p className="text-sm text-[var(--muted)]">We'll miss you! Are you sure you want to leave Meraki?</p>
        <div className="flex gap-3 mt-5">
          <button onClick={onStay} className="flex-1 btn-primary py-2.5 text-sm focus-ring">Stay a little longer</button>
          <button onClick={onLeave} className="flex-1 btn-secondary py-2.5 text-sm focus-ring">Leave</button>
        </div>
      </div>
    </Modal>
  );
}

function CategoryPage({route}){
  const catId = route.parts[1] || 'stationery';
  const cat = CATEGORIES.find(c=>c.id===catId) || CATEGORIES[0];
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortOpen, setSortOpen] = useState(false);
  const [sort, setSort] = useState('popular');
  const [priceMax, setPriceMax] = useState(1000);
  const [brandFilter, setBrandFilter] = useState([]);
  const [inStockOnly, setInStockOnly] = useState(false);
  const [subFilter, setSubFilter] = useState('all');
  const [view, setView] = useState('grid');
  const {products} = useApp();

  useEffect(()=>{
    setSubFilter('all');
    setPriceMax(1000);
    setBrandFilter([]);
    setInStockOnly(false);
    setSort('popular');
  },[catId]);

  const base = products.filter(p=>p.category===catId);
  const subcats = useMemo(()=> Array.from(new Set(base.map(p=>p.sub))), [catId]);
  const brands = useMemo(()=> Array.from(new Set(base.map(p=>p.brand))), [catId]);

  let list = base.filter(p=> p.price<=priceMax);
  if(subFilter!=='all') list = list.filter(p=>p.sub===subFilter);
  if(brandFilter.length) list = list.filter(p=>brandFilter.includes(p.brand));
  if(inStockOnly) list = list.filter(p=>p.stock>0);

  if(sort==='price_low') list = [...list].sort((a,b)=>a.price-b.price);
  else if(sort==='price_high') list = [...list].sort((a,b)=>b.price-a.price);
  else if(sort==='newest') list = [...list].sort((a,b)=> b.id.localeCompare(a.id));
  else if(sort==='discount') list = [...list].sort((a,b)=> b.discount-a.discount);
  else list = [...list].sort((a,b)=> (b.tags.includes('bestseller')?1:0) - (a.tags.includes('bestseller')?1:0));

  const sortLabels = {popular:'Popular', price_low:'Price: Low to High', price_high:'Price: High to Low', newest:'Newest', discount:'Discount'};

  return (
    <div className="fade-in flex h-[calc(100vh-118px)] md:h-[calc(100vh-100px)] overflow-hidden">
      {/* Zepto-style left category rail — scrolls independently */}
      <div className="w-[72px] sm:w-[87px] flex-shrink-0 border-r border-[var(--line)] bg-white overflow-y-auto scrollbar-none h-full">
        {CATEGORIES.map(c=>{
          const active = c.id===catId;
          return (
            <a key={c.id} href={"#/category/"+c.id}
              className={"flex flex-col items-center gap-1 py-4 px-1 text-center border-l-[3px] transition-colors focus-ring "+
                (active ? 'border-[var(--purple)] bg-[var(--purple-light)]' : 'border-transparent hover:bg-gray-50')}>
              <div className={"text-xl transition-transform "+(active?'scale-110':'')}>{c.icon}</div>
              <div className={"text-[10px] font-bold leading-tight "+(active?'text-[var(--purple)]':'text-[var(--muted)]')}>{c.name}</div>
            </a>
          );
        })}
      </div>

      <div key={catId} className="flex-1 min-w-0 px-3 md:px-6 py-3 overflow-y-auto h-full fade-in">
        <div className="hidden md:block mb-2">
          <h1 className="font-display font-bold text-2xl">{cat.icon} {cat.name}</h1>
          <div className="text-sm text-[var(--muted)]">{list.length} products</div>
        </div>

        <div className="pb-2">
          <div className="flex items-center justify-between mb-2 gap-2">
            <button onClick={()=>setFiltersOpen(true)} className="chip flex items-center gap-1 focus-ring">🧰 Filters</button>
            <button onClick={()=>setSortOpen(true)} className="chip flex items-center gap-1 focus-ring !px-[13px]">Sort: {sortLabels[sort]} ▾</button>
            <div className="flex gap-1 ml-auto">
              <button onClick={()=>setView('grid')} className={"chip px-2 "+(view==='grid'?'active':'')}>▦</button>
              <button onClick={()=>setView('list')} className={"chip px-2 "+(view==='list'?'active':'')}>≡</button>
            </div>
          </div>
          <div className="text-xs text-[var(--muted)] mb-2">{list.length} Products {(subFilter!=='all'||brandFilter.length||inStockOnly) && <span className="text-[var(--purple)] font-semibold">· Filter Applied</span>}</div>
          {subcats.length>0 && (
            <div className="flex gap-2 overflow-x-auto scrollbar-none">
              <button onClick={()=>setSubFilter('all')} className={"chip "+(subFilter==='all'?'active':'')}>All</button>
              {subcats.map(s=> <button key={s} onClick={()=>setSubFilter(s)} className={"chip "+(subFilter===s?'active':'')}>{s}</button>)}
            </div>
          )}
        </div>
        <ProductGrid products={list} cols="grid-cols-2 lg:grid-cols-3" layout={view} />
      </div>

      {filtersOpen && (
        <Modal onClose={()=>setFiltersOpen(false)} title="Filters">
          <FilterPanel {...{subcats, subFilter, setSubFilter, priceMax, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}} />
          <button onClick={()=>setFiltersOpen(false)} className="btn-primary w-full py-2.5 mt-4 focus-ring">Apply Filters</button>
        </Modal>
      )}
      {sortOpen && (
        <Modal onClose={()=>setSortOpen(false)} title="Sort by">
          <div className="flex flex-col gap-1">
            {Object.entries(sortLabels).map(([k,v])=> (
              <button key={k} onClick={()=>{setSort(k); setSortOpen(false);}} className={"text-left px-3 py-2.5 rounded-lg text-sm font-semibold focus-ring "+(sort===k?'bg-[var(--purple-light)] text-[var(--purple)]':'hover:bg-gray-50')}>{v}</button>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

function FilterPanel({subcats, subFilter, setSubFilter, priceMax, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}){
  const toggleBrand = (b)=> setBrandFilter(prev=> prev.includes(b) ? prev.filter(x=>x!==b) : [...prev,b]);
  return (
    <div className="space-y-5">
      <div>
        <div className="font-bold text-sm mb-2">Categories</div>
        <div className="flex flex-col gap-1.5 text-sm">
          <label className="flex items-center gap-2"><input type="radio" checked={subFilter==='all'} onChange={()=>setSubFilter('all')} /> All</label>
          {subcats.map(s=> <label key={s} className="flex items-center gap-2"><input type="radio" checked={subFilter===s} onChange={()=>setSubFilter(s)} /> {s}</label>)}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Price</div>
        <input type="range" min="0" max="1000" value={priceMax} onChange={e=>setPriceMax(Number(e.target.value))} className="w-full accent-[var(--purple)]" />
        <div className="flex justify-between text-xs text-[var(--muted)]"><span>₹0</span><span>{priceMax>=1000?'₹1000+':inr(priceMax)}</span></div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Brand</div>
        <div className="flex flex-col gap-1.5 text-sm max-h-36 overflow-y-auto">
          {brands.map(b=> <label key={b} className="flex items-center gap-2"><input type="checkbox" checked={brandFilter.includes(b)} onChange={()=>toggleBrand(b)} /> {b}</label>)}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Availability</div>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={inStockOnly} onChange={()=>setInStockOnly(v=>!v)} /> In Stock</label>
      </div>
    </div>
  );
}

function ShareSheetModal({product, onClose}){
  const {showToast} = useApp();
  const url = window.location.href;
  const text = encodeURIComponent('Check out '+product.name+' on Meraki Stationery & Toys!');
  const encodedUrl = encodeURIComponent(url);
  const copy = ()=>{
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=> showToast('Link copied!','🔗')).catch(()=>{});
  };
  const nativeShare = ()=>{
    if(navigator.share) navigator.share({title:product.name, text:'Check out '+product.name+' on Meraki!', url}).catch(()=>{});
  };
  const options = [
    {label:'WhatsApp', icon:'💬', href:'https://wa.me/?text='+text+'%20'+encodedUrl},
    {label:'Facebook', icon:'📘', href:'https://www.facebook.com/sharer/sharer.php?u='+encodedUrl},
    {label:'X (Twitter)', icon:'🐦', href:'https://twitter.com/intent/tweet?text='+text+'&url='+encodedUrl},
    {label:'Instagram', icon:'📷', href:'https://instagram.com/'},
  ];
  return (
    <Modal onClose={onClose} title="Share this product">
      <div className="grid grid-cols-4 gap-3 mb-4">
        {options.map(o=> (
          <a key={o.label} href={o.href} target="_blank" rel="noopener noreferrer" className="flex flex-col items-center gap-1.5 focus-ring">
            <span className="w-12 h-12 rounded-full bg-[var(--purple-light)] flex items-center justify-center text-xl">{o.icon}</span>
            <span className="text-[10px] font-semibold text-center">{o.label}</span>
          </a>
        ))}
      </div>
      {typeof navigator !== 'undefined' && navigator.share && (
        <button onClick={nativeShare} className="btn-secondary w-full py-2.5 text-sm mb-2 focus-ring">📤 More Share Options</button>
      )}
      <button onClick={copy} className="btn-primary w-full py-2.5 text-sm focus-ring">🔗 Copy Link</button>

function CheckoutStepper({step}){
  const steps = ['Address','Payment','Confirm'];
  return (
    <div className="flex items-center gap-2 px-4 md:container-max md:mx-auto py-3 text-xs font-semibold">
      {steps.map((s,i)=>{
        const idx=i+1;
        const state = idx<step ? 'done' : idx===step ? 'active' : 'pending';
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-1.5">
              <span className={"w-5 h-5 rounded-full flex items-center justify-center text-[10px] "+
                (state==='done' ? 'bg-[var(--green)] text-white' : state==='active' ? 'bg-[var(--purple)] text-white' : 'bg-gray-200 text-gray-500')}>
                {state==='done' ? '✓' : idx}
              </span>
              <span className={state==='pending' ? 'text-[var(--muted)]' : ''}>{s}</span>
            </div>
            {idx<3 && <div className="flex-1 h-px bg-[var(--line)]"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

const UPI_VPA = '7231842081@okbizaxis';
const UPI_PAYEE_NAME = 'Prashant Punia';

// App-specific custom URI schemes so tapping a chosen app opens its own
// payment-confirmation screen (with amount prefilled) instead of its home screen.
// The generic 'upi://pay' scheme below is kept for the QR code, since that
// needs to stay app-agnostic so any UPI app's scanner can read it.
const UPI_APP_SCHEMES = {
  phonepe: 'phonepe://pay',
  gpay: 'tez://upi/pay',
  paytm: 'paytmmp://pay',
};

function buildUpiParams(amount, note){
  return {
    pa: UPI_VPA, pn: UPI_PAYEE_NAME, am: Number(amount).toFixed(2), cu: 'INR',
    tn: note || 'Meraki Order Payment', tr: 'MERAKI'+Date.now(),
  };
}

function buildUpiUri(amount, note){
  return 'upi://pay?' + new URLSearchParams(buildUpiParams(amount, note)).toString();
}

function buildUpiAppUri(appId, amount, note){
  const base = UPI_APP_SCHEMES[appId] || 'upi://pay';
  return base + '?' + new URLSearchParams(buildUpiParams(amount, note)).toString();
}

    <div className="rounded-lg flex items-center justify-center text-white font-extrabold flex-shrink-0"
      style={{width:size, height:size, fontSize:size*0.24, background:'#00BAF2'}}>Paytm</div>
  );
}

function UpiQr({amount}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current || typeof QRCode === 'undefined') return;
    ref.current.innerHTML = '';
    try{
      new QRCode(ref.current, {
        text: buildUpiUri(amount),
        width: 168, height: 168,
        colorDark: '#241A38', colorLight: '#ffffff',
      });
    }catch(e){ console.error('QR generation failed', e); }
  },[amount]);
  return <div ref={ref} className="flex items-center justify-center min-h-[168px] min-w-[168px]"></div>;
}

function UpiAppSelectorModal({onClose, onSelectApp}){
  const apps = [
    {id:'phonepe', label:'PhonePe', Badge:PhonePeBadge},
    {id:'gpay', label:'Google Pay', Badge:GPayBadge},
    {id:'paytm', label:'Paytm', Badge:PaytmBadge},

function statusColor(status){
  if(status==='Delivered') return 'green';
  if(status==='Cancelled') return 'danger';
  return 'amber';
}

function downloadInvoice(order, storeSettings){
  const s = storeSettings || DEFAULT_STORE_SETTINGS;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(108,63,197);
    doc.text(s.storeName, 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    y += 6; doc.text(s.addressLine+', '+s.area+', '+s.city+' - '+s.pincode, 14, y);
    y += 5; doc.text('Phone: '+s.phone+'  ·  '+s.email, 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 10; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,20,50);
    doc.text('TAX INVOICE', 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text('Order #'+order.id, 196, y, {align:'right'});

    y += 8;
    doc.text('Order Date: '+new Date(order.date).toLocaleString(), 14, y);
    y += 5;
    doc.text('Payment Method: '+(order.paymentLabel || PAYMENT_LABELS[order.paymentMethod] || order.paymentMethod), 14, y);
    y += 5;
    doc.text('Delivery Type: '+(order.deliveryType==='home'?'Home Delivery':'Store Pickup'), 14, y);

    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50); doc.text('Bill To:', 14, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90);
    y += 5; doc.text(order.address.name || '', 14, y);
    y += 5; doc.text((order.address.line1||'')+', '+(order.address.area||''), 14, y);
    y += 5; doc.text((order.address.city||'')+' - '+(order.address.pincode||''), 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50);
    doc.text('Item', 14, y); doc.text('Qty', 130, y, {align:'right'}); doc.text('Price', 160, y, {align:'right'}); doc.text('Total', 196, y, {align:'right'});
    y += 3; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(60,50,70);

    order.items.forEach(it=>{
      y += 8;
      if(y > 270){ doc.addPage(); y = 20; }
      const name = it.name.length > 48 ? it.name.slice(0,45)+'...' : it.name;
      doc.text(name, 14, y);
      doc.text(String(it.qty), 130, y, {align:'right'});
      doc.text(inr(it.price), 160, y, {align:'right'});
      doc.text(inr(it.price*it.qty), 196, y, {align:'right'});
    });

    y += 6; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.text('Subtotal', 160, y, {align:'right'}); doc.text(inr(order.subtotal), 196, y, {align:'right'});
    y += 6;
    doc.text('Delivery Charge', 160, y, {align:'right'}); doc.text(order.deliveryCharge===0?'FREE':inr(order.deliveryCharge), 196, y, {align:'right'});
    y += 6;
    doc.text('Packaging Charge', 160, y, {align:'right'}); doc.text(inr(order.packagingCharge), 196, y, {align:'right'});
    y += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,20,50);
    doc.text('Total Amount', 160, y, {align:'right'}); doc.text(inr(order.total), 196, y, {align:'right'});

    y += 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140,130,155);
    doc.text('Thank you for shopping with Meraki Stationery & Toys!', 14, y);

    doc.save('Invoice-'+order.id+'.pdf');
  } catch(e){
    console.error('Invoice generation failed', e);
  }
}

function SearchPage(){
  const route = parseRoute(window.location.hash);
  const q = (route.query.q||'').toLowerCase().trim();
  const [term, setTerm] = useState(q);
  const {products} = useApp();
  useEffect(()=> setTerm(q), [q]);

  const results = term ? products.filter(p=>
    p.name.toLowerCase().includes(term) ||
    p.category.toLowerCase().includes(term) ||
    p.sub.toLowerCase().includes(term) ||
    p.brand.toLowerCase().includes(term)
  ) : [];

  const onType = (e)=>{
    const v = e.target.value;
    setTerm(v.toLowerCase());
    window.history.replaceState(null,'', v.trim() ? '#/search?q='+encodeURIComponent(v.trim()) : '#/search');
  };

  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      <div className="desktop-only flex items-center bg-[#F5F2FB] rounded-xl px-3 py-2.5 gap-2 mb-4">
        <span className="text-[var(--muted)]">🔍</span>
        <input autoFocus value={term} onChange={onType} placeholder="Search for toys, stationery, art supplies..." className="bg-transparent outline-none text-sm w-full" />
      </div>
      {!term ? (
        <div className="text-center py-16 text-[var(--muted)]">
          <div className="text-4xl mb-2">🔎</div>
          <div className="text-sm">Start typing to search across all products.</div>
        </div>
      ) : (
        <>
          <div className="text-sm text-[var(--muted)] mb-3">{results.length} results for "{term}"</div>
          <ProductGrid products={results} />
        </>
      )}
    </div>
  );
}

function AddressBookModal({onClose}){
  const {address, setAddress, showToast} = useApp();
  const [addresses, setAddresses] = useLocalState('meraki_addresses', [
    {id:'addr1', label:'Home', name:address.name, phone:address.phone, line1:address.line1, area:address.area, landmark:address.landmark, pincode:address.pincode, city:address.city}
  ]);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({label:'', name:'', phone:'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur'});

  const startNew = ()=>{ setForm({label:'', name:'', phone:'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur'}); setEditing('new'); };
  const startEdit = (a)=>{ setForm(a); setEditing(a.id); };

  const save = ()=>{
    if(!form.name.trim() || !form.line1.trim() || !/^\d{6}$/.test(form.pincode||'')){
      showToast('Please fill name, address & a valid PIN','⚠️');
      return;
    }
    if(editing==='new'){
      setAddresses(prev=> [...prev, {...form, id:'addr'+Date.now()}]);
    } else {
      setAddresses(prev=> prev.map(a=> a.id===editing ? {...form, id:editing} : a));
    }
    setEditing(null);
  };

  const remove = (id)=>{
    setAddresses(prev=> prev.filter(a=>a.id!==id));
  };

  const setDefault = (a)=>{
    setAddress(prev=>({...prev, name:a.name, phone:a.phone, line1:a.line1, area:a.area, landmark:a.landmark, pincode:a.pincode, city:a.city}));
    showToast('Default delivery address updated','📍');
  };

  if(editing){
    return (
      <Modal onClose={()=>setEditing(null)} title={editing==='new' ? 'Add Address' : 'Edit Address'}>
        <div className="space-y-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Label (Home, Work, etc.)</label><input value={form.label} onChange={e=>setForm({...form,label:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Full Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value.replace(/\D/g,'').slice(0,10)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">House / Flat / Street</label><input value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Area</label><input value={form.area} onChange={e=>setForm({...form,area:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">PIN Code</label><input value={form.pincode} onChange={e=>setForm({...form,pincode:e.target.value.replace(/\D/g,'').slice(0,6)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <button onClick={save} className="btn-primary w-full py-2.5 focus-ring">Save Address</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal onClose={onClose} title="Saved Addresses">
      <div className="flex flex-col gap-2.5">
        {addresses.map(a=>{
          const isDefault = a.line1===address.line1 && a.pincode===address.pincode;
          return (
            <div key={a.id} className={"card p-3.5 "+(isDefault?'border-[var(--purple)] border-2':'')}>
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold">{a.label || 'Address'}</span>
                {isDefault && <Badge tone="green">Default</Badge>}
              </div>
              <div className="text-xs text-[var(--muted)] mt-1">{a.name} · +91 {a.phone}</div>
              <div className="text-xs text-[var(--muted)]">{a.line1}, {a.area}, {a.city} - {a.pincode}</div>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>setDefault(a)} disabled={isDefault} className="btn-secondary px-3 py-1.5 text-xs flex-1 focus-ring disabled:opacity-40">
                  {isDefault ? 'Currently Default' : 'Use for Delivery'}
                </button>
                <button onClick={()=>startEdit(a)} aria-label="Edit address" className="w-8 h-8 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring"><Icon.Edit/></button>
                <button onClick={()=>remove(a.id)} aria-label="Delete address" className="w-8 h-8 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring"><Icon.Close/></button>
              </div>
            </div>
          );
        })}
        <button onClick={startNew} className="btn-primary w-full py-2.5 mt-1 focus-ring">+ Add New Address</button>
      </div>
    </Modal>
  );
}

function EditProfileModal({onClose}){
  const {address, setAddress, showToast} = useApp();
  const [form, setForm] = useState({name:address.name, phone:address.phone, email:address.email||''});
  const [errors, setErrors] = useState({});

  const validate = ()=>{
    const e = {};
    if(!form.name.trim()) e.name = 'Name is required';
    if(!/^\d{10}$/.test(form.phone.trim())) e.phone = 'Enter a valid 10-digit phone number';
    if(form.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) e.email = 'Enter a valid email address';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const onSave = ()=>{
    if(!validate()) return;
    setAddress({...address, ...form});
    showToast('Profile updated', '✅');
    onClose();
  };

  return (
    <Modal onClose={onClose} title="Edit Profile">
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Full Name</label>
          <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          {errors.name && <div className="text-xs text-[var(--danger)] mt-1">{errors.name}</div>}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Phone</label>
          <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value.replace(/\D/g,'').slice(0,10)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          {errors.phone && <div className="text-xs text-[var(--danger)] mt-1">{errors.phone}</div>}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Email (optional)</label>
          <input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          {errors.email && <div className="text-xs text-[var(--danger)] mt-1">{errors.email}</div>}
        </div>
        <button onClick={onSave} className="btn-primary w-full py-2.5 focus-ring">Save Changes</button>
      </div>
    </Modal>
  );

function AdminDashboard(){
  const {orders, products} = useApp();
  const totalRevenue = orders.reduce((s,o)=> s+o.total, 0);
  const pendingOrders = orders.filter(o=> o.status!=='Delivered' && o.status!=='Cancelled').length;
  const lowStock = products.filter(p=> p.stock <= 20);
  const recent = orders.slice(0,6);

  return (
    <div className="fade-in max-w-5xl">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label="Total Orders" value={orders.length} icon="📦" tone="purple" />
        <StatCard label="Total Revenue" value={inr(totalRevenue)} icon="💰" tone="green" />
        <StatCard label="Pending Orders" value={pendingOrders} icon="⏳" tone="amber" />
        <StatCard label="Products Listed" value={products.length} icon="🏷️" tone="purple" />
      </div>

      {lowStock.length>0 && (
        <div className="card p-4 mt-4 border-amber-200">
          <div className="font-bold text-sm mb-2 flex items-center gap-2">⚠️ Low Stock Alert</div>
          <div className="flex flex-wrap gap-2">
            {lowStock.slice(0,8).map(p=> (
              <a key={p.id} href="#/admin/products" className="chip bg-amber-50 border-amber-200 focus-ring">{p.name} · {p.stock} left</a>
            ))}
          </div>
        </div>
      )}

      <div className="card p-4 mt-4">
        <div className="flex items-center justify-between mb-3">
          <div className="font-bold text-sm">Recent Orders</div>
          <a href="#/admin/orders" className="text-xs font-bold text-[var(--purple)] focus-ring">View All ›</a>
        </div>
        {recent.length===0 ? (
          <div className="text-sm text-[var(--muted)] text-center py-6">No orders yet.</div>
        ) : (
          <div className="flex flex-col gap-2">
            {recent.map(o=> (
              <div key={o.id} className="flex items-center justify-between text-sm py-2 border-b border-[var(--line)] last:border-0">
                <div>
                  <div className="font-semibold">#{o.id}</div>

                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function AdminProductFormModal({product, onClose}){
  const {upsertProduct, showToast} = useApp();
  const [form, setForm] = useState(product ? {...product, price:String(product.price), mrp:String(product.mrp), stock:String(product.stock)} : emptyProductForm());
  const isEdit = Boolean(product);

  const save = ()=>{
    if(!form.name.trim() || !form.sub.trim() || !form.brand.trim() || !form.price || !form.mrp){
      showToast('Please fill in all required fields','⚠️');
      return;
    }
    const price = Number(form.price), mrp = Number(form.mrp);
    const discount = mrp>0 ? Math.round(((mrp-price)/mrp)*100) : 0;
    const finalProduct = {
      ...form,
      id: form.id || ('p'+uid()),
      price, mrp, discount,
      stock: Number(form.stock)||0,
      rating: form.rating || 4.5,
      reviews: form.reviews || 0,
      tags: form.isBestseller ? ['bestseller'] : (form.tags||[]),
    };
    delete finalProduct.isBestseller;
    upsertProduct(finalProduct);
    showToast(isEdit ? 'Product updated' : 'Product added', '✅');
    onClose();
  };

  return (
    <Modal onClose={onClose} title={isEdit ? 'Edit Product' : 'Add Product'}>
      <div className="space-y-3">
        <div><label className="text-xs font-semibold text-[var(--muted)]">Product Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Category</label>
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
              {CATEGORIES.map(c=> <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Sub-category</label><input value={form.sub} onChange={e=>setForm({...form,sub:e.target.value})} placeholder="e.g. Notebooks" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Brand</label><input value={form.brand} onChange={e=>setForm({...form,brand:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Stock Quantity</label><input type="number" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>

          <div><label className="text-xs font-semibold text-[var(--muted)]">Selling Price (₹)</label><input type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>

              </div>
              <button onClick={()=>openEdit(p)} aria-label="Edit product" className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring flex-shrink-0"><Icon.Edit/></button>
              <button onClick={()=>setDeleteConfirm(p)} aria-label="Delete product" className="w-9 h-9 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring flex-shrink-0"><Icon.Close/></button>
            </div>
          </div>
        ))}
        {filtered.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No products match your search.</div>}
      </div>

      {formOpen && <AdminProductFormModal product={editingProduct} onClose={()=>setFormOpen(false)} />}
      {deleteConfirm && (
        <Modal onClose={()=>setDeleteConfirm(null)} title="Delete Product">
          <p className="text-sm text-[var(--muted)]">Delete <b>{deleteConfirm.name}</b>? This can't be undone.</p>
          <div className="flex gap-3 mt-5">
            <button onClick={()=>setDeleteConfirm(null)} className="flex-1 btn-secondary py-2.5 text-sm focus-ring">Cancel</button>
            <button onClick={confirmDelete} className="flex-1 py-2.5 text-sm font-bold text-white bg-[var(--danger)] rounded-2xl focus-ring">Delete</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

const ORDER_STATUS_STEPS = ['Order Confirmed','Preparing Your Order','Out for Delivery','Delivered'];

function AdminOrderDetailModal({order, onClose}){
  const {updateOrderStatus, storeSettings} = useApp();
  return (
    <Modal onClose={onClose} title={'Order #'+order.id}>
      <div className="space-y-4 text-sm">
        <div>
          <div className="font-bold mb-1.5">Update Status</div>
          <div className="flex flex-wrap gap-2">
            {ORDER_STATUS_STEPS.map((s,i)=> (
              <button key={s} onClick={()=>updateOrderStatus(order.id, i)}
                className={"chip "+((order.statusIndex===i && order.status!=='Cancelled')?'active':'')}>{s}</button>
            ))}
            <button onClick={()=>updateOrderStatus(order.id, -1)} className={"chip "+(order.status==='Cancelled'?'active bg-[var(--danger)] border-[var(--danger)]':'')}>Cancel Order</button>
          </div>
        </div>
        <div className="card p-3.5">
          <div className="font-bold mb-1">Customer & Delivery</div>
          <div className="text-xs text-[var(--muted)]">{order.address.name} · +91 {order.address.phone}</div>
          <div className="text-xs text-[var(--muted)]">{order.address.line1}, {order.address.area}, {order.address.city} - {order.address.pincode}</div>
          <div className="text-xs text-[var(--muted)] mt-1">Payment: {order.paymentLabel || PAYMENT_LABELS[order.paymentMethod]} {order.paymentVerified===false && <Badge tone="amber">Pending</Badge>} · {order.deliveryType==='home'?'Home Delivery':'Store Pickup'}</div>
        </div>
        <div className="card p-3.5">
          <div className="font-bold mb-2">Items</div>
          {order.items.map(it=> (
            <div key={it.id} className="flex justify-between text-xs py-1"><span className="text-[var(--muted)]">{it.name} x{it.qty}</span><span>{inr(it.price*it.qty)}</span></div>
          ))}
          <div className="border-t border-dashed border-[var(--line)] my-2"></div>
          <div className="flex justify-between font-bold text-sm"><span>Total</span><span>{inr(order.total)}</span></div>
        </div>
        <button onClick={()=>downloadInvoice(order, storeSettings)} className="btn-secondary w-full py-2.5 text-sm focus-ring">⬇️ Download Invoice</button>
      </div>
    </Modal>
  );
}

function AdminOrders(){
  const {orders} = useApp();
  const [statusFilter, setStatusFilter] = useState('all');
  const [selected, setSelected] = useState(null);

  const filtered = statusFilter==='all' ? orders : orders.filter(o=>o.status===statusFilter);
  const statuses = ['all', ...ORDER_STATUS_STEPS, 'Cancelled'];

  return (
    <div className="fade-in max-w-5xl">
      <div className="flex gap-2 overflow-x-auto scrollbar-none mb-4">
        {statuses.map(s=> (
          <button key={s} onClick={()=>setStatusFilter(s)} className={"chip "+(statusFilter===s?'active':'')}>{s==='all'?'All Orders':s}</button>
        ))}
      </div>
      <div className="flex flex-col gap-2">
        {filtered.map(o=> (
          <button key={o.id} onClick={()=>setSelected(o)} className="card p-3.5 flex items-center gap-3 text-left w-full focus-ring">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-bold">#{o.id}</div>
              <div className="text-xs text-[var(--muted)]">{o.address.name} · {new Date(o.date).toLocaleDateString()} · {o.items.length} items</div>
            </div>
            <span className="font-bold text-sm">{inr(o.total)}</span>
            <Badge tone={statusColor(o.status)}>{o.status}</Badge>
          </button>
        ))}
        {filtered.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No orders in this status.</div>}
      </div>
      {selected && <AdminOrderDetailModal order={selected} onClose={()=>setSelected(null)} />}
    </div>
  );
}

function emptyBannerForm(){
  return {id:'', active:true, title:'', highlight:'', subtitle:'', ctaLabel:'Shop Now', ctaLink:'#/category/stationery', bg:'#EFE6FF', image:null};
}

function AdminBannerFormModal({banner, onClose}){
  const {upsertBanner, showToast} = useApp();
  const [form, setForm] = useState(banner ? {...banner} : emptyBannerForm());
  const isEdit = Boolean(banner);

  const onImageUpload = (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('Please choose an image under 2MB','⚠️'); return; }
    const reader = new FileReader();
    reader.onload = ()=> setForm(prev=>({...prev, image: reader.result}));
    reader.readAsDataURL(file);
  };

  const save = ()=>{
    if(!form.title.trim()){ showToast('Please add a banner title','⚠️'); return; }
    const finalBanner = {...form, id: form.id || ('b'+uid()), bg: form.bg.startsWith('linear') ? form.bg : `linear-gradient(120deg, ${form.bg}, #ffffff)`};
    upsertBanner(finalBanner);
    showToast(isEdit ? 'Banner updated' : 'Banner added', '✅');
    onClose();
  };

  return (
    <Modal onClose={onClose} title={isEdit ? 'Edit Banner' : 'Add Banner'}>
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Banner Image (optional)</label>
          {form.image ? (
            <div className="mt-1 relative rounded-lg overflow-hidden border border-[var(--line)]">
              <img src={form.image} alt="Banner preview" className="w-full h-28 object-cover" />
              <button type="button" onClick={()=>setForm({...form,image:null})} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 shadow flex items-center justify-center focus-ring"><Icon.Close/></button>
            </div>
          ) : (
            <label className="mt-1 flex flex-col items-center justify-center gap-1 border-2 border-dashed border-[var(--line)] rounded-lg h-24 cursor-pointer hover:bg-gray-50 focus-ring">
              <span className="text-lg">🖼️</span>
              <span className="text-xs font-semibold text-[var(--muted)]">Tap to upload an image</span>
              <input type="file" accept="image/*" onChange={onImageUpload} className="hidden" />
            </label>
          )}
          <div className="text-[10px] text-[var(--muted)] mt-1">If no image is uploaded, the background colour below is used instead.</div>
        </div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Everything they need. Delivered with" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Highlight (coloured text)</label><input value={form.highlight} onChange={e=>setForm({...form,highlight:e.target.value})} placeholder="Care & Happiness! 💗" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Subtitle</label><input value={form.subtitle} onChange={e=>setForm({...form,subtitle:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Button Label</label><input value={form.ctaLabel} onChange={e=>setForm({...form,ctaLabel:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Button Link</label><input value={form.ctaLink} onChange={e=>setForm({...form,ctaLink:e.target.value})} placeholder="#/category/toys" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Background Colour</label>
          <input type="color" value={form.bg.startsWith('#')?form.bg:'#EFE6FF'} onChange={e=>setForm({...form,bg:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg h-[38px] px-1 focus-ring" />
        </div>
        <label className="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" checked={form.active} onChange={e=>setForm({...form,active:e.target.checked})} /> Active (visible on homepage)</label>
        <button onClick={save} className="btn-primary w-full py-2.5 focus-ring">{isEdit ? 'Save Changes' : 'Add Banner'}</button>
      </div>
    </Modal>
  );
}

function AdminBanners(){
  const {banners, deleteBanner, reorderBanner, showToast} = useApp();
  const [formOpen, setFormOpen] = useState(false);
  const [editingBanner, setEditingBanner] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const openAdd = ()=>{ setEditingBanner(null); setFormOpen(true); };
  const openEdit = (b)=>{ setEditingBanner(b); setFormOpen(true); };
  const confirmDelete = ()=>{ deleteBanner(deleteConfirm.id); showToast('Banner deleted','🗑️'); setDeleteConfirm(null); };

  return (
    <div className="fade-in max-w-3xl">
      <div className="flex justify-between items-center mb-4">
        <div className="text-xs text-[var(--muted)]">{banners.length} banner{banners.length!==1?'s':''} · order shown here matches the homepage carousel</div>
        <button onClick={openAdd} className="btn-primary px-4 py-2 text-sm focus-ring">+ Add Banner</button>
      </div>
      <div className="flex flex-col gap-3">
        {banners.map((b,i)=> (
          <div key={b.id} className="card p-4">
            <div className="rounded-xl p-4 mb-3 bg-cover bg-center" style={{background: b.image ? `url(${b.image}) center/cover` : b.bg}}>
              <div className="font-display font-bold">{b.title} <span className="text-[var(--danger)]">{b.highlight}</span></div>
              <div className="text-xs text-[var(--muted)] mt-1">{b.subtitle}</div>
            </div>
            <div className="flex items-center justify-between flex-wrap gap-2">
              <Badge tone={b.active ? 'green' : 'amber'}>{b.active ? 'Active' : 'Hidden'}</Badge>
              <div className="flex gap-2">
                <button onClick={()=>reorderBanner(b.id,-1)} disabled={i===0} aria-label="Move up" className="w-9 h-9 rounded-full bg-gray-100 text-[var(--ink)] flex items-center justify-center focus-ring disabled:opacity-30">↑</button>
                <button onClick={()=>reorderBanner(b.id,1)} disabled={i===banners.length-1} aria-label="Move down" className="w-9 h-9 rounded-full bg-gray-100 text-[var(--ink)] flex items-center justify-center focus-ring disabled:opacity-30">↓</button>
                <button onClick={()=>openEdit(b)} className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring"><Icon.Edit/></button>
                <button onClick={()=>setDeleteConfirm(b)} className="w-9 h-9 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring"><Icon.Close/></button>
              </div>
            </div>
          </div>
        ))}
        {banners.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No banners yet. Add one to promote a sale or new arrivals.</div>}
      </div>

      {formOpen && <AdminBannerFormModal banner={editingBanner} onClose={()=>setFormOpen(false)} />}
      {deleteConfirm && (
        <Modal onClose={()=>setDeleteConfirm(null)} title="Delete Banner">
          <p className="text-sm text-[var(--muted)]">Delete this banner? This can't be undone.</p>
          <div className="flex gap-3 mt-5">
            <button onClick={()=>setDeleteConfirm(null)} className="flex-1 btn-secondary py-2.5 text-sm focus-ring">Cancel</button>
            <button onClick={confirmDelete} className="flex-1 py-2.5 text-sm font-bold text-white bg-[var(--danger)] rounded-2xl focus-ring">Delete</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AdminSettings(){
  const {storeSettings, setStoreSettings, showToast} = useApp();
  const [form, setForm] = useState(storeSettings);

  const save = ()=>{
    setStoreSettings(form);
    showToast('Store settings saved','✅');
  };

  const field = (key, label, placeholder)=> (
    <div>
      <label className="text-xs font-semibold text-[var(--muted)]">{label}</label>
      <input value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} placeholder={placeholder}
        className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
    </div>
  );

  return (
    <div className="fade-in max-w-lg">
      <div className="card p-5 space-y-3">
        {field('storeName','Store Name')}
        {field('addressLine','Address Line')}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('area','Area')}
          {field('city','City')}
        </div>
        {field('pincode','PIN Code')}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('phone','Phone')}
          {field('email','Email')}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('hoursWeekday','Weekday Hours')}
          {field('hoursSunday','Sunday Hours')}
        </div>
        <button onClick={save} className="btn-primary w-full py-2.5 mt-2 focus-ring">Save Store Settings</button>
      </div>
    </div>
  );
}

function AdminRoot({route}){
  const [adminAuthed, setAdminAuthed] = useLocalState('meraki_admin_authed', false);
  if(!route.parts[1]){ navigate('#/admin/dashboard'); }
  if(!adminAuthed) return <AdminLogin onSuccess={()=>setAdminAuthed(true)} />;
  return <AdminShell route={route} onExit={()=>{ setAdminAuthed(false); navigate('#/home'); }} />;
}

/* ============================= END ADMIN PANEL ============================= */

function PageRouter({route}){
  const parts = route.parts;
  const top = parts[0] || 'home';
  switch(top){
    case 'home': return <HomePage />;
    case 'category': return <CategoryPage route={route} />;
    case 'product': return <ProductPage route={route} />;
    case 'cart': return <CartPage />;
    case 'checkout':
      if(parts[1]==='payment') return <CheckoutPaymentPage />;
      if(parts[1]==='confirm') return <CheckoutConfirmPage />;
      return <CheckoutAddressPage />;
    case 'order-confirmation': return <OrderConfirmationPage route={route} />;
    case 'orders':
      if(parts[1]) return <OrderDetailPage route={route} />;
      return <OrdersPage />;
    case 'search': return <SearchPage />;
    case 'wishlist': return <WishlistPage />;
    case 'account': return <AccountPage />;
    default: return <HomePage />;
  }
}

function LoggedOutScreen(){
  const {setLoggedIn} = useApp();
  const onLogin = ()=>{
    setLoggedIn(true);
    navigate('#/home');
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in" style={{background:'linear-gradient(160deg,#F6EEFF,#FBFAFE)'}}>
      <LogoBlock />
      <div className="text-6xl mt-8 mb-2">👋</div>
      <h1 className="font-display font-bold text-xl mt-2">You've been logged out</h1>
      <p className="text-sm text-[var(--muted)] mt-2 max-w-xs">Your cart, wishlist and orders are safe. Log back in anytime to pick up where you left off.</p>
      <button onClick={onLogin} className="btn-primary px-8 py-3 text-sm mt-6 focus-ring">Log In Again</button>
    </div>
  );
}

function AppShell({route, hash}){
  const {loggedIn} = useApp();
  useEffect(()=>{
    window.scrollTo({top:0, left:0, behavior:'auto'});
  },[hash]);
  if(route.parts[0]==='admin') return <AdminRoot route={route} />;
  const isCheckoutOrConfirm = route.parts[0]==='checkout' || route.parts[0]==='order-confirmation';
  if(!loggedIn) return <LoggedOutScreen />;
  const transitionKey = route.parts[0]==='category' ? 'category' : hash;
  return (
    <div className="min-h-screen flex flex-col">
      <MobileHeader route={route} />
      <DesktopHeader route={route} />
      <div className="flex-1">
        <div key={transitionKey} className="page-transition">
          <PageRouter route={route} />
        </div>
      </div>
      {!isCheckoutOrConfirm && <div className="mobile-only h-14"></div>}
      {!isCheckoutOrConfirm && <BottomNav route={route} />}
      <Toast />
    </div>
  );
}

function App(){
  const hash = useHashRoute();
  const route = parseRoute(hash);
  return (
    <AppProvider>
      <AppShell route={route} hash={hash} />
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
