function AdminBanners(){
  const { showToast } = useApp();
  const [banners, setBanners] = useState([]);
  const [loading, setLoading] = useState(true);
  const [formOpen, setFormOpen] = useState(false);
  const [editingBanner, setEditingBanner] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const loadBanners = ()=>{
    setLoading(true);
    sbAdmin.from('storefront_banners').select('*').eq('owner_id', SHOP_OWNER_ID).order('sort_order').then(({data, error})=>{
      if(!error) setBanners((data||[]).map(mapDbBanner));
      setLoading(false);
    });
  };

  useEffect(()=>{ loadBanners(); },[]);

  const openAdd = ()=>{ setEditingBanner(null); setFormOpen(true); };
  const openEdit = (b)=>{ setEditingBanner(b); setFormOpen(true); };

  const onSaved = (banner)=>{
    setBanners(prev=>{
      const exists = prev.some(b=>b.id===banner.id);
      return exists ? prev.map(b=> b.id===banner.id ? banner : b) : [...prev, banner].sort((a,b)=>a.sortOrder-b.sortOrder);
    });
  };

  const confirmDelete = async ()=>{
    const { error } = await sbAdmin.from('storefront_banners').delete().eq('id', deleteConfirm.id);
    if(error){ showToast('Could not delete banner','⚠️'); return; }
    setBanners(prev=> prev.filter(b=>b.id!==deleteConfirm.id));
    showToast('Banner deleted','🗑️');
    setDeleteConfirm(null);
  };

  const reorder = async (id, direction)=>{
    const idx = banners.findIndex(b=>b.id===id);
    const swapIdx = idx + direction;
    if(idx<0 || swapIdx<0 || swapIdx>=banners.length) return;
    const a = banners[idx], b = banners[swapIdx];
    const next = [...banners];
    [next[idx], next[swapIdx]] = [{...b, sortOrder:a.sortOrder}, {...a, sortOrder:b.sortOrder}];
    setBanners(next);
    await sbAdmin.from('storefront_banners').update({ sort_order: a.sortOrder }).eq('id', b.id);
    await sbAdmin.from('storefront_banners').update({ sort_order: b.sortOrder }).eq('id', a.id);
  };

  return (
    <div className="fade-in max-w-3xl">
      <div className="flex justify-between items-center mb-4">
        <div className="text-xs text-[var(--muted)]">{banners.length} banner{banners.length!==1?'s':''} · order shown here matches the homepage carousel</div>
        <button onClick={openAdd} className="btn-primary px-4 py-2 text-sm focus-ring">+ Add Banner</button>
      </div>
      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-10">Loading banners…</div>
      ) : (
        <div className="flex flex-col gap-3">
          {banners.map((b,i)=> (
            <div key={b.id} className="card p-4">
              <div className="rounded-xl p-4 mb-3 bg-cover bg-center" style={{background: b.image ? `url(${b.image}) center/cover` : b.bg}}>
                <div className="font-display font-bold">{b.title} <span className="text-[var(--danger)]">{b.highlight}</span></div>
                <div className="text-xs text-[var(--muted)] mt-1">{b.subtitle}</div>
              </div>
              <div className="flex items-center justify-between flex-wrap gap-2">
                <Badge tone={b.active ? 'green' : 'amber'}>{b.active ? 'Active' : 'Hidden'}</Badge>
                <div className="flex gap-2">
                  <button onClick={()=>reorder(b.id,-1)} disabled={i===0} aria-label="Move up" className="w-9 h-9 rounded-full bg-gray-100 text-[var(--ink)] flex items-center justify-center focus-ring disabled:opacity-30">↑</button>
                  <button onClick={()=>reorder(b.id,1)} disabled={i===banners.length-1} aria-label="Move down" className="w-9 h-9 rounded-full bg-gray-100 text-[var(--ink)] flex items-center justify-center focus-ring disabled:opacity-30">↓</button>
                  <button onClick={()=>openEdit(b)} className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring"><Icon.Edit/></button>
                  <button onClick={()=>setDeleteConfirm(b)} className="w-9 h-9 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring"><Icon.Close/></button>
                </div>
              </div>
            </div>
          ))}
          {banners.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No banners yet. Add one to promote a sale or new arrivals.</div>}
        </div>
      )}

      {formOpen && <AdminBannerFormModal banner={editingBanner} sortOrder={banners.length} onSaved={onSaved} onClose={()=>setFormOpen(false)} />}
      {deleteConfirm && (
        <Modal onClose={()=>setDeleteConfirm(null)} title="Delete Banner">
          <p className="text-sm text-[var(--muted)]">Delete this banner? This can't be undone.</p>
          <div className="flex gap-3 mt-5">
            <button onClick={()=>setDeleteConfirm(null)} className="flex-1 btn-secondary py-2.5 text-sm focus-ring">Cancel</button>
            <button onClick={confirmDelete} className="flex-1 py-2.5 text-sm font-bold text-white bg-[var(--danger)] rounded-2xl focus-ring">Delete</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AdminSettings(){
  const { showToast } = useApp();
  const [form, setForm] = useState(DEFAULT_STORE_SETTINGS);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{
    sbAdmin.from('storefront_settings').select('*').eq('owner_id', SHOP_OWNER_ID).maybeSingle().then(({data, error})=>{
      if(!error && data) setForm(mapDbStoreSettings(data));
      setLoading(false);
    });
  },[]);

  const save = async ()=>{
    setSaving(true);
    const { error } = await sbAdmin.from('storefront_settings').update({
      store_name: form.storeName, address_line: form.addressLine, area: form.area, city: form.city,
      pincode: form.pincode, phone: form.phone, email: form.email,
      hours_weekday: form.hoursWeekday, hours_sunday: form.hoursSunday,
    }).eq('owner_id', SHOP_OWNER_ID);
    setSaving(false);
    if(error){ showToast('Could not save settings','⚠️'); return; }
    showToast('Store settings saved','✅');
  };

  const field = (key, label, placeholder)=> (
    <div>
      <label className="text-xs font-semibold text-[var(--muted)]">{label}</label>
      <input value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} placeholder={placeholder}
        className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
    </div>
  );

  if(loading){
    return <div className="fade-in max-w-lg text-center text-sm text-[var(--muted)] py-10">Loading settings…</div>;
  }

  return (
    <div className="fade-in max-w-lg">
      <div className="card p-5 space-y-3">
        {field('storeName','Store Name')}
        {field('addressLine','Address Line')}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('area','Area')}
          {field('city','City')}
        </div>
        {field('pincode','PIN Code')}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('phone','Phone')}
          {field('email','Email')}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {field('hoursWeekday','Weekday Hours')}
          {field('hoursSunday','Sunday Hours')}
        </div>
        <button onClick={save} disabled={saving} className="btn-primary w-full py-2.5 mt-2 focus-ring">{saving ? 'Saving…' : 'Save Store Settings'}</button>
      </div>
    </div>
  );
}

function AdminRoot({route}){
  const [adminSession, setAdminSession] = useState(undefined); // undefined = checking, null = signed out
  if(!route.parts[1]){ navigate('#/admin/dashboard'); }

  useEffect(()=>{
    sbAdmin.auth.getSession().then(({data})=> setAdminSession(data.session));
    const { data: sub } = sbAdmin.auth.onAuthStateChange((_event, sess)=> setAdminSession(sess));
    return ()=> sub.subscription.unsubscribe();
  },[]);

  if(adminSession===undefined){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center">
        <LogoBlock />
        <div className="text-xs text-[var(--muted)] mt-4">Loading…</div>
      </div>
    );
  }
  const isOwner = adminSession && adminSession.user.id === SHOP_OWNER_ID;
  if(!isOwner) return <AdminLogin onSuccess={()=>{}} />;
  return <AdminShell route={route} onExit={async ()=>{ await sbAdmin.auth.signOut(); navigate('#/home'); }} />;
}

/* ============================= END ADMIN PANEL ============================= */

function PageRouter({route}){
  const parts = route.parts;
  const top = parts[0] || 'home';
  switch(top){
    case 'home': return <HomePage />;
    case 'category': return <CategoryPage route={route} />;
    case 'product': return <ProductPage route={route} />;
    case 'cart': return <CartPage />;
    case 'checkout':
      if(parts[1]==='payment') return <CheckoutPaymentPage />;
      if(parts[1]==='confirm') return <CheckoutConfirmPage />;
      return <CheckoutAddressPage />;
    case 'order-confirmation': return <OrderConfirmationPage route={route} />;
    case 'orders':
      if(parts[1]) return <OrderDetailPage route={route} />;
      return <OrdersPage />;
    case 'search': return <SearchPage />;
    case 'wishlist': return <WishlistPage />;
    case 'account': return <AccountPage />;
    default: return <HomePage />;
  }
}

function AuthShellBackground(){
  return (
    <div className="fixed inset-0 -z-10 overflow-hidden" style={{background:'linear-gradient(160deg,#F6EEFF 0%,#FBFAFE 45%,#FFF8EF 100%)'}}>
      <div className="absolute -top-20 -left-24 w-72 h-72 rounded-full opacity-60" style={{background:'radial-gradient(circle, rgba(108,63,197,0.18), transparent 70%)'}}></div>
      <div className="absolute top-1/3 -right-28 w-80 h-80 rounded-full opacity-60" style={{background:'radial-gradient(circle, rgba(245,166,35,0.16), transparent 70%)'}}></div>
      <div className="absolute -bottom-24 left-1/4 w-72 h-72 rounded-full opacity-60" style={{background:'radial-gradient(circle, rgba(30,158,90,0.14), transparent 70%)'}}></div>
    </div>
  );
}

function AuthInput({icon, ...props}){
  return (
    <div className="relative">
      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--muted)] pointer-events-none">{icon}</span>
      <input {...props} className="w-full border border-[var(--line)] rounded-xl pl-10 pr-3 py-2.5 text-sm focus-ring bg-[#FBFAFE] focus:bg-white transition-colors" />
    </div>
  );
}

function LoggedOutScreen(){
  const { signUp, signIn, showToast } = useApp();
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup' | 'check-email'
  const [form, setForm] = useState({ email:'', password:'', fullName:'', phone:'', username:'' });
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const update = (k,v)=> setForm(prev=>({...prev,[k]:v}));

  const submit = async (e)=>{
    e.preventDefault();
    setError('');
    if(!form.email.trim() || !form.password){ setError('Email and password are required.'); return; }
    if(mode==='signup' && form.password.length<6){ setError('Password must be at least 6 characters.'); return; }
    setSubmitting(true);
    if(mode==='signin'){
      const { error: err } = await signIn({ email: form.email.trim(), password: form.password });
      setSubmitting(false);
      if(err){ setError(err.message); return; }
      showToast('Welcome back! 👋','✨');
    } else {
      if(!form.fullName.trim()){ setError('Please enter your name.'); setSubmitting(false); return; }
      const { error: err, needsEmailConfirmation } = await signUp({
        email: form.email.trim(), password: form.password,
        fullName: form.fullName.trim(), phone: form.phone.trim(), username: form.username.trim(),
      });
      setSubmitting(false);
      if(err){ setError(err.message); return; }
      if(needsEmailConfirmation){ setMode('check-email'); return; }
      showToast('Account created! 🎉','✨');
    }
  };

  if(mode==='check-email'){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in relative">
        <AuthShellBackground />
        <div className="card w-full max-w-sm p-8 shadow-xl">
          <img src={MERAKI_LOGO_DATA_URI} alt="Meraki Stationery & Toys" className="w-20 h-20 mx-auto rounded-2xl shadow-md" />
          <div className="text-6xl mt-6 mb-2">📬</div>
          <h1 className="font-display font-bold text-xl mt-2">Almost there!</h1>
          <p className="text-sm text-[var(--muted)] mt-2">We've sent a confirmation link to <b>{form.email}</b>. Tap it, then come back and log in.</p>
          <button onClick={()=>setMode('signin')} className="btn-primary w-full py-3 text-sm mt-6 focus-ring">Back to Log In</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 py-10 text-center fade-in relative">
      <AuthShellBackground />
      <div className="mb-6">
        <img src={MERAKI_LOGO_DATA_URI} alt="Meraki Stationery & Toys" className="w-28 h-28 mx-auto rounded-3xl shadow-lg pop" />
      </div>

      <div className="card w-full max-w-sm p-7 shadow-xl text-left rise-in">
        <h1 className="font-display font-bold text-xl text-center">{mode==='signin' ? 'Welcome back! 👋' : 'Create your account ✨'}</h1>
        <p className="text-sm text-[var(--muted)] mt-1 text-center">{mode==='signin' ? 'Log in to shop, track orders and manage your wishlist.' : 'Sign up to start shopping at Meraki.'}</p>

        <form onSubmit={submit} className="mt-6 space-y-3">
          {mode==='signup' && (
            <React.Fragment>
              <div>
                <label className="text-xs font-semibold text-[var(--muted)]">Full Name</label>
                <div className="mt-1"><AuthInput icon="👤" value={form.fullName} onChange={e=>update('fullName',e.target.value)} /></div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs font-semibold text-[var(--muted)]">Username</label>
                  <div className="mt-1"><AuthInput icon="@" value={form.username} onChange={e=>update('username',e.target.value)} /></div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-[var(--muted)]">Phone</label>
                  <div className="mt-1"><AuthInput icon="📞" value={form.phone} onChange={e=>update('phone',e.target.value.replace(/\D/g,'').slice(0,10))} /></div>
                </div>
              </div>
            </React.Fragment>
          )}
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Email</label>
            <div className="mt-1"><AuthInput icon="✉️" type="email" value={form.email} onChange={e=>update('email',e.target.value)} /></div>
          </div>
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Password</label>
            <div className="mt-1"><AuthInput icon="🔒" type="password" value={form.password} onChange={e=>update('password',e.target.value)} /></div>
          </div>
          {error && <div className="text-xs text-[var(--danger)] font-semibold bg-red-50 rounded-lg px-3 py-2">{error}</div>}
          <button type="submit" disabled={submitting} className="btn-primary w-full py-3 text-sm focus-ring mt-1">
            {submitting ? 'Please wait…' : (mode==='signin' ? 'Log In' : 'Create Account')}
          </button>
        </form>

        <button onClick={()=>{ setMode(mode==='signin'?'signup':'signin'); setError(''); }} className="text-sm font-bold text-[var(--purple)] mt-5 focus-ring block mx-auto">
          {mode==='signin' ? "New here? Create an account" : "Already have an account? Log in"}
        </button>
      </div>

      <div className="text-[11px] text-[var(--muted)] mt-6">✨ Everything they need, delivered with care.</div>
    </div>
  );
}

function AppShell({route, hash}){
  const {loggedIn, authLoading} = useApp();
  useEffect(()=>{
    window.scrollTo({top:0, left:0, behavior:'auto'});
  },[hash]);
  if(route.parts[0]==='admin') return <AdminRoot route={route} />;
  const isCheckoutOrConfirm = route.parts[0]==='checkout' || route.parts[0]==='order-confirmation';
  if(authLoading){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center">
        <LogoBlock />
        <div className="text-xs text-[var(--muted)] mt-4">Loading…</div>
      </div>
    );
  }
  if(!loggedIn) return <LoggedOutScreen />;
  const transitionKey = route.parts[0]==='category' ? 'category' : hash;
  return (
    <div className="min-h-screen flex flex-col">
      <MobileHeader route={route} />
      <DesktopHeader route={route} />
      <div className="flex-1">
        <div key={transitionKey} className="page-transition">
          <PageRouter route={route} />
        </div>
      </div>
      {!isCheckoutOrConfirm && <div className="mobile-only h-14"></div>}
      {!isCheckoutOrConfirm && <BottomNav route={route} />}
      <Toast />
    </div>
  );
}

function App(){
  const hash = useHashRoute();
  const route = parseRoute(hash);
  return (
    <AppProvider>
      <AppShell route={route} hash={hash} />
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
