<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meraki — Stationery & Toys</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6C3FC5;
    --purple-dark:#4E2A96;
    --purple-light:#F1EBFB;
    --green:#1E9E5A;
    --green-light:#E7F8EE;
    --amber:#F5A623;
    --ink:#241A38;
    --muted:#8A7FA0;
    --line:#EDE7F7;
    --danger:#E0455D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#FBFAFE;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,h4,.font-display{font-family:'Poppins',sans-serif;}
  .brand-m{color:#E0455D;}
  .brand-e{color:#F5A623;}
  .brand-r{color:#1E9E5A;}
  .brand-a{color:#4EA1E8;}
  .brand-k{color:#8E4FE0;}
  .brand-i{color:#E0455D;}
  ::-webkit-scrollbar{height:0;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .scrollbar-none::-webkit-scrollbar{display:none;}
  .scrollbar-none{-ms-overflow-style:none;scrollbar-width:none;}
  .snap-x-row{scroll-snap-type:x mandatory;}
  .snap-item{scroll-snap-align:start;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom);}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 1px 2px rgba(36,26,56,0.03);
  }
  .btn-primary{
    background:var(--purple);color:#fff;border-radius:12px;font-weight:600;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 14px rgba(108,63,197,0.28);
  }
  .btn-primary:hover{background:var(--purple-dark);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0px) scale(.98);}
  .btn-primary:disabled{background:#C9BEE5;box-shadow:none;cursor:not-allowed;transform:none;}
  .btn-secondary{
    background:#fff;color:var(--purple);border:1.5px solid var(--purple);border-radius:12px;font-weight:600;
    transition:all .15s ease;
  }
  .btn-secondary:hover{background:var(--purple-light);}
  .chip{
    border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink);
    transition:all .15s ease; white-space:nowrap;
  }
  .chip.active{background:var(--purple);border-color:var(--purple);color:#fff;}
  .pulse{animation:pulse-anim .5s ease;}
  @keyframes pulse-anim{0%{transform:scale(1);}30%{transform:scale(1.35);}60%{transform:scale(.92);}100%{transform:scale(1);}}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rise-in{animation:riseIn .35s cubic-bezier(.2,.8,.2,1);}
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .placeholder-img{
    display:flex;align-items:center;justify-content:center;
    font-size:2.4rem; border-radius:14px; position:relative; overflow:hidden;
  }
  .placeholder-img::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(120% 120% at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
  }
  .desktop-only{display:none;}
  .mobile-only{display:block;}
  @media (min-width:900px){
    .desktop-only{display:block;}
    .mobile-only{display:none;}
  }
  .focus-ring:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  a{text-decoration:none;color:inherit;}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .container-max{max-width:1240px;margin:0 auto;}
  .sparkle{display:inline-block;animation:sparkleSpin 2.4s linear infinite;}
  @keyframes sparkleSpin{0%,100%{transform:rotate(0deg) scale(1);}50%{transform:rotate(20deg) scale(1.15);}}
  .skeleton{background:linear-gradient(90deg,#EDE7F7 25%,#F5F1FC 37%,#EDE7F7 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
</head>
<body>

<script type="text/babel" data-presets="react">

const PRODUCTS = [
  P('p1','Classmate Notebook (200 Pages)','stationery','Notebooks','Classmate',40,50,4.5,342,120,'📓','#DCEBFF','Single ruled long notebook with soft cover, ideal for daily school use.',['bestseller']),
  P('p2','Camlin Colour Pencils (12 Shades)','stationery','Colours','Camlin',85,110,4.6,201,80,'🖍️','#FFE3E9','Smooth, vivid colour pencils in a reusable tin box, 12 rich shades.',['bestseller']),
  P('p3','DOMS Brush Pens (14 Shades)','stationery','Colours','DOMS',120,150,4.7,128,64,'🖌️','#FFF1D6','Flexible-tip brush pens for colouring, sketching and lettering. Vibrant, non-toxic colours.',['bestseller']),

  P('p8','Camlin Geometry Box','stationery','Geometry','Camlin',99,130,4.4,150,90,'📐','#E6F3FF','Complete geometry set with compass, divider, scale & protractor.',[]),
  P('p9','File Folder (Set of 6)','stationery','Files & Folders','Classmate',80,100,4.1,64,110,'📁','#FFE3E9','Durable poly file folders in assorted colours, pack of 6.',[]),
  P('p10','Classmate Spiral Notebook (160 Pages)','stationery','Notebooks','Classmate',55,70,4.5,143,95,'📔','#DCEBFF','Spiral-bound notebook, single ruled, 160 pages.',[]),
  P('p11','Faber-Castell Sketch Pens (24 Shades)','stationery','Colours','Faber-Castell',145,190,4.7,175,55,'🖍️','#FFF1D6','Water-based sketch pens in 24 bright, washable shades.',['bestseller']),
  P('p12','Natraj Sharpener (Pack of 5)','stationery','Erasers & Sharpeners','Natraj',15,20,4.0,72,260,'🔪','#F1EBFB','Metal-body sharpeners with safety cover, pack of 5.',[]),
  P('p13','Wooden Sorting Puzzle','toys','Educational Toys','Funskool',349,450,4.6,88,40,'🧩','#FFE9EC','Shape-sorting wooden puzzle that builds motor skills for ages 3+.',['bestseller']),
  P('p14','Plush Bear Soft Toy (Medium)','toys','Soft Toys','Luvely',499,650,4.8,210,35,'🧸','#FFE9EC','Super-soft huggable bear, safe for all ages, machine washable.',['bestseller']),
  P('p15','Die-Cast Racer Car Set (Pack of 3)','toys','Cars','Joyo',299,399,4.4,120,60,'🚗','#FFE9EC','Set of 3 die-cast mini racer cars with free-rolling wheels.',[]),
  P('p16','Fashion Doll with Accessories','toys','Dolls','Joyo',499,699,4.5,265,45,'💃','#FFE9EC','Poseable fashion doll with a set of outfits and accessories.',['bestseller']),
  P('p17','Snakes & Ladders + Ludo Combo','toys','Games','Funskool',199,260,4.3,140,70,'🎲','#FFE9EC','Classic 2-in-1 family board game set for game nights.',[]),
  P('p18','500-Piece Jigsaw Puzzle — Ocean Life','toys','Puzzles','Funskool',249,320,4.6,98,50,'🧩','#FFE9EC','500-piece jigsaw puzzle featuring vivid ocean-life artwork.',[]),
  P('p19','Cartoon Pencil Box (Character Print)','stationery','Files & Folders','Classmate',199,249,4.5,175,60,'📦','#DCEBFF','Fun character-print pencil box with a spacious dual compartment.',['bestseller']),
  P('p20','Building Blocks Set (120 Pcs)','toys','Educational Toys','Funskool',599,799,4.7,190,30,'🧱','#FFE9EC','120-piece interlocking blocks set to build creativity and focus.',[]),
  P('p21','Sketchbook A4 (Spiral, 100 GSM)','art-craft','Sketchbooks','Camlin',89,120,4.5,110,85,'📒','#E7F8EE','Spiral-bound A4 sketchbook with heavy 100 GSM sheets for all media.',[]),
  P('p22','Camlin Poster Colours (12 Shades)','art-craft','Paints','Camlin',110,145,4.6,132,70,'🎨','#E7F8EE','Bright, opaque poster colours in a 12-shade set, great coverage.',[]),
  P('p23','Watercolour Brush Set (Pack of 8)','art-craft','Brushes','Faber-Castell',150,199,4.4,76,55,'🖌️','#E7F8EE','Assorted round & flat brushes for watercolour and poster work.',[]),
  P('p24','DIY Craft Kit — Paper Quilling','art-craft','Craft Kits','Joyo',249,320,4.5,64,40,'✂️','#E7F8EE','Beginner-friendly quilling kit with strips, tools & base cards.',[]),
  P('p25','School Backpack (18L, Water-Resistant)','school-supplies','Bags','Classmate',799,999,4.6,225,25,'🎒','#FFF4E0','Lightweight 18L backpack with padded straps and water-resistant fabric.',['bestseller']),
  P('p26','School Diary & Planner Set','school-supplies','Notebooks','Classmate',65,85,4.2,58,90,'📘','#FFF4E0','Weekly planner diary to track homework and school schedules.',[]),
  P('p27','Gift Hamper — Stationery Starter Kit','gifts','Hampers','Meraki',349,450,4.7,95,30,'🎁','#E6F3FF','A curated hamper of notebooks, pens & colours — ready to gift.',['bestseller']),
  P('p28','Personalised Name Pencil Set (Pack of 12)','gifts','Personalised','Meraki',199,260,4.5,73,45,'🎁','#E6F3FF','12 pencils engraved with a name of your choice — a sweet little gift.',[]),
];

const uid = () => Math.random().toString(36).slice(2,9);
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));

const DELIVERY_CHARGE = 30;
const PACKAGING_CHARGE = 5;
const FREE_DELIVERY_THRESHOLD = 299;

/* ============================= STORAGE ============================= */

function useLocalState(key, initial){
  const [state, setState] = useState(()=>{
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    }catch(e){ return initial; }
  });
  useEffect(()=>{
    try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
  },[key,state]);
  return [state,setState];
}

/* ============================= ROUTER ============================= */

function useHashRoute(){
  const [hash, setHash] = useState(()=> window.location.hash || '#/home');
  useEffect(()=>{
    const onHash = () => setHash(window.location.hash || '#/home');
    window.addEventListener('hashchange', onHash);
    return ()=> window.removeEventListener('hashchange', onHash);
  },[]);
  return hash;
}
function navigate(path){
  window.location.hash = path;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function parseRoute(hash){
  const clean = hash.replace(/^#/,'');
  const [pathPart, queryPart] = clean.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart){
    queryPart.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
  }
  return {parts, query};
}

/* ============================= APP CONTEXT ============================= */

const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

function AppProvider({children}){
  const [cart, setCart] = useLocalState('meraki_cart', []); // [{id,qty}]
  const [wishlist, setWishlist] = useLocalState('meraki_wishlist', []); // [id]
  const [orders, setOrders] = useLocalState('meraki_orders', []);
  const [address, setAddress] = useLocalState('meraki_address', {
    name:'Prashant Punia', phone:'8302416181', line1:'Shop No. LG-06, Below HDFC Bank',
    area:'Mansarovar', landmark:'Near HDFC Bank', pincode:'302021', city:'Jaipur', instructions:''
  });
  const [deliveryType, setDeliveryType] = useLocalState('meraki_delivery_type','home');
  const [paymentMethod, setPaymentMethod] = useLocalState('meraki_payment_method','cod');
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg, icon)=>{
    setToast({msg, icon, key: uid()});
    clearTimeout(window.__meraki_toast_timer);
    window.__meraki_toast_timer = setTimeout(()=> setToast(null), 1800);
  },[]);

  const productMap = useMemo(()=>{
    const m = {}; PRODUCTS.forEach(p=> m[p.id]=p); return m;
  },[]);

  const addToCart = useCallback((id, qty=1)=>{
    setCart(prev=>{
      const existing = prev.find(c=>c.id===id);
      if(existing){
        return prev.map(c=> c.id===id ? {...c, qty: clamp(c.qty+qty,1,20)} : c);
      }
      return [...prev, {id, qty}];
    });
    showToast('Added to cart', '🛒');
  },[setCart, showToast]);

  const setCartQty = useCallback((id, qty)=>{
    setCart(prev=>{
      if(qty<=0) return prev.filter(c=>c.id!==id);
      return prev.map(c=> c.id===id ? {...c, qty: clamp(qty,1,20)} : c);
    });
  },[setCart]);

  const removeFromCart = useCallback((id)=>{
    setCart(prev=> prev.filter(c=>c.id!==id));
    showToast('Removed from cart','🗑️');
  },[setCart, showToast]);

  const toggleWishlist = useCallback((id)=>{
    setWishlist(prev=>{
      if(prev.includes(id)){ showToast('Removed from wishlist','💔'); return prev.filter(x=>x!==id); }
      showToast('Added to wishlist','💜'); return [...prev, id];
    });
  },[setWishlist, showToast]);

  const moveWishlistToCart = useCallback((id)=>{
    addToCart(id,1);
    setWishlist(prev=> prev.filter(x=>x!==id));
  },[addToCart, setWishlist]);

  const cartLines = useMemo(()=> cart
    .map(c=> ({...c, product: productMap[c.id]}))
    .filter(c=> c.product), [cart, productMap]);

  const subtotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.price*c.qty, 0), [cartLines]);
  const mrpTotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.mrp*c.qty, 0), [cartLines]);
  const savings = mrpTotal - subtotal;
  const deliveryCharge = subtotal===0 ? 0 : (subtotal >= FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_CHARGE);
  const packagingCharge = subtotal===0 ? 0 : PACKAGING_CHARGE;
  const total = subtotal + deliveryCharge + packagingCharge;
  const amountToFreeDelivery = Math.max(0, FREE_DELIVERY_THRESHOLD - subtotal);
  const cartCount = cart.reduce((s,c)=> s+c.qty, 0);

  const placeOrder = useCallback(()=>{
    const orderId = 'MERAKI' + Math.floor(20260000 + Math.random()*9999);
    const now = new Date();
    const order = {
      id: orderId,
      date: now.toISOString(),
      items: cartLines.map(c=> ({id:c.id, name:c.product.name, qty:c.qty, price:c.product.price, emoji:c.product.emoji, bg:c.product.bg})),
      subtotal, deliveryCharge, packagingCharge, total,
      deliveryType, paymentMethod,
      address: {...address},
      status: 'Order Confirmed',
      statusSteps: ['Order Confirmed','Preparing Your Order','Out for Delivery','Delivered'],
      statusIndex: 0,
    };
    setOrders(prev=> [order, ...prev]);
    setCart([]);
    return order;
  },[cartLines, subtotal, deliveryCharge, packagingCharge, total, deliveryType, paymentMethod, address, setOrders, setCart]);

  const value = {
    cart, cartLines, cartCount, subtotal, mrpTotal, savings, deliveryCharge, packagingCharge, total, amountToFreeDelivery,
    addToCart, setCartQty, removeFromCart,
    wishlist, toggleWishlist, moveWishlistToCart,
    orders, placeOrder,
    address, setAddress, deliveryType, setDeliveryType, paymentMethod, setPaymentMethod,
    showToast, toast, productMap,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

/* ============================= SMALL UI PARTS ============================= */

      </span>
      <span className="sparkle text-base">✨</span>

}

}

function StarRating({rating}){

    <span className="inline-flex items-center gap-0.5 text-amber-500 text-xs font-semibold">

    </span>

}

function Badge({children, tone='purple'}){
  const tones = {
    purple:'bg-[var(--purple-light)] text-[var(--purple)]',
    green:'bg-[var(--green-light)] text-[var(--green)]',
    amber:'bg-amber-50 text-amber-600',
    danger:'bg-red-50 text-[var(--danger)]',
  };
  return <span className={"px-2 py-0.5 rounded-full text-[11px] font-bold "+tones[tone]}>{children}</span>;
}

function QuantitySelector({qty, onChange, small}){
  return (
    <div className={"inline-flex items-center border border-[var(--line)] rounded-lg overflow-hidden bg-white "+(small?'h-8':'h-9')}>
      <button aria-label="Decrease quantity" onClick={()=>onChange(qty-1)}
        className="w-8 h-full flex items-center justify-center text-[var(--purple)] font-bold hover:bg-[var(--purple-light)] focus-ring">−</button>
      <span className="w-7 text-center text-sm font-bold">{qty}</span>
      <button aria-label="Increase quantity" onClick={()=>onChange(qty+1)}
        className="w-8 h-full flex items-center justify-center text-[var(--purple)] font-bold hover:bg-[var(--purple-light)] focus-ring">+</button>
    </div>
  );
}

function ProductImg({product, className, iconClass}){
  return (
    <div className={"placeholder-img "+className} style={{background:product.bg}}>
      <span className={iconClass||''} style={{position:'relative', zIndex:1}}>{product.emoji}</span>
    </div>
  );
}

function ProductCard({product}){
  const {cart, addToCart, setCartQty, wishlist, toggleWishlist} = useApp();
  const line = cart.find(c=>c.id===product.id);
  const isWished = wishlist.includes(product.id);
  return (
    <div className="card p-2.5 flex flex-col relative group">
      <button aria-label="Toggle wishlist" onClick={()=>toggleWishlist(product.id)}
        className="absolute top-3 right-3 z-10 w-7 h-7 rounded-full bg-white/90 shadow flex items-center justify-center focus-ring">
        <span className={isWished ? 'text-[var(--danger)]' : 'text-gray-300'}>{isWished?'♥':'♡'}</span>
      </button>
      <a href={"#/product/"+product.id} className="block">
        <ProductImg product={product} className="w-full aspect-square text-4xl mb-2" />
        {product.tags.includes('bestseller') && <div className="absolute top-3 left-3"><Badge tone="amber">Bestseller</Badge></div>}
        <div className="text-[13px] font-semibold leading-snug line-clamp-2 min-h-[34px]">{product.name}</div>
      </a>
      <div className="flex items-baseline gap-1.5 mt-1">
        <span className="font-bold text-[15px]">{inr(product.price)}</span>
        <span className="text-xs text-gray-400 line-through">{inr(product.mrp)}</span>
        <span className="text-xs font-bold text-[var(--danger)]">{product.discount}% OFF</span>
      </div>
      <div className="mt-2">
        {!line ? (
          <button onClick={()=>addToCart(product.id,1)}
            className="btn-primary w-full py-1.5 text-sm flex items-center justify-center gap-1 focus-ring">
            <span>+</span> Add
          </button>
        ) : (
          <div className="w-full flex justify-center"><QuantitySelector qty={line.qty} onChange={(q)=>setCartQty(product.id,q)} small /></div>
        )}
      </div>
    </div>
  );
}

function ProductGrid({products, cols}){
  if(products.length===0){
    return (
      <div className="text-center py-16 text-[var(--muted)]">
        <div className="text-4xl mb-3">🔍</div>
        <div className="font-semibold">No products found</div>

/* ============================= CATEGORY / LISTING PAGE ============================= */

function CategoryPage({route}){
  const catId = route.parts[1] || 'stationery';
  const cat = CATEGORIES.find(c=>c.id===catId) || CATEGORIES[0];
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortOpen, setSortOpen] = useState(false);
  const [sort, setSort] = useState('popular');
  const [priceMax, setPriceMax] = useState(1000);
  const [brandFilter, setBrandFilter] = useState([]);
  const [inStockOnly, setInStockOnly] = useState(false);
  const [subFilter, setSubFilter] = useState('all');
  const [view, setView] = useState('grid');

  const base = PRODUCTS.filter(p=>p.category===catId);
  const subcats = useMemo(()=> Array.from(new Set(base.map(p=>p.sub))), [catId]);
  const brands = useMemo(()=> Array.from(new Set(base.map(p=>p.brand))), [catId]);

  let list = base.filter(p=> p.price<=priceMax);
  if(subFilter!=='all') list = list.filter(p=>p.sub===subFilter);
  if(brandFilter.length) list = list.filter(p=>brandFilter.includes(p.brand));
  if(inStockOnly) list = list.filter(p=>p.stock>0);

  if(sort==='price_low') list = [...list].sort((a,b)=>a.price-b.price);
  else if(sort==='price_high') list = [...list].sort((a,b)=>b.price-a.price);
  else if(sort==='newest') list = [...list].sort((a,b)=> b.id.localeCompare(a.id));
  else if(sort==='discount') list = [...list].sort((a,b)=> b.discount-a.discount);
  else list = [...list].sort((a,b)=> (b.tags.includes('bestseller')?1:0) - (a.tags.includes('bestseller')?1:0));

  const sortLabels = {popular:'Popular', price_low:'Price: Low to High', price_high:'Price: High to Low', newest:'Newest', discount:'Discount'};

  return (
    <div className="fade-in">
      <div className="px-4 md:container-max md:mx-auto pt-4 pb-2 desktop-only">
        <h1 className="font-display font-bold text-2xl">{cat.icon} {cat.name}</h1>
        <div className="text-sm text-[var(--muted)]">{list.length} products</div>
      </div>
      <div className="px-4 md:container-max md:mx-auto mt-2 md:mt-4 flex gap-4">
        {/* Desktop sidebar filters */}
        <div className="desktop-only w-64 flex-shrink-0">
          <FilterPanel {...{subcats, subFilter, setSubFilter, priceMax, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="mobile-only px-0 pb-2">
            <div className="flex items-center justify-between mb-2">
              <button onClick={()=>setFiltersOpen(true)} className="chip flex items-center gap-1 focus-ring">🧰 Filters</button>
              <button onClick={()=>setSortOpen(true)} className="chip flex items-center gap-1 focus-ring">Sort: {sortLabels[sort]} ▾</button>
              <div className="flex gap-1">
                <button onClick={()=>setView('grid')} className={"chip px-2 "+(view==='grid'?'active':'')}>▦</button>
                <button onClick={()=>setView('list')} className={"chip px-2 "+(view==='list'?'active':'')}>≡</button>
              </div>
            </div>
            <div className="text-xs text-[var(--muted)] mb-2">{list.length} Products {(subFilter!=='all'||brandFilter.length||inStockOnly) && <span className="text-[var(--purple)] font-semibold">· Filter Applied</span>}</div>
            <div className="flex gap-2 overflow-x-auto scrollbar-none">
              <button onClick={()=>setSubFilter('all')} className={"chip "+(subFilter==='all'?'active':'')}>All</button>
              {subcats.map(s=> <button key={s} onClick={()=>setSubFilter(s)} className={"chip "+(subFilter===s?'active':'')}>{s}</button>)}
            </div>
          </div>
          <div className="hidden md:flex items-center justify-between mb-3">
            <div className="flex gap-2 overflow-x-auto scrollbar-none">
              <button onClick={()=>setSubFilter('all')} className={"chip "+(subFilter==='all'?'active':'')}>All</button>
              {subcats.map(s=> <button key={s} onClick={()=>setSubFilter(s)} className={"chip "+(subFilter===s?'active':'')}>{s}</button>)}
            </div>
            <select value={sort} onChange={e=>setSort(e.target.value)} className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm font-semibold focus-ring">
              {Object.entries(sortLabels).map(([k,v])=> <option key={k} value={k}>Sort by: {v}</option>)}
            </select>
          </div>
          <ProductGrid products={list} cols={view==='grid' ? 'grid-cols-2 md:grid-cols-3 lg:grid-cols-4' : 'grid-cols-1'} />
        </div>
      </div>
      {filtersOpen && (
        <Modal onClose={()=>setFiltersOpen(false)} title="Filters">
          <FilterPanel {...{subcats, subFilter, setSubFilter, priceMax, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}} />
          <button onClick={()=>setFiltersOpen(false)} className="btn-primary w-full py-2.5 mt-4 focus-ring">Apply Filters</button>
        </Modal>
      )}
      {sortOpen && (
        <Modal onClose={()=>setSortOpen(false)} title="Sort by">
          <div className="flex flex-col gap-1">
            {Object.entries(sortLabels).map(([k,v])=> (
              <button key={k} onClick={()=>{setSort(k); setSortOpen(false);}} className={"text-left px-3 py-2.5 rounded-lg text-sm font-semibold focus-ring "+(sort===k?'bg-[var(--purple-light)] text-[var(--purple)]':'hover:bg-gray-50')}>{v}</button>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

function FilterPanel({subcats, subFilter, setSubFilter, priceMax, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}){
  const toggleBrand = (b)=> setBrandFilter(prev=> prev.includes(b) ? prev.filter(x=>x!==b) : [...prev,b]);
  return (
    <div className="space-y-5">
      <div>
        <div className="font-bold text-sm mb-2">Categories</div>
        <div className="flex flex-col gap-1.5 text-sm">
          <label className="flex items-center gap-2"><input type="radio" checked={subFilter==='all'} onChange={()=>setSubFilter('all')} /> All</label>
          {subcats.map(s=> <label key={s} className="flex items-center gap-2"><input type="radio" checked={subFilter===s} onChange={()=>setSubFilter(s)} /> {s}</label>)}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Price</div>
        <input type="range" min="0" max="1000" value={priceMax} onChange={e=>setPriceMax(Number(e.target.value))} className="w-full accent-[var(--purple)]" />
        <div className="flex justify-between text-xs text-[var(--muted)]"><span>₹0</span><span>{priceMax>=1000?'₹1000+':inr(priceMax)}</span></div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Brand</div>
        <div className="flex flex-col gap-1.5 text-sm max-h-36 overflow-y-auto">
          {brands.map(b=> <label key={b} className="flex items-center gap-2"><input type="checkbox" checked={brandFilter.includes(b)} onChange={()=>toggleBrand(b)} /> {b}</label>)}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Availability</div>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={inStockOnly} onChange={()=>setInStockOnly(v=>!v)} /> In Stock</label>
      </div>
    </div>
  );
}

function FreeDeliveryBar(){
  const {subtotal, amountToFreeDelivery} = useApp();
  const pct = clamp((subtotal / FREE_DELIVERY_THRESHOLD) * 100, 0, 100);
  if(subtotal===0) return null;
  return (
    <div className={"rounded-xl p-3 text-sm font-semibold mb-4 "+(amountToFreeDelivery===0 ? 'bg-[var(--green-light)] text-[var(--green)]' : 'bg-[#FFF8E9] text-amber-700')}>
      {amountToFreeDelivery===0 ? '🎉 You\'ve unlocked FREE delivery!' : <span>Add {inr(amountToFreeDelivery)} more to get FREE delivery! 🚚</span>}
      <div className="h-2 bg-white/70 rounded-full mt-2 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-500" style={{width:pct+'%', background: amountToFreeDelivery===0 ? 'var(--green)' : 'var(--amber)'}}></div>
      </div>
      <div className="text-[11px] font-medium mt-1 opacity-70">{inr(Math.min(subtotal,FREE_DELIVERY_THRESHOLD))} / {inr(FREE_DELIVERY_THRESHOLD)}</div>

  );
}

function CheckoutStepper({step}){
  const steps = ['Address','Payment','Confirm'];
  return (
    <div className="flex items-center gap-2 px-4 md:container-max md:mx-auto py-3 text-xs font-semibold">
      {steps.map((s,i)=>{
        const idx=i+1;
        const state = idx<step ? 'done' : idx===step ? 'active' : 'pending';
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-1.5">
              <span className={"w-5 h-5 rounded-full flex items-center justify-center text-[10px] "+
                (state==='done' ? 'bg-[var(--green)] text-white' : state==='active' ? 'bg-[var(--purple)] text-white' : 'bg-gray-200 text-gray-500')}>
                {state==='done' ? '✓' : idx}
              </span>
              <span className={state==='pending' ? 'text-[var(--muted)]' : ''}>{s}</span>
            </div>
            {idx<3 && <div className="flex-1 h-px bg-[var(--line)]"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function OrderConfirmationPage({route}){
  const orderId = route.parts[1];
  const {orders} = useApp();
  const order = orders.find(o=>o.id===orderId);
  if(!order) return <div className="p-8 text-center text-[var(--muted)]">Order not found. <a className="text-[var(--purple)] font-semibold" href="#/home">Go home</a></div>;
  const orderDate = new Date(order.date);
  const eta = new Date(orderDate.getTime() + 2*60*60*1000);
  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-8 max-w-lg md:max-w-2xl mx-auto text-center">
      <div className="text-6xl mb-2 pop">✅</div>
      <h1 className="font-display font-bold text-xl">Thank You! 🎉</h1>
      <div className="text-[var(--muted)] text-sm mt-1">Your order is confirmed</div>
      <div className="text-[var(--purple)] font-bold text-sm mt-2">Order #{order.id}</div>
      <div className="text-xs text-[var(--muted)] mt-1">We've received your order and it is being processed.</div>

      <div className="grid grid-cols-3 gap-2 mt-5 text-left">
        <div className="card p-3"><div className="text-[11px] text-[var(--muted)]">Order Date</div><div className="text-xs font-bold mt-0.5">{orderDate.toLocaleDateString()}, {orderDate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
        <div className="card p-3"><div className="text-[11px] text-[var(--muted)]">Delivery Type</div><div className="text-xs font-bold mt-0.5">{order.deliveryType==='home'?'Home Delivery':'Store Pickup'}</div></div>
        <div className="card p-3"><div className="text-[11px] text-[var(--muted)]">Est. Delivery</div><div className="text-xs font-bold mt-0.5">{eta.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
      </div>

      <div className="card p-4 mt-4 text-left">
        <div className="font-bold text-sm mb-2">Order Summary</div>
        {order.items.map(it=> (
          <div key={it.id} className="flex justify-between text-xs py-1">
            <span className="text-[var(--muted)]">{it.name} x{it.qty}</span><span>{inr(it.price*it.qty)}</span>
          </div>
        ))}
        <div className="border-t border-dashed border-[var(--line)] my-2"></div>
        <div className="flex justify-between text-sm font-bold"><span>Total Amount</span><span>{inr(order.total)}</span></div>
        <div className="text-xs text-[var(--muted)] mt-1">Payment: {PAYMENT_LABELS[order.paymentMethod]}</div>
      </div>

      <div className="flex gap-3 mt-6">
        <a href={"#/orders/"+order.id} className="btn-primary flex-1 py-3 text-sm text-center focus-ring">Track Your Order</a>
        <a href="#/home" className="btn-secondary flex-1 py-3 text-sm text-center focus-ring">Continue Shopping</a>
      </div>
      <div className="text-xs text-[var(--green)] font-semibold mt-4 bg-[var(--green-light)] rounded-xl p-3">📲 We'll notify you once your order is out for delivery.</div>
    </div>
  );
}

/* ============================= ORDERS ============================= */

function statusColor(status){
  if(status==='Delivered') return 'green';
  if(status==='Cancelled') return 'danger';
  return 'amber';
}

function OrdersPage(){
  const {orders} = useApp();
  if(orders.length===0){
    return (
      <div className="fade-in text-center py-20 px-4">
        <div className="text-5xl mb-3">📦</div>
        <div className="font-display font-bold text-lg">No orders yet</div>
        <div className="text-sm text-[var(--muted)] mt-1">Your placed orders will show up here.</div>
        <a href="#/home" className="btn-primary inline-block px-6 py-2.5 text-sm mt-5 focus-ring">Start Shopping</a>
      </div>
    );
  }
  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      <h1 className="font-display font-bold text-xl mb-4">My Orders</h1>
      <div className="flex flex-col gap-3 md:grid md:grid-cols-2 md:gap-4">
        {orders.map(o=> (
          <a key={o.id} href={"#/orders/"+o.id} className="card p-4 block focus-ring">
            <div className="flex justify-between items-start">
              <div>
                <div className="text-sm font-bold">#{o.id}</div>
                <div className="text-xs text-[var(--muted)]">{new Date(o.date).toLocaleDateString()} · {o.items.length} items</div>
              </div>
              <Badge tone={statusColor(o.status)}>{o.status}</Badge>
            </div>
            <div className="flex gap-1.5 mt-3">
              {o.items.slice(0,4).map(it=> <div key={it.id} className="w-9 h-9 rounded-lg placeholder-img text-base" style={{background:it.bg}}>{it.emoji}</div>)}
              {o.items.length>4 && <div className="w-9 h-9 rounded-lg bg-gray-100 flex items-center justify-center text-[10px] font-bold text-[var(--muted)]">+{o.items.length-4}</div>}
            </div>
            <div className="flex justify-between items-center mt-3">
              <span className="text-sm font-bold">{inr(o.total)}</span>
              <span className="text-xs font-bold text-[var(--purple)]">View Details ›</span>
            </div>
          </a>
        ))}
      </div>
    </div>
  );
}

function OrderDetailPage({route}){
  const orderId = route.parts[1];
  const {orders} = useApp();
  const order = orders.find(o=>o.id===orderId);
  if(!order) return <div className="p-8 text-center text-[var(--muted)]">Order not found. <a className="text-[var(--purple)] font-semibold" href="#/orders">Back to orders</a></div>;
  const steps = order.statusSteps;
  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-10 max-w-lg mx-auto">
      <h1 className="font-display font-bold text-lg mb-1">Order #{order.id}</h1>
      <div className="text-xs text-[var(--muted)] mb-4">Placed on {new Date(order.date).toLocaleString()}</div>

      <div className="card p-4 mb-4">
        <div className="font-bold text-sm mb-4">Order Status</div>
        <div className="flex flex-col gap-0">
          {steps.map((s,i)=> (
            <div key={s} className="flex gap-3">
              <div className="flex flex-col items-center">
                <div className={"w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold "+(i<=order.statusIndex ? 'bg-[var(--green)] text-white' : 'bg-gray-200 text-gray-400')}>{i<=order.statusIndex?'✓':i+1}</div>
                {i<steps.length-1 && <div className={"w-0.5 flex-1 min-h-[24px] "+(i<order.statusIndex ? 'bg-[var(--green)]':'bg-gray-200')}></div>}
              </div>
              <div className="pb-5 -mt-0.5">
                <div className={"text-sm font-semibold "+(i<=order.statusIndex ? '' : 'text-[var(--muted)]')}>{s}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="card p-4 mb-4">
        <div className="font-bold text-sm mb-2">Items</div>
        {order.items.map(it=> (
          <div key={it.id} className="flex items-center gap-3 py-2">
            <div className="w-11 h-11 rounded-lg placeholder-img text-lg" style={{background:it.bg}}>{it.emoji}</div>
            <div className="flex-1 text-sm">{it.name} <span className="text-[var(--muted)]">x{it.qty}</span></div>
            <div className="text-sm font-bold">{inr(it.price*it.qty)}</div>
          </div>
        ))}
        <div className="border-t border-dashed border-[var(--line)] my-2"></div>
        <div className="flex justify-between text-sm font-bold"><span>Total</span><span>{inr(order.total)}</span></div>
      </div>

      <div className="card p-4">
        <div className="font-bold text-sm mb-2">Delivery Address</div>
        <div className="text-sm">{order.address.name}</div>
        <div className="text-xs text-[var(--muted)]">{order.address.line1}, {order.address.area}, {order.address.city} - {order.address.pincode}</div>
      </div>
    </div>
  );
}

/* ============================= SEARCH ============================= */

function SearchPage(){
  const route = parseRoute(window.location.hash);
  const q = (route.query.q||'').toLowerCase().trim();
  const [term, setTerm] = useState(q);
  useEffect(()=> setTerm(q), [q]);

  const results = term ? PRODUCTS.filter(p=>
    p.name.toLowerCase().includes(term) ||
    p.category.toLowerCase().includes(term) ||
    p.sub.toLowerCase().includes(term) ||
    p.brand.toLowerCase().includes(term)
  ) : [];

  const onType = (e)=>{
    const v = e.target.value;
    setTerm(v.toLowerCase());
    window.history.replaceState(null,'', v.trim() ? '#/search?q='+encodeURIComponent(v.trim()) : '#/search');
  };

  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      <div className="flex items-center bg-[#F5F2FB] rounded-xl px-3 py-2.5 gap-2 mb-4">
        <span className="text-[var(--muted)]">🔍</span>
        <input autoFocus value={term} onChange={onType} placeholder="Search for toys, stationery, art supplies..." className="bg-transparent outline-none text-sm w-full" />
      </div>
      {!term ? (
        <div className="text-center py-16 text-[var(--muted)]">
          <div className="text-4xl mb-2">🔎</div>
          <div className="text-sm">Start typing to search across all products.</div>
        </div>
      ) : (
        <>
          <div className="text-sm text-[var(--muted)] mb-3">{results.length} results for "{term}"</div>
          <ProductGrid products={results} />
        </>
      )}
    </div>
  );
}

/* ============================= WISHLIST ============================= */

function WishlistPage(){
  const {wishlist, productMap, moveWishlistToCart, toggleWishlist} = useApp();
  const items = wishlist.map(id=>productMap[id]).filter(Boolean);
  if(items.length===0){
    return (
      <div className="fade-in text-center py-20 px-4">
        <div className="text-5xl mb-3">♡</div>
        <div className="font-display font-bold text-lg">Your wishlist is empty</div>
        <div className="text-sm text-[var(--muted)] mt-1">Tap the heart icon on any product to save it here.</div>
        <a href="#/home" className="btn-primary inline-block px-6 py-2.5 text-sm mt-5 focus-ring">Explore Products</a>
      </div>
    );
  }
  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      <h1 className="font-display font-bold text-xl mb-4">My Wishlist ({items.length})</h1>
      <div className="flex flex-col gap-3">
        {items.map(p=> (
          <div key={p.id} className="card p-3 flex gap-3 items-center">
            <a href={"#/product/"+p.id}><ProductImg product={p} className="w-16 h-16 text-2xl flex-shrink-0" /></a>
            <div className="flex-1 min-w-0">
              <a href={"#/product/"+p.id} className="text-sm font-semibold line-clamp-2">{p.name}</a>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-sm font-bold">{inr(p.price)}</span>
                <span className="text-xs text-gray-400 line-through">{inr(p.mrp)}</span>
              </div>
            </div>
            <div className="flex flex-col gap-2 items-end">
              <button onClick={()=>toggleWishlist(p.id)} aria-label="Remove from wishlist" className="text-[var(--danger)] text-sm focus-ring">✕</button>
              <button onClick={()=>moveWishlistToCart(p.id)} className="btn-secondary px-3 py-1.5 text-xs focus-ring">Move to Cart</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================= ACCOUNT ============================= */

function AccountPage(){
  const {address, setAddress, orders, wishlist} = useApp();
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(address);
  const sections = [
    {icon:'📦', label:'My Orders', sub: orders.length+' orders', href:'#/orders'},
    {icon:'♡', label:'Wishlist', sub: wishlist.length+' items', href:'#/wishlist'},
    {icon:'🏠', label:'Saved Addresses', sub:'1 saved address', action:()=>setEditing(true)},
    {icon:'💬', label:'Help & Support', sub:'FAQs, contact us', href:'#/account'},
    {icon:'🏬', label:'Store Information', sub:'Timing, location', href:'#/account'},
    {icon:'⚙️', label:'Settings', sub:'App preferences', href:'#/account'},
  ];
  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8 max-w-2xl mx-auto">
      <div className="card p-4 flex items-center gap-4 mb-5">
        <div className="w-14 h-14 rounded-full bg-[var(--purple-light)] flex items-center justify-center text-2xl">👤</div>
        <div>
          <div className="font-bold">{address.name}</div>
          <div className="text-xs text-[var(--muted)]">+91 {address.phone}</div>
        </div>
      </div>
      <div className="flex flex-col gap-2">
        {sections.map(s=> s.href ? (
          <a key={s.label} href={s.href} className="card p-3.5 flex items-center gap-3 focus-ring">
            <span className="text-xl">{s.icon}</span>
            <div className="flex-1"><div className="text-sm font-semibold">{s.label}</div><div className="text-xs text-[var(--muted)]">{s.sub}</div></div>
            <span className="text-[var(--muted)]">›</span>
          </a>
        ) : (
          <button key={s.label} onClick={s.action} className="card p-3.5 flex items-center gap-3 text-left focus-ring">
            <span className="text-xl">{s.icon}</span>
            <div className="flex-1"><div className="text-sm font-semibold">{s.label}</div><div className="text-xs text-[var(--muted)]">{s.sub}</div></div>
            <span className="text-[var(--muted)]">›</span>
          </button>
        ))}
      </div>
      <div className="text-center text-xs text-[var(--muted)] mt-8">Meraki Stationery &amp; Toys · App version 1.0.0 (demo)</div>

      {editing && (
        <Modal onClose={()=>setEditing(false)} title="Saved Address">
          <div className="space-y-3">
            <div><label className="text-xs font-semibold text-[var(--muted)]">Full Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
            <div><label className="text-xs font-semibold text-[var(--muted)]">Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
            <div><label className="text-xs font-semibold text-[var(--muted)]">Address</label><textarea value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} rows="2" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring"></textarea></div>
            <button onClick={()=>{setAddress(form); setEditing(false);}} className="btn-primary w-full py-2.5 focus-ring">Save Address</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================= APP SHELL ============================= */

function PageRouter({route}){
  const parts = route.parts;
  const top = parts[0] || 'home';
  switch(top){
    case 'home': return <HomePage />;
    case 'category': return <CategoryPage route={route} />;
    case 'product': return <ProductPage route={route} />;
    case 'cart': return <CartPage />;
    case 'checkout':
      if(parts[1]==='payment') return <CheckoutPaymentPage />;
      if(parts[1]==='confirm') return <CheckoutConfirmPage />;
      return <CheckoutAddressPage />;
    case 'order-confirmation': return <OrderConfirmationPage route={route} />;
    case 'orders':
      if(parts[1]) return <OrderDetailPage route={route} />;
      return <OrdersPage />;
    case 'search': return <SearchPage />;
    case 'wishlist': return <WishlistPage />;
    case 'account': return <AccountPage />;
    default: return <HomePage />;
  }
}

function App(){
  const hash = useHashRoute();
  const route = parseRoute(hash);
  const isCheckoutOrConfirm = route.parts[0]==='checkout' || route.parts[0]==='order-confirmation';
  return (
    <AppProvider>
      <div className="min-h-screen flex flex-col">
        <MobileHeader route={route} />
        <DesktopHeader route={route} />
        <div className="flex-1">
          <PageRouter route={route} />
        </div>
        {!isCheckoutOrConfirm && <div className="mobile-only h-16"></div>}
        {!isCheckoutOrConfirm && <BottomNav route={route} />}
        <Toast />
      </div>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
