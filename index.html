<title>Meraki — Stationery & Toys</title>
<script>
  // Some mobile browsers' "Desktop site" mode forces a wide layout viewport, which makes our
  // `min-width:900px` breakpoint fire even on an actual phone — that's what shows the desktop
  // sidebar squeezed onto a phone screen, tiny and cramped. window.screen.width/height reflect the
  // real device size and aren't affected by that mode, so we use them as a second, more reliable
  // check and force mobile layout via this class regardless of what the browser is pretending the
  // viewport is.
  (function(){
    var w = Math.min(window.screen.width||9999, window.screen.height||9999);
    if(w < 480) document.documentElement.classList.add('force-mobile-layout');
  })();
</script>

<style>
  :root{
    --purple:#6C3FC5;
    --purple-dark:#4E2A96;
    --purple-light:#F1EBFB;
    --green:#1E9E5A;
    --green-light:#E7F8EE;
    --amber:#F5A623;
    --ink:#241A38;
    --muted:#8A7FA0;
    --line:#EDE7F7;
    --danger:#E0455D;
  }
  html.dark{
    --purple-light:#3A2E57;
    --green-light:#173829;
    --ink:#F1ECFB;
    --muted:#A79BC4;
    --line:#33294D;
  }
  html.dark body{background:#151022;}
  html.dark .card,
  html.dark .floating-nav,
  html.dark .bg-white{background:#211a35 !important;}
  html.dark input, html.dark select, html.dark textarea{background:#1b1530 !important; color:var(--ink) !important;}
  html.dark ::placeholder{color:#6f6390;}
  html.dark .placeholder-img{filter:brightness(.92) saturate(.92);}
  html.dark .skeleton{background:linear-gradient(90deg,#2b2246 25%,#352a56 37%,#2b2246 63%);}
  html.dark .chip{color:var(--ink);}
  html *{transition:background-color .25s ease, border-color .25s ease, color .25s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:#FBFAFE;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,h4,.font-display{font-family:'Fredoka',sans-serif !important;letter-spacing:.01em;}
  button,a,input,.card,.chip{transition:all .22s cubic-bezier(.25,.8,.25,1);}
  a:active, button:active{transform:scale(.96);}
  .brand-m{color:#E0455D;}
  .brand-e{color:#F5A623;}
  .brand-r{color:#1E9E5A;}
  .brand-a{color:#4EA1E8;}
  .brand-k{color:#8E4FE0;}
  .brand-i{color:#E0455D;}
  ::-webkit-scrollbar{height:0;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .scrollbar-none::-webkit-scrollbar{display:none;}
  .scrollbar-none{-ms-overflow-style:none;scrollbar-width:none;}
  .snap-x-row{scroll-snap-type:x mandatory;}
  .snap-item{scroll-snap-align:start;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom);}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 2px 10px rgba(108,63,197,0.05);
    transition:transform .28s cubic-bezier(.25,.8,.25,1), box-shadow .28s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(108,63,197,0.12);}
  .btn-primary{
    background:var(--purple);color:#fff;border-radius:16px;font-weight:700;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s ease, box-shadow .18s ease;
    box-shadow:0 6px 16px rgba(108,63,197,0.32);
  }
  .btn-primary:hover{background:var(--purple-dark);transform:translateY(-2px) scale(1.015);}
  .btn-primary:active{transform:translateY(0px) scale(.95);}
  .btn-primary:disabled{background:#C9BEE5;box-shadow:none;cursor:not-allowed;transform:none;}
  .btn-secondary{
    background:#fff;color:var(--purple);border:1.5px solid var(--purple);border-radius:16px;font-weight:700;
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-secondary:hover{background:var(--purple-light);transform:translateY(-2px) scale(1.015);}
  .btn-secondary:active{transform:translateY(0) scale(.95);}
  .chip{
    border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink);
    transition:all .15s ease; white-space:nowrap;
  }
  .chip.active{background:var(--purple);border-color:var(--purple);color:#fff;}
  .pulse{animation:pulse-anim .5s ease;}
  @keyframes pulse-anim{0%{transform:scale(1);}30%{transform:scale(1.35);}60%{transform:scale(.92);}100%{transform:scale(1);}}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rise-in{animation:riseIn .35s cubic-bezier(.2,.8,.2,1);}
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  @keyframes dealsMarquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .deals-marquee-track{width:max-content;animation:dealsMarquee 22s linear infinite;}
  .deals-marquee-track:hover,.deals-marquee-track:active{animation-play-state:paused;}
  .reveal-on-scroll{opacity:0;transform:translateY(16px);transition:opacity .5s ease, transform .5s ease;}
  .reveal-on-scroll.revealed{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .deals-marquee-track{animation:none;}
    .reveal-on-scroll{opacity:1;transform:none;transition:none;}
  }
  .placeholder-img{
    display:flex;align-items:center;justify-content:center;
    font-size:2.4rem; border-radius:20px; position:relative; overflow:hidden;
    transition:transform .28s cubic-bezier(.25,.8,.25,1);
  }
  .card:hover .placeholder-img{transform:scale(1.04) rotate(-1deg);}
  .placeholder-img::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(120% 120% at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
  }
  .desktop-only{display:none;}
  .mobile-only{display:block;}
  @media (min-width:900px){
    .desktop-only{display:block;}
    .mobile-only{display:none;}
  }
  html.force-mobile-layout .desktop-only{display:none !important;}
  html.force-mobile-layout .mobile-only{display:block !important;}
  .focus-ring:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  a{text-decoration:none;color:inherit;}
  input,select,textarea{border-radius:14px !important;}
  input:focus,select:focus,textarea:focus{border-color:var(--purple) !important; box-shadow:0 0 0 3px rgba(108,63,197,0.12);}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .container-max{max-width:1240px;margin:0 auto;}
  .sparkle{display:inline-block;animation:sparkleSpin 2.4s linear infinite;}
  @keyframes sparkleSpin{0%,100%{transform:rotate(0deg) scale(1);}50%{transform:rotate(20deg) scale(1.15);}}
  .skeleton{background:linear-gradient(90deg,#EDE7F7 25%,#F5F1FC 37%,#EDE7F7 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* Floating bottom nav */
  .floating-nav{
    background:#fff;
    border-radius:999px;
    box-shadow:0 12px 32px rgba(108,63,197,0.18), 0 2px 8px rgba(108,63,197,0.08);
    border:1px solid var(--line);
  }
  .nav-item{
    position:relative;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .2s ease;
  }
  .nav-item .nav-icon{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;margin:0 auto;
    transition:all .38s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-item.active .nav-icon{
    background:var(--purple-light);
    transform:translateY(-12px) scale(1.45);
    box-shadow:0 8px 16px rgba(108,63,197,0.28);
  }
  .nav-item:active{transform:scale(.88);}
  .page-transition{animation:pageIn .38s cubic-bezier(.22,.8,.32,1);}
  @keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  .wiggle{animation:wiggle .5s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-12deg) scale(1.15);}60%{transform:rotate(10deg) scale(1.15);}}
</style>
</head>

// Maps a row from the real `storefront_products` view (your actual POS
// inventory) into the shape the rest of the UI already expects. Real inventory
// has no MRP/discount/rating concept, so those are left honest (no discount,
// no fabricated rating) rather than invented.
function mapDbProduct(row){
  const slug = slugify(row.category);
  const meta = getCategoryMeta(row.category);
  const price = Number(row.price);
  const rawMrp = row.mrp!=null ? Number(row.mrp) : price;
  const mrp = rawMrp > price ? rawMrp : price; // only a real, admin-set MRP counts as a discount
  const discount = mrp > price ? Math.round((1 - price/mrp)*100) : 0;
  return {
    id: row.id,
    name: row.name,
    category: slug,
    categoryLabel: row.category,
    sub: row.brand || 'General',
    brand: row.brand || 'Generic',
    price,
    mrp,
    discount,
    rating: 0,
    reviews: 0,
    stock: row.stock,
    emoji: meta.icon,
    bg: meta.color,
    image: row.image_url || null,
    desc: row.description || '',
    tags: row.is_featured ? ['bestseller'] : [],
    variants: null,
  };
}

const ORDER_STATUS_STEPS = ['Order Confirmed','Preparing Your Order','Out for Delivery','Delivered'];

// Maps a row from `online_orders` (with nested online_order_items / online_payments
// via Supabase's foreign-key embedding) into the order shape the rest of the UI
// already expects.
function mapDbOrder(row, productMap){
  const items = (row.online_order_items || []).map(it=>{
    const known = productMap ? productMap[it.product_id] : null;
    return {
      id: it.product_id,
      name: it.product_name,
      qty: it.quantity,
      price: Number(it.unit_price),
      emoji: known ? known.emoji : '📦',
      bg: known ? known.bg : '#F1EBFB',
    };
  });
  const payment = (row.online_payments && row.online_payments[0]) || null;
  const isCancelled = row.status === 'Cancelled';
  const statusIndex = isCancelled ? 0 : Math.max(0, ORDER_STATUS_STEPS.indexOf(row.status));
  return {
    id: row.id,
    shortId: 'MERAKI'+row.id.slice(0,8).toUpperCase(),
    date: row.created_at,
    items,
    subtotal: Number(row.subtotal),
    deliveryCharge: Number(row.delivery_charge),
    packagingCharge: Number(row.packaging_charge),
    total: Number(row.total),
    deliveryType: row.delivery_type,
    paymentMethod: row.payment_method,
    paymentLabel: row.payment_method,
    paymentVerified: row.payment_status === 'paid' || row.payment_status === 'cod',
    address: row.shipping_address || {},
    status: row.status,
    statusSteps: ORDER_STATUS_STEPS,
    statusIndex,
    paymentId: payment ? payment.id : null,
  };
}

function mapDbBanner(row){
  return {
    id: row.id,
    title: row.title,
    highlight: row.highlight,
    subtitle: row.subtitle,

/* ============================= STORAGE ============================= */

function useLocalState(key, initial){
  const [state, setState] = useState(()=>{
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    }catch(e){ return initial; }
  });
  useEffect(()=>{
    try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
  },[key,state]);
  return [state,setState];
}

/* ============================= ROUTER ============================= */

function useHashRoute(){
  const [hash, setHash] = useState(()=> window.location.hash || '#/home');
  useEffect(()=>{
    const onHash = () => setHash(window.location.hash || '#/home');
    window.addEventListener('hashchange', onHash);
    return ()=> window.removeEventListener('hashchange', onHash);
  },[]);
  return hash;
}
function navigate(path){
  window.location.hash = path;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function parseRoute(hash){
  const clean = hash.replace(/^#/,'');
  const [pathPart, queryPart] = clean.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart){
    queryPart.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
  }
  return {parts, query};
}

  const addToCart = useCallback((id, qty=1)=>{

    showToast(hitLimit ? `Only ${stock} in stock — added what's available` : 'Added to cart', hitLimit ? '⚠️' : '🛒');
    if(session){
      sb.from('customer_cart_items').upsert(
        { customer_id: session.user.id, product_id: id, quantity: finalQty },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, showToast, productMap]);

  const setCartQty = useCallback((id, qty)=>{
    const product = productMap[id];
    const stock = product ? Math.max(product.stock,0) : 20;
    const clamped = clamp(qty, 0, Math.min(20, stock));
    if(qty > clamped) showToast(`Only ${stock} in stock`, '⚠️');
    setCart(prev=>{
      if(clamped<=0) return prev.filter(c=>c.id!==id);
      return prev.map(c=> c.id===id ? {...c, qty: clamped} : c);
    });
    if(!session) return;
    if(clamped<=0){
      sb.from('customer_cart_items').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    } else {
      sb.from('customer_cart_items').upsert(
        { customer_id: session.user.id, product_id: id, quantity: clamped },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, productMap, showToast]);

  const removeFromCart = useCallback((id)=>{
    setCart(prev=> prev.filter(c=>c.id!==id));
    showToast('Removed from cart','🗑️');
    if(session){
      sb.from('customer_cart_items').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, showToast]);

  const toggleWishlist = useCallback((id)=>{
    let adding = false;
    setWishlist(prev=>{
      if(prev.includes(id)){ showToast('Removed from wishlist','💔'); adding=false; return prev.filter(x=>x!==id); }
      showToast('Added to wishlist','💜'); adding=true; return [...prev, id];
    });
    if(!session) return;
    if(adding){
      sb.from('customer_wishlist').upsert(
        { customer_id: session.user.id, product_id: id },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    } else {
      sb.from('customer_wishlist').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    }
  },[session, showToast]);

  const moveWishlistToCart = useCallback((id)=>{
    addToCart(id,1);
    setWishlist(prev=> prev.filter(x=>x!==id));
    if(session){
      sb.from('customer_wishlist').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    }
  },[addToCart, session]);

  const cartLines = useMemo(()=> cart
    .map(c=> ({...c, product: productMap[c.id]}))
    .filter(c=> c.product), [cart, productMap]);

  const subtotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.price*c.qty, 0), [cartLines]);
  const mrpTotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.mrp*c.qty, 0), [cartLines]);
  const savings = mrpTotal - subtotal;
  const deliveryCharge = subtotal===0 ? 0 : (subtotal >= FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_CHARGE);
  const packagingCharge = subtotal===0 ? 0 : PACKAGING_CHARGE;
  const total = subtotal + deliveryCharge + packagingCharge;
  const amountToFreeDelivery = Math.max(0, FREE_DELIVERY_THRESHOLD - subtotal);
  const cartCount = cart.reduce((s,c)=> s+c.qty, 0);

  const placeOrder = useCallback(async ()=>{
    if(!session) return { error: new Error('Not logged in') };
    if(!cartLines.length) return { error: new Error('Your cart is empty') };

    // Final stock check right before the order is created — this is the real backstop against two
    // customers (or an in-store POS sale) taking the last unit of something at nearly the same
    // time; the cart-side clamping earlier is only as fresh as the last product sync.
    const ids = cartLines.map(c=>c.id);
    const { data: freshRows, error: stockErr } = await sb.from('storefront_products').select('id, stock').in('id', ids);
    if(stockErr){ showToast('Could not verify stock — please try again','⚠️'); return { error: stockErr }; }
    const freshStock = {}; (freshRows||[]).forEach(r=>{ freshStock[r.id]=r.stock; });
    const shortages = cartLines.filter(c=> (freshStock[c.id] ?? 0) < c.qty);
    if(shortages.length){
      shortages.forEach(c=>{
        const avail = freshStock[c.id] || 0;
        if(avail<=0) removeFromCart(c.id); else setCartQty(c.id, avail);
      });
      const names = shortages.map(c=>c.product.name).join(', ');
      showToast(`Stock just changed for: ${names} — please review your cart`, '⚠️');
      return { error: new Error('stock_changed') };
    }

    const needsVerification = paymentMethod==='upi' || paymentMethod==='upiApps';
    const paymentLabel = paymentMethod==='upiApps' && upiAppChoice ? upiAppChoice.label : PAYMENT_LABELS[paymentMethod] || paymentMethod;

    const { data: orderRow, error: orderErr } = await sb.from('online_orders').insert({
      customer_id: session.user.id,
      status: 'Order Confirmed',
      subtotal, delivery_charge: deliveryCharge, packaging_charge: packagingCharge, total,
      payment_status: needsVerification ? 'pending' : 'cod',
      payment_method: paymentLabel,
      delivery_type: deliveryType,
      shipping_address: address,
      notes: address.instructions || null,
    }).select().single();

    if(orderErr || !orderRow){
      showToast('Could not place order — please try again','⚠️');
      return { error: orderErr };
    }

    const itemRows = cartLines.map(c=> ({
      order_id: orderRow.id, product_id: c.id, product_name: c.product.name,
      quantity: c.qty, unit_price: c.product.price, discount: 0, total: c.product.price*c.qty,
    }));
    const { error: itemsErr } = await sb.from('online_order_items').insert(itemRows);
    if(itemsErr) console.error('Failed to insert order items', itemsErr);

    const { error: payErr } = await sb.from('online_payments').insert({
      order_id: orderRow.id, amount: total, method: paymentLabel,
      status: needsVerification ? 'pending' : 'pending',
      transaction_reference: needsVerification ? 'MERAKI'+Date.now() : null,
      gateway: paymentMethod==='cod' ? 'cod' : 'upi_manual',
      metadata: upiAppChoice ? { app: upiAppChoice.id } : null,
    });
    if(payErr) console.error('Failed to insert payment record', payErr);

    const fullOrder = mapDbOrder({...orderRow, online_order_items: itemRows, online_payments: []}, productMap);
    setOrders(prev=> [fullOrder, ...prev]);
    setCart([]);
    setUpiAppChoice(null);
    fetchOrders();
    sb.from('customer_cart_items').delete().eq('customer_id', session.user.id)
      .then(({error})=>{ if(error) console.error('Failed to clear cart after order', error); });
    return { order: fullOrder };
  },[session, cartLines, subtotal, deliveryCharge, packagingCharge, total, deliveryType, paymentMethod, upiAppChoice, address, productMap, setCart, setCartQty, removeFromCart, setUpiAppChoice, fetchOrders, showToast]);

  const verifyOrderPayment = useCallback(async (orderId)=>{
    setOrders(prev=> prev.map(o=> o.id===orderId ? {...o, paymentVerified:true} : o));
    const { error: e1 } = await sb.from('online_orders').update({ payment_status: 'paid' }).eq('id', orderId);
    const { error: e2 } = await sb.from('online_payments').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('order_id', orderId);
    if(e1 || e2){ showToast('Could not update payment status','⚠️'); }
  },[showToast]);

  const value = {
    cart, cartLines, cartCount, subtotal, mrpTotal, savings, deliveryCharge, packagingCharge, total, amountToFreeDelivery,
    addToCart, setCartQty, removeFromCart,
    wishlist, toggleWishlist, moveWishlistToCart,
    orders, ordersLoading, placeOrder, verifyOrderPayment,
    address, setAddress, deliveryType, setDeliveryType, paymentMethod, setPaymentMethod,
    upiAppChoice, setUpiAppChoice,
    loggedIn, authLoading, session, customerProfile, profileLoading,
    signUp, signIn, signOut, updateProfile,
    darkMode, setDarkMode,
    showToast, toast, productMap, productsLoading,
    products, categories,
    banners, storeSettings,
    viewMode, setViewMode,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function Toast(){
  const {toast} = useApp();
  const [current, setCurrent] = useState(null);
  const [visible, setVisible] = useState(false);
  const hideTimer = useRef(null);

  useEffect(()=>{
    if(toast){
      clearTimeout(hideTimer.current);
      setCurrent(toast);
      requestAnimationFrame(()=> requestAnimationFrame(()=> setVisible(true)));
    } else if(current){
      setVisible(false);
      hideTimer.current = setTimeout(()=> setCurrent(null), 320);
    }
    return ()=> clearTimeout(hideTimer.current);
  },[toast]);

  if(!current) return null;
  return (
    <div className={"fixed z-[80] left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 bg-[var(--ink)] text-white px-4 py-2.5 rounded-full shadow-xl text-sm font-semibold flex items-center gap-2 transition-all duration-300 ease-[cubic-bezier(.34,1.56,.64,1)] "+(visible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-3 scale-90')}>
      <span>{current.icon}</span><span>{current.msg}</span>
    </div>
  );
}

// Shared voice-search hook — wraps the browser's SpeechRecognition API (Chrome/Edge/most Android
// browsers; not Safari/iOS, which has no implementation) so both the desktop and mobile search bars
// can reuse the same mic behavior instead of duplicating it.
function useVoiceSearch(onResult){
  const {showToast} = useApp();
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const SR = typeof window!=='undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  const start = useCallback(()=>{
    if(!SR){ showToast("Voice search isn't supported on this browser", '🎤'); return; }
    if(listening){ recognitionRef.current && recognitionRef.current.stop(); return; }
    const rec = new SR();
    rec.lang = 'en-IN';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = ()=> setListening(true);
    rec.onend = ()=> setListening(false);
    rec.onerror = (e)=>{
      setListening(false);
      if(e.error==='not-allowed' || e.error==='service-not-allowed') showToast("Microphone access was blocked", '🎤');
      else if(e.error!=='no-speech' && e.error!=='aborted') showToast("Couldn't hear that — try again", '🎤');
    };
    rec.onresult = (e)=>{ const transcript = e.results[0][0].transcript; if(transcript.trim()) onResult(transcript.trim()); };
    recognitionRef.current = rec;
    rec.start();
  },[SR, listening, onResult, showToast]);

  useEffect(()=>()=>{ recognitionRef.current && recognitionRef.current.stop(); },[]);

  return { listening, start, supported: !!SR };
}

function SearchBar({autoFocus, onSubmitGo}){
  const [q,setQ] = useState(()=> parseRoute(window.location.hash).query.q || '');

    if(onSubmitGo) onSubmitGo();
  };
  const {listening, start} = useVoiceSearch((transcript)=>{
    setQ(transcript);
    navigate('#/search?q='+encodeURIComponent(transcript));
    if(onSubmitGo) onSubmitGo();
  });
  return (
    <form onSubmit={submit} className="flex-1 flex items-center bg-[#F5F2FB] rounded-xl px-3 py-2 gap-2">
      <span className="text-[var(--muted)]"><Icon.Search /></span>

  );
}

    p.category.toLowerCase().includes(query.toLowerCase()) ||

              <button onClick={()=> window.history.length>1 ? window.history.back() : navigate('#/home')} aria-label="Back" className="focus-ring text-[var(--ink)] flex-shrink-0"><Icon.Back /></button>
            ) : (

            {searchOpen && (
              <form onSubmit={e=>{e.preventDefault(); runSearch();}} className={"flex items-center bg-[#F5F2FB] rounded-full px-3 py-2 gap-2 border-2 transition-colors "+(focused?'border-[var(--purple)] bg-white':'border-transparent')}>
                <span className="text-[var(--muted)] flex-shrink-0"><Icon.Search /></span>
                <input autoFocus value={query} onChange={e=>setQuery(e.target.value)}
                  onFocus={()=>setFocused(true)}
                  onBlur={()=>setTimeout(()=>setFocused(false), 150)}
                  placeholder="Search for toys, stationery, art supplies..."
                  className="bg-transparent outline-none text-sm w-full placeholder-[var(--muted)]" />

                  <Icon.Mic />
                </button>
              </form>
            )}

            ) : (

            See all results for "{query}" →

  );

function ChangeLocationModal({onClose}){
  const {address, setAddress} = useApp();
  const [pin, setPin] = useState(address.pincode);
  const [area, setArea] = useState(address.area);
  const [autoDetected, setAutoDetected] = useState(false);

  const isComplete = /^\d{6}$/.test(pin);
  const serviceable = isServiceablePin(pin);

  useEffect(()=>{
    if(isComplete && PIN_TO_AREA[pin]){
      setArea(PIN_TO_AREA[pin]);
      setAutoDetected(true);
    } else {
      setAutoDetected(false);
    }
  },[pin]);

  return (
    <Modal onClose={onClose} title="Change delivery location">
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">PIN Code</label>
          <div className="relative mt-1">
            <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,6))}
              className={"w-full border rounded-lg pl-3 pr-9 py-2 text-sm focus-ring "+(isComplete && !serviceable ? 'border-[var(--danger)]' : 'border-[var(--line)]')} />
            {pin && (
              <button aria-label="Clear PIN code" onClick={()=>{setPin(''); setAutoDetected(false);}}
                className="absolute right-2 top-1/2 -translate-y-1/2 text-[var(--muted)] hover:text-[var(--ink)] w-5 h-5 flex items-center justify-center rounded-full hover:bg-black/5 focus-ring">
                <Icon.Close />
              </button>
            )}
          </div>
          {isComplete && !serviceable && (
            <div className="text-xs text-[var(--danger)] font-semibold mt-1.5 flex items-center gap-1">🚫 Sorry, we don't deliver to this PIN code yet. We currently serve Jaipur only.</div>
          )}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)] flex items-center gap-1.5">
            Area {autoDetected && <span className="text-[var(--green)] font-bold">· Auto-detected ✨</span>}
          </label>
          <input value={area} onChange={e=>{setArea(e.target.value); setAutoDetected(false);}} disabled={isComplete && !serviceable}
            className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring disabled:bg-gray-50 disabled:text-gray-400" />
        </div>
        <button onClick={()=>{ setAddress({...address, pincode:pin, area:area}); onClose(); }}
          disabled={!serviceable}
          className="btn-primary w-full py-2.5 focus-ring">{serviceable ? 'Save Location' : 'Not Serviceable'}</button>
      </div>
    </Modal>
  );
}

function Modal({onClose, title, children}){
  const [mounted, setMounted] = useState(false);
  const [closing, setClosing] = useState(false);

  useEffect(()=>{
    const raf = requestAnimationFrame(()=> requestAnimationFrame(()=> setMounted(true)));
    return ()=> cancelAnimationFrame(raf);
  },[]);

  const requestClose = useCallback(()=>{
    setClosing(true);
    setTimeout(()=> onClose(), 260);
  },[onClose]);

  useEffect(()=>{
    const onEsc = (e)=>{ if(e.key==='Escape') requestClose(); };
    document.addEventListener('keydown', onEsc);
    return ()=> document.removeEventListener('keydown', onEsc);
  },[requestClose]);

  const visible = mounted && !closing;

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] flex items-end md:items-center justify-center">
      <div className={"absolute inset-0 bg-black/40 transition-opacity duration-300 "+(visible?'opacity-100':'opacity-0')} onClick={requestClose}></div>
      <div className={"relative bg-white w-full md:w-[420px] md:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto transition-all duration-300 ease-[cubic-bezier(.22,.9,.32,1)] "+
        (visible ? 'translate-y-0 md:scale-100 opacity-100' : 'translate-y-full md:translate-y-3 md:scale-95 opacity-0')}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display font-bold text-lg">{title}</h3>
          <button onClick={requestClose} aria-label="Close" className="focus-ring w-7 h-7 flex items-center justify-center rounded-full hover:bg-black/5"><Icon.Close /></button>
        </div>
        {children}
      </div>
    </div>,
    document.body
  );
}

// Fades a section in once it actually scrolls into view (rather than all at once on page load) —
// used for the trust strip near the bottom of the homepage.
function RevealOnScroll({children, className}){
  const ref = useRef(null);
  const [revealed, setRevealed] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){ setRevealed(true); obs.disconnect(); }
    }, { threshold: 0.2 });
    obs.observe(el);
    return ()=> obs.disconnect();
  },[]);
  return <div ref={ref} className={"reveal-on-scroll "+(revealed?'revealed ':'')+(className||'')}>{children}</div>;
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  const [order] = useState(()=> shuffleArray(products));
  const [visibleCount, setVisibleCount] = useState(BATCH);

  if(!order.length) return null;
  const visible = order.slice(0, visibleCount);
  const hasMore = visibleCount < order.length;

  return (

// Reads/writes the small "recently viewed" list kept in localStorage (most-recent-first, capped).
const RECENTLY_VIEWED_KEY = 'meraki_recently_viewed_v1';
function recordRecentlyViewed(id){
  try{
    const raw = localStorage.getItem(RECENTLY_VIEWED_KEY);
    let list = raw ? JSON.parse(raw) : [];
    list = [id, ...list.filter(x=>x!==id)].slice(0,12);
    localStorage.setItem(RECENTLY_VIEWED_KEY, JSON.stringify(list));
  } catch(e){ /* localStorage unavailable — recently viewed just won't persist, not fatal */ }
}
function useRecentlyViewedIds(){
  const [ids, setIds] = useState([]);
  useEffect(()=>{
    try{ const raw = localStorage.getItem(RECENTLY_VIEWED_KEY); setIds(raw ? JSON.parse(raw) : []); }
    catch(e){ setIds([]); }
  },[]);
  return ids;
}

function CategoryPage({route}){
  const routeParam = route.parts[1] || '';
  const {products, productsLoading, categories} = useApp();
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortOpen, setSortOpen] = useState(false);
  const [sort, setSort] = useState('popular');
  const [priceMax, setPriceMax] = useState(null); // null = no cap applied yet
  const [brandFilter, setBrandFilter] = useState([]);
  const [inStockOnly, setInStockOnly] = useState(false);
  const [view, setView] = useState('grid');

  useEffect(()=>{
    setPriceMax(null);
    setBrandFilter([]);
    setInStockOnly(false);
    setSort('popular');
  },[routeParam]);

  const matchedCategory = categories.find(c=>c.id===routeParam) || categories[0];

  const base = matchedCategory ? products.filter(p=>p.category===matchedCategory.id) : products;
  const headerLabel = matchedCategory ? matchedCategory.name : 'All Products';
  const headerIcon = matchedCategory ? matchedCategory.icon : '🛍️';

  const brands = useMemo(()=> Array.from(new Set(base.map(p=>p.brand))), [base]);
  // The real ceiling for this category's price slider — never caps products by
  // default; a filter is only "active" once the shopper actually drags it down.
  const priceCeiling = useMemo(()=> Math.max(1000, ...base.map(p=>p.price), 0), [base]);
  const effectivePriceMax = priceMax==null ? priceCeiling : priceMax;
  const priceFilterActive = priceMax!=null && priceMax < priceCeiling;

  let list = base.filter(p=> p.price<=effectivePriceMax);
  if(brandFilter.length) list = list.filter(p=>brandFilter.includes(p.brand));
  if(inStockOnly) list = list.filter(p=>p.stock>0);

  if(sort==='price_low') list = [...list].sort((a,b)=>a.price-b.price);
  else if(sort==='price_high') list = [...list].sort((a,b)=>b.price-a.price);
  else if(sort==='newest') list = [...list].sort((a,b)=> b.id.localeCompare(a.id));
  else if(sort==='discount') list = [...list].sort((a,b)=> b.discount-a.discount);
  else list = [...list].sort((a,b)=> (b.tags.includes('bestseller')?1:0) - (a.tags.includes('bestseller')?1:0));

  const sortLabels = {popular:'Popular', price_low:'Price: Low to High', price_high:'Price: High to Low', newest:'Newest', discount:'Discount'};

  return (
    <div className="fade-in flex h-[calc(100vh-118px)] md:h-[calc(100vh-100px)] overflow-hidden">
      {/* Left rail — every real category from Supabase, regardless of current stock */}
      <div className="w-[72px] sm:w-[87px] flex-shrink-0 border-r border-[var(--line)] bg-white overflow-y-auto scrollbar-none h-full">
        {categories.map(c=>{
          const active = matchedCategory && matchedCategory.id===c.id;
          return (
            <a key={c.id} href={"#/category/"+c.id}
              className={"flex flex-col items-center gap-1 py-4 px-1 text-center border-l-[3px] transition-colors focus-ring "+
                (active ? 'border-[var(--purple)] bg-[var(--purple-light)]' : 'border-transparent hover:bg-gray-50')}>
              <div className={"text-xl transition-transform "+(active?'scale-110':'')}>{c.icon}</div>
              <div className={"text-[10px] font-bold leading-tight break-words "+(active?'text-[var(--purple)]':'text-[var(--muted)]')}>{c.name}</div>
            </a>
          );
        })}
      </div>

      <div key={routeParam} className="flex-1 min-w-0 px-3 md:px-6 py-3 overflow-y-auto h-full fade-in">
        <div className="hidden md:block mb-2">
          <h1 className="font-display font-bold text-2xl">{headerIcon} {headerLabel}</h1>
          <div className="text-sm text-[var(--muted)]">{list.length} products</div>
        </div>

        <div className="pb-2">
          <div className="flex items-center justify-between mb-2 gap-2">
            <button onClick={()=>setFiltersOpen(true)} className="chip flex items-center gap-1 focus-ring">🧰 Filters</button>
            <button onClick={()=>setSortOpen(true)} className="chip flex items-center gap-1 focus-ring !px-[13px]">Sort: {sortLabels[sort]} ▾</button>
            <div className="flex gap-1 ml-auto">
              <button onClick={()=>setView('grid')} className={"chip px-2 "+(view==='grid'?'active':'')}>▦</button>
              <button onClick={()=>setView('list')} className={"chip px-2 "+(view==='list'?'active':'')}>≡</button>
            </div>
          </div>
          <div className="text-xs text-[var(--muted)] mb-2">{list.length} Products {(brandFilter.length||inStockOnly||priceFilterActive) && <span className="text-[var(--purple)] font-semibold">· Filter Applied</span>}</div>
        </div>
        {productsLoading ? (
          <ProductGridSkeleton count={6} cols="grid-cols-2 lg:grid-cols-3" />
        ) : (
          <ProductGrid products={list} cols="grid-cols-2 lg:grid-cols-3" layout={view} />
        )}
      </div>

      {filtersOpen && (
        <Modal onClose={()=>setFiltersOpen(false)} title="Filters">
          <FilterPanel {...{categories, activeCategoryId: matchedCategory && matchedCategory.id, priceMax: effectivePriceMax, priceCeiling, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly}} onNavigate={()=>setFiltersOpen(false)} />
          <button onClick={()=>setFiltersOpen(false)} className="btn-primary w-full py-2.5 mt-4 focus-ring">Apply Filters</button>
        </Modal>
      )}
      {sortOpen && (
        <Modal onClose={()=>setSortOpen(false)} title="Sort by">
          <div className="flex flex-col gap-1">
            {Object.entries(sortLabels).map(([k,v])=> (
              <button key={k} onClick={()=>{setSort(k); setSortOpen(false);}} className={"text-left px-3 py-2.5 rounded-lg text-sm font-semibold focus-ring "+(sort===k?'bg-[var(--purple-light)] text-[var(--purple)]':'hover:bg-gray-50')}>{v}</button>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

function FilterPanel({categories, activeCategoryId, priceMax, priceCeiling, setPriceMax, brands, brandFilter, setBrandFilter, inStockOnly, setInStockOnly, onNavigate}){
  const toggleBrand = (b)=> setBrandFilter(prev=> prev.includes(b) ? prev.filter(x=>x!==b) : [...prev,b]);
  return (
    <div className="space-y-5">
      <div>
        <div className="font-bold text-sm mb-2">Category</div>
        <div className="flex flex-col gap-1.5 text-sm">
          {categories.map(c=> (
            <a key={c.id} href={"#/category/"+c.id} onClick={onNavigate}
              className={"flex items-center gap-2 focus-ring "+(activeCategoryId===c.id?'font-bold text-[var(--purple)]':'')}>
              <span>{c.icon}</span> {c.name}
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Price</div>
        <input type="range" min="0" max={priceCeiling} value={priceMax} onChange={e=>setPriceMax(Number(e.target.value))} className="w-full accent-[var(--purple)]" />
        <div className="flex justify-between text-xs text-[var(--muted)]"><span>₹0</span><span>{priceMax>=priceCeiling?inr(priceCeiling)+'+':inr(priceMax)}</span></div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Brand</div>
        <div className="flex flex-col gap-1.5 text-sm max-h-36 overflow-y-auto">
          {brands.map(b=> <label key={b} className="flex items-center gap-2"><input type="checkbox" checked={brandFilter.includes(b)} onChange={()=>toggleBrand(b)} /> {b}</label>)}
        </div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Availability</div>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={inStockOnly} onChange={()=>setInStockOnly(v=>!v)} /> In Stock</label>
      </div>
    </div>
  );
}

function CheckoutStepper({step}){
  const steps = ['Address','Payment','Confirm'];
  return (
    <div className="flex items-center gap-2 px-4 md:container-max md:mx-auto py-3 text-xs font-semibold">
      {steps.map((s,i)=>{
        const idx=i+1;
        const state = idx<step ? 'done' : idx===step ? 'active' : 'pending';
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-1.5">
              <span className={"w-5 h-5 rounded-full flex items-center justify-center text-[10px] "+
                (state==='done' ? 'bg-[var(--green)] text-white' : state==='active' ? 'bg-[var(--purple)] text-white' : 'bg-gray-200 text-gray-500')}>
                {state==='done' ? '✓' : idx}
              </span>
              <span className={state==='pending' ? 'text-[var(--muted)]' : ''}>{s}</span>
            </div>
            {idx<3 && <div className="flex-1 h-px bg-[var(--line)]"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

const UPI_VPA = '7231842081@okbizaxis';
const UPI_PAYEE_NAME = 'Prashant Punia';

// App-specific custom URI schemes so tapping a chosen app opens its own
// payment-confirmation screen (with amount prefilled) instead of its home screen.
// The generic 'upi://pay' scheme below is kept for the QR code, since that
// needs to stay app-agnostic so any UPI app's scanner can read it.
function buildUpiParams(amount, note){
  return {
    pa: UPI_VPA, pn: UPI_PAYEE_NAME, am: Number(amount).toFixed(2), cu: 'INR',
    tn: note || 'Meraki Order Payment', tr: 'MERAKI'+Date.now(),
  };
}

function buildUpiUri(amount, note){
  return 'upi://pay?' + new URLSearchParams(buildUpiParams(amount, note)).toString();
}

// NOTE: We deliberately use the single, standard NPCI 'upi://pay' intent for every
// app choice below (not each app's private/undocumented scheme like tez:// or
// paytmmp://). Those unofficial schemes are what trigger "blocked for your safety /
// risk policy" errors in GPay and Paytm, since a webpage silently launching a
// specific payment app with a pre-filled amount via an undocumented deep link is
// exactly the pattern phishing pages use. The standard intent lets the phone's OS
// hand off to the chosen app the same safe way a QR scan does.
function buildUpiAppUri(appId, amount, note){
  return buildUpiUri(amount, note);
}

}

      style={{width:size, height:size, fontSize:size*0.5}}>

  );
}

function UpiQr({amount}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current || typeof QRCode === 'undefined') return;
    ref.current.innerHTML = '';
    try{
      new QRCode(ref.current, {
        text: buildUpiUri(amount),
        width: 168, height: 168,
        colorDark: '#241A38', colorLight: '#ffffff',
      });
    }catch(e){ console.error('QR generation failed', e); }
  },[amount]);
  return <div ref={ref} className="flex items-center justify-center min-h-[168px] min-w-[168px]"></div>;
}

    {id:'cod', label:'Cash on Delivery', sub:'Pay when your order is delivered', render:()=><Icon.Cash/>},
    {id:'upi', label:'UPI / QR Code', sub:'Scan & pay with any UPI app', render:()=><UpiBadge size={30}/>},

  ];

  const onSelect = (id)=>{

  };

  const onSelectUpiApp = (app)=>{

  return (

function statusColor(status){
  if(status==='Delivered') return 'green';
  if(status==='Cancelled') return 'danger';
  return 'amber';
}

function downloadInvoice(order, storeSettings){
  const s = storeSettings || DEFAULT_STORE_SETTINGS;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(108,63,197);
    doc.text(s.storeName, 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    y += 6; doc.text(s.addressLine+', '+s.area+', '+s.city+' - '+s.pincode, 14, y);
    y += 5; doc.text('Phone: '+s.phone+'  ·  '+s.email, 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 10; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,20,50);
    doc.text('TAX INVOICE', 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text('Order #'+(order.shortId||order.id), 196, y, {align:'right'});

    y += 8;
    doc.text('Order Date: '+new Date(order.date).toLocaleString(), 14, y);
    y += 5;
    doc.text('Payment Method: '+(order.paymentLabel || PAYMENT_LABELS[order.paymentMethod] || order.paymentMethod), 14, y);
    y += 5;
    doc.text('Delivery Type: '+(order.deliveryType==='home'?'Home Delivery':'Store Pickup'), 14, y);

    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50); doc.text('Bill To:', 14, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90);
    y += 5; doc.text(order.address.name || '', 14, y);
    y += 5; doc.text((order.address.line1||'')+', '+(order.address.area||''), 14, y);
    y += 5; doc.text((order.address.city||'')+' - '+(order.address.pincode||''), 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50);
    doc.text('Item', 14, y); doc.text('Qty', 130, y, {align:'right'}); doc.text('Price', 160, y, {align:'right'}); doc.text('Total', 196, y, {align:'right'});
    y += 3; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(60,50,70);

    order.items.forEach(it=>{
      y += 8;
      if(y > 270){ doc.addPage(); y = 20; }
      const name = it.name.length > 48 ? it.name.slice(0,45)+'...' : it.name;
      doc.text(name, 14, y);
      doc.text(String(it.qty), 130, y, {align:'right'});
      doc.text(inr(it.price), 160, y, {align:'right'});
      doc.text(inr(it.price*it.qty), 196, y, {align:'right'});
    });

    y += 6; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.text('Subtotal', 160, y, {align:'right'}); doc.text(inr(order.subtotal), 196, y, {align:'right'});
    y += 6;
    doc.text('Delivery Charge', 160, y, {align:'right'}); doc.text(order.deliveryCharge===0?'FREE':inr(order.deliveryCharge), 196, y, {align:'right'});
    y += 6;
    doc.text('Packaging Charge', 160, y, {align:'right'}); doc.text(inr(order.packagingCharge), 196, y, {align:'right'});
    y += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,20,50);
    doc.text('Total Amount', 160, y, {align:'right'}); doc.text(inr(order.total), 196, y, {align:'right'});

    y += 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140,130,155);
    doc.text('Thank you for shopping with Meraki Stationery & Toys!', 14, y);

    doc.save('Invoice-'+(order.shortId||order.id)+'.pdf');
  } catch(e){
    console.error('Invoice generation failed', e);
  }
}

function SearchPage(){
  const route = parseRoute(window.location.hash);
  const q = (route.query.q||'').toLowerCase().trim();
  const maxPrice = route.query.maxPrice ? Number(route.query.maxPrice) : null;
  const minPrice = route.query.minPrice ? Number(route.query.minPrice) : null;
  const [term, setTerm] = useState(q);
  const {products} = useApp();
  useEffect(()=> setTerm(q), [q]);

  const hasPriceFilter = maxPrice!=null || minPrice!=null;
  const results = (term || hasPriceFilter) ? products.filter(p=>{
    const matchesTerm = !term || p.name.toLowerCase().includes(term) ||
      p.category.toLowerCase().includes(term) || p.sub.toLowerCase().includes(term) || p.brand.toLowerCase().includes(term);
    const matchesMax = maxPrice==null || p.price <= maxPrice;
    const matchesMin = minPrice==null || p.price >= minPrice;
    return matchesTerm && matchesMax && matchesMin;
  }) : [];

  const priceLabel = maxPrice!=null && minPrice!=null ? `${inr(minPrice)}–${inr(maxPrice)}`
    : maxPrice!=null ? `Under ${inr(maxPrice)}`
    : minPrice!=null ? `${inr(minPrice)}+` : null;

  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      {!term && !hasPriceFilter ? (
        <div className="text-center py-16 text-[var(--muted)]">
          <div className="text-4xl mb-2">🔎</div>
          <div className="text-sm">Start typing to search across all products.</div>
        </div>
      ) : (
        <>
          <div className="text-sm text-[var(--muted)] mb-3">
            {results.length} results{term ? <> for "{term}"</> : null}{priceLabel ? <> · {priceLabel}</> : null}
          </div>
          <ProductGrid products={results} />
        </>
      )}
    </div>
  );
}

function AddressBookModal({onClose}){
  const {address, setAddress, session, showToast} = useApp();
  const [addresses, setAddresses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({label:'', name:'', phone:'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur'});
  const [saving, setSaving] = useState(false);

  const loadAddresses = ()=>{
    if(!session){ setLoading(false); return; }
    setLoading(true);
    sb.from('customer_addresses').select('*').eq('customer_id', session.user.id).order('is_default',{ascending:false}).order('created_at')
      .then(({data, error})=>{
        if(!error) setAddresses(data || []);
        setLoading(false);
      });
  };

  useEffect(()=>{ loadAddresses(); },[session]);

  const startNew = ()=>{ setForm({label:'', name:address.name||'', phone:address.phone||'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur'}); setEditing('new'); };
  const startEdit = (a)=>{ setForm({label:a.label||'', name:a.name||'', phone:a.phone||'', line1:a.address_line||'', area:a.locality||'', landmark:a.landmark||'', pincode:a.pincode||'', city:a.city||'Jaipur'}); setEditing(a.id); };

  const save = async ()=>{
    if(!form.name.trim() || !form.line1.trim() || !/^\d{6}$/.test(form.pincode||'')){
      showToast('Please fill name, address & a valid PIN','⚠️');
      return;
    }
    setSaving(true);
    const payload = {
      label: form.label || 'Home', name: form.name.trim(), phone: form.phone.trim(),
      address_line: form.line1.trim(), locality: form.area.trim(), landmark: form.landmark.trim() || null,
      pincode: form.pincode.trim(), city: form.city.trim() || 'Jaipur',
    };
    const query = editing==='new'
      ? sb.from('customer_addresses').insert({...payload, customer_id: session.user.id, is_default: addresses.length===0}).select().maybeSingle()
      : sb.from('customer_addresses').update(payload).eq('id', editing).select().maybeSingle();
    const { data, error } = await query;
    setSaving(false);
    if(error){ showToast('Could not save address','⚠️'); return; }
    setAddresses(prev=> editing==='new' ? [...prev, data] : prev.map(a=> a.id===editing ? data : a));
    if(data.is_default) applyAsDeliveryAddress(data);
    setEditing(null);
  };

  const remove = async (id)=>{
    const { error } = await sb.from('customer_addresses').delete().eq('id', id);
    if(error){ showToast('Could not delete address','⚠️'); return; }
    setAddresses(prev=> prev.filter(a=>a.id!==id));
  };

  const applyAsDeliveryAddress = (a)=>{
    setAddress(prev=>({...prev, name:a.name, phone:a.phone, line1:a.address_line, area:a.locality, landmark:a.landmark||'', pincode:a.pincode, city:a.city}));
  };

  const setDefault = async (a)=>{
    await sb.from('customer_addresses').update({ is_default: false }).eq('customer_id', session.user.id);
    const { data, error } = await sb.from('customer_addresses').update({ is_default: true }).eq('id', a.id).select().maybeSingle();
    if(error){ showToast('Could not set default address','⚠️'); return; }
    setAddresses(prev=> prev.map(x=> ({...x, is_default: x.id===a.id})));
    applyAsDeliveryAddress(data);
    showToast('Default delivery address updated','📍');
  };

  if(editing){
    return (
      <Modal onClose={()=>setEditing(null)} title={editing==='new' ? 'Add Address' : 'Edit Address'}>
        <div className="space-y-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Label (Home, Work, etc.)</label><input value={form.label} onChange={e=>setForm({...form,label:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Full Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value.replace(/\D/g,'').slice(0,10)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">House / Flat / Street</label><input value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Area</label><input value={form.area} onChange={e=>setForm({...form,area:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Landmark (optional)</label><input value={form.landmark} onChange={e=>setForm({...form,landmark:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">PIN Code</label><input value={form.pincode} onChange={e=>setForm({...form,pincode:e.target.value.replace(/\D/g,'').slice(0,6)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <button onClick={save} disabled={saving} className="btn-primary w-full py-2.5 focus-ring">{saving ? 'Saving…' : 'Save Address'}</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal onClose={onClose} title="Saved Addresses">
      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-8">Loading addresses…</div>
      ) : (
        <div className="flex flex-col gap-2.5">
          {addresses.map(a=> (
            <div key={a.id} className={"card p-3.5 "+(a.is_default?'border-[var(--purple)] border-2':'')}>
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold">{a.label || 'Address'}</span>
                {a.is_default && <Badge tone="green">Default</Badge>}
              </div>
              <div className="text-xs text-[var(--muted)] mt-1">{a.name} · +91 {a.phone}</div>
              <div className="text-xs text-[var(--muted)]">{a.address_line}, {a.locality}, {a.city} - {a.pincode}</div>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>setDefault(a)} disabled={a.is_default} className="btn-secondary px-3 py-1.5 text-xs flex-1 focus-ring disabled:opacity-40">
                  {a.is_default ? 'Currently Default' : 'Use for Delivery'}
                </button>
                <button onClick={()=>startEdit(a)} aria-label="Edit address" className="w-8 h-8 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring"><Icon.Edit/></button>
                <button onClick={()=>remove(a.id)} aria-label="Delete address" className="w-8 h-8 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring"><Icon.Close/></button>
              </div>
            </div>
          ))}
          {addresses.length===0 && <div className="text-center text-sm text-[var(--muted)] py-4">No saved addresses yet.</div>}
          <button onClick={startNew} className="btn-primary w-full py-2.5 mt-1 focus-ring">+ Add New Address</button>
        </div>
      )}
    </Modal>
  );
}

function EditProfileModal({onClose}){
  const {customerProfile, updateProfile, showToast} = useApp();
  const [form, setForm] = useState({
    fullName: (customerProfile && customerProfile.full_name) || '',
    phone: (customerProfile && customerProfile.phone) || '',
    username: (customerProfile && customerProfile.username) || '',
  });
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);

  const validate = ()=>{
    const e = {};
    if(!form.fullName.trim()) e.fullName = 'Name is required';
    if(form.phone && !/^\d{10}$/.test(form.phone.trim())) e.phone = 'Enter a valid 10-digit phone number';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const onSave = async ()=>{
    if(!validate()) return;
    setSaving(true);
    const { error } = await updateProfile({ full_name: form.fullName.trim(), phone: form.phone.trim(), username: form.username.trim() || null });
    setSaving(false);
    if(error){ showToast('Could not update profile','⚠️'); return; }
    showToast('Profile updated', '✅');
    onClose();
  };

  return (
    <Modal onClose={onClose} title="Edit Profile">
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Full Name</label>
          <input value={form.fullName} onChange={e=>setForm({...form,fullName:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          {errors.fullName && <div className="text-xs text-[var(--danger)] mt-1">{errors.fullName}</div>}
        </div>

function AdminLogin({onSuccess}){
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const submit = async (e)=>{
    e.preventDefault();
    setError('');
    setSubmitting(true);
    const { data, error: err } = await sbAdmin.auth.signInWithPassword({ email: email.trim(), password: pass });
    if(err){
      setSubmitting(false);
      setError(err.message);
      return;
    }
    if(data.user.id !== SHOP_OWNER_ID){
      await sbAdmin.auth.signOut();
      setSubmitting(false);
      setError('This account is not authorized as the Meraki shop owner.');
      return;
    }
    setSubmitting(false);
    onSuccess();
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in" style={{background:'linear-gradient(160deg,#F6EEFF,#FBFAFE)'}}>
      <LogoBlock />
      <div className="text-5xl mt-8 mb-2">🔐</div>
      <h1 className="font-display font-bold text-xl mt-2">Shop Owner Login</h1>
      <p className="text-sm text-[var(--muted)] mt-2 max-w-xs">Manage products, banners and orders for Meraki Stationery &amp; Toys.</p>
      <form onSubmit={submit} className="w-full max-w-xs mt-6 space-y-3">
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Shop owner email"
          className="w-full border border-[var(--line)] rounded-lg px-3 py-2.5 text-sm text-center focus-ring" autoFocus />
        <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password"
          className="w-full border border-[var(--line)] rounded-lg px-3 py-2.5 text-sm text-center focus-ring" />
        {error && <div className="text-xs text-[var(--danger)] font-semibold">{error}</div>}
        <button type="submit" disabled={submitting} className="btn-primary w-full py-3 text-sm focus-ring">{submitting ? 'Checking…' : 'Log In to Admin'}</button>
      </form>
      <a href="#/home" onClick={()=>navigate('#/home')} className="text-sm font-bold text-[var(--purple)] mt-6 focus-ring">← Back to Store</a>
    </div>
  );
}

function AdminDashboard(){
  const [orders, setOrders] = useState([]);
  const [items, setItems] = useState([]);
  const [itemsLoading, setItemsLoading] = useState(true);

  const loadItems = ()=>{
    sbAdmin.from('items').select('*').eq('owner_id', SHOP_OWNER_ID).then(({data, error})=>{
      if(!error) setItems(data || []);
      setItemsLoading(false);
    });
  };
  const loadOrders = ()=>{
    sbAdmin.from('online_orders').select('*, online_order_items(*), online_payments(*)').eq('owner_id', SHOP_OWNER_ID).order('created_at',{ascending:false}).then(({data, error})=>{
      if(!error) setOrders((data||[]).map(row=> mapDbOrder(row, null)));
    });
  };

  useEffect(()=>{ loadItems(); loadOrders(); },[]);

  useEffect(()=>{
    const channel = sbAdmin.channel('admin-dashboard-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadItems())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_orders', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_order_items'}, ()=> loadOrders())
      .subscribe();
    return ()=> sbAdmin.removeChannel(channel);
  },[]);

  const totalRevenue = orders.reduce((s,o)=> s+o.total, 0);
  const pendingOrders = orders.filter(o=> o.status!=='Delivered' && o.status!=='Cancelled').length;
  const onlineVisibleCount = items.filter(i=>i.online_visible).length;
  const lowStock = items.filter(i=> i.qty <= (i.custom_low!=null ? i.custom_low : 3));
  const recent = orders.slice(0,6);

  return (
    <div className="fade-in max-w-5xl">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label="Total Orders" value={orders.length} icon="📦" tone="purple" />
        <StatCard label="Total Revenue" value={inr(totalRevenue)} icon="💰" tone="green" />
        <StatCard label="Pending Orders" value={pendingOrders} icon="⏳" tone="amber" />
        <StatCard label="Online Products" value={itemsLoading ? '…' : onlineVisibleCount+' / '+items.length} icon="🏷️" tone="purple" />
      </div>

      {!itemsLoading && lowStock.length>0 && (
        <div className="card p-4 mt-4 border-amber-200">
          <div className="font-bold text-sm mb-2 flex items-center gap-2">⚠️ Low Stock Alert</div>
          <div className="flex flex-wrap gap-2">
            {lowStock.slice(0,8).map(p=> (
              <a key={p.id} href="#/admin/products" className="chip bg-amber-50 border-amber-200 focus-ring">{p.name} · {p.qty} left</a>
            ))}
          </div>
        </div>
      )}

      <div className="card p-4 mt-4">
        <div className="flex items-center justify-between mb-3">
          <div className="font-bold text-sm">Recent Orders</div>
          <a href="#/admin/orders" className="text-xs font-bold text-[var(--purple)] focus-ring">View All ›</a>
        </div>
        {recent.length===0 ? (
          <div className="text-sm text-[var(--muted)] text-center py-6">No orders yet.</div>
        ) : (
          <div className="flex flex-col gap-2">
            {recent.map(o=> (
              <div key={o.id} className="flex items-center justify-between text-sm py-2 border-b border-[var(--line)] last:border-0">
                <div>
                  <div className="font-semibold">#{o.shortId || o.id}</div>
                  <div className="text-xs text-[var(--muted)]">{new Date(o.date).toLocaleDateString()} · {o.items.length} items</div>

              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

function AdminProductFormModal({item, onSaved, onClose}){
  const { showToast } = useApp();
  const [form, setForm] = useState({
    price: String(item.price),
    mrp: item.mrp ? String(item.mrp) : '',
    qty: String(item.qty),
    online_description: item.online_description || '',
    online_visible: item.online_visible,
    is_featured: item.is_featured,
  });
  const [saving, setSaving] = useState(false);
  const [imageUrl, setImageUrl] = useState(null);
  const [imageLoading, setImageLoading] = useState(true);
  const [uploadingImage, setUploadingImage] = useState(false);

  useEffect(()=>{
    sbAdmin.from('product_images').select('image_url').eq('product_id', item.id).eq('is_primary', true).maybeSingle()
      .then(({data})=>{ setImageUrl(data ? data.image_url : null); setImageLoading(false); });
  },[item.id]);

  const onImageUpload = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('Please choose an image under 2MB','⚠️'); return; }
    setUploadingImage(true);
    const path = item.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
    const { error: upErr } = await sbAdmin.storage.from('product-images').upload(path, file, { upsert:true });
    if(upErr){ setUploadingImage(false); showToast('Upload failed','⚠️'); return; }
    const { data: pub } = sbAdmin.storage.from('product-images').getPublicUrl(path);
    const { data: existing } = await sbAdmin.from('product_images').select('id').eq('product_id', item.id).eq('is_primary', true).maybeSingle();
    if(existing){
      await sbAdmin.from('product_images').update({ object_path: path, image_url: pub.publicUrl }).eq('id', existing.id);
    } else {
      await sbAdmin.from('product_images').insert({ product_id: item.id, object_path: path, image_url: pub.publicUrl, is_primary: true, sort_order: 0 });
    }
    setImageUrl(pub.publicUrl);
    setUploadingImage(false);
    showToast('Photo uploaded','📸');
  };

  const removeImage = async ()=>{
    const { data: existing } = await sbAdmin.from('product_images').select('id').eq('product_id', item.id).eq('is_primary', true).maybeSingle();
    if(existing) await sbAdmin.from('product_images').delete().eq('id', existing.id);
    setImageUrl(null);
  };

  const save = async ()=>{
    const price = Number(form.price), qty = Number(form.qty);
    if(!form.price || isNaN(price) || price<0){ showToast('Enter a valid price','⚠️'); return; }
    if(form.qty==='' || isNaN(qty) || qty<0){ showToast('Enter a valid stock quantity','⚠️'); return; }
    let mrp = null;
    if(form.mrp.trim()!==''){
      const mrpNum = Number(form.mrp);
      if(isNaN(mrpNum) || mrpNum<0){ showToast('Enter a valid MRP, or leave it blank','⚠️'); return; }
      mrp = mrpNum;
    }
    setSaving(true);
    const { data, error } = await sbAdmin.from('items').update({
      price, mrp, qty,
      online_description: form.online_description.trim() || null,
      online_visible: form.online_visible,
      is_featured: form.is_featured,
    }).eq('id', item.id).select().maybeSingle();
    setSaving(false);
    if(error){ showToast('Could not save changes','⚠️'); return; }
    showToast('Item updated', '✅');
    onSaved(data);
    onClose();
  };

  return (
    <Modal onClose={onClose} title="Edit Inventory Item">
      <div className="space-y-3">
        <div className="card p-3 text-sm">
          <div className="font-bold">{item.name}</div>
          <div className="text-xs text-[var(--muted)] mt-0.5">{item.category} · {item.brand || 'No brand'}</div>
          <div className="text-[10px] text-[var(--muted)] mt-1">Name, category and brand are managed in your POS app.</div>
        </div>
        <div>

function AdminProducts(){
  const { showToast } = useApp();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('all');
  const [visFilter, setVisFilter] = useState('all');
  const [editingItem, setEditingItem] = useState(null);

  const loadItems = ()=>{
    setLoading(true);
    Promise.all([
      sbAdmin.from('items').select('*').eq('owner_id', SHOP_OWNER_ID).order('name'),
      sbAdmin.from('product_images').select('product_id, image_url, is_primary, sort_order').order('is_primary', {ascending:false}).order('sort_order')
    ]).then(([itemsRes, imagesRes])=>{
      if(itemsRes.error){ showToast('Could not load inventory','⚠️'); setLoading(false); return; }
      const imageByProduct = {};
      (imagesRes.data||[]).forEach(row=>{ if(!imageByProduct[row.product_id]) imageByProduct[row.product_id] = row.image_url; });
      setItems((itemsRes.data||[]).map(it=> ({...it, thumb: imageByProduct[it.id]||null})));
      setLoading(false);
    });
  };

  useEffect(()=>{ loadItems(); },[]);

  useEffect(()=>{
    const channel = sbAdmin.channel('admin-items-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadItems())
      .on('postgres_changes', {event:'*', schema:'public', table:'product_images'}, ()=> loadItems())
      .subscribe();
    return ()=> sbAdmin.removeChannel(channel);
  },[]);

  const categories = useMemo(()=> Array.from(new Set(items.map(i=>i.category))).sort(), [items]);

  const filtered = items.filter(i=>
    (catFilter==='all' || i.category===catFilter) &&
    (visFilter==='all' || (visFilter==='visible' ? i.online_visible : !i.online_visible)) &&
    (search.trim()==='' || i.name.toLowerCase().includes(search.toLowerCase()) || (i.brand||'').toLowerCase().includes(search.toLowerCase()))
  );

  const toggleVisible = async (item)=>{
    const { data, error } = await sbAdmin.from('items').update({ online_visible: !item.online_visible }).eq('id', item.id).select().maybeSingle();
    if(error){ showToast('Could not update visibility','⚠️'); return; }
    setItems(prev=> prev.map(i=> i.id===item.id ? data : i));
    showToast(data.online_visible ? 'Now visible online' : 'Hidden from storefront', data.online_visible ? '👁️' : '🙈');
  };

  const onSaved = (updated)=>{
    setItems(prev=> prev.map(i=> i.id===updated.id ? updated : i));
  };

  return (
    <div className="fade-in max-w-5xl">
      <div className="card p-3 mb-4 text-xs text-[var(--muted)] flex items-start gap-2">
        <span>ℹ️</span> This is your real POS inventory ({items.length} items). Adding or removing items happens in your POS app — here you control what's sold online, its online price/stock, and its storefront description.
      </div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search inventory..." className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring flex-1 min-w-[160px]" />
        <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
          <option value="all">All Categories</option>
          {categories.map(c=> <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={visFilter} onChange={e=>setVisFilter(e.target.value)} className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
          <option value="all">All Items</option>
          <option value="visible">Online Only</option>
          <option value="hidden">Hidden Only</option>
        </select>
      </div>

      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-10">Loading inventory…</div>
      ) : (
        <React.Fragment>
          <div className="text-xs text-[var(--muted)] mb-2">{filtered.length} items</div>
          <div className="flex flex-col gap-2">
            {filtered.map(item=> (
              <div key={item.id} className="card p-3 flex items-center gap-3">
                {item.thumb ? (
                  <img src={item.thumb} alt="" className="w-12 h-12 rounded-lg object-cover flex-shrink-0 border border-[var(--line)]" />
                ) : (
                  <div className="w-12 h-12 rounded-lg flex-shrink-0 bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center font-bold text-lg">{(item.name[0]||'?').toUpperCase()}</div>
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="text-sm font-semibold truncate">{item.name}</div>
                    {item.is_featured && <Badge tone="amber">Featured</Badge>}
                  </div>
                  <div className="text-xs text-[var(--muted)] mt-0.5 truncate">{item.category} · {item.brand || 'No brand'}</div>
                  <div className="text-xs mt-0.5">
                    <span className="font-bold">{inr(item.price)}</span> · <span className={item.qty<=2?'text-[var(--danger)] font-semibold':'text-[var(--muted)]'}>{item.qty} in stock</span>
                  </div>
                </div>
                <div className="flex items-center gap-2.5 ml-auto flex-shrink-0">
                  <ToggleSwitch on={item.online_visible} onChange={()=>toggleVisible(item)} label={item.online_visible ? "Hide from storefront" : "Show on storefront"} />
                  <button onClick={()=>setEditingItem(item)} aria-label="Edit item" className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring flex-shrink-0"><Icon.Edit/></button>
                </div>
              </div>
            ))}
            {filtered.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No items match your search.</div>}
          </div>
        </React.Fragment>
      )}

      {editingItem && <AdminProductFormModal item={editingItem} onSaved={onSaved} onClose={()=>setEditingItem(null)} />}
    </div>
  );
}

function AdminBannerFormModal({banner, sortOrder, onSaved, onClose}){
  const { showToast } = useApp();
  const [form, setForm] = useState(banner ? {
    id: banner.id, active: banner.active, title: banner.title, highlight: banner.highlight||'', subtitle: banner.subtitle||'',
    cta_label: banner.ctaLabel||'Shop Now', cta_link: banner.ctaLink||'#/category/stationery',
    bg: banner.bg && banner.bg.startsWith('#') ? banner.bg : '#EFE6FF', image_url: banner.image||null, sort_order: banner.sortOrder||0,
  } : {...emptyBannerForm(), sort_order: sortOrder||0});
  const isEdit = Boolean(banner);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);

  const onImageUpload = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('Please choose an image under 2MB','⚠️'); return; }
    setUploading(true);
    const path = Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
    const { error } = await sbAdmin.storage.from('banner-images').upload(path, file, { upsert:true });
    if(error){ setUploading(false); showToast('Upload failed','⚠️'); return; }
    const { data } = sbAdmin.storage.from('banner-images').getPublicUrl(path);
    setForm(prev=>({...prev, image_url: data.publicUrl}));
    setUploading(false);
  };

  const save = async ()=>{
    if(!form.title.trim()){ showToast('Please add a banner title','⚠️'); return; }
    setSaving(true);
    const payload = {
      title: form.title.trim(), highlight: form.highlight, subtitle: form.subtitle,
      cta_label: form.cta_label, cta_link: form.cta_link,
      bg: `linear-gradient(120deg, ${form.bg}, #ffffff)`,
      image_url: form.image_url, active: form.active, sort_order: form.sort_order,
    };
    const query = isEdit
      ? sbAdmin.from('storefront_banners').update(payload).eq('id', form.id).select().maybeSingle()
      : sbAdmin.from('storefront_banners').insert(payload).select().maybeSingle();
    const { data, error } = await query;
    setSaving(false);
    if(error){ showToast('Could not save banner','⚠️'); return; }
    showToast(isEdit ? 'Banner updated' : 'Banner added', '✅');
    onSaved(mapDbBanner(data));
    onClose();
  };

  return (
    <Modal onClose={onClose} title={isEdit ? 'Edit Banner' : 'Add Banner'}>
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Banner Image (optional)</label>
          {form.image_url ? (
            <div className="mt-1 relative rounded-lg overflow-hidden border border-[var(--line)]">
              <img src={form.image_url} alt="Banner preview" className="w-full h-28 object-cover" />
              <button type="button" onClick={()=>setForm({...form,image_url:null})} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 shadow flex items-center justify-center focus-ring"><Icon.Close/></button>
            </div>
          ) : (
            <label className="mt-1 flex flex-col items-center justify-center gap-1 border-2 border-dashed border-[var(--line)] rounded-lg h-24 cursor-pointer hover:bg-gray-50 focus-ring">
              <span className="text-lg">{uploading ? '⏳' : '🖼️'}</span>
              <span className="text-xs font-semibold text-[var(--muted)]">{uploading ? 'Uploading…' : 'Tap to upload an image'}</span>
              <input type="file" accept="image/*" onChange={onImageUpload} disabled={uploading} className="hidden" />
            </label>
          )}
          <div className="text-[10px] text-[var(--muted)] mt-1">If no image is uploaded, the background colour below is used instead.</div>
        </div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Everything they need. Delivered with" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Highlight (coloured text)</label><input value={form.highlight} onChange={e=>setForm({...form,highlight:e.target.value})} placeholder="Care & Happiness! 💗" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Subtitle</label><input value={form.subtitle} onChange={e=>setForm({...form,subtitle:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div className="grid grid-cols-2 gap-3">
