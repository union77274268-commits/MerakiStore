<html lang="en">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="css">
/* Layout concept: hash-routed toys and stationery store with ink outlines, hard shadows and floating illustrations. */
:root{
  --bg:#f6f0e6;--bg-alt:#ece3d3;--card:#fffcf6;--ink:#2b2622;--ink-soft:#766d62;--line:#ddd1bd;--road:#d3c5ac;
  --brown:#c0573a;--on-brown:#fff8ee;--on-brown-soft:#f4dccd;--feat-line:#d98a70;
  --lime:#e7b04a;--on-lime:#2b2622;
  --p1:#f3e2b8;--p2:#f1d2c6;--p3:#cfdde3;--p4:#d3dcc6;
  --foot:#2b2622;--foot-ink:#cfc3b2;
  --wm-fill:var(--brown);--wm-stroke:#fff;--wm-shadow:#000;
  --btn-bg:var(--ink);--btn-fg:#fff8ee;--pin-stroke:var(--ink);--focus:var(--brown);
  --danger:#b8402e;--veg:#3c7a52;--nonveg:#b8402e;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hh:calc(114px + env(safe-area-inset-top,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1613;--bg-alt:#241f1b;--card:#2a2420;--ink:#f3ebdf;--ink-soft:#b3a797;--line:#3d352d;--road:#4a4036;
    --brown:#c4553a;--on-brown:#fff8ee;--on-brown-soft:#f4dccd;--feat-line:#d98a70;
    --p1:#3f3722;--p2:#432b25;--p3:#243640;--p4:#2c3826;--foot:#110e0c;
    --btn-bg:#f3ebdf;--btn-fg:#1a1613;--pin-stroke:#f3ebdf;--focus:#e7b04a;--danger:#ff9a86;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1613;--bg-alt:#241f1b;--card:#2a2420;--ink:#f3ebdf;--ink-soft:#b3a797;--line:#3d352d;--road:#4a4036;
  --brown:#c4553a;--on-brown:#fff8ee;--on-brown-soft:#f4dccd;--feat-line:#d98a70;
  --p1:#3f3722;--p2:#432b25;--p3:#243640;--p4:#2c3826;--foot:#110e0c;
  --btn-bg:#f3ebdf;--btn-fg:#1a1613;--pin-stroke:#f3ebdf;--focus:#e7b04a;--danger:#ff9a86;color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,74px);line-height:.96;text-wrap:balance}
h3{text-wrap:balance}
::selection{background:var(--lime);color:var(--on-lime)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
main:focus{outline:none}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.lede{font-size:clamp(18px,2.4vw,21px);color:var(--ink-soft);max-width:32em}
.muted{color:var(--ink-soft)}
.sel{user-select:all}
.section{padding-block:clamp(40px,7vw,96px)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:14px 24px;border-radius:999px;font:700 16px/1 var(--f-body);text-decoration:none;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;transform:translate(var(--mx,0px),var(--my,0px));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn:hover{transform:translate(var(--mx,0px),calc(var(--my,0px) - 2px));box-shadow:0 4px 0 var(--lime)}
.btn:active{transform:translate(var(--mx,0px),var(--my,0px)) scale(.97)}
.btn[disabled],.btn.is-off{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn-lime:hover{box-shadow:0 4px 0 var(--on-brown)}
.btn-sm{padding:10px 16px;font-size:14px}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.fld{display:grid;gap:6px;min-width:0}
.fld>label{font-weight:700;font-size:14px}
.fld small{color:var(--ink-soft);font-size:13px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=color]{width:100%;height:46px;padding:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brown)}
.msg{font-weight:700;min-height:1.4em}
.err{color:var(--danger);font-weight:700}
.ok{color:var(--veg);font-weight:700}

/* header */
.announce{background:var(--lime);color:var(--on-lime);text-align:center;font-weight:700;font-size:14px;padding:8px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:60px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:clamp(12px,2.4vw,28px)}
.nav a{font-weight:700;font-size:15px;text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{border-bottom-color:var(--lime)}
.top-actions{display:flex;align-items:center;gap:10px}
.cart-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none}
.cart-btn svg,.burger svg{width:22px;height:22px}
.cart-btn b{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--lime);color:var(--on-lime);font-size:12px;display:grid;place-items:center;border:2px solid var(--bg)}
.burger{display:none;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pub-pill{font-size:13px;font-weight:700;text-decoration:none;background:var(--lime);color:var(--on-lime);padding:7px 12px;border-radius:999px;white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--lime);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:899px){
  .nav{display:none}
  .burger{display:grid}
  .top.open .nav{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);gap:2px}
  .top.open .nav a{padding:12px 0;font-size:19px;border-bottom:1px solid var(--line)}
  .brand{font-size:19px}
}
@media (max-width:520px){.pub-pill{display:none}}

/* page heads */
.pagehead{padding-block:clamp(32px,6vw,76px) clamp(18px,3vw,34px);display:grid;gap:14px;justify-items:start}
.pagehead h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,9vw,104px);line-height:.94;text-wrap:balance}

/* hero */
.hero{padding-block:clamp(28px,5vw,64px) clamp(48px,7vw,90px);overflow-x:clip}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:32px;align-items:center}
.hero-copy{display:grid;gap:22px;justify-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink-soft)}
.wordmark{display:flex;flex-direction:column;font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.88;font-size:clamp(68px,20vw,152px);letter-spacing:.01em;transform:rotate(-2.5deg);padding-block:.12em;margin:0}
.wm{display:block;width:max-content;max-width:100%;color:var(--wm-fill);text-shadow:-.055em -.055em 0 var(--wm-stroke),.055em -.055em 0 var(--wm-stroke),-.055em .055em 0 var(--wm-stroke),.055em .055em 0 var(--wm-stroke),0 -.07em 0 var(--wm-stroke),0 .07em 0 var(--wm-stroke),-.07em 0 0 var(--wm-stroke),.07em 0 0 var(--wm-stroke),0 .115em 0 var(--wm-shadow)}
.wm.l2{margin-left:.32em}
.hero-badge{position:relative;width:min(80vw,430px);aspect-ratio:1;justify-self:center}
.ring{position:absolute;inset:0;width:100%;height:100%;will-change:transform}
.ring text{font-family:var(--f-display);font-size:14px;fill:var(--ink)}
.cup{position:absolute;left:12%;top:12%;width:76%;height:76%;border-radius:50%;object-fit:cover;border:7px solid var(--card);box-shadow:0 0 0 4px var(--brown),0 26px 50px -12px rgba(40,15,15,.5)}
.sticker{position:absolute;left:-2%;bottom:7%;background:var(--lime);color:var(--on-lime);font-family:var(--f-display);font-size:19px;line-height:1;padding:11px 16px;border-radius:14px;transform:rotate(-8deg);box-shadow:4px 4px 0 var(--brown)}

/* ticker */
.ticker-wrap{overflow:hidden;padding:20px 0;background:var(--bg)}
.ticker{width:104%;margin-left:-2%;background:var(--lime);color:var(--on-lime);transform:rotate(-1.4deg) skewX(var(--sk,0deg));padding-block:14px;overflow:hidden;border-block:3px solid var(--brown)}
.tick-track{display:flex;width:max-content;will-change:transform}
.tick-group{display:flex;flex:none;align-items:center}
.tick-group span{font-family:var(--f-display);font-size:clamp(26px,4vw,40px);text-transform:uppercase;white-space:nowrap;padding-inline:18px;display:inline-flex;align-items:center;gap:36px}
.tick-group span::after{content:"";width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--brown);transform:rotate(-45deg)}

/* story */
.story{padding-block:clamp(48px,8vw,110px);overflow-x:clip}
.story-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,6vw,96px);align-items:start}
.story-visual{position:sticky;top:calc(var(--hh) + 24px);height:calc(100vh - var(--hh) - 48px);height:calc(100svh - var(--hh) - 48px);min-height:360px;display:grid;place-items:center}
.collage{--p:0;position:relative;width:min(100%,380px);aspect-ratio:4/5}
.c-sign{position:absolute;left:0;top:0;width:82%;aspect-ratio:335/425;margin:0;border-radius:26px;overflow:hidden;border:6px solid var(--card);box-shadow:0 26px 50px -18px rgba(40,15,15,.5);transform:rotate(calc(var(--p) * -3deg)) scale(calc(1.06 - var(--p) * .06))}
.c-sign img{width:100%;height:100%;object-fit:cover;object-position:top}
.c-cup{position:absolute;right:0;bottom:0;width:58%;aspect-ratio:1;margin:0;border-radius:50%;overflow:hidden;border:6px solid var(--card);box-shadow:0 0 0 4px var(--brown),0 22px 40px -12px rgba(40,15,15,.5);transform:translate(calc((1 - var(--p)) * 60%),calc((1 - var(--p)) * 50%)) rotate(calc(-14deg + var(--p) * 20deg))}
.c-cup img{width:100%;height:100%;object-fit:cover}
.stamp{position:absolute;left:4%;bottom:5%;background:var(--lime);color:var(--on-lime);font-family:var(--f-display);font-size:18px;line-height:1;padding:10px 14px;border-radius:12px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--brown)}
.beat{min-height:72vh;min-height:72svh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:34em}
.beat p:not(.kicker){font-size:19px;color:var(--ink-soft)}
.mark{background-image:linear-gradient(var(--lime),var(--lime));background-repeat:no-repeat;background-position:0 90%;background-size:0 .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .8s cubic-bezier(.2,.7,.2,1)}
.beat.on .mark{background-size:100% .2em}
.values{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.value{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:10px;align-content:start}
.value h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.value p{color:var(--ink-soft)}

/* featured scroller and menu cards */
.menu{background:var(--bg-alt)}
.menu-sticky{padding-block:clamp(44px,7vw,84px) 40px}
.menu-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.menu-head>div{display:grid;gap:10px;min-width:0}
.menu-count{display:none;font-family:var(--f-display);font-size:28px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-count small{font-family:var(--f-body);font-size:14px;color:var(--ink-soft);font-weight:700}
.menu-view{overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:14px}
.track{display:flex;gap:18px;width:max-content;align-items:stretch;padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 1200px) / 2 + 16px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.track .mi{flex:0 0 clamp(250px,76vw,300px);scroll-snap-align:start}
.menu-foot{display:none;margin-top:22px}
.menu-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.menu-prog i{display:block;height:100%;background:var(--lime);transform-origin:0 50%;transform:scaleX(0)}
.menu-hint{margin-top:6px;font-size:14px;font-weight:700;color:var(--ink-soft)}
.is-pinned .menu-sticky{position:sticky;top:var(--hh);height:calc(100vh - var(--hh));height:calc(100svh - var(--hh));padding-block:24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.is-pinned .menu-view{overflow:hidden;padding-bottom:0}
.is-pinned .menu-count,.is-pinned .menu-foot{display:block}
.is-pinned .menu-hint{display:none}
.is-pinned .track{will-change:transform}

.mi,.offer,.bcard,.value{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mi:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.mi{background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mi-art{aspect-ratio:4/3;display:grid;place-items:center;background:var(--bg-alt);overflow:hidden}
.menu .mi-art{background:var(--bg)}
.mi-art .art{width:78%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.mi:hover .mi-art .art{transform:scale(1.1) rotate(-4deg)}
.mi.off{opacity:.62}
.mi-img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mi-ph{width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:var(--bg-alt);font-family:var(--f-display);font-size:64px;color:var(--ink-soft)}
.menu .mi-ph{background:var(--bg)}
.mi-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.mi-top{display:flex;align-items:center;gap:8px;min-height:22px}
.mi h3{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.05}
.mi .d{color:var(--ink-soft);font-size:15px}
.mi-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
.mi-price{font-family:var(--f-display);font-size:30px;line-height:1}
.vdot{display:inline-block;flex:none;width:16px;height:16px;border:2px solid var(--veg);border-radius:3px;position:relative}
.vdot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--veg)}
.vdot.nv{border-color:var(--nonveg)}
.vdot.nv::after{background:var(--nonveg)}
.badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--lime);color:var(--on-lime);padding:3px 9px;border-radius:99px}
.add{font:700 15px/1 var(--f-body);padding:11px 20px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.add:hover{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.step{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font:700 20px/1 var(--f-body);cursor:pointer}
.step button:hover{background:var(--bg-alt)}
.step span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.soldout{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.cat-h{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:36px 0 16px}
.cat-h:first-child{margin-top:0}

/* menu page controls */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.tools .search{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;margin-bottom:14px;scrollbar-width:thin}
.chips button,.vegbtn{flex:none;font:700 15px/1 var(--f-body);padding:11px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"],.vegbtn[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.notice{background:var(--bg-alt);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;font-weight:700}

/* offers */
.offers{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.offer{background:var(--brown);color:var(--on-brown);border-radius:24px;padding:26px;display:grid;gap:12px;align-content:start}
.offer h3{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.offer p{color:var(--on-brown-soft)}
.offer-price{font-family:var(--f-display);font-weight:400;font-size:38px;color:var(--lime)}
.tag{justify-self:start;display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--bg-alt);color:var(--ink)}
.tag.lime{background:var(--lime);color:var(--on-lime)}
.codes{display:grid;gap:12px}
.code{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;background:var(--card);border:1.5px dashed var(--ink-soft);border-radius:16px;padding:16px 20px}
.code b{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.06em}

/* steps */
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));counter-reset:s}
.stepc{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:8px;align-content:start;counter-increment:s}
.stepc::before{content:counter(s);width:42px;height:42px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.stepc h3{font-family:var(--f-display);font-weight:400;font-size:28px}
.stepc p{color:var(--ink-soft)}

/* branches */
.branches{padding-block:clamp(48px,8vw,110px)}
.br-head{display:grid;gap:14px;margin-bottom:36px;max-width:34em}
.br-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.map-card{background:var(--bg-alt);border:1.5px solid var(--line);border-radius:28px;padding:14px}
.map{display:block;width:100%;height:auto}
.map .ring-road{fill:none;stroke:var(--road);stroke-width:.7;stroke-dasharray:2 2}
.map .road{fill:none;stroke:var(--road);stroke-width:1.2;stroke-linecap:round}
.map .oldcity rect{fill:none;stroke:var(--road);stroke-width:.7;stroke-dasharray:1.5 1.5}
.map .oldcity text{font:italic 600 2.8px var(--f-body);fill:var(--ink-soft)}
.pin{cursor:pointer}
.pin .halo{fill:var(--lime);opacity:0;transform-box:fill-box;transform-origin:center}
.pin.on .halo{opacity:.5;animation:pulse 1.9s ease-out infinite}
.pin .dot{fill:var(--lime);stroke:var(--pin-stroke);stroke-width:.9;transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.3,1.6,.5,1) calc(var(--i,0) * 70ms),opacity .4s calc(var(--i,0) * 70ms),fill .2s}
.pin.on .dot{fill:var(--ink);stroke:var(--lime)}
.pin text{font:700 3.3px var(--f-body);fill:var(--ink-soft);paint-order:stroke;stroke:var(--bg-alt);stroke-width:1.3px;stroke-linejoin:round}
.pin.on text{fill:var(--ink)}
.map.pre .pin .dot{transform:scale(.15);opacity:.2}
@keyframes pulse{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.4);opacity:0}}
.map-note{margin-top:8px;font-size:13px;color:var(--ink-soft);text-align:center}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.pill{font:700 15px/1 var(--f-body);padding:11px 16px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.pill:hover{background:var(--bg-alt)}
.pill[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.detail{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:10px;justify-items:start}
.detail h3{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1}
.detail p{color:var(--ink-soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.link{font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px}
.bcards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin-top:48px}
.bcard{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px;align-content:start;justify-items:start}
.bcard h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.bcard p{color:var(--ink-soft)}
.bcard.closed{opacity:.7}

/* contact */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:16px;align-content:start}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.info{display:grid;gap:14px}
.info div{display:grid;gap:2px}
.info b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* cart and checkout */
.cart-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.lines{display:grid;gap:12px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.line h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05;display:flex;gap:8px;align-items:center}
.line .unit{color:var(--ink-soft);font-size:14px}
.line .tot{font-family:var(--f-display);font-size:26px;text-align:right}
.line .ctl{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.rm{border:0;background:transparent;color:var(--ink-soft);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px}
.sum{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px;position:sticky;top:calc(var(--hh) + 16px)}
.sum .row{display:flex;justify-content:space-between;gap:12px}
.sum .row.disc{color:var(--veg);font-weight:700}
.sum .total{font-family:var(--f-display);font-size:36px;display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px dashed var(--line);padding-top:12px;margin-top:4px}
.promo{display:flex;gap:8px}
.promo input{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 140px;font:700 16px/1 var(--f-body);padding:14px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.form{display:grid;gap:16px}
.recent{display:grid;gap:10px;margin-top:28px}
.recent .rrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.done-card{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);display:grid;gap:16px}
.oid{font-family:var(--f-display);font-size:clamp(40px,8vw,72px);line-height:1;color:var(--ink)}
.olines{display:grid;gap:6px;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding-block:14px}
.olines div{display:flex;justify-content:space-between;gap:12px}
.textbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;background:var(--bg-alt);border-radius:14px;padding:14px;max-height:240px;overflow:auto}

/* closing band, footer */
.cta{background:var(--brown);color:var(--on-brown);overflow:hidden;padding-top:clamp(56px,9vw,120px)}
.cta-inner{display:grid;gap:26px;justify-items:start}
.cta h2{font-size:clamp(44px,9vw,108px);max-width:11em}
.cta p{color:var(--on-brown-soft);font-size:19px}
.mega{width:max-content;margin-top:clamp(36px,6vw,64px);font-family:var(--f-display);text-transform:uppercase;white-space:nowrap;font-size:clamp(96px,24vw,300px);line-height:.9;color:transparent;-webkit-text-stroke:2px var(--on-brown);opacity:.38;user-select:none}
.footer{background:var(--brown);color:var(--on-brown-soft);padding-top:clamp(36px,5vw,56px)}
.footer .cols{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.footer h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-brown);margin-bottom:10px}
.footer .fb{font-family:var(--f-display);font-size:30px;text-transform:uppercase;color:var(--on-brown);line-height:1}
.footer ul{display:grid;gap:6px}
.footer a{text-decoration:none;font-weight:700}
.footer a:hover{color:var(--lime)}
.footer .legal{border-top:1px solid var(--feat-line);margin-top:34px;padding-block:20px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:14px}

/* fixed bars and toast */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;display:flex;justify-content:center}
.cartbar>*{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;width:min(100%,520px);background:var(--btn-bg);color:var(--btn-fg);border-radius:999px;padding:14px 22px;text-decoration:none;font-weight:700;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
.cartbar .btn{width:auto;box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,460px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:var(--lime);margin-left:8px}
:root[data-theme="dark"] .toast a{color:var(--on-lime);background:var(--lime);padding:2px 8px;border-radius:8px}

/* admin */
.adm{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:90px}
.adm-nav{position:sticky;top:calc(var(--hh) + 16px);display:grid;gap:6px}
.adm-nav button{text-align:left;font:700 15px/1 var(--f-body);padding:13px 16px;border-radius:12px;border:1.5px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.adm-nav button:hover{background:var(--bg-alt)}
.adm-nav button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.adm-body{display:grid;gap:18px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.rowbox{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;background:var(--bg);min-width:0}
.rowbox.slim{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.togs{display:flex;flex-wrap:wrap;gap:12px 22px}
.ctrls{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 16px/1 var(--f-body);cursor:pointer}
.ib:hover{border-color:var(--ink)}
.ib.danger{color:var(--danger)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
details.rowbox>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;font-weight:700;list-style:none}
details.rowbox>summary::-webkit-details-marker{display:none}
details.rowbox>summary::after{content:"Edit";font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
details.rowbox[open]>summary::after{content:"Close"}
.sum-meta{font-weight:500;color:var(--ink-soft)}
.thumb{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);background:var(--bg-alt)}
.imgrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.checks{display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:baseline}
.checks .dotk{width:12px;height:12px;border-radius:50%;flex:none;background:var(--veg);transform:translateY(1px)}
.checks .dotk.warn{background:#d8932b}
.pubbar span{font-weight:700}
.pubbar{justify-content:space-between}
@media (max-width:820px){
  .adm{grid-template-columns:minmax(0,1fr)}
  .adm-nav{position:static;display:flex;overflow-x:auto;padding-bottom:6px}
  .adm-nav button{white-space:nowrap}
}

/* illustrations */
.art{display:block;width:100%}
.art svg{display:block;width:100%;height:auto;overflow:visible}
.art .o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.art .ab{fill:var(--brown)}.art .ac{fill:var(--card)}.art .al{fill:var(--lime)}
.art .aa{fill:#d9893b}.art .ay{fill:#f2c14e}.art .ar{fill:#c4382a}.art .ag{fill:#5aa05a}.art .ao{fill:#a8683a}
.art .sh{fill:var(--ink);opacity:.14}
.art .steam path{animation:steam 3.2s ease-in-out infinite}
.art .steam path:nth-child(2){animation-delay:.5s}.art .steam path:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}
.art .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}

/* page transition, cursor, split headings */
.pg-enter{animation:pgIn .55s cubic-bezier(.2,.7,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cur{position:fixed;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border:2px solid var(--ink);border-radius:50%;pointer-events:none;z-index:60;opacity:0;transition:width .3s,height .3s,margin .3s,background .3s,border-color .3s,opacity .3s;will-change:transform}
.cur.on{opacity:.55}
.cur.big{width:68px;height:68px;margin:-34px 0 0 -34px;background:color-mix(in srgb,var(--lime) 38%,transparent);border-color:var(--lime);opacity:.9}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.split .w>span{display:inline-block;transform:translateY(112%);transition:transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--wi,0) * 70ms)}
.split.in .w>span{transform:none}
.hero .cup{transform:translate(calc(var(--px,0) * -16px),calc(var(--py,0) * -16px));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero .sticker{translate:calc(var(--px,0) * 24px) calc(var(--py,0) * 18px);transition:translate .5s cubic-bezier(.2,.8,.2,1)}
.hero .wordmark{translate:calc(var(--px,0) * 8px) 0;transition:translate .6s cubic-bezier(.2,.8,.2,1)}

/* craving picker */
.mood{padding-block:clamp(48px,8vw,110px)}
.mood-chips{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 26px}
.mood-chips button{font:700 17px/1 var(--f-body);padding:14px 22px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,color .25s,transform .25s}
.mood-chips button:hover{transform:translateY(-2px)}
.mood-chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.mood-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));animation:pgIn .5s cubic-bezier(.2,.7,.2,1)}

/* gallery */
.gal{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(140px,18vw,230px);grid-auto-flow:dense}
.tile{position:relative;margin:0;overflow:hidden;border-radius:24px;background:var(--bg-alt);isolation:isolate}
.tile.wide{grid-column:span 2}.tile.tall{grid-row:span 2}.tile.big{grid-column:span 2;grid-row:span 2}
.tile-in{position:absolute;inset:-10% 0;will-change:transform;display:grid;place-items:center}
.tile-in img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.tile:hover .tile-in img{transform:scale(1.07)}
.tile .art{width:min(70%,260px);transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.tile:hover .art{transform:scale(1.1) rotate(-5deg)}
.tile:nth-child(4n+1).artt{background:var(--lime)}
.tile:nth-child(4n+2).artt{background:var(--brown)}
.tile:nth-child(4n+3).artt{background:var(--bg-alt)}
.tile:nth-child(4n).artt{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.tile figcaption{position:absolute;left:12px;bottom:12px;z-index:2;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;padding:7px 13px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(0,0,0,.4);transform:translateY(0);transition:transform .4s}
.tile:hover figcaption{transform:translateY(-4px)}
@media (max-width:820px){.gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(130px,34vw,200px)}}

/* bean to cup scene */
.proc{height:calc(var(--n,4) * 62vh + 100vh)}
.proc-sticky{position:sticky;top:var(--hh);height:calc(100vh - var(--hh));height:calc(100svh - var(--hh));display:flex;align-items:center;overflow:hidden}
.proc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,72px);align-items:center}
.proc-list{display:grid;gap:6px;align-content:center}
.proc-list h2{margin-bottom:14px}
.pstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 16px;align-items:start;padding:10px 0;border-top:1.5px solid var(--line);opacity:.45;transition:opacity .5s}
.pstep .n{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;transition:background .4s,border-color .4s,color .4s}
.pstep h3{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.1;align-self:center}
.pstep .pt{grid-column:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}
.pstep .pt>p{overflow:hidden;color:var(--ink-soft);min-height:0}
.pstep.on{opacity:1}
.pstep.on .n{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.pstep.on .pt{grid-template-rows:1fr}
.pstep.on .pt>p{padding-top:6px}
.proc-art{position:relative;aspect-ratio:1;max-height:min(62vh,520px);width:100%;justify-self:center;background:var(--bg-alt);border-radius:36px;border:1.5px solid var(--line);overflow:hidden}
.proc-art .art-s{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.8) rotate(-6deg);transition:opacity .6s,transform .8s cubic-bezier(.3,1.3,.5,1)}
.proc-art .art-s.on{opacity:1;transform:none}
.proc-art .art{width:72%}
.proc-bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.proc-bar i{display:block;width:100%;height:100%;background:var(--lime);transform-origin:50% 0;transform:scaleY(0)}
.proc.static{height:auto}
.proc.static .proc-sticky{position:static;height:auto;padding-block:40px}
.proc.static .pstep{opacity:1}.proc.static .pstep .pt{grid-template-rows:1fr}
.proc.static .proc-bar{display:none}
@media (max-width:820px){
  .proc-grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .proc-art{order:-1;aspect-ratio:auto;height:min(30vh,240px);border-radius:26px}
  .proc-list h2{font-size:clamp(30px,8vw,44px);margin-bottom:6px}
  .pstep{padding:7px 0}
}

/* stats */
.stats{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stat{background:var(--brown);color:var(--on-brown);border-radius:24px;padding:26px 22px;display:grid;gap:4px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,8vw,92px);line-height:.95;color:var(--lime);font-variant-numeric:tabular-nums}
.stat span{color:var(--on-brown-soft);font-weight:700}

/* links, crumbs, chip links */
.mi-link{display:block;text-decoration:none}
.plink{text-decoration:none;color:inherit}
.plink:hover{text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:700;color:var(--ink-soft);padding-top:clamp(20px,3vw,34px)}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.crumbs i{font-style:normal;opacity:.5}
.chiplinks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip-link{font:700 15px/1 var(--f-body);padding:11px 18px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;transition:background .2s,color .2s,transform .25s}
.chip-link:hover{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);transform:translateY(-2px)}

/* header dropdown */
.dd{position:relative}
.dd>button{font:700 15px/1 var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--ink);cursor:pointer;padding:6px 2px}
.dd>button:hover,.dd.open>button{border-bottom-color:var(--lime)}
.dd-menu{display:none;position:absolute;top:calc(100% + 14px);right:0;min-width:220px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);z-index:45}
.dd.open .dd-menu{display:grid}
.dd-menu a{padding:10px 12px;border-radius:10px;border-bottom:0!important}
.dd-menu a:hover{background:var(--bg-alt)}
@media (max-width:899px){
  .dd{display:contents}.dd>button{display:none}.dd-menu{display:contents}
  .top.open .nav a{display:block}
  .nav{max-height:calc(100vh - var(--hh));overflow-y:auto}
}

/* category tiles */
.cats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.cat{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px 14px 20px;text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s}
.cat:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--ink)}
.cat .art{width:68%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.cat:hover .art{transform:scale(1.12) rotate(-5deg)}
.cat b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1}
.cat span{font-size:14px;font-weight:700;color:var(--ink-soft)}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,64px);align-items:start;margin-top:22px}
.pdp-media{position:sticky;top:calc(var(--hh) + 20px);aspect-ratio:1;background:var(--bg-alt);border:1.5px solid var(--line);border-radius:32px;overflow:hidden;display:grid;place-items:center}
.pdp-media img{width:100%;height:100%;object-fit:cover}
.pdp-media .art{width:72%}
.pdp-info{display:grid;gap:16px;align-content:start;min-width:0}
.pdp-info h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:.96;text-wrap:balance}
.price-big{font-family:var(--f-display);font-size:48px;line-height:1}
@media (max-width:820px){.pdp{grid-template-columns:minmax(0,1fr)}.pdp-media{position:static}}

/* journal */
.posts{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.post{display:grid;background:var(--card);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;align-content:start}
.post-art{display:grid;place-items:center;background:var(--bg-alt);aspect-ratio:16/10;overflow:hidden}
.post:nth-child(3n+1) .post-art{background:var(--lime)}
.post:nth-child(3n+2) .post-art{background:var(--brown)}
.post-art .art{width:46%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.post:hover .post-art .art{transform:scale(1.1) rotate(-4deg)}
.post-body{padding:20px;display:grid;gap:10px;align-content:start}
.post-body h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}
.article{max-width:760px;margin-inline:auto;display:grid;gap:22px}
.article h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,80px);line-height:.96;text-wrap:balance}
.post-hero{background:var(--bg-alt);border:1.5px solid var(--line);border-radius:32px;padding:clamp(18px,4vw,40px);display:grid;place-items:center}
.post-hero .art{width:min(46%,260px)}
.prose{display:grid;gap:16px;font-size:18px;max-width:42em}
.prose p{color:var(--ink)}
.ph2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;margin-top:12px}
.prose .ph2{scroll-margin-top:calc(var(--hh) + 12px)}

/* faq, policies, roles, search, sitemap */
.faqs{display:grid;gap:10px;align-content:start}
.faq{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0 20px}
.faq summary{cursor:pointer;font-weight:700;font-size:18px;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-display);font-size:26px;line-height:1;transition:transform .3s}
.faq[open] summary::after{transform:rotate(45deg)}
.faq p{padding-bottom:18px;color:var(--ink-soft)}
.toc{position:sticky;top:calc(var(--hh) + 20px);display:grid;gap:6px}
.toc button{text-align:left;font:700 15px/1.2 var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.toc button:hover{border-color:var(--ink)}
@media (max-width:820px){.toc{position:static}}
.roles{display:grid;gap:14px}
.role{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px}
.role>div:first-child{display:grid;gap:4px;min-width:0;flex:1 1 280px}
.role h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}
.sgrp{margin-bottom:26px}
.sgrp h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin-bottom:10px}
.sgrp ul{display:grid;gap:8px}
.sgrp a{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;text-decoration:none;transition:border-color .2s,transform .25s}
.sgrp a:hover{border-color:var(--ink);transform:translateX(4px)}
.sgrp a span{color:var(--ink-soft);font-weight:700}
.sitemap{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.smcol h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:10px}
.smcol ul{display:grid;gap:6px}
.smcol a{text-decoration:none;font-weight:700}
.smcol a:hover{text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px}
.banner{background:var(--brown);color:var(--on-brown);border-radius:32px;padding:clamp(26px,5vw,56px);display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:space-between}
.banner .kicker{color:var(--on-brown-soft)}
.banner h2{font-size:clamp(34px,6vw,60px);margin-top:8px;max-width:14em}

/* reveals */
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.pre{opacity:.2;transform:translateY(34px)}
.tile.rv.pre{transform:scale(.9) translateY(40px)}

@media (max-width:820px){
  .hero-grid,.br-grid,.two,.cart-grid{grid-template-columns:minmax(0,1fr)}
  .hero-badge{margin-top:8px}
  .sum{position:static}
  .story-grid{grid-template-columns:minmax(0,1fr);gap:0}
  .story-visual{top:calc(var(--hh) + 8px);height:min(44vh,340px);height:min(44svh,340px);min-height:0;background:var(--bg);z-index:3;padding-bottom:10px}
  .collage{width:auto;height:100%}
  .beat{min-height:56vh;min-height:56svh}
}
@media (prefers-reduced-motion:reduce){
  .rv,.mark,.pin .dot,.toast,.split .w>span,.tile-in img,.mi,.btn{transition:none}
  .pin.on .halo,.pg-enter,.mood-grid,.art .steam path,.art .bob{animation:none}
  .split .w>span{transform:none}
}
@media (hover:none){.cur{display:none}}
/* ===== Meraki theme: editorial, soft arches, thin lines ===== */
body{font-size:16.5px;letter-spacing:.005em}
h2{font-size:clamp(32px,4.6vw,56px);line-height:1.06;letter-spacing:-.015em;font-weight:400}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--brown)}
.pagehead h1{font-size:clamp(40px,6vw,78px);line-height:1.02;letter-spacing:-.02em}
.lede{font-size:clamp(17px,2vw,19px);line-height:1.6}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
/* buttons */
.btn{background:var(--btn-bg);color:var(--btn-fg);border:1.5px solid var(--btn-bg);border-radius:999px;box-shadow:none;padding:15px 26px;font-weight:600;letter-spacing:.02em;gap:.6em}
.btn:hover{box-shadow:none;background:var(--brown);border-color:var(--brown);color:var(--on-brown)}
.btn:active{box-shadow:none}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-lime{background:var(--brown);border-color:var(--brown);color:var(--on-brown)}
.btn-lime:hover{background:var(--on-brown);border-color:var(--on-brown);color:var(--brown)}
.btn .ic{width:1.1em;height:1.1em;vertical-align:0}
.link{display:inline-flex;align-items:center;gap:.4em;font-weight:600;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.link:hover{color:var(--brown)}
/* header */
.announce{background:var(--ink);color:var(--bg);font-weight:500;font-size:13px;letter-spacing:.06em;padding:9px 16px}
.top.mh{height:auto;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .mh-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px;gap:12px}
.mh-left{display:flex;align-items:center;justify-self:start;min-width:0}
.mh .nav{gap:clamp(14px,2vw,26px)}
.mh .nav a,.dd>button{font:500 14.5px var(--f-body);letter-spacing:.03em;border-bottom:1.5px solid transparent}
.mh .nav a:hover,.mh .nav a[aria-current="page"],.dd>button:hover,.dd.open>button{border-bottom-color:var(--brown);color:var(--brown)}
.mh-logo{justify-self:center;display:grid;justify-items:center;line-height:1;text-decoration:none;text-transform:none;letter-spacing:0}
.mh-logo span{font:500 clamp(26px,3.4vw,34px) var(--f-display);letter-spacing:.04em}
.mh-logo small{font:500 9.5px var(--f-body);letter-spacing:.36em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;white-space:nowrap}
.mh .top-actions{justify-self:end;gap:6px}
.top .mh-cats{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);justify-content:center}
.mh-cats::-webkit-scrollbar{display:none}
.mh-cats a{flex:none;font:500 13.5px var(--f-body);letter-spacing:.04em;padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--ink-soft);white-space:nowrap}
.mh-cats a:hover{background:var(--bg-alt);color:var(--ink)}
.mh-cats a.sale{color:var(--brown);font-weight:700}
.cart-btn,.burger{border:0;background:transparent;width:44px;height:44px}
.cart-btn:hover,.burger:hover{background:var(--bg-alt)}
.cart-btn .ic,.burger .ic{width:22px;height:22px}
.cart-btn b{background:var(--brown);color:var(--on-brown);border-color:var(--bg);top:2px;right:0}
.pub-pill{background:var(--brown);color:var(--on-brown)}
.bar{background:var(--brown);height:2px}
.dd-menu{border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -20px rgba(60,40,20,.35)}
@media (max-width:899px){
  .top .mh-top{grid-template-columns:auto 1fr auto;height:62px}
  .mh-logo{justify-self:start;margin-left:4px}
  .mh .nav a{font-size:18px}
  .top.open .nav a{border-bottom:1px solid var(--line)}
  .top .mh-cats{justify-content:flex-start;padding-inline:16px}
  :root{--hh:calc(106px + env(safe-area-inset-top,0px))}
}
/* hero */
.mh-hero{padding:clamp(26px,4vw,56px) 0 clamp(36px,6vw,76px);overflow-x:clip}
.mh-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(24px,5vw,72px);align-items:center}
.mh-copy{display:grid;gap:22px;justify-items:start}
.mh-eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--brown)}
.mh-eyebrow .ic{width:16px;height:16px}
.mh-h1{font:400 clamp(44px,7.2vw,98px)/.98 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.mh-h1 em{font-style:italic;color:var(--brown);font-weight:400}
.mh-perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;border-top:1px solid var(--line);padding-top:22px;margin-top:8px;width:100%}
.perk{display:grid;gap:6px;justify-items:start}
.perk .ic{width:26px;height:26px;color:var(--brown)}
.perk b{font:600 14.5px var(--f-body)}
.perk span{font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.mh-art{position:relative;aspect-ratio:1/1.04;width:min(100%,560px);justify-self:center}
.arch{position:absolute;display:grid;place-items:center;overflow:hidden;will-change:transform}
.arch .art{width:76%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.arch:hover .art{transform:scale(1.07) rotate(-3deg)}
.arch img{width:100%;height:100%;object-fit:cover}
.a1{left:22%;top:0;width:54%;height:80%;border-radius:999px 999px 30px 30px;background:var(--p2)}
.a2{left:0;bottom:4%;width:38%;aspect-ratio:1;border-radius:50%;background:var(--p3)}
.a3{right:0;bottom:0;width:36%;height:48%;border-radius:999px 999px 26px 26px;background:var(--p1)}
.mh-tag{position:absolute;display:inline-flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 15px 7px 8px;font:500 13px var(--f-body);box-shadow:0 14px 30px -14px rgba(60,40,20,.35);translate:calc(var(--px,0)*var(--k,14px)) calc(var(--py,0)*var(--k,14px));transition:translate .5s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.mh-tag i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brown);color:var(--on-brown)}
.mh-tag i .ic{width:15px;height:15px}
.t1{left:-2%;top:18%;--k:-18px}
.t2{right:-2%;top:46%;--k:22px}
.mh-seal{position:absolute;right:2%;top:-4%;width:min(24%,130px);aspect-ratio:1;color:var(--ink);animation:spin 26s linear infinite}
.mh-seal text{font:600 11.5px var(--f-body);letter-spacing:.2em;fill:currentColor;text-transform:uppercase}
.mh-seal .ic{position:absolute}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mh-seal{animation:none}}
@media (max-width:860px){.mh-grid{grid-template-columns:minmax(0,1fr)}.mh-art{order:-1;width:min(86%,420px)}.mh-perks{grid-template-columns:1fr}.perk{grid-template-columns:auto 1fr;gap:2px 12px}.perk .ic{grid-row:span 2;align-self:center}}
/* ticker */
.ticker-wrap{padding:0;background:var(--bg-alt);border-block:1px solid var(--line)}
.ticker{width:100%;margin:0;background:transparent;color:var(--ink);transform:none;border:0;padding-block:16px}
.tick-group span{font:italic 400 clamp(22px,3vw,30px) var(--f-display);text-transform:none;gap:34px}
.tick-group span::after{width:8px;height:8px;border-radius:50%;transform:none;background:var(--brown)}
/* section heads */
.sec{padding-block:clamp(40px,7vw,92px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:18px 30px;flex-wrap:wrap;margin-bottom:clamp(22px,3vw,36px)}
.sec-head>div{display:grid;gap:12px;max-width:30em}
.sec-head h2{margin:0}
/* ages */
.ages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.age{position:relative;border-radius:26px;padding:24px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.age:nth-child(1){background:var(--p1)}.age:nth-child(2){background:var(--p2)}.age:nth-child(3){background:var(--p3)}.age:nth-child(4){background:var(--p4)}
.age:hover{transform:translateY(-6px)}
.age small{font:600 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.age b{font:400 clamp(28px,3vw,38px)/1 var(--f-display);display:block;margin-top:6px}
.age .go{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;position:relative;z-index:1}
.age .art{position:absolute;right:-4%;bottom:6%;width:50%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.age:hover .art{transform:rotate(-7deg) scale(1.08)}
@media (max-width:900px){.ages{grid-template-columns:repeat(2,minmax(0,1fr))}.age{min-height:190px}}
/* aisles (cats) */
.cats{display:grid;gap:clamp(12px,1.6vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr))}
.cat{background:none;border:0;border-radius:0;padding:0;box-shadow:none;gap:12px;justify-items:center;text-align:center;text-decoration:none}
.cat:hover{transform:none;border-color:transparent}
.cat .art-wrap{width:100%;aspect-ratio:3/4;border-radius:999px 999px 22px 22px;display:grid;place-items:center;overflow:hidden;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.cat:nth-child(4n+1) .art-wrap{background:var(--p1)}.cat:nth-child(4n+2) .art-wrap{background:var(--p2)}.cat:nth-child(4n+3) .art-wrap{background:var(--p3)}.cat:nth-child(4n+4) .art-wrap{background:var(--p4)}
.cat:hover .art-wrap{transform:translateY(-6px)}
.cat .art{width:70%}
.cat:hover .art{transform:scale(1.08) rotate(-4deg)}
.cat b{font:400 clamp(19px,2vw,23px)/1.1 var(--f-display)}
.cat span{font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
/* product cards */
.grid{gap:clamp(18px,2.4vw,30px) clamp(14px,2vw,24px);grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.mi,.mi:hover{transform:none;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.pc-media{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1.08;background:var(--p1)}
.grid .mi:nth-child(4n+2) .pc-media,.track .mi:nth-child(4n+2) .pc-media{background:var(--p2)}
.grid .mi:nth-child(4n+3) .pc-media{background:var(--p3)}
.grid .mi:nth-child(4n+4) .pc-media{background:var(--p4)}
.pc-media .mi-link{display:grid;place-items:center;height:100%}
.pc-media .mi-art{background:none;aspect-ratio:auto;width:100%;height:100%;display:grid;place-items:center}
.pc-media .mi-art .art{width:68%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.mi:hover .pc-media .art{transform:scale(1.07) rotate(-3deg)}
.pc-media .mi-img{height:100%;aspect-ratio:auto}
.pc-tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pc-tags span{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 10px;background:var(--card);color:var(--ink)}
.pc-tags .sale{background:var(--brown);color:var(--on-brown)}
.pc-add{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 22px -10px rgba(40,25,10,.45);transition:background .2s,color .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.pc-add:hover{background:var(--brown);color:var(--on-brown);transform:scale(1.1) rotate(90deg)}
.pc-add .ic{width:20px;height:20px}
.mi-body{padding:14px 2px 0;gap:4px}
.pc-cat{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap}
.mi h3{font:400 clamp(19px,2vw,22px)/1.15 var(--f-display)}
.mi .d{display:none}
.mi-foot{padding-top:6px;justify-content:space-between;align-items:center;min-height:36px}
.mi-price{font:500 18px var(--f-body);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mrp{font:400 14px var(--f-body);color:var(--ink-soft);text-decoration:line-through}
.pct{font:700 12px var(--f-body);color:var(--brown)}
.add{display:none}
.agechip{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.step{border:1px solid var(--line);background:var(--card);border-radius:99px}
.step button{width:36px;height:36px;display:grid;place-items:center}
.step button .ic{width:16px;height:16px}
.soldout{font-size:13px;font-weight:600;color:var(--danger)}
.mi.off{opacity:.55}
/* shop layout */
.shop-lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.shop-side{position:sticky;top:calc(var(--hh) + 18px);display:grid;gap:26px}
.fgroup{display:grid;gap:8px}
.fgroup>h4{font:600 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
.fgroup button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid transparent;padding:8px 0;font:500 15.5px var(--f-body);color:var(--ink);cursor:pointer;border-radius:0}
.fgroup button small{color:var(--ink-soft);font-size:12.5px}
.fgroup button:hover{color:var(--brown)}
.fgroup button[aria-pressed="true"]{color:var(--brown);font-weight:700}
.fgroup button[aria-pressed="true"]::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--brown);margin-left:auto}
.fgroup button[aria-pressed="true"] small{display:none}
.sidesearch{position:relative}

}

function mapSvg(){
  var bs=S.branches.slice();
  var act=bs.find(function(b){return b.id===ui.branch});
  if(act){bs.splice(bs.indexOf(act),1);bs.push(act)}
  var pins=bs.map(function(b){
    var i=S.branches.indexOf(b),x=+b.x||0,y=+b.y||0,tx,ty,an='middle';
    if(b.l==='right'){tx=x+4.6;ty=y+1.2;an='start'}else if(b.l==='left'){tx=x-4.6;ty=y+1.2;an='end'}else if(b.l==='above'){tx=x;ty=y-4.6}else{tx=x;ty=y+7}
    return '<g class="pin'+(b.id===ui.branch?' on':'')+'" data-act="pick" data-id="'+esc(b.id)+'" style="--i:'+i+'"><circle class="halo" cx="'+x+'" cy="'+y+'" r="3.2"/><circle class="dot" cx="'+x+'" cy="'+y+'" r="2.6"/><text x="'+tx+'" y="'+ty+'" text-anchor="'+an+'">'+esc(b.name)+'</text></g>';
  }).join('');
  return '<svg class="map" viewBox="0 0 100 100" role="img" aria-label="Schematic map of '+esc(S.brand.name)+' stores in '+esc(S.brand.city)+'"><ellipse class="ring-road" cx="50" cy="55" rx="40" ry="37"/><path class="road" d="M4 52 C30 50 70 58 96 56"/><path class="road" d="M50 4 C48 30 46 70 45 96"/><path class="road" d="M12 90 C40 60 70 30 90 12"/><g class="oldcity"><rect x="56" y="22" width="16" height="16" rx="3" transform="rotate(12 64 30)"/><text x="64" y="44" text-anchor="middle">Old city</text></g><g>'+pins+'</g></svg>';
}
function branchDetail(b){
  if(!b)return '<div class="detail"><p>Store list coming soon.</p></div>';
  var svc=[b.dine&&'Browse in store',b.take&&'Pickup',b.deliv&&'Delivery'].filter(Boolean).map(function(s){return '<span class="tag">'+s+'</span>'}).join('');
  var addr=b.address||(S.brand.name+', '+b.name+', '+S.brand.city);
  return '<div class="detail"><h3>'+esc(b.name)+'</h3><p>'+esc(addr)+'</p>'+(b.hours?'<p>Hours: '+esc(b.hours)+'</p>':'')+(b.phone?'<p>Phone: <span class="sel">'+esc(b.phone)+'</span></p>':'')+'<div class="tags">'+svc+'</div><div class="btn-row"><a class="link" href="#b-'+esc(b.id)+'">Store page</a><a class="link" target="_blank" rel="noopener" href="'+esc(mapsUrl(b))+'">Get directions '+ic('arrow-up-right')+'</a>'+(S.settings.orders&&b.open?'<button type="button" class="btn btn-sm" data-act="order-here" data-id="'+esc(b.id)+'">Order from here</button>':'')+'</div></div>';

function pickerHtml(){
  var bs=S.branches;

  return '<div class="br-grid" data-picker><div class="map-card">'+mapSvg()+'<p class="map-note">Schematic map, not to scale.</p></div><div><ul class="pills">'+bs.map(function(x){return '<li><button type="button" class="pill" data-act="pick" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===ui.branch)+'">'+esc(x.name)+'</button></li>'}).join('')+'</ul>'+branchDetail(b)+'</div></div>';

  return '<section class="proc" id="proc" style="--n:'+ps.length+'" aria-label="From shelf to doorstep"><div class="proc-sticky" id="procSticky"><div class="wrap proc-grid"><div class="proc-list"><p class="kicker">From shelf to doorstep</p><h2>How your order gets to you.</h2>'+ps.map(function(p,i){return '<div class="pstep'+(i===0?' on':'')+'" data-step="'+i+'"><span class="n">'+(i+1)+'</span><h3>'+esc(p.title)+'</h3><div class="pt"><p>'+esc(p.text)+'</p></div></div>'}).join('')+'</div><div class="proc-art" aria-hidden="true">'+ps.map(function(p,i){return '<div class="art-s'+(i===0?' on':'')+'" data-art="'+i+'">'+artSvg(p.art)+'</div>'}).join('')+'</div></div><div class="proc-bar"><i id="procBar"></i></div></div></section>';
}
function statsBlock(){
  var live=S.offers.filter(function(o){return o.active}).length;
  var st=[[S.branches.length,'Store in '+S.brand.city],[S.items.length,'Products on the shelf'],[live,'Offers running now'],[S.categories.length,'Aisles to explore']];
  return '<div class="stats">'+st.map(function(s,i){return '<div class="stat rv" style="--d:'+(i*90)+'ms"><b class="cnt" data-n="'+s[0]+'">'+s[0]+'</b><span>'+esc(s[1])+'</span></div>'}).join('')+'</div>';

/* ---------- page switches and routing ---------- */
function pageOn(n){var p=S.pages&&S.pages[n];return !p||p.on!==false}
var STATIC=['home','menu','offers','story','gallery','branches','contact','cart','checkout','order-done','admin','journal','faq','franchise','careers','policies','orders','search','sitemap'];
var DYNN={c:'category',p:'product',b:'branch',post:'post',o:'receipt'};
function resolve(){
  var h=(W.location.hash||'').replace(/^#/,''),m;h=({shop:'menu',stores:'branches',bulk:'franchise'})[h]||h;
  if(!h)return {n:'home'};
  m=/^age-(\d)$/.exec(h);if(m){ui.age=m[1];return pageOn('menu')?{n:'menu'}:{n:'notfound'}}
  if(STATIC.indexOf(h)>=0)return pageOn(h)?{n:h}:{n:'notfound'};
  m=/^(c|p|b|post|o)-(.+)$/.exec(h);
  if(m)return {n:DYNN[m[1]],a:m[2]};
  return {n:'notfound'};
}
function route(){return resolve().n}
function routeArg(){return resolve().a}
var TITLES={menu:'Shop',offers:'Offers',story:'Our story',gallery:'Gallery',branches:'Stores',contact:'Contact',cart:'Your cart',checkout:'Checkout','order-done':'Order placed',admin:'Admin',journal:'Journal',faq:'FAQ',franchise:'School and bulk orders',careers:'Careers',policies:'Policies',orders:'My orders',search:'Search',sitemap:'Sitemap',notfound:'Page not found',receipt:'Order'};
function pageTitle(){
  var r=route(),a=routeArg(),x;
  if(r==='home')return S.brand.name;
  if(r==='product'){x=itemById(a);return (x?x.name:'Shop')+' | '+S.brand.name}
  if(r==='category'){x=S.categories.find(function(c){return c.id===a});return (x?x.name:'Shop')+' | '+S.brand.name}
  if(r==='branch'){x=branchById(a);return (x?x.name+' store':'Stores')+' | '+S.brand.name}
  if(r==='post'){x=(S.posts||[]).find(function(p){return p.id===a});return (x?x.title:'Journal')+' | '+S.brand.name}
  return (TITLES[r]||'')+' | '+S.brand.name;
}
function crumbs(list){return '<nav class="crumbs" aria-label="Breadcrumb">'+list.map(function(c){return c[1]?'<a href="'+c[1]+'">'+esc(c[0])+'</a>':'<span aria-current="page">'+esc(c[0])+'</span>'}).join('<i aria-hidden="true">/</i>')+'</nav>'}
function stepper(it,q){return '<div class="step" role="group" aria-label="Quantity of '+esc(it.name)+'"><button type="button" data-act="dec" data-id="'+esc(it.id)+'" aria-label="Remove one">'+ic('minus')+'</button><span>'+q+'</span><button type="button" data-act="inc" data-id="'+esc(it.id)+'" aria-label="Add one">'+ic('plus')+'</button></div>'}
function catArt(c){var its=S.items.filter(function(i){return i.cat===c.id});return its.length?artOf(its[0]):'teddy'}
function catsBlock(){
  if(!S.categories.length)return '';
  return '<div class="cats">'+S.categories.map(function(c,i){var n=S.items.filter(function(x){return x.cat===c.id}).length;return '<a class="cat rv" style="--d:'+(i*70)+'ms" href="#c-'+esc(c.id)+'">'+artSvg(catArt(c))+'<b>'+esc(c.name)+'</b><span>'+n+' item'+(n===1?'':'s')+''+ic('arrow-right','sp')+'</span></a>'}).join('')+'</div>';
}
function catsSec(){
  if(!S.categories.length)return '';
  return '<section class="section" style="padding-bottom:0"><div class="wrap"><div class="pagehead" style="padding-top:0"><p class="kicker rv">Explore the shop</p><h2 class="split">Start with what you like.</h2></div>'+catsBlock()+'</div></section>';
}

/* ---------- category and product pages ---------- */
function pgCategory(id){
  var c=S.categories.find(function(x){return x.id===id});if(!c)return pgNotFound();
  var its=S.items.filter(function(i){return i.cat===id});
  var others=S.categories.filter(function(x){return x.id!==id}).map(function(x){return '<a class="chip-link" href="#c-'+esc(x.id)+'">'+esc(x.name)+'</a>'}).join('');
  return '<section class="section" style="padding-top:0"><div class="wrap">'+crumbs([['Home','#home'],['Shop','#shop'],[c.name,null]])+pageHead('Shop',c.name,its.length+' item'+(its.length===1?'':'s')+' in this category.')+
    '<div class="chiplinks"><a class="chip-link" href="#shop">All items</a>'+others+'</div>'+(its.length?'<div class="grid">'+its.map(function(i){return itemCard(i)}).join('')+'</div>':'<p class="notice">Nothing here yet.</p>')+'</div></section>'+ctaBand();
}
function pgProduct(id){
  var it=itemById(id);if(!it)return pgNotFound();
  var cat=S.categories.find(function(c){return c.id===it.cat});
  var same=S.items.filter(function(x){return x.cat===it.cat}),idx=same.indexOf(it),prev=same[idx-1],next=same[idx+1];
  var pair=[];S.categories.forEach(function(c){if(c.id!==it.cat&&pair.length<3){var x=S.items.find(function(y){return y.cat===c.id&&y.avail});if(x)pair.push(x)}});
  var q=cart[it.id]||0;
  var media=it.img?'<img src="'+esc(it.img)+'" alt="'+esc(it.name)+'">':artSvg(artOf(it));
  var ctl=!it.avail?'<p class="notice">This item is sold out right now.</p>':!S.settings.orders?'<p class="notice">Online ordering is paused right now.</p>':(q?'<div class="btn-row">'+stepper(it,q)+'<a class="btn" href="#cart">View cart</a></div>':'<div class="btn-row"><button type="button" class="btn" data-act="add" data-id="'+esc(it.id)+'">Add to cart · '+money(it.price)+'</button></div>');
  var at=S.branches.filter(function(b){return b.open&&b.take});
  return '<section class="section" style="padding-top:0"><div class="wrap">'+crumbs([['Home','#home'],['Shop','#shop'],cat?[cat.name,'#c-'+cat.id]:['Shop',null],[it.name,null]])+
    '<div class="pdp"><div class="pdp-media">'+media+'</div><div class="pdp-info"><div class="mi-top">'+ageChip(it)+(it.badge?'<span class="badge">'+esc(it.badge)+'</span>':'')+(cat?'<a class="tag" href="#c-'+esc(cat.id)+'" style="text-decoration:none">'+esc(cat.name)+'</a>':'')+'</div><h1 class="split">'+esc(it.name)+'</h1><p class="price-big">'+priceHtml(it)+'</p><p class="lede">'+esc(it.long||it.desc)+'</p>'+ctl+
    (S.settings.taxPct>0?'<p class="muted" style="font-size:14px">GST '+(S.settings.taxIncl?'is included in the price.':'of '+S.settings.taxPct+'% is added at checkout.')+'</p>':'')+
    perksPdp()+(at.length?'<div><p class="kicker" style="margin-bottom:8px">Available at</p><div class="chiplinks">'+at.map(function(b){return '<a class="chip-link" href="#b-'+esc(b.id)+'">'+esc(b.name)+'</a>'}).join('')+'</div></div>':'')+
    '<div class="btn-row">'+(prev?'<a class="link" href="#p-'+esc(prev.id)+'">'+ic('arrow-left','sp')+''+esc(prev.name)+'</a>':'')+(next?'<a class="link" href="#p-'+esc(next.id)+'">'+esc(next.name)+''+ic('arrow-right','sp')+'</a>':'')+'</div></div></div>'+
    (pair.length?'<h2 class="cat-h">Goes well with</h2><div class="grid">'+pair.map(function(i){return itemCard(i)}).join('')+'</div>':'')+'</div></section>';
}

  var wa=waUrl(b.wa||S.settings.whatsapp,'Hello '+S.brand.name+' '+b.name+'!');
  var others=S.branches.filter(function(x){return x.id!==id});
  var pop=S.items.filter(function(i){return i.featured&&i.avail}).slice(0,3);
  return '<section class="section" style="padding-top:0"><div class="wrap">'+crumbs([['Home','#home'],['Stores','#stores'],[b.name,null]])+pageHead('Store',b.name,b.about||('The '+b.name+' store serves the full '+S.brand.name+' shop.'))+

    (pop.length?'<h2 class="cat-h">Popular here</h2><div class="grid">'+pop.map(function(i){return itemCard(i)}).join('')+'</div>':'')+

/* ---------- journal ---------- */
function bodyHtml(txt){return String(txt||'').split(/\n\s*\n/).map(function(b){b=b.trim();if(!b)return '';if(b.indexOf('## ')===0)return '<h2 class="ph2">'+esc(b.slice(3))+'</h2>';return '<p>'+esc(b).replace(/\n/g,'<br>')+'</p>'}).join('')}
function postCard(p,i){return '<article class="post rv" style="--d:'+((i%3)*80)+'ms"><a class="post-art" href="#post-'+esc(p.id)+'" tabindex="-1" aria-hidden="true">'+artSvg(p.art||'chai')+'</a><div class="post-body"><div class="tags"><span class="tag lime">'+esc(p.tag||'Story')+'</span>'+(p.date?'<span class="tag">'+esc(p.date)+'</span>':'')+'</div><h3><a class="plink" href="#post-'+esc(p.id)+'">'+esc(p.title)+'</a></h3><p class="muted">'+esc(p.excerpt)+'</p><a class="link" href="#post-'+esc(p.id)+'">Read the story'+ic('arrow-right','sp')+'</a></div></article>'}
function pgJournal(){
  var ps=S.posts||[],tags=[];ps.forEach(function(p){if(p.tag&&tags.indexOf(p.tag)<0)tags.push(p.tag)});
  var list=ps.filter(function(p){return !ui.jtag||p.tag===ui.jtag});
  return '<section class="section" style="padding-top:0"><div class="wrap">'+pageHead('Journal','Stories from the shelf.','Gift ideas, school lists and play tips.')+
    (tags.length?'<div class="chips" data-lenis-prevent><button type="button" data-act="jtag" data-id="" aria-pressed="'+(!ui.jtag)+'">All</button>'+tags.map(function(t){return '<button type="button" data-act="jtag" data-id="'+esc(t)+'" aria-pressed="'+(ui.jtag===t)+'">'+esc(t)+'</button>'}).join('')+'</div>':'')+
    '<div class="posts">'+(list.map(postCard).join('')||'<p class="notice">No stories yet.</p>')+'</div></div></section>'+ctaBand();
}
function pgPost(id){
  var p=(S.posts||[]).find(function(x){return x.id===id});if(!p)return pgNotFound();
  var others=(S.posts||[]).filter(function(x){return x.id!==id}).slice(0,3);
  return '<section class="section" style="padding-top:0"><div class="wrap">'+crumbs([['Home','#home'],['Journal','#journal'],[p.title,null]])+'<article class="article"><div class="tags" style="margin-top:26px"><span class="tag lime">'+esc(p.tag||'Story')+'</span>'+(p.date?'<span class="tag">'+esc(p.date)+'</span>':'')+'</div><h1 class="split">'+esc(p.title)+'</h1><div class="post-hero">'+artSvg(p.art||'chai')+'</div><div class="prose">'+bodyHtml(p.body)+'</div><div class="btn-row"><a class="btn" href="#shop">Shop something fun</a><a class="btn btn-ghost" href="#journal">All stories</a></div></article>'+
    (others.length?'<h2 class="cat-h">More to read</h2><div class="posts">'+others.map(postCard).join('')+'</div>':'')+'</div></section>';
}
function journalTeaser(){
  if(!pageOn('journal')||!(S.posts||[]).length)return '';
  return '<section class="section" style="padding-top:0"><div class="wrap"><div class="pagehead" style="padding-top:0"><p class="kicker rv">Journal</p><h2 class="split">Read, then go play.</h2></div><div class="posts">'+S.posts.slice(0,3).map(postCard).join('')+'</div><div class="btn-row" style="margin-top:22px"><a class="btn btn-sm" href="#journal">All stories</a></div></div></section>';

function formText(form){
  var parts=[];
  [].slice.call(form.querySelectorAll('input[type=text],input[type=tel],input[type=email],textarea,select')).forEach(function(el){
    var l=form.querySelector('label[for="'+el.id+'"]');
    if(el.value.trim())parts.push((l?l.textContent:el.id)+': '+el.value.trim());
  });
  return (form.getAttribute('data-intro')||'Hello!')+'\n'+parts.join('\n');
}
function waForm(fid,intro,fields,btn){
  var has=waNum(S.settings.whatsapp).length>=8;
  return '<form class="form" id="'+fid+'" data-wa="'+fid+'Link" data-intro="'+esc(intro)+'" onsubmit="return false">'+fields.map(function(f){
    var id=fid+f[0];
    return f[2]==='area'?'<div class="fld"><label for="'+id+'">'+f[1]+'</label><textarea id="'+id+'" rows="4"></textarea></div>':'<div class="fld"><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" type="'+(f[2]||'text')+'"></div>';
  }).join('')+(has?'<a class="btn" id="'+fid+'Link" target="_blank" rel="noopener" href="'+esc(waUrl(S.settings.whatsapp,intro))+'">'+btn+'</a><p class="muted">This opens WhatsApp with your message ready to send.</p>':'<button type="button" class="btn" data-act="copy-form" data-id="'+fid+'">Copy message</button><p class="muted">Copy the message and send it to the store of your choice.</p>')+'</form>';
}

/* ---------- orders, search, sitemap, not found ---------- */
function pgOrders(){
  var rows=orders.map(function(o){
    var d=new Date(o.at),when=isNaN(d)?'':d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
    return '<article class="role rv"><div><h3>'+esc(o.id)+'</h3><p class="muted">'+esc(when)+' · '+esc(o.branch)+' · '+(o.type==='delivery'?'Delivery':'Pickup')+'</p><p>'+o.lines.map(function(l){return l.q+' × '+esc(l.n)}).join(', ')+'</p><p><b>'+money(o.total)+'</b></p></div><div class="btn-row"><a class="btn btn-sm" href="#o-'+esc(o.id)+'">Receipt</a><button type="button" class="btn btn-sm btn-ghost" data-act="reorder" data-id="'+esc(o.id)+'">Order again</button></div></article>';
  }).join('');
  return '<section class="section" style="padding-top:0"><div class="wrap">'+pageHead('Your orders','My orders.','Orders placed from this device.')+(rows?'<div class="roles">'+rows+'</div><div class="btn-row" style="margin-top:22px"><button type="button" class="btn btn-sm btn-danger" data-act="clear-orders">Clear history</button></div>':'<p class="notice">No orders yet.</p><div class="btn-row" style="margin-top:18px"><a class="btn" href="#shop">Browse the shop</a></div>')+'</div></section>';
}
function searchHtml(){
  var q=(ui.sq||'').trim().toLowerCase();
  if(q.length<2)return '<p class="muted">Type at least two letters to search the shop, stores, stories and pages.</p>';
  var has=function(s){return String(s||'').toLowerCase().indexOf(q)>=0};
  var items=S.items.filter(function(i){return has(i.name)||has(i.desc)||has(i.long)});
  var cats=S.categories.filter(function(c){return has(c.name)});
  var brs=S.branches.filter(function(b){return has(b.name)||has(b.address)});
  var posts=(S.posts||[]).filter(function(p){return has(p.title)||has(p.excerpt)||has(p.tag)});
  var pages=SEARCHABLE.filter(function(p){return pageOn(p[3]||'home')&&(has(p[0])||has(p[2]))});
  var L=function(h,t,s){return '<li><a href="'+h+'"><b>'+esc(t)+'</b>'+(s?'<span>'+esc(s)+'</span>':'')+'</a></li>'};
  var grp=function(t,html){return html?'<div class="sgrp"><h3>'+t+'</h3><ul>'+html+'</ul></div>':''};
  var out=grp('Shop',items.map(function(i){return L('#p-'+i.id,i.name,money(i.price))}).join('')+cats.map(function(c){return L('#c-'+c.id,c.name+' (category)','')}).join(''))+
    grp('Stores',brs.map(function(b){return L('#b-'+b.id,b.name,b.hours||'')}).join(''))+
    grp('Journal',posts.map(function(p){return L('#post-'+p.id,p.title,p.tag||'')}).join(''))+
    grp('Pages',pages.map(function(p){return L(p[1],p[0],'')}).join(''));
  return out||'<p class="notice">Nothing found for “'+esc(ui.sq)+'”. Try a different word.</p>';
}

var LIVE={url:'https://viefouzekrzoqaqpuaug.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpZWZvdXpla3J6b3FhcXB1YXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTQ4ODIsImV4cCI6MjEwMDc5MDg4Mn0.BNVufdPxOHkxdIuuEZ4ny2KPABW9UR0t6x6v1_0hOBo'};
(function(){
  var LARTS={'Pens':'marker','Notebooks & Diaries':'notebook','Art Supplies':'paints','Office Supplies':'notes','Soft Toys':'teddy','Chocolates':'duck','Other':'blocks','Gifts':'teddy','Art/Craft Toys':'crayons','Toys':'car','School Essentials':'backpack','Stationaries':'pencil','Sports':'rocket','Books':'notebook','Seasonal':'paints'};
  function slug(n){return String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
  function get(path){return W.fetch(LIVE.url+'/rest/v1/'+path,{headers:{apikey:LIVE.key,Authorization:'Bearer '+LIVE.key}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
  function mapRow(r){
    var cat=r.category||'Other',d=[r.brand,r.subcategory].filter(Boolean).join(' · ')||cat;
    var price=+r.price||0,mrp=+r.mrp||0;
    return {id:String(r.id),cat:slug(cat),name:r.name||'Item',desc:d,price:price,mrp:mrp>price?mrp:0,age:'',avail:(+r.stock||0)>0,featured:!!r.is_featured,badge:'',img:r.image_url||'',art:LARTS[cat]||'teddy',long:r.description||''};
  }
  function load(){
    Promise.all([get('storefront_products?select=id,name,price,mrp,stock,category,subcategory,brand,image_url,description,is_featured&order=name.asc&limit=2000'),
      get('storefront_categories?select=categories&limit=1').catch(function(){return []})]).then(function(res){
      var rows=res[0];if(!Array.isArray(rows)||!rows.length)return;
      var items=rows.map(mapRow),names=(res[1][0]&&res[1][0].categories)||[],seen={},cats=[];
      names.forEach(function(n){var id=slug(n);if(!seen[id]){seen[id]=1;cats.push({id:id,name:n})}});
      rows.forEach(function(r){var n=r.category||'Other',id=slug(n);if(!seen[id]){seen[id]=1;cats.push({id:id,name:n})}});
      cats=cats.filter(function(c){return items.some(function(i){return i.cat===c.id})});
      items.sort(function(a,b){return (b.featured-a.featured)||(b.avail-a.avail)});
      S.items=items;S.categories=cats;LIVE.on=true;
      if(route()!=='admin')renderAll(false);
    }).catch(function(){});
  }
  W.setTimeout(load,0);
})();
