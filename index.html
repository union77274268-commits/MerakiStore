<script>
  // Some mobile browsers' "Desktop site" mode forces a wide layout viewport, which makes our
  // `min-width:900px` breakpoint fire even on an actual phone — that's what shows the desktop
  // sidebar squeezed onto a phone screen, tiny and cramped. window.screen.width/height reflect the
  // real device size and aren't affected by that mode, so we use them as a second, more reliable
  // check and force mobile layout via this class regardless of what the browser is pretending the
  // viewport is.
  (function(){
    var w = Math.min(window.screen.width||9999, window.screen.height||9999);
    if(w < 480) document.documentElement.classList.add('force-mobile-layout');
  })();
</script>

<style>
  :root{
    --purple:#6C3FC5;
    --purple-dark:#4E2A96;
    --purple-light:#F1EBFB;
    --green:#1E9E5A;
    --green-light:#E7F8EE;
    --amber:#F5A623;
    --ink:#241A38;
    --muted:#8A7FA0;
    --line:#EDE7F7;
    --danger:#E0455D;
  }
  html.dark{
    --purple-light:#241b38;
    --green-light:#0f2a1d;
    --ink:#F1ECFB;
    --muted:#948da8;
    --line:#232228;
  }
  html.dark .card,
  html.dark .floating-nav,
  html.dark .bg-white{
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 45%), #101012 !important;
    border-color:#222226 !important;
  }
  html.dark .card{box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 28px -6px rgba(0,0,0,0.65) !important;}
  html.dark .card:hover{box-shadow:0 1px 0 rgba(255,255,255,0.07) inset, 0 22px 42px -8px rgba(0,0,0,0.75) !important;}
  html.dark .btn-secondary{background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 45%), #101012;}
  html.dark input, html.dark select, html.dark textarea{background:#0c0c0e !important; color:var(--ink) !important; border-color:#26262b !important;}
  html.dark ::placeholder{color:#6b6478;}
  html.dark .placeholder-img{filter:brightness(.9) saturate(.9);}
  html.dark .skeleton{background:linear-gradient(90deg,#18181b 25%,#232326 37%,#18181b 63%);}
  html.dark .chip{color:var(--ink); border-color:#28282d;}
  html *{transition:background-color .25s ease, border-color .25s ease, color .25s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 12% -8%, rgba(108,63,197,0.10), transparent 55%),
      radial-gradient(100% 55% at 100% 0%, rgba(245,166,35,0.09), transparent 50%),
      radial-gradient(90% 50% at 50% 100%, rgba(30,158,90,0.07), transparent 55%),
      #FBFAFE;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  html.dark body{
    background:
      radial-gradient(120% 60% at 12% -8%, rgba(142,79,224,0.10), transparent 55%),
      radial-gradient(100% 55% at 100% 0%, rgba(245,166,35,0.05), transparent 50%),
      radial-gradient(90% 50% at 50% 100%, rgba(30,158,90,0.05), transparent 55%),
      #050506;
  }
  h1,h2,h3,h4,.font-display{font-family:'Fredoka',sans-serif !important;letter-spacing:.01em;}
  button,a,input,.card,.chip{transition:all .22s cubic-bezier(.25,.8,.25,1);}
  a:active, button:active{transform:scale(.96);}
  .brand-m{color:#E0455D;}
  .brand-e{color:#F5A623;}
  .brand-r{color:#1E9E5A;}
  .brand-a{color:#4EA1E8;}
  .brand-k{color:#8E4FE0;}
  .brand-i{color:#E0455D;}
  ::-webkit-scrollbar{height:0;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .scrollbar-none::-webkit-scrollbar{display:none;}
  .scrollbar-none{-ms-overflow-style:none;scrollbar-width:none;}
  .snap-x-row{scroll-snap-type:x mandatory;}
  .snap-item{scroll-snap-align:start;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom);}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 1px 2px rgba(108,63,197,0.06), 0 10px 24px -8px rgba(108,63,197,0.10);
    transition:transform .28s cubic-bezier(.25,.8,.25,1), box-shadow .28s ease, border-color .2s ease;
    will-change:transform;
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 2px 4px rgba(108,63,197,0.08), 0 20px 36px -10px rgba(108,63,197,0.20);}
  .card:active{transform:translateY(-1px) scale(.985);}
  .tilt-card{transform-style:preserve-3d; transition:transform .12s ease-out, box-shadow .28s ease;}
  @media (prefers-reduced-motion: reduce){ .tilt-card{transition:box-shadow .28s ease !important;} }
  .btn-primary{
    background:var(--purple);color:#fff;border-radius:16px;font-weight:700;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease, box-shadow .16s ease;
    box-shadow:0 4px 0 var(--purple-dark), 0 10px 20px -4px rgba(108,63,197,0.4);
  }
  .btn-primary:hover{background:var(--purple-dark);transform:translateY(-2px);box-shadow:0 6px 0 var(--purple-dark), 0 14px 24px -4px rgba(108,63,197,0.42);}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-dark), 0 4px 10px -2px rgba(108,63,197,0.3);}
  .btn-primary:disabled{background:#C9BEE5;box-shadow:none;cursor:not-allowed;transform:none;}
  .btn-secondary{
    background:#fff;color:var(--purple);border:1.5px solid var(--purple);border-radius:16px;font-weight:700;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .16s ease, box-shadow .16s ease;
    box-shadow:0 4px 0 var(--purple-light), 0 6px 14px -4px rgba(108,63,197,0.18);
  }
  .btn-secondary:hover{background:var(--purple-light);transform:translateY(-2px);}
  .btn-secondary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-light);}
  .chip{
    border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink);
    transition:all .15s ease; white-space:nowrap;
  }
  .chip.active{background:var(--purple);border-color:var(--purple);color:#fff;}
  .pulse{animation:pulse-anim .5s ease;}
  @keyframes pulse-anim{0%{transform:scale(1);}30%{transform:scale(1.35);}60%{transform:scale(.92);}100%{transform:scale(1);}}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rise-in{animation:riseIn .35s cubic-bezier(.2,.8,.2,1);}
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  @keyframes dealsMarquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .deals-marquee-track{width:max-content;animation:dealsMarquee 22s linear infinite;}
  .deals-marquee-track:hover,.deals-marquee-track:active{animation-play-state:paused;}
  .reveal-on-scroll{opacity:0;transform:translateY(16px);transition:opacity .5s ease, transform .5s ease;}
  .reveal-on-scroll.revealed{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .deals-marquee-track{animation:none;}
    .reveal-on-scroll{opacity:1;transform:none;transition:none;}
  }
  .placeholder-img{
    display:flex;align-items:center;justify-content:center;
    font-size:2.4rem; border-radius:20px; position:relative; overflow:hidden;
    transition:transform .28s cubic-bezier(.25,.8,.25,1);
  }
  .card:hover .placeholder-img{transform:scale(1.04) rotate(-1deg);}
  .placeholder-img::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(120% 120% at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
  }
  .desktop-only{display:none;}
  .mobile-only{display:block;}
  @media (min-width:900px){
    .desktop-only{display:block;}
    .mobile-only{display:none;}
  }
  html.force-mobile-layout .desktop-only{display:none !important;}
  html.force-mobile-layout .mobile-only{display:block !important;}
  .focus-ring:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  a{text-decoration:none;color:inherit;}
  input,select,textarea{border-radius:14px !important;}
  input:focus,select:focus,textarea:focus{border-color:var(--purple) !important; box-shadow:0 0 0 3px rgba(108,63,197,0.12);}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .container-max{max-width:1240px;margin:0 auto;}
  .sparkle{display:inline-block;animation:sparkleSpin 2.4s linear infinite;}
  @keyframes sparkleSpin{0%,100%{transform:rotate(0deg) scale(1);}50%{transform:rotate(20deg) scale(1.15);}}
  .skeleton{background:linear-gradient(90deg,#EDE7F7 25%,#F5F1FC 37%,#EDE7F7 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .glass-header{background:rgba(255,255,255,.72); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);}
  html.dark .glass-header{background:rgba(6,6,8,.78);}
  @media (prefers-reduced-motion: reduce){ .page-transition{animation:none;} }

  /* Floating bottom nav */
  .floating-nav{
    background:#fff;
    border-radius:999px;
    box-shadow:0 12px 32px rgba(108,63,197,0.18), 0 2px 8px rgba(108,63,197,0.08);
    border:1px solid var(--line);
  }
  .nav-item{
    position:relative;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .2s ease;
  }
  .nav-item .nav-icon{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;margin:0 auto;
    transition:all .38s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-item.active .nav-icon{
    background:linear-gradient(135deg, var(--purple), #9B6FFF);
    color:#fff;
    transform:translateY(-12px) scale(1.45);
    box-shadow:0 0 0 4px var(--purple-light), 0 8px 20px -2px rgba(108,63,197,0.55);
    animation:navGlowPulse 2.2s ease-in-out infinite;
  }
  @keyframes navGlowPulse{
    0%,100%{box-shadow:0 0 0 4px var(--purple-light), 0 8px 20px -2px rgba(108,63,197,0.55);}
    50%{box-shadow:0 0 0 6px var(--purple-light), 0 10px 26px -2px rgba(108,63,197,0.7);}
  }
  @media (prefers-reduced-motion: reduce){ .nav-item.active .nav-icon{animation:none;} }
  .category-ring{position:relative;}
  .category-ring::before{
    content:'';position:absolute;inset:-3px;border-radius:inherit;z-index:-1;
    background:conic-gradient(from 0deg, var(--purple), #9B6FFF, var(--amber), var(--green), var(--purple));
    opacity:0;transition:opacity .3s ease;animation:ringSpin 3s linear infinite;
  }
  .category-ring:hover::before, .category-ring:focus-visible::before, .group:hover .category-ring::before{opacity:1;}
  @keyframes ringSpin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .category-ring::before{animation:none;} }
  @keyframes cartSheetIn{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @keyframes cartSheetOut{from{transform:translateY(0);opacity:1;}to{transform:translateY(60px);opacity:0;}}
  .cart-sheet-in{animation:cartSheetIn .3s cubic-bezier(.22,.9,.32,1);}
  .cart-sheet-out{animation:cartSheetOut .24s cubic-bezier(.4,0,1,1);}
  @media (prefers-reduced-motion: reduce){ .cart-sheet-in,.cart-sheet-out{animation:none;} }
  .nav-item:active{transform:scale(.88);}
  .page-transition{animation:pageIn .38s cubic-bezier(.22,.8,.32,1);}
  @keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  .wiggle{animation:wiggle .5s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-12deg) scale(1.15);}60%{transform:rotate(10deg) scale(1.15);}}
  /* ---- Counter assistant ---- */
  .bot-fab{position:fixed;z-index:60;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 8px 22px -6px rgba(108,63,197,.55);}
  .bot-fab:hover{background:var(--purple-dark);}
  .bot-fab-label{display:none;}
  @media (min-width:768px){ .bot-fab{right:24px;bottom:24px;} .bot-fab-label{display:inline;} }
  html.force-mobile-layout .bot-fab{right:14px;bottom:calc(76px + env(safe-area-inset-bottom));}
  html.force-mobile-layout .bot-fab-label{display:none;}
  .bot-panel{position:fixed;z-index:210;display:flex;flex-direction:column;background:#fff;color:var(--ink);overflow:hidden;
    left:0;right:0;bottom:0;height:min(82vh,640px);height:min(82dvh,640px);border-radius:22px 22px 0 0;border:1px solid var(--line);box-shadow:0 -12px 40px -8px rgba(36,26,56,.35);}
  @media (min-width:768px){ .bot-panel{left:auto;right:24px;bottom:24px;width:390px;height:min(600px,calc(100vh - 48px));border-radius:22px;} }
  html.force-mobile-layout .bot-panel{left:0;right:0;bottom:0;width:auto;height:min(82dvh,640px);border-radius:22px 22px 0 0;}
  html.dark .bot-panel{background:#0c0c0e;border-color:#26262b;}
  .bot-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--purple);color:#fff;flex-shrink:0;}
  .bot-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .bot-close{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;flex-shrink:0;}
  .bot-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;}
  .bot-row{display:flex;flex-direction:column;gap:6px;max-width:100%;}
  .bot-row.user{align-items:flex-end;}
  .bot-row.bot{align-items:flex-start;}
  .bot-bubble{max-width:88%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.45;word-break:break-word;}
  .bot-bubble.bot{background:var(--purple-light);border-bottom-left-radius:4px;}
  .bot-bubble.user{background:var(--purple);color:#fff;border-bottom-right-radius:4px;}
  .bot-prods{display:flex;flex-direction:column;gap:6px;width:100%;}
  .bot-prod{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff;}
  html.dark .bot-prod{background:#101012;border-color:#26262b;}
  .bot-add{background:var(--purple);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .bot-add:disabled{background:#C9BEE5;cursor:not-allowed;}
  .bot-link{font-size:12px;font-weight:700;color:var(--purple);text-decoration:none;padding:2px 4px;}
  .bot-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .bot-chip{border:1px solid var(--line);background:#fff;color:var(--purple);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  html.dark .bot-chip{background:#101012;border-color:#26262b;}
  .bot-input{display:flex;align-items:center;gap:6px;padding:10px;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  .bot-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:16px;outline:none;background:#fff;color:var(--ink);}
  .bot-input input:focus{border-color:var(--purple);}
  .bot-mic,.bot-send{border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;flex-shrink:0;font-size:15px;}
  .bot-mic{background:var(--purple-light);}
  .bot-mic.listening{background:var(--danger);}
  .bot-send{background:var(--purple);color:#fff;}
  .bot-send:disabled{background:#C9BEE5;cursor:not-allowed;}
  .bot-typing{display:flex;gap:4px;align-items:center;padding:12px 14px;}
  .bot-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:botdot 1s infinite ease-in-out;}
  .bot-typing span:nth-child(2){animation-delay:.15s;} .bot-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes botdot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .bot-typing span{animation:none;opacity:.7;} }
  /* ---- native-app feel ---- */
  html{-webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain; -webkit-text-size-adjust:100%;}
  a,button,input,select,textarea,label,[role=button]{touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  button,a,.chip,.floating-nav,.btn-primary,.btn-secondary,h1,h2,h3,.font-display,img,svg{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  img{-webkit-user-drag:none; user-drag:none;}
  input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text;}
  @media (hover:none){
    .card:hover{transform:none; box-shadow:0 1px 2px rgba(108,63,197,0.06), 0 10px 24px -8px rgba(108,63,197,0.10);}
    .btn-primary:hover{background:var(--purple); transform:none; box-shadow:0 4px 0 var(--purple-dark), 0 10px 20px -4px rgba(108,63,197,0.4);}
    .btn-secondary:hover{background:#fff; transform:none;}
    .card:hover .placeholder-img{transform:none;}
  }
  @media (max-width:899px){ input,select,textarea{font-size:16px !important;} }
  .nf-spin{animation:nfSpin .7s linear infinite;}
