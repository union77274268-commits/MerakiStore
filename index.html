function CheckoutStepper({step}){
  const steps = ['Address','Payment','Confirm'];
  return (
    <div className="flex items-center gap-2 px-4 md:container-max md:mx-auto py-3 text-xs font-semibold">
      {steps.map((s,i)=>{
        const idx=i+1;
        const state = idx<step ? 'done' : idx===step ? 'active' : 'pending';
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-1.5">
              <span className={"w-5 h-5 rounded-full flex items-center justify-center text-[10px] "+
                (state==='done' ? 'bg-[var(--green)] text-white' : state==='active' ? 'bg-[var(--purple)] text-white' : 'bg-gray-200 text-gray-500')}>
                {state==='done' ? '✓' : idx}
              </span>
              <span className={state==='pending' ? 'text-[var(--muted)]' : ''}>{s}</span>
            </div>
            {idx<3 && <div className="flex-1 h-px bg-[var(--line)]"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* ---- Map pin picker (OpenStreetMap + Leaflet; search via Nominatim) ---- */
const MAP_DEFAULT = { lat: 26.9124, lng: 75.7873 }; // Jaipur
function MapPickerSheet({initial, onCancel, onConfirm}){
  const { showToast } = useApp();
  useBackToClose(onCancel);
  const boxRef = useRef(null);
  const mapRef = useRef(null);
  const geoTimer = useRef(null);
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [place, setPlace] = useState(null);   // { lat, lng, addr, label }
  const [looking, setLooking] = useState(false);
  const [noMap, setNoMap] = useState(false);

  const reverse = useCallback((lat, lng)=>{
    clearTimeout(geoTimer.current);
    setLooking(true);
    geoTimer.current = setTimeout(async ()=>{
      try{
        const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat='+lat+'&lon='+lng);
        const j = await r.json();
        setPlace({ lat, lng, addr: j.address || {}, label: j.display_name || '' });
      }catch(e){ setPlace({ lat, lng, addr:{}, label:'' }); }
      setLooking(false);
    }, 500);
  },[]);

  useEffect(()=>{
    if(!window.L || !boxRef.current){ setNoMap(true); return; }
    const L = window.L;
    const start = (initial && initial.lat && initial.lng) ? initial : MAP_DEFAULT;
    const map = L.map(boxRef.current, { zoomControl:false, attributionControl:true }).setView([start.lat, start.lng], (initial && initial.lat) ? 17 : 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
    L.control.zoom({ position:'bottomright' }).addTo(map);
    mapRef.current = map;
    map.on('moveend', ()=>{ const c = map.getCenter(); reverse(c.lat, c.lng); });
    const c0 = map.getCenter(); reverse(c0.lat, c0.lng);
    setTimeout(()=>map.invalidateSize(), 250);
    return ()=>{ clearTimeout(geoTimer.current); map.remove(); mapRef.current = null; };
  },[]);

  const search = async (e)=>{
    if(e) e.preventDefault();
    const t = q.trim(); if(t.length<3) return;
    setSearching(true); setResults([]);
    try{
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=in&q='+encodeURIComponent(t));
      const j = await r.json();
      setResults(j || []);
      if(!j || !j.length) showToast('No places found — try a landmark or area name','🔍');
    }catch(err){ showToast('Search failed — check your internet','⚠️'); }
    setSearching(false);
  };
  const goTo = (lat, lng)=>{ if(mapRef.current) mapRef.current.setView([lat,lng], 17); setResults([]); };
  const locate = ()=>{
    if(!navigator.geolocation){ showToast('Location is not available on this device','⚠️'); return; }
    navigator.geolocation.getCurrentPosition(
      p=> goTo(p.coords.latitude, p.coords.longitude),
      ()=> showToast('Allow location access, or search for your address instead','📍'),
      { enableHighAccuracy:true, timeout:10000 });
  };
  const confirm = ()=>{
    if(!place) return;
    const a = place.addr || {};
    const road = [a.house_number, a.road].filter(Boolean).join(' ');
    onConfirm({
      lat: Number(place.lat.toFixed(6)), lng: Number(place.lng.toFixed(6)),
      line1: road || a.amenity || a.building || '',
      area: a.suburb || a.neighbourhood || a.city_district || a.quarter || a.residential || '',
      city: a.city || a.town || a.village || a.county || '',
      pincode: (a.postcode||'').replace(/\D/g,'').slice(0,6),
      label: place.label,
    });
  };

  return ReactDOM.createPortal(
    <div style={{position:'fixed', inset:0, zIndex:400, background:'#fff', display:'flex', flexDirection:'column'}}>
      <div style={{padding:'10px 12px', borderBottom:'1px solid var(--line)', background:'#fff'}}>
        <div className="flex items-center gap-2 mb-2">
          <button onClick={onCancel} aria-label="Close map" className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring flex-shrink-0">←</button>
          <div className="font-display font-bold text-base flex-1">Pin your delivery spot</div>
        </div>
        <form onSubmit={search} className="flex gap-2">
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search area, landmark or address" className="flex-1 min-w-0 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          <button type="submit" disabled={searching} className="btn-primary px-4 text-xs flex-shrink-0 focus-ring">{searching?'…':'Search'}</button>
        </form>
        {results.length>0 && (
          <div style={{maxHeight:'34vh', overflowY:'auto'}} className="mt-2 border border-[var(--line)] rounded-lg bg-white">
            {results.map(r=>(
              <button key={r.place_id} type="button" onClick={()=>goTo(parseFloat(r.lat), parseFloat(r.lon))} className="block w-full text-left text-xs px-3 py-2.5 border-b border-[var(--line)] last:border-0 hover:bg-gray-50 focus-ring">{r.display_name}</button>
            ))}
          </div>
        )}
      </div>
      <div style={{position:'relative', flex:1, minHeight:0}}>
        {noMap ? (
          <div className="p-6 text-center text-sm text-[var(--muted)]">The map couldn't load. Check your connection, or go back and type your address.</div>
        ) : (
          <React.Fragment>
            <div ref={boxRef} style={{position:'absolute', inset:0}} />
            <div style={{position:'absolute', left:'50%', top:'50%', transform:'translate(-50%,-100%)', fontSize:36, lineHeight:1, pointerEvents:'none', zIndex:500, filter:'drop-shadow(0 2px 3px rgba(0,0,0,.35))'}}>📍</div>
            <button type="button" onClick={locate} aria-label="Use my current location" style={{position:'absolute', right:12, top:12, zIndex:500}} className="w-11 h-11 rounded-full bg-white shadow-lg flex items-center justify-center text-lg focus-ring">🎯</button>
          </React.Fragment>
        )}
      </div>
      <div style={{padding:'12px 14px calc(12px + env(safe-area-inset-bottom))', borderTop:'1px solid var(--line)', background:'#fff'}}>
        <div className="text-xs text-[var(--muted)] mb-2" style={{minHeight:32}}>
          {looking ? 'Finding address…' : (place && place.label ? place.label : 'Move the map so the pin sits exactly on your door or gate.')}
        </div>
        <button onClick={confirm} disabled={!place || looking || noMap} className="btn-primary w-full py-3 text-sm focus-ring">Confirm this location</button>
      </div>
    </div>, document.body);
}

function istNow(){
  const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g = t=> Number(parts.find(x=>x.type===t).value);
  return { y:g('year'), m:g('month'), d:g('day'), hour:g('hour')+g('minute')/60 };
}
function slotDays(){
  const n = istNow();
  const base = new Date(Date.UTC(n.y, n.m-1, n.d));
  const fmt = dt=> dt.toISOString().slice(0,10);
  const next = new Date(base.getTime()+86400000);
  return { hour:n.hour, days:[{key:fmt(base), label:'Today'},{key:fmt(next), label:'Tomorrow'}] };
}
function SlotPicker(){
  const {shopRules, slot, setSlot} = useApp();
  const {hour, days} = slotDays();
  const options = [];
  days.forEach((dd,i)=> (shopRules.slots||[]).forEach(sl=>{
    if(i===0 && hour >= Number(sl.end)) return;
    options.push({date:dd.key, day:dd.label, label:sl.label});
  }));
  useEffect(()=>{
    if(slot && options.some(o=>o.date===slot.date && o.label===slot.label)) return;
    setSlot(options[0] ? {date:options[0].date, label:options[0].label} : null);
    // eslint-disable-next-line
  },[]);
  if(!options.length) return <div className="card p-3 mt-4 text-xs text-[var(--muted)]">No delivery windows are left right now.</div>;
  return (
    <div className="mt-5">
      <div className="font-bold text-sm mb-2">Delivery time</div>
      {days.map(dd=>{
        const opts = options.filter(o=>o.date===dd.key);
        if(!opts.length) return null;
        return (
          <div key={dd.key} className="mb-2">
            <div className="text-[11px] font-semibold text-[var(--muted)] mb-1">{dd.label}</div>
            <div className="flex flex-wrap gap-2">
              {opts.map(o=>{
                const on = slot && slot.date===o.date && slot.label===o.label;
                return <button key={o.date+o.label} type="button" onClick={()=>setSlot({date:o.date,label:o.label})} className={"px-3 py-2 rounded-xl text-xs font-semibold border focus-ring "+(on?'border-[var(--purple)] bg-[var(--purple-light)] text-[var(--purple)]':'border-[var(--line)]')}>{o.label}</button>;
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

const UPI_VPA = '7231842081@okbizaxis';
const UPI_PAYEE_NAME = 'Prashant Punia';

// App-specific custom URI schemes so tapping a chosen app opens its own
// payment-confirmation screen (with amount prefilled) instead of its home screen.
// The generic 'upi://pay' scheme below is kept for the QR code, since that
// needs to stay app-agnostic so any UPI app's scanner can read it.
function buildUpiParams(amount, note){
  return {
    pa: UPI_VPA, pn: UPI_PAYEE_NAME, am: Number(amount).toFixed(2), cu: 'INR',
    tn: note || 'Meraki Order Payment', tr: 'MERAKI'+Date.now(),
  };
}

function buildUpiUri(amount, note){
  return 'upi://pay?' + new URLSearchParams(buildUpiParams(amount, note)).toString();
}

// NOTE: We deliberately use the single, standard NPCI 'upi://pay' intent for every
// app choice below (not each app's private/undocumented scheme like tez:// or
// paytmmp://). Those unofficial schemes are what trigger "blocked for your safety /
// risk policy" errors in GPay and Paytm, since a webpage silently launching a
// specific payment app with a pre-filled amount via an undocumented deep link is
// exactly the pattern phishing pages use. The standard intent lets the phone's OS
// hand off to the chosen app the same safe way a QR scan does.
function buildUpiAppUri(appId, amount, note){
  return buildUpiUri(amount, note);
}

function UpiQr({amount}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current || typeof QRCode === 'undefined') return;
    ref.current.innerHTML = '';
    try{
      new QRCode(ref.current, {
        text: buildUpiUri(amount),
        width: 168, height: 168,
        colorDark: '#241A38', colorLight: '#ffffff',
      });
    }catch(e){ console.error('QR generation failed', e); }
  },[amount]);
  return <div ref={ref} className="flex items-center justify-center min-h-[168px] min-w-[168px]"></div>;
}

// Lightweight canvas confetti — no library needed. Self-contained: mounts, bursts for ~2.6s, then
// nothing (the canvas element itself stays but is empty/inert). Skipped entirely for
// prefers-reduced-motion.
function ConfettiBurst(){
  const canvasRef = useRef(null);
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = canvasRef.current; if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = ()=>{ canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    const colors = ['#6C3FC5','#9B6FFF','#F5A623','#1E9E5A','#FF5C7A','#3FA7F5'];
    const particles = Array.from({length:90}, ()=>({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.4,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5)*3,
      vy: 2+Math.random()*3,
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*10,
    }));
    let raf, start=null;
    const duration = 2600;
    const tick = (t)=>{
      if(!start) start=t;
      const elapsed = t-start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      if(elapsed < duration) raf = requestAnimationFrame(tick);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    };
    raf = requestAnimationFrame(tick);
    window.addEventListener('resize', resize);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  },[]);
  return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[9998]" aria-hidden="true" />;
}

function statusColor(status){
  if(status==='Delivered') return 'green';
  if(status==='Cancelled') return 'danger';
  return 'amber';
}

function downloadInvoice(order, storeSettings){
  const s = storeSettings || DEFAULT_STORE_SETTINGS;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(108,63,197);
    doc.text(s.storeName, 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    y += 6; doc.text(s.addressLine+', '+s.area+', '+s.city+' - '+s.pincode, 14, y);
    y += 5; doc.text('Phone: '+s.phone+'  ·  '+s.email, 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 10; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,20,50);
    doc.text('TAX INVOICE', 14, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text('Order #'+(order.shortId||order.id), 196, y, {align:'right'});

    y += 8;
    doc.text('Order Date: '+new Date(order.date).toLocaleString(), 14, y);
    y += 5;
    doc.text('Payment Method: '+(order.paymentLabel || PAYMENT_LABELS[order.paymentMethod] || order.paymentMethod), 14, y);
    y += 5;
    doc.text('Delivery Type: '+(order.deliveryType==='home'?'Home Delivery':'Store Pickup'), 14, y);

    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50); doc.text('Bill To:', 14, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90);
    y += 5; doc.text(order.address.name || '', 14, y);
    y += 5; doc.text((order.address.line1||'')+', '+(order.address.area||''), 14, y);
    y += 5; doc.text((order.address.city||'')+' - '+(order.address.pincode||''), 14, y);

    y += 10; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(30,20,50);
    doc.text('Item', 14, y); doc.text('Qty', 130, y, {align:'right'}); doc.text('Price', 160, y, {align:'right'}); doc.text('Total', 196, y, {align:'right'});
    y += 3; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(60,50,70);

    order.items.forEach(it=>{
      y += 8;
      if(y > 270){ doc.addPage(); y = 20; }
      const name = it.name.length > 48 ? it.name.slice(0,45)+'...' : it.name;
      doc.text(name, 14, y);
      doc.text(String(it.qty), 130, y, {align:'right'});
      doc.text(inr(it.price), 160, y, {align:'right'});
      doc.text(inr(it.price*it.qty), 196, y, {align:'right'});
    });

    y += 6; doc.setDrawColor(230,225,245); doc.line(14, y, 196, y);
    y += 8;
    doc.text('Subtotal', 160, y, {align:'right'}); doc.text(inr(order.subtotal), 196, y, {align:'right'});
    y += 6;
    doc.text('Delivery Charge', 160, y, {align:'right'}); doc.text(order.deliveryCharge===0?'FREE':inr(order.deliveryCharge), 196, y, {align:'right'});
    y += 6;
    doc.text('Packaging Charge', 160, y, {align:'right'}); doc.text(inr(order.packagingCharge), 196, y, {align:'right'});
    y += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,20,50);
    doc.text('Total Amount', 160, y, {align:'right'}); doc.text(inr(order.total), 196, y, {align:'right'});

    y += 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140,130,155);
    doc.text('Thank you for shopping with Meraki Stationery & Toys!', 14, y);

    doc.save('Invoice-'+(order.shortId||order.id)+'.pdf');
  } catch(e){
    console.error('Invoice generation failed', e);
  }
}

function SearchPage(){
  const route = parseRoute(window.location.hash);
  const q = (route.query.q||'').toLowerCase().trim();
  const maxPrice = route.query.maxPrice ? Number(route.query.maxPrice) : null;
  const minPrice = route.query.minPrice ? Number(route.query.minPrice) : null;
  const [term, setTerm] = useState(q);
  const {products} = useApp();
  useEffect(()=> setTerm(q), [q]);

  const hasPriceFilter = maxPrice!=null || minPrice!=null;
  const results = (term || hasPriceFilter) ? products.filter(p=>{
    const matchesTerm = !term || p.name.toLowerCase().includes(term) ||
      p.category.toLowerCase().includes(term) || p.sub.toLowerCase().includes(term) || p.brand.toLowerCase().includes(term);
    const matchesMax = maxPrice==null || p.price <= maxPrice;
    const matchesMin = minPrice==null || p.price >= minPrice;
    return matchesTerm && matchesMax && matchesMin;
  }) : [];

  const priceLabel = maxPrice!=null && minPrice!=null ? `${inr(minPrice)}–${inr(maxPrice)}`
    : maxPrice!=null ? `Under ${inr(maxPrice)}`
    : minPrice!=null ? `${inr(minPrice)}+` : null;

  return (
    <div className="fade-in px-4 md:container-max md:mx-auto py-4 pb-8">
      {!term && !hasPriceFilter ? (
        <div className="text-center py-16 text-[var(--muted)]">
          <div className="text-4xl mb-2">🔎</div>
          <div className="text-sm">Start typing to search across all products.</div>
        </div>
      ) : (
        <>
          <div className="text-sm text-[var(--muted)] mb-3">
            {results.length} results{term ? <> for "{term}"</> : null}{priceLabel ? <> · {priceLabel}</> : null}
          </div>
          <ProductGrid products={results} />
        </>
      )}
    </div>
  );
}

function AddressBookModal({onClose}){
  const {address, setAddress, session, showToast} = useApp();
  const [addresses, setAddresses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({label:'', name:'', phone:'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur'});
  const [saving, setSaving] = useState(false);

  const loadAddresses = ()=>{
    if(!session){ setLoading(false); return; }
    setLoading(true);
    sb.from('customer_addresses').select('*').eq('customer_id', session.user.id).order('is_default',{ascending:false}).order('created_at')
      .then(({data, error})=>{
        if(!error) setAddresses(data || []);
        setLoading(false);
      });
  };

  useEffect(()=>{ loadAddresses(); },[session]);

  const startNew = ()=>{ setForm({label:'', name:address.name||'', phone:address.phone||'', line1:'', area:'', landmark:'', pincode:'', city:'Jaipur', lat:null, lng:null}); setEditing('new'); };
  const startEdit = (a)=>{ setForm({label:a.label||'', name:a.name||'', phone:a.phone||'', line1:a.address_line||'', area:a.locality||'', landmark:a.landmark||'', pincode:a.pincode||'', city:a.city||'Jaipur', lat:a.latitude||null, lng:a.longitude||null}); setEditing(a.id); };

  const save = async ()=>{
    if(!form.name.trim() || !form.line1.trim() || !/^\d{6}$/.test(form.pincode||'')){
      showToast('Please fill name, address & a valid PIN','⚠️');
      return;
    }
    setSaving(true);
    const payload = {
      label: form.label || 'Home', name: form.name.trim(), phone: form.phone.trim(),
      address_line: form.line1.trim(), locality: form.area.trim(), landmark: form.landmark.trim() || null,
      pincode: form.pincode.trim(), city: form.city.trim() || 'Jaipur',
      latitude: form.lat || null, longitude: form.lng || null,
    };
    const query = editing==='new'
      ? sb.from('customer_addresses').insert({...payload, customer_id: session.user.id, is_default: addresses.length===0}).select().maybeSingle()
      : sb.from('customer_addresses').update(payload).eq('id', editing).select().maybeSingle();
    const { data, error } = await query;
    setSaving(false);
    if(error){ showToast('Could not save address','⚠️'); return; }
    setAddresses(prev=> editing==='new' ? [...prev, data] : prev.map(a=> a.id===editing ? data : a));
    if(data.is_default) applyAsDeliveryAddress(data);
    setEditing(null);
  };

  const remove = async (id)=>{
    const { error } = await sb.from('customer_addresses').delete().eq('id', id);
    if(error){ showToast('Could not delete address','⚠️'); return; }
    setAddresses(prev=> prev.filter(a=>a.id!==id));
  };

  const applyAsDeliveryAddress = (a)=>{
    setAddress(prev=>({...prev, name:a.name, phone:a.phone, line1:a.address_line, area:a.locality, landmark:a.landmark||'', pincode:a.pincode, city:a.city, lat:a.latitude||null, lng:a.longitude||null}));
  };

  const setDefault = async (a)=>{
    await sb.from('customer_addresses').update({ is_default: false }).eq('customer_id', session.user.id);
    const { data, error } = await sb.from('customer_addresses').update({ is_default: true }).eq('id', a.id).select().maybeSingle();
    if(error){ showToast('Could not set default address','⚠️'); return; }
    setAddresses(prev=> prev.map(x=> ({...x, is_default: x.id===a.id})));
    applyAsDeliveryAddress(data);
    showToast('Default delivery address updated','📍');
  };

  if(editing){
    return (
      <Modal onClose={()=>setEditing(null)} title={editing==='new' ? 'Add Address' : 'Edit Address'}>
        <div className="space-y-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Label (Home, Work, etc.)</label><input value={form.label} onChange={e=>setForm({...form,label:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Full Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value.replace(/\D/g,'').slice(0,10)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">House / Flat / Street</label><input value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Area</label><input value={form.area} onChange={e=>setForm({...form,area:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Landmark (optional)</label><input value={form.landmark} onChange={e=>setForm({...form,landmark:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">PIN Code</label><input value={form.pincode} onChange={e=>setForm({...form,pincode:e.target.value.replace(/\D/g,'').slice(0,6)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div className="grid grid-cols-2"><PinField lat={form.lat} lng={form.lng}
            onPicked={(r)=>setForm(prev=>({...prev, lat:r.lat, lng:r.lng, line1: (prev.line1||'').trim()?prev.line1:r.line1, area: r.area||prev.area, city: r.city||prev.city, pincode: r.pincode||prev.pincode}))}
            onClear={()=>setForm(prev=>({...prev, lat:null, lng:null}))} /></div>
          <button onClick={save} disabled={saving} className="btn-primary w-full py-2.5 focus-ring">{saving ? 'Saving…' : 'Save Address'}</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal onClose={onClose} title="Saved Addresses">
      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-8">Loading addresses…</div>
      ) : (
        <div className="flex flex-col gap-2.5">
          {addresses.map(a=> (
            <div key={a.id} className={"card p-3.5 "+(a.is_default?'border-[var(--purple)] border-2':'')}>
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold">{a.label || 'Address'}</span>
                {a.is_default && <Badge tone="green">Default</Badge>}
              </div>
              <div className="text-xs text-[var(--muted)] mt-1">{a.name} · +91 {a.phone}</div>
              <div className="text-xs text-[var(--muted)]">{a.address_line}, {a.locality}, {a.city} - {a.pincode}</div>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>setDefault(a)} disabled={a.is_default} className="btn-secondary px-3 py-1.5 text-xs flex-1 focus-ring disabled:opacity-40">
                  {a.is_default ? 'Currently Default' : 'Use for Delivery'}
                </button>
                <button onClick={()=>startEdit(a)} aria-label="Edit address" className="w-8 h-8 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring"><Icon.Edit/></button>
                <button onClick={()=>remove(a.id)} aria-label="Delete address" className="w-8 h-8 rounded-full bg-red-50 text-[var(--danger)] flex items-center justify-center focus-ring"><Icon.Close/></button>
              </div>
            </div>
          ))}
          {addresses.length===0 && <div className="text-center text-sm text-[var(--muted)] py-4">No saved addresses yet.</div>}
          <button onClick={startNew} className="btn-primary w-full py-2.5 mt-1 focus-ring">+ Add New Address</button>
        </div>
      )}
    </Modal>
  );
}

function EditProfileModal({onClose}){
  const {customerProfile, updateProfile, showToast} = useApp();
  const [form, setForm] = useState({
    fullName: (customerProfile && customerProfile.full_name) || '',
    phone: (customerProfile && customerProfile.phone) || '',
    username: (customerProfile && customerProfile.username) || '',
  });
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);

  const validate = ()=>{
    const e = {};
    if(!form.fullName.trim()) e.fullName = 'Name is required';
    if(form.phone && !/^\d{10}$/.test(form.phone.trim())) e.phone = 'Enter a valid 10-digit phone number';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const onSave = async ()=>{
    if(!validate()) return;
    setSaving(true);
    const { error } = await updateProfile({ full_name: form.fullName.trim(), phone: form.phone.trim(), username: form.username.trim() || null });
    setSaving(false);
    if(error){ showToast('Could not update profile','⚠️'); return; }
    showToast('Profile updated', '✅');
    onClose();
  };

  return (
    <Modal onClose={onClose} title="Edit Profile">
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Full Name</label>

          {errors.fullName && <div className="text-xs text-[var(--danger)] mt-1">{errors.fullName}</div>}

        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Username</label>
          <input value={form.username} onChange={e=>setForm({...form,username:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Phone</label>
          <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value.replace(/\D/g,'').slice(0,10)})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          {errors.phone && <div className="text-xs text-[var(--danger)] mt-1">{errors.phone}</div>}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Email</label>
          <input value={(customerProfile && customerProfile.email) || ''} disabled className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-400" />
          <div className="text-[10px] text-[var(--muted)] mt-1">To change your email, go to Account → Email & password.</div>

  );
}

/* ============ Account control: email, password, deactivate, delete ============ */
function SecurityModal({onClose}){
  const { session, changeEmail, verifyEmailChange, updatePassword, showToast } = useApp();
  const currentEmail = (session && session.user && session.user.email) || '';
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState({ email:'', pw:'' });
  const [emailSent, setEmailSent] = useState(false);
  const [ecode, setEcode] = useState('');
  const [stage, setStage] = useState('new'); // 'new' = code sent to the new address, 'old' = second code sent to the old one

  const saveEmail = async ()=>{
    const v = email.trim();
    if(!/^\S+@\S+\.\S+$/.test(v)){ setMsg(m=>({...m, email:'Enter a valid email address.'})); return; }
    if(v.toLowerCase()===currentEmail.toLowerCase()){ setMsg(m=>({...m, email:'That is already your email.'})); return; }
    setBusy('email'); setMsg(m=>({...m, email:''}));
    const { error } = await changeEmail(v);
    setBusy('');
    if(error){ setMsg(m=>({...m, email: friendlyAuthError(error)})); return; }
    setEmailSent(true);
  };
  const verifyChange = async ()=>{
    const c = ecode.trim();
    if(c.length<4){ setMsg(m=>({...m, email:'Enter the code from your email.'})); return; }
    setBusy('email'); setMsg(m=>({...m, email:''}));
    const target = stage==='new' ? email.trim() : currentEmail;
    const { error } = await verifyEmailChange(target, c);
    if(error){ setBusy(''); setMsg(m=>({...m, email: friendlyAuthError(error)})); return; }
    const { data } = await sb.auth.getUser();
    setBusy(''); setEcode('');
    if(data && data.user && data.user.new_email && stage==='new'){ setStage('old'); return; }
    showToast('Email updated ✅'); setEmailSent(false); setEmail(''); setStage('new');
  };
  const savePw = async ()=>{
    if(pw.length<6){ setMsg(m=>({...m, pw:'Password must be at least 6 characters.'})); return; }
    if(pw!==pw2){ setMsg(m=>({...m, pw:"The two passwords don't match."})); return; }
    setBusy('pw'); setMsg(m=>({...m, pw:''}));
    const { error } = await updatePassword(pw);
    setBusy('');
    if(error){ setMsg(m=>({...m, pw: friendlyAuthError(error)})); return; }
    setPw(''); setPw2(''); showToast('Password updated 🔒','✅');
  };

  return (
    <Modal onClose={onClose} title="Email & password">
      <div className="space-y-5">
        <div>
          <div className="text-sm font-bold">Change email</div>
          <div className="text-xs text-[var(--muted)] mt-0.5">Now: <b>{currentEmail}</b></div>
          {emailSent ? (
            <div className="mt-2">
              <div className="rounded-xl bg-[var(--green-light)] text-[var(--green)] text-xs font-semibold p-3">{stage==='new' ? <>We sent a code to <b>{email.trim()}</b>. Enter it below to confirm the change.</> : <>Almost done — we also sent a code to your current email <b>{currentEmail}</b>. Enter that one too.</>}</div>
              <input value={ecode} onChange={e=>setEcode(e.target.value.replace(/\D/g,'').slice(0,8))} inputMode="numeric" autoComplete="one-time-code" placeholder="Code" className="w-full mt-2 text-center tracking-[0.4em] text-lg font-bold border border-[var(--line)] rounded-lg px-3 py-2 focus-ring" />
              {msg.email && <div className="text-xs text-[var(--danger)] mt-1">{msg.email}</div>}
              <button onClick={verifyChange} disabled={busy==='email'} className="btn-primary w-full py-2 text-sm mt-2 focus-ring">{busy==='email' ? 'Checking…' : 'Confirm new email'}</button>

function DeactivateModal({onClose}){
  const { deactivateAccount, hasActiveOrders, showToast } = useApp();
  const [busy, setBusy] = useState(false);
  const go = async ()=>{
    setBusy(true);
    const { error } = await deactivateAccount();
    setBusy(false);
    if(error){ showToast(error.message || 'Could not deactivate','⚠️'); return; }
    showToast('Account deactivated. Log in any time to come back.','😴');
  };
  return (
    <Modal onClose={onClose} title="Deactivate account?">
      <div className="space-y-3 text-sm">
        <p className="text-[var(--muted)]">Taking a break? Your orders, addresses and reward money stay safe. You'll be logged out and won't get notifications. Log in again whenever you like and tap <b>Reactivate</b>.</p>

        </div>
      </div>
    </Modal>
  );
}

function DeleteAccountModal({onClose}){
  const { deleteAccount, hasActiveOrders, showToast, rewardBalance } = useApp();
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const go = async ()=>{
    setBusy(true); setErr('');

    <Modal onClose={onClose} title="Delete account permanently?">
      <div className="space-y-3 text-sm">
        <p className="text-[var(--muted)]">This removes your login, saved addresses, cart, wishlist and reward money{rewardBalance>0?(' ('+inr(rewardBalance)+')'):''}. <b>It can't be undone.</b> Records of past orders stay with the shop for its accounts, but are no longer linked to you.</p>

function AdminLogin({onSuccess}){
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const submit = async (e)=>{
    e.preventDefault();
    setError('');
    setSubmitting(true);
    const { data, error: err } = await sbAdmin.auth.signInWithPassword({ email: email.trim(), password: pass });
    if(err){
      setSubmitting(false);
      setError(err.message);
      return;
    }
    if(data.user.id !== SHOP_OWNER_ID){
      await sbAdmin.auth.signOut();
      setSubmitting(false);
      setError('This account is not authorized as the Meraki shop owner.');
      return;
    }
    setSubmitting(false);
    onSuccess();
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center fade-in" style={{background:'linear-gradient(160deg,#F6EEFF,#FBFAFE)'}}>

function AdminDashboard(){
  const [orders, setOrders] = useState([]);
  const [items, setItems] = useState([]);
  const [itemsLoading, setItemsLoading] = useState(true);

  const loadItems = ()=>{
    sbAdmin.from('items').select('*').eq('owner_id', SHOP_OWNER_ID).then(({data, error})=>{
      if(!error) setItems(data || []);
      setItemsLoading(false);
    });
  };
  const loadOrders = ()=>{
    sbAdmin.from('online_orders').select('*, online_order_items(*), online_payments(*)').eq('owner_id', SHOP_OWNER_ID).order('created_at',{ascending:false}).then(({data, error})=>{
      if(!error) setOrders((data||[]).map(row=> mapDbOrder(row, null)));
    });
  };

  useEffect(()=>{ loadItems(); loadOrders(); },[]);

  useEffect(()=>{
    const channel = sbAdmin.channel('admin-dashboard-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadItems())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_orders', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_order_items'}, ()=> loadOrders())
      .subscribe();
    return ()=> sbAdmin.removeChannel(channel);
  },[]);

  const totalRevenue = orders.reduce((s,o)=> s+o.total, 0);
  const pendingOrders = orders.filter(o=> o.status!=='Delivered' && o.status!=='Cancelled').length;
  const onlineVisibleCount = items.filter(i=>i.online_visible).length;
  const lowStock = items.filter(i=> i.qty <= (i.custom_low!=null ? i.custom_low : 3));
  const recent = orders.slice(0,6);

  return (
    <div className="fade-in max-w-5xl">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label="Total Orders" value={orders.length} icon="📦" tone="purple" />
        <StatCard label="Total Revenue" value={inr(totalRevenue)} icon="💰" tone="green" />
        <StatCard label="Pending Orders" value={pendingOrders} icon="⏳" tone="amber" />
        <StatCard label="Online Products" value={itemsLoading ? '…' : onlineVisibleCount+' / '+items.length} icon="🏷️" tone="purple" />
      </div>

                </div>
                <div className="flex items-center gap-3">
                  <span className="font-bold">{inr(o.total)}</span>

            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function AdminProductFormModal({item, allItems, onSaved, onClose}){
  const { showToast } = useApp();
  const [form, setForm] = useState({
    price: String(item.price),
    mrp: item.mrp ? String(item.mrp) : '',
    qty: String(item.qty),
    subcategory: item.subcategory || '',
    online_description: item.online_description || '',
    online_visible: item.online_visible,
    is_featured: item.is_featured,
  });
  // Existing subcategories used elsewhere in this same main category — offered as suggestions so
  // typos don't create near-duplicate groupings (e.g. "Lunch Box" vs "Lunch Boxes").
  const subcategorySuggestions = useMemo(()=>{
    const set = new Set();
    (allItems||[]).forEach(it=>{ if(it.category===item.category && it.subcategory) set.add(it.subcategory); });
    return Array.from(set).sort();
  },[allItems, item.category]);
  const [saving, setSaving] = useState(false);
  const save = async ()=>{
    const price = Number(form.price), qty = Number(form.qty);
    if(!form.price || isNaN(price) || price<0){ showToast('Enter a valid price','⚠️'); return; }
    if(form.qty==='' || isNaN(qty) || qty<0){ showToast('Enter a valid stock quantity','⚠️'); return; }
    let mrp = null;
    if(form.mrp.trim()!==''){
      const mrpNum = Number(form.mrp);
      if(isNaN(mrpNum) || mrpNum<0){ showToast('Enter a valid MRP, or leave it blank','⚠️'); return; }
      mrp = mrpNum;
    }
    setSaving(true);
    const { data, error } = await sbAdmin.from('items').update({
      price, mrp, qty,
      subcategory: form.subcategory.trim() || null,
      online_description: form.online_description.trim() || null,
      online_visible: form.online_visible,
      is_featured: form.is_featured,
    }).eq('id', item.id).select().maybeSingle();
    setSaving(false);
    if(error){ showToast('Could not save changes','⚠️'); return; }
    showToast('Item updated', '✅');
    onSaved(data);
    onClose();
  };

  return (
    <Modal onClose={onClose} title="Edit Inventory Item">
      <div className="space-y-3">
        <div className="card p-3 text-sm">
          <div className="font-bold">{item.name}</div>
          <div className="text-xs text-[var(--muted)] mt-0.5">{item.category} · {item.brand || 'No brand'}</div>
          <div className="text-[10px] text-[var(--muted)] mt-1">Name, category and brand are managed in your POS app.</div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Subcategory (within {item.category}) — optional</label>
          <input list="subcat-suggestions" value={form.subcategory} onChange={e=>setForm({...form,subcategory:e.target.value})}
            placeholder="e.g. Lunch Boxes, Cups/Mugs, Pouches" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          <datalist id="subcat-suggestions">{subcategorySuggestions.map(s=> <option key={s} value={s} />)}</datalist>
          <div className="text-[10px] text-[var(--muted)] mt-1">Groups this product under {item.category} on the storefront — e.g. School Essentials → Lunch Boxes, Cups/Mugs, Pouches.</div>
        </div>
        <ProductMediaEditor item={item} />
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Selling Price (₹)</label><input type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Stock Quantity</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">MRP / Strike-through Price (₹) — optional</label>
          <input type="number" value={form.mrp} onChange={e=>setForm({...form,mrp:e.target.value})} placeholder="Leave blank for no discount shown" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          <div className="text-[10px] text-[var(--muted)] mt-1">Only shows as a discount on the storefront when set higher than the selling price — this is what feeds the Deals strip.</div>
        </div>
        <div className="text-[10px] text-[var(--muted)] -mt-1">Shared with your POS — changes here affect both channels.</div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Storefront Description</label>
          <textarea value={form.online_description} onChange={e=>setForm({...form,online_description:e.target.value})} rows="2" placeholder="Shown to online shoppers" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring"></textarea>
        </div>
        <label className="flex items-center gap-2 text-sm font-semibold">
          <input type="checkbox" checked={form.online_visible} onChange={e=>setForm({...form,online_visible:e.target.checked})} /> Visible on the online store
        </label>
        <label className="flex items-center gap-2 text-sm font-semibold">
          <input type="checkbox" checked={form.is_featured} onChange={e=>setForm({...form,is_featured:e.target.checked})} /> Feature in Popular Picks
        </label>
        <button onClick={save} disabled={saving} className="btn-primary w-full py-2.5 focus-ring">{saving ? 'Saving…' : 'Save Changes'}</button>
      </div>
    </Modal>
  );
}

function AdminProducts(){
  const { showToast } = useApp();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('all');
  const [visFilter, setVisFilter] = useState('all');
  const [editingItem, setEditingItem] = useState(null);

  const loadItems = ()=>{
    setLoading(true);
    Promise.all([
      sbAdmin.from('items').select('*').eq('owner_id', SHOP_OWNER_ID).order('name'),
      sbAdmin.from('product_images').select('product_id, image_url, is_primary, sort_order').order('is_primary', {ascending:false}).order('sort_order')
    ]).then(([itemsRes, imagesRes])=>{
      if(itemsRes.error){ showToast('Could not load inventory','⚠️'); setLoading(false); return; }
      const imageByProduct = {};
      (imagesRes.data||[]).forEach(row=>{ if(!imageByProduct[row.product_id]) imageByProduct[row.product_id] = row.image_url; });
      setItems((itemsRes.data||[]).map(it=> ({...it, thumb: imageByProduct[it.id]||null})));
      setLoading(false);
    });
  };

  useEffect(()=>{ loadItems(); },[]);

  useEffect(()=>{
    const channel = sbAdmin.channel('admin-items-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadItems())
      .on('postgres_changes', {event:'*', schema:'public', table:'product_images'}, ()=> loadItems())
      .subscribe();
    return ()=> sbAdmin.removeChannel(channel);
  },[]);

  const categories = useMemo(()=> Array.from(new Set(items.map(i=>i.category))).sort(), [items]);

  const filtered = items.filter(i=>
    (catFilter==='all' || i.category===catFilter) &&
    (visFilter==='all' || (visFilter==='visible' ? i.online_visible : !i.online_visible)) &&
    (search.trim()==='' || i.name.toLowerCase().includes(search.toLowerCase()) || (i.brand||'').toLowerCase().includes(search.toLowerCase()))
  );

  const toggleVisible = async (item)=>{
    const { data, error } = await sbAdmin.from('items').update({ online_visible: !item.online_visible }).eq('id', item.id).select().maybeSingle();
    if(error){ showToast('Could not update visibility','⚠️'); return; }
    setItems(prev=> prev.map(i=> i.id===item.id ? data : i));
    showToast(data.online_visible ? 'Now visible online' : 'Hidden from storefront', data.online_visible ? '👁️' : '🙈');
  };

  const onSaved = (updated)=>{
    setItems(prev=> prev.map(i=> i.id===updated.id ? updated : i));
  };

  return (
    <div className="fade-in max-w-5xl">
      <div className="card p-3 mb-4 text-xs text-[var(--muted)] flex items-start gap-2">
        <span>ℹ️</span> This is your real POS inventory ({items.length} items). Adding or removing items happens in your POS app — here you control what's sold online, its online price/stock, and its storefront description.
      </div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search inventory..." className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring flex-1 min-w-[160px]" />
        <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
          <option value="all">All Categories</option>
          {categories.map(c=> <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={visFilter} onChange={e=>setVisFilter(e.target.value)} className="border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
          <option value="all">All Items</option>
          <option value="visible">Online Only</option>
          <option value="hidden">Hidden Only</option>
        </select>
      </div>

      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-10">Loading inventory…</div>
      ) : (
        <React.Fragment>
          <div className="text-xs text-[var(--muted)] mb-2">{filtered.length} items</div>
          <div className="flex flex-col gap-2">
            {filtered.map(item=> (
              <div key={item.id} className="card p-3 flex items-center gap-3">
                {item.thumb ? (
                  <img src={item.thumb} alt="" className="w-12 h-12 rounded-lg object-cover flex-shrink-0 border border-[var(--line)]" />
                ) : (
                  <div className="w-12 h-12 rounded-lg flex-shrink-0 bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center font-bold text-lg">{(item.name[0]||'?').toUpperCase()}</div>
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="text-sm font-semibold truncate">{item.name}</div>
                    {item.is_featured && <Badge tone="amber">Featured</Badge>}
                  </div>
                  <div className="text-xs text-[var(--muted)] mt-0.5 truncate">{item.category} · {item.brand || 'No brand'}</div>
                  <div className="text-xs mt-0.5">
                    <span className="font-bold">{inr(item.price)}</span> · <span className={item.qty<=2?'text-[var(--danger)] font-semibold':'text-[var(--muted)]'}>{item.qty} in stock</span>
                  </div>
                </div>
                <div className="flex items-center gap-2.5 ml-auto flex-shrink-0">
                  <ToggleSwitch on={item.online_visible} onChange={()=>toggleVisible(item)} label={item.online_visible ? "Hide from storefront" : "Show on storefront"} />
                  <button onClick={()=>setEditingItem(item)} aria-label="Edit item" className="w-9 h-9 rounded-full bg-[var(--purple-light)] text-[var(--purple)] flex items-center justify-center focus-ring flex-shrink-0"><Icon.Edit/></button>
                </div>
              </div>
            ))}
            {filtered.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No items match your search.</div>}
          </div>
        </React.Fragment>
      )}

      {editingItem && <AdminProductFormModal item={editingItem} allItems={items} onSaved={onSaved} onClose={()=>setEditingItem(null)} />}
    </div>
  );
}

function AdminCustomerPanel({id, onClose}){
  const { showToast } = useApp();
  const [d, setD] = useState(null);
  const [err, setErr] = useState('');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [busy, setBusy] = useState(false);
  const [askOrder, setAskOrder] = useState(null);       // order id awaiting delete confirmation
  const [reverse, setReverse] = useState(true);
  const [rwAmt, setRwAmt] = useState('');
  const [rwWhy, setRwWhy] = useState('');
  const [delText, setDelText] = useState('');
  const [askDel, setAskDel] = useState(false);

  const load = useCallback(async ()=>{
    const { data, error } = await sbAdmin.rpc('admin_customer_detail', { p_id: id });
    if(error || !data){ setErr((error && error.message) || 'Customer not found'); return; }
    setErr(''); setD(data); setName(data.name||''); setPhone(data.phone||'');
  },[id]);
  useEffect(()=>{ load(); },[load]);

  const run = async (fn, okMsg)=>{
    setBusy(true);
    try{ const r = await fn(); if(r && r.error) throw r.error; if(okMsg) showToast(okMsg,'✅'); await load(); }
    catch(e){ showToast((e && e.message) || 'That did not work','⚠️'); }
    setBusy(false);
  };

  const saveProfile = ()=> run(()=> sbAdmin.rpc('admin_update_customer', { p_id:id, p_name:name, p_phone:phone }), 'Profile saved');
  const setQty = (pid, qty)=> run(()=> sbAdmin.rpc('admin_set_cart_qty', { p_customer:id, p_product:pid, p_qty:qty }));
  const removeCart = (pid)=> run(()=> sbAdmin.from('customer_cart_items').delete().eq('customer_id',id).eq('product_id',pid), 'Removed from cart');
  const clearCart = ()=> run(()=> sbAdmin.from('customer_cart_items').delete().eq('customer_id',id), 'Cart cleared');
  const removeWish = (pid)=> run(()=> sbAdmin.from('customer_wishlist').delete().eq('customer_id',id).eq('product_id',pid), 'Removed from wishlist');
  const adjustRewards = ()=>{
    const amt = Number(rwAmt);
    if(!amt){ showToast('Enter an amount (use − to take away)','⚠️'); return; }
    run(async ()=>{ const r = await sbAdmin.rpc('admin_adjust_rewards', { p_customer:id, p_amount:amt, p_reason:rwWhy }); if(!r.error){ setRwAmt(''); setRwWhy(''); } return r; }, 'Rewards updated');
  };
  const deleteOrder = (oid)=> run(async ()=>{
    if(reverse){ const r1 = await sbAdmin.from('loyalty_transactions').delete().eq('order_id', oid).gt('amount', 0); if(r1.error) return r1; }
    const r2 = await sbAdmin.from('online_orders').delete().eq('id', oid);
    if(!r2.error) setAskOrder(null);
    return r2;
  }, 'Order deleted');
  const deleteCustomer = async ()=>{
    setBusy(true);
    try{
      const { data: sess } = await sbAdmin.auth.getSession();
      const res = await fetch(SUPABASE_URL+'/functions/v1/admin-delete-customer', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token,'apikey':SUPABASE_ANON_KEY},
        body: JSON.stringify({ customer_id:id }),
      });
      const j = await res.json();
      if(!res.ok) throw new Error(j.error || 'Could not delete');
      showToast('Customer deleted','🗑️'); onClose();
    }catch(e){ showToast(e.message || 'Could not delete','⚠️'); setBusy(false); }
  };

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] flex justify-end">
      <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
      <div className="relative bg-white w-full md:w-[560px] h-full overflow-y-auto p-4 md:p-6">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-bold text-lg">Customer</h3>
          <button onClick={onClose} aria-label="Close" className="focus-ring w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5"><Icon.Close /></button>
        </div>
        {err && <div className="rounded-xl bg-red-50 text-[var(--danger)] text-sm p-3">{err}</div>}
        {!d && !err && <div className="text-center text-sm text-[var(--muted)] py-10">Loading…</div>}
        {d && (<>
          <div className="card p-3.5 text-sm">
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-semibold text-[var(--muted)]">Name</label><input value={name} onChange={e=>setName(e.target.value)} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
              <div><label className="text-xs font-semibold text-[var(--muted)]">Phone</label><input value={phone} onChange={e=>setPhone(e.target.value)} inputMode="tel" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
            </div>
            <div className="text-xs text-[var(--muted)] mt-2.5 space-y-0.5">
              <div>Email: <span className="font-semibold text-[var(--ink)]">{d.email}</span></div>
              <div>Joined: {fmtDateTime(d.joined)} · Last signed in: {fmtDateTime(d.last_seen)}</div>
              <div>Phone notifications: {d.devices>0 ? d.devices+' device'+(d.devices===1?'':'s') : 'off'}</div>
            </div>
            <button onClick={saveProfile} disabled={busy || (name===(d.name||'') && phone===(d.phone||''))} className="btn-primary w-full py-2 text-sm mt-3 focus-ring">Save name &amp; phone</button>
          </div>

          <Section title="Orders" count={d.orders.length}>
            <div className="flex flex-col gap-2">
              {d.orders.map(o=>(
                <div key={o.id} className="card p-3">
                  <div className="flex items-center gap-2">
                    <div className="flex-1 min-w-0"><div className="text-sm font-bold">{shortOrderCode(o.id)}</div><div className="text-[11px] text-[var(--muted)]">{fmtDateTime(o.created_at)} · {o.payment_method||'—'} · {o.delivery_type||''}</div></div>
                    <div className="text-right"><div className="text-sm font-bold">{inr(o.total)}</div><Badge tone={statusColor(o.status)}>{o.status}</Badge></div>
                  </div>
                  <div className="mt-2 text-xs divide-y divide-[var(--line)]">
                    {o.items.map((it,i)=> <div key={i} className="flex justify-between gap-2 py-1"><span className="min-w-0 truncate">{it.qty} × {it.name}</span><span className="font-semibold flex-shrink-0">{inr(it.total)}</span></div>)}
                  </div>
                  {askOrder===o.id ? (
                    <div className="mt-2.5 rounded-lg bg-red-50 p-2.5 space-y-2">
                      <div className="text-xs font-semibold text-[var(--danger)]">Delete this order permanently? Stock is not put back automatically.</div>
                      <label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={reverse} onChange={e=>setReverse(e.target.checked)} /> Also take back the reward money it earned</label>
                      <div className="flex gap-2">
                        <button onClick={()=>setAskOrder(null)} className="btn-secondary flex-1 py-1.5 text-xs focus-ring">Keep</button>
                        <button onClick={()=>deleteOrder(o.id)} disabled={busy} className="flex-1 py-1.5 text-xs font-bold rounded-lg bg-[var(--danger)] text-white focus-ring">Delete order</button>
                      </div>
                    </div>
                  ) : <button onClick={()=>{ setAskOrder(o.id); setReverse(true); }} className="mt-2 text-xs font-semibold text-[var(--danger)] focus-ring">Delete order…</button>}
                </div>
              ))}
              {d.orders.length===0 && <div className="text-xs text-[var(--muted)]">No orders yet.</div>}
            </div>
          </Section>

          <Section title="In cart now" count={d.cart.length} right={d.cart.length>0 && <button onClick={clearCart} disabled={busy} className="text-xs font-semibold text-[var(--danger)] focus-ring">Clear cart</button>}>
            <div className="flex flex-col gap-1.5">
              {d.cart.map(c=>(
                <div key={c.product_id} className="card p-2.5 flex items-center gap-2">
                  <div className="flex-1 min-w-0"><div className="text-sm font-semibold truncate">{c.name || 'Removed product'}</div><div className="text-[11px] text-[var(--muted)]">{c.price!=null?inr(c.price):''}{c.stock!=null?' · '+c.stock+' in stock':''}</div></div>
                  <div className="flex items-center border border-[var(--line)] rounded-lg overflow-hidden">
                    <button onClick={()=>setQty(c.product_id, c.qty-1)} disabled={busy||c.qty<=1} className="w-7 h-7 font-bold focus-ring disabled:opacity-30">−</button>
                    <span className="w-7 text-center text-sm font-bold">{c.qty}</span>
                    <button onClick={()=>setQty(c.product_id, c.qty+1)} disabled={busy} className="w-7 h-7 font-bold focus-ring">+</button>
                  </div>
                  <button onClick={()=>removeCart(c.product_id)} disabled={busy} aria-label="Remove from cart" className="w-7 h-7 rounded-full hover:bg-red-50 text-[var(--danger)] focus-ring">✕</button>
                </div>
              ))}
              {d.cart.length===0 && <div className="text-xs text-[var(--muted)]">Cart is empty.</div>}
            </div>
          </Section>

          <Section title="Wishlist" count={d.wishlist.length}>
            <div className="flex flex-col gap-1.5">
              {d.wishlist.map(w=>(
                <div key={w.product_id} className="card p-2.5 flex items-center gap-2">
                  <div className="flex-1 min-w-0"><div className="text-sm font-semibold truncate">{w.name || 'Removed product'}</div>{w.price!=null && <div className="text-[11px] text-[var(--muted)]">{inr(w.price)}</div>}</div>
                  <button onClick={()=>removeWish(w.product_id)} disabled={busy} aria-label="Remove from wishlist" className="w-7 h-7 rounded-full hover:bg-red-50 text-[var(--danger)] focus-ring">✕</button>
                </div>
              ))}
              {d.wishlist.length===0 && <div className="text-xs text-[var(--muted)]">Wishlist is empty.</div>}

          </Section>

          {d.notify.length>0 && (
            <Section title="Waiting for back in stock" count={d.notify.length}>
              <div className="text-xs space-y-1">{d.notify.map(n=> <div key={n.product_id} className="card px-3 py-2">🔔 {n.name || 'Removed product'}</div>)}</div>
            </Section>
          )}

          <Section title="Reward money" count={inr(d.rewards)}>
            <div className="card p-3 space-y-2">
              <div className="flex gap-2">
                <input value={rwAmt} onChange={e=>setRwAmt(e.target.value)} inputMode="decimal" placeholder="± amount" className="w-24 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
                <input value={rwWhy} onChange={e=>setRwWhy(e.target.value)} placeholder="Reason (optional)" className="flex-1 min-w-0 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
                <button onClick={adjustRewards} disabled={busy} className="btn-primary px-3 text-sm focus-ring">Apply</button>
              </div>
              <div className="text-[11px] text-[var(--muted)]">Use a minus sign (e.g. −20) to take reward money away.</div>
              {d.reward_log.length>0 && <div className="text-xs divide-y divide-[var(--line)]">{d.reward_log.map((r,i)=> <div key={i} className="flex justify-between gap-2 py-1"><span className="truncate">{r.reason||'—'} <span className="text-[var(--muted)]">· {fmtDateTime(r.at)}</span></span><span className={"font-semibold flex-shrink-0 "+(r.amount<0?'text-[var(--danger)]':'text-[var(--green)]')}>{r.amount>0?'+':''}{inr(r.amount)}</span></div>)}</div>}
            </div>
          </Section>

          <Section title="Saved addresses" count={d.addresses.length}>
            <div className="flex flex-col gap-1.5 text-xs">
              {d.addresses.map(a=> <div key={a.id} className="card p-2.5"><div className="font-semibold">{a.label||'Address'}{a.is_default && ' · default'} — {a.name} {a.phone}</div><div className="text-[var(--muted)]">{[a.line,a.locality,a.landmark,a.city,a.pincode].filter(Boolean).join(', ')}</div></div>)}
              {d.addresses.length===0 && <div className="text-[var(--muted)]">No saved addresses.</div>}
            </div>
          </Section>

          <Section title="Danger zone">
            {!askDel ? <button onClick={()=>setAskDel(true)} className="w-full py-2 text-sm font-semibold rounded-lg border border-[var(--danger)] text-[var(--danger)] focus-ring">Delete this customer…</button> : (
              <div className="rounded-xl bg-red-50 p-3 space-y-2">
                <div className="text-xs font-semibold text-[var(--danger)]">This permanently removes the account, all their orders, cart, wishlist, addresses and rewards. It can't be undone. Type DELETE to confirm.</div>
                <input value={delText} onChange={e=>setDelText(e.target.value)} placeholder="DELETE" className="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
                <div className="flex gap-2">
                  <button onClick={()=>{ setAskDel(false); setDelText(''); }} className="btn-secondary flex-1 py-2 text-sm focus-ring">Cancel</button>
                  <button onClick={deleteCustomer} disabled={busy || delText!=='DELETE'} className="flex-1 py-2 text-sm font-bold rounded-lg bg-[var(--danger)] text-white disabled:opacity-40 focus-ring">{busy?'Deleting…':'Delete forever'}</button>
                </div>
              </div>
            )}
          </Section>
          <div className="h-8"></div>
        </>)}
      </div>
    </div>,
    document.body
  );
}

function AdminOrders(){
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('all');
  const [selected, setSelected] = useState(null);

  const loadOrders = ()=>{
    setLoading(true);
    sbAdmin.from('online_orders')
      .select('*, online_order_items(*), online_payments(*)')
      .eq('owner_id', SHOP_OWNER_ID)
      .order('created_at', {ascending:false})
      .then(({data, error})=>{
        if(!error) setOrders((data||[]).map(row=> mapDbOrder(row, null)));
        setLoading(false);
      });
  };

  useEffect(()=>{ loadOrders(); },[]);

  useEffect(()=>{
    const channel = sbAdmin.channel('admin-orders-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'online_orders', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> loadOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_order_items'}, ()=> loadOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_payments'}, ()=> loadOrders())
      .subscribe();
    return ()=> sbAdmin.removeChannel(channel);
  },[]);

  const onUpdated = (updated)=>{
    setOrders(prev=> prev.map(o=> o.id===updated.id ? updated : o));
    setSelected(updated);
  };

  const filtered = statusFilter==='all' ? orders : orders.filter(o=>o.status===statusFilter);
  const statuses = ['all', ...ORDER_STATUS_STEPS, 'Cancelled'];

  return (
    <div className="fade-in max-w-5xl">
      <div className="flex gap-2 overflow-x-auto scrollbar-none mb-4">
        {statuses.map(s=> (
          <button key={s} onClick={()=>setStatusFilter(s)} className={"chip "+(statusFilter===s?'active':'')}>{s==='all'?'All Orders':s}</button>
        ))}
      </div>
      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-10">Loading orders…</div>
      ) : (
        <div className="flex flex-col gap-2">
          {filtered.map(o=> (
            <button key={o.id} onClick={()=>setSelected(o)} className="card p-3.5 flex items-center gap-3 text-left w-full focus-ring">
              <div className="flex-1 min-w-0">
                <div className="text-sm font-bold">#{o.shortId || o.id}</div>
                <div className="text-xs text-[var(--muted)]">{o.address.name} · {new Date(o.date).toLocaleDateString()} · {o.items.length} items</div>
              </div>
              <span className="font-bold text-sm">{inr(o.total)}</span>
              <Badge tone={statusColor(o.status)}>{o.status}</Badge>
            </button>
          ))}
          {filtered.length===0 && <div className="text-center text-sm text-[var(--muted)] py-10">No orders in this status.</div>}
        </div>
      )}
      {selected && <AdminOrderDetailModal order={selected} onUpdated={onUpdated} onClose={()=>setSelected(null)} />}
    </div>
  );
}

function emptyBannerForm(){

}

function AdminBannerFormModal({banner, sortOrder, onSaved, onClose}){
  const { showToast } = useApp();
  const [form, setForm] = useState(banner ? {
    id: banner.id, active: banner.active, title: banner.title, highlight: banner.highlight||'', subtitle: banner.subtitle||'',
    cta_label: banner.ctaLabel||'Shop Now', cta_link: banner.ctaLink||'#/category/stationery',
    bg: banner.bg && banner.bg.startsWith('#') ? banner.bg : '#EFE6FF', image_url: banner.image||null, sort_order: banner.sortOrder||0,
  } : {...emptyBannerForm(), sort_order: sortOrder||0});
  const isEdit = Boolean(banner);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);

  const onImageUpload = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('Please choose an image under 2MB','⚠️'); return; }
    setUploading(true);
    const path = Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
    const { error } = await sbAdmin.storage.from('banner-images').upload(path, file, { upsert:true });
    if(error){ setUploading(false); showToast('Upload failed','⚠️'); return; }
    const { data } = sbAdmin.storage.from('banner-images').getPublicUrl(path);
    setForm(prev=>({...prev, image_url: data.publicUrl}));
    setUploading(false);
  };

  const save = async ()=>{
    if(!form.title.trim()){ showToast('Please add a banner title','⚠️'); return; }
    setSaving(true);
    const payload = {
      title: form.title.trim(), highlight: form.highlight, subtitle: form.subtitle,
      cta_label: form.cta_label, cta_link: form.cta_link,
      bg: `linear-gradient(120deg, ${form.bg}, #ffffff)`,
      image_url: form.image_url, active: form.active, sort_order: form.sort_order,
    };
    const query = isEdit
      ? sbAdmin.from('storefront_banners').update(payload).eq('id', form.id).select().maybeSingle()
      : sbAdmin.from('storefront_banners').insert(payload).select().maybeSingle();
    const { data, error } = await query;
    setSaving(false);
    if(error){ showToast('Could not save banner','⚠️'); return; }
    showToast(isEdit ? 'Banner updated' : 'Banner added', '✅');
    onSaved(mapDbBanner(data));
    onClose();
  };

  return (
    <Modal onClose={onClose} title={isEdit ? 'Edit Banner' : 'Add Banner'}>
      <div className="space-y-3">
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Banner Image (optional)</label>
          {form.image_url ? (
            <div className="mt-1 relative rounded-lg overflow-hidden border border-[var(--line)]">
              <img src={form.image_url} alt="Banner preview" className="w-full h-28 object-cover" />
              <button type="button" onClick={()=>setForm({...form,image_url:null})} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 shadow flex items-center justify-center focus-ring"><Icon.Close/></button>
            </div>
          ) : (
            <label className="mt-1 flex flex-col items-center justify-center gap-1 border-2 border-dashed border-[var(--line)] rounded-lg h-24 cursor-pointer hover:bg-gray-50 focus-ring">
              <span className="text-lg">{uploading ? '⏳' : '🖼️'}</span>
              <span className="text-xs font-semibold text-[var(--muted)]">{uploading ? 'Uploading…' : 'Tap to upload an image'}</span>
              <input type="file" accept="image/*" onChange={onImageUpload} disabled={uploading} className="hidden" />
            </label>
          )}
          <div className="text-[10px] text-[var(--muted)] mt-1">If no image is uploaded, the background colour below is used instead.</div>
        </div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Everything they need. Delivered with" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Highlight (coloured text)</label><input value={form.highlight} onChange={e=>setForm({...form,highlight:e.target.value})} placeholder="Care & Happiness! 💗" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Subtitle</label><input value={form.subtitle} onChange={e=>setForm({...form,subtitle:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs font-semibold text-[var(--muted)]">Button Label</label><input value={form.cta_label} onChange={e=>setForm({...form,cta_label:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
          <div><label className="text-xs font-semibold text-[var(--muted)]">Button Link</label><input value={form.cta_link} onChange={e=>setForm({...form,cta_link:e.target.value})} placeholder="#/category/toys" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" /></div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Background Colour</label>
          <input type="color" value={form.bg} onChange={e=>setForm({...form,bg:e.target.value})} className="w-full mt-1 border border-[var(--line)] rounded-lg h-[38px] px-1 focus-ring" />
        </div>
        <label className="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" checked={form.active} onChange={e=>setForm({...form,active:e.target.checked})} /> Active (visible on homepage)</label>
        <button onClick={save} disabled={saving||uploading} className="btn-primary w-full py-2.5 focus-ring">{saving ? 'Saving…' : (isEdit ? 'Save Changes' : 'Add Banner')}</button>
      </div>
    </Modal>
  );
}

function AdminBanners(){
  const { showToast } = useApp();
  const [banners, setBanners] = useState([]);
  const [loading, setLoading] = useState(true);
  const [formOpen, setFormOpen] = useState(false);
  const [editingBanner, setEditingBanner] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const loadBanners = ()=>{
    setLoading(true);
    sbAdmin.from('storefront_banners').select('*').eq('owner_id', SHOP_OWNER_ID).order('sort_order').then(({data, error})=>{
      if(!error) setBanners((data||[]).map(mapDbBanner));
      setLoading(false);
    });
  };

  useEffect(()=>{ loadBanners(); },[]);

  const openAdd = ()=>{ setEditingBanner(null); setFormOpen(true); };
  const openEdit = (b)=>{ setEditingBanner(b); setFormOpen(true); };

  const onSaved = (banner)=>{
    setBanners(prev=>{
      const exists = prev.some(b=>b.id===banner.id);
      return exists ? prev.map(b=> b.id===banner.id ? banner : b) : [...prev, banner].sort((a,b)=>a.sortOrder-b.sortOrder);
    });
  };

  const confirmDelete = async ()=>{
    const { error } = await sbAdmin.from('storefront_banners').delete().eq('id', deleteConfirm.id);
    if(error){ showToast('Could not delete banner','⚠️'); return; }
    setBanners(prev=> prev.filter(b=>b.id!==deleteConfirm.id));
    showToast('Banner deleted','🗑️');
    setDeleteConfirm(null);
  };

  const reorder = async (id, direction)=>{
    const idx = banners.findIndex(b=>b.id===id);
    const swapIdx = idx + direction;
    if(idx<0 || swapIdx<0 || swapIdx>=banners.length) return;
    const a = banners[idx], b = banners[swapIdx];
    const next = [...banners];
    [next[idx], next[swapIdx]] = [{...b, sortOrder:a.sortOrder}, {...a, sortOrder:b.sortOrder}];
    setBanners(next);
    await sbAdmin.from('storefront_banners').update({ sort_order: a.sortOrder }).eq('id', b.id);
    await sbAdmin.from('storefront_banners').update({ sort_order: b.sortOrder }).eq('id', a.id);
  };

  return (
    <div className="fade-in max-w-3xl">
      <div className="flex justify-between items-center mb-4">
        <div className="text-xs text-[var(--muted)]">{banners.length} banner{banners.length!==1?'s':''} · order shown here matches the homepage carousel</div>
        <button onClick={openAdd} className="btn-primary px-4 py-2 text-sm focus-ring">+ Add Banner</button>
      </div>
      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-10">Loading banners…</div>
      ) : (
        <div className="flex flex-col gap-3">
          {banners.map((b,i)=> (
            <div key={b.id} className="card p-4">
              <div className="rounded-xl p-4 mb-3 bg-cover bg-center" style={{background: b.image ? `url(${b.image}) center/cover` : b.bg}}>
                <div className="font-display font-bold">{b.title} <span className="text-[var(--danger)]">{b.highlight}</span></div>
                <div className="text-xs text-[var(--muted)] mt-1">{b.subtitle}</div>
              </div>
              <div className="flex items-center justify-between flex-wrap gap-2">
                <Badge tone={b.active ? 'green' : 'amber'}>{b.active ? 'Active' : 'Hidden'}</Badge>
                <div className="flex gap-2">
                  <button onClick={()=>reorder(b.id,-1)} disabled={i===0} aria-label="Move up" className="w-9 h-9 rounded-full bg-gray-100 text-[var(--ink)] flex items-center justify-center focus-ring disabled:opacity-30">↑</button>

        </div>
      )}
