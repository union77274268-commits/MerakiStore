function OwnerAlertCard(){
  const {showToast} = useApp();
  const [state, setState] = useState('checking'); // checking | unsupported | off | on | denied
  const [busy, setBusy] = useState(false);
  const refresh = useCallback(async ()=>{
    if(!pushApiSupported()){ setState(isIOSDevice() && !isStandaloneApp() ? 'ios' : 'unsupported'); return; }
    if(Notification.permission==='denied'){ setState('denied'); return; }
    const {sub} = await getPushSubscription();
    if(!sub || Notification.permission!=='granted'){ setState('off'); return; }
    const { data } = await sbAdmin.from('push_subscriptions').select('id').eq('endpoint', sub.endpoint).maybeSingle();
    setState(data ? 'on' : 'off');
  },[]);
  useEffect(()=>{ refresh(); },[refresh]);
  const enable = async ()=>{
    setBusy(true);
    try{
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ setState(perm==='denied'?'denied':'off'); return; }
      const reg = await registerMerakiSW();
      if(!reg) throw new Error('no sw');
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToUint8(VAPID_PUBLIC_KEY)});
      const j = sub.toJSON();
      const {error} = await sbAdmin.rpc('register_push_subscription', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:navigator.userAgent});
      if(error) throw error;
      setState('on'); showToast('This device will get new-order alerts','🔔');
    }catch(e){ showToast("Couldn't turn on alerts",'⚠️'); }
    finally{ setBusy(false); }
  };
  const disable = async ()=>{
    setBusy(true);
    try{
      const {sub} = await getPushSubscription();
      if(sub){ await sbAdmin.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
      setState('off');
    }catch(e){ showToast("Couldn't turn off alerts",'⚠️'); }
    finally{ setBusy(false); }
  };
  return (
    <div className="card p-5 mt-5">
      <div className="font-bold text-sm">🔔 New-order alerts on this device</div>
      <div className="text-xs text-[var(--muted)] mt-0.5 mb-3">Get a push notification here the moment a customer places an order. Turn it on from the phone you keep at the shop.</div>
      {state==='checking' && <div className="text-xs text-[var(--muted)]">Checking…</div>}
      {state==='unsupported' && <div className="text-xs text-[var(--muted)]">This browser can't receive push notifications.</div>}
      {state==='ios' && <div className="text-xs text-[var(--muted)]">On iPhone, first add the app to your Home Screen, then open it from there.</div>}
      {state==='denied' && <div className="text-xs text-[var(--danger)]">Notifications are blocked for this site — allow them in your browser/phone settings, then come back.</div>}
      {state==='off' && <button onClick={enable} disabled={busy} className="btn-primary w-full py-2.5 text-sm focus-ring">{busy?'Please wait…':'Turn on alerts for this device'}</button>}
      {state==='on' && (
        <div className="flex items-center gap-3">
          <div className="flex-1 text-xs font-semibold text-[var(--green)]">✅ On — this device gets new-order alerts.</div>
          <button onClick={disable} disabled={busy} className="text-xs font-bold text-[var(--danger)] focus-ring">Turn off</button>
        </div>
      )}
      <div className="text-[10px] text-[var(--muted)] mt-2">If you also shop on this same phone with a different customer account, alerts follow whichever account used the app last — use a separate browser or device for the shop.</div>
    </div>
  );
}

function CouponsCard(){
  const {showToast} = useApp();
  const [list, setList] = useState(null);
  const blank = {code:'', kind:'percent', value:'', min_order:'', max_discount:'', expires:'', usage_limit:'', per_customer:'1', description:''};
  const [f, setF] = useState(blank);
  const [saving, setSaving] = useState(false);
  const load = useCallback(()=>{ sbAdmin.from('coupons').select('*').order('created_at',{ascending:false}).then(({data,error})=> setList(error?[]:(data||[]))); },[]);
  useEffect(()=>{ load(); },[load]);
  const upd = (k,v)=> setF(prev=>({...prev,[k]:v}));
  const create = async ()=>{
    const code = f.code.trim().toUpperCase();
    if(!/^[A-Z0-9_-]{3,20}$/.test(code)){ showToast('Code: 3–20 letters/numbers','⚠️'); return; }
    if(!(Number(f.value)>0)){ showToast('Enter the discount amount','⚠️'); return; }
    if(f.kind==='percent' && Number(f.value)>100){ showToast('Percent can’t be above 100','⚠️'); return; }
    setSaving(true);
    const { error } = await sbAdmin.from('coupons').insert({
      code, kind:f.kind, value:Number(f.value), min_order:Number(f.min_order)||0,
      max_discount: f.max_discount===''?null:Number(f.max_discount),
      expires_at: f.expires ? new Date(f.expires+'T23:59:59+05:30').toISOString() : null,
      usage_limit: f.usage_limit===''?null:Number(f.usage_limit),
      per_customer: Math.max(1, Number(f.per_customer)||1),
      description: f.description.trim() || null,
    });
    setSaving(false);
    if(error){ showToast(error.code==='23505' ? 'That code already exists' : 'Could not create coupon','⚠️'); return; }
    setF(blank); load(); showToast('Coupon created','🏷️');
  };
  const toggle = async (c)=>{ const {error} = await sbAdmin.from('coupons').update({active:!c.active}).eq('code', c.code); if(error){ showToast('Could not update','⚠️'); return; } load(); };
  const remove = async (c)=>{ if(!window.confirm('Delete coupon '+c.code+'?')) return; const {error} = await sbAdmin.from('coupons').delete().eq('code', c.code); if(error){ showToast('Could not delete','⚠️'); return; } load(); };
  const inp = "w-full mt-1 border border-[var(--line)] bg-transparent rounded-lg px-3 py-2 text-sm focus-ring";
  return (
    <div className="card p-5 mt-5">
      <div className="font-bold text-sm">🏷️ Coupon codes</div>
      <div className="text-xs text-[var(--muted)] mt-0.5 mb-3">Customers type a code in their cart. Discounts are checked on the server.</div>
      <div className="grid grid-cols-2 gap-3">
        <div><label className="text-xs font-semibold text-[var(--muted)]">Code</label><input value={f.code} onChange={e=>upd('code',e.target.value.toUpperCase())} maxLength={20} placeholder="WELCOME10" className={inp} /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Type</label>
          <select value={f.kind} onChange={e=>upd('kind',e.target.value)} className={inp}><option value="percent">Percent off</option><option value="flat">Flat ₹ off</option></select></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">{f.kind==='percent'?'Percent (%)':'Amount (₹)'}</label><input type="number" min="0" value={f.value} onChange={e=>upd('value',e.target.value)} className={inp} /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Min. order (₹)</label><input type="number" min="0" value={f.min_order} onChange={e=>upd('min_order',e.target.value)} placeholder="0" className={inp} /></div>
        {f.kind==='percent' && <div><label className="text-xs font-semibold text-[var(--muted)]">Max discount (₹)</label><input type="number" min="0" value={f.max_discount} onChange={e=>upd('max_discount',e.target.value)} placeholder="no cap" className={inp} /></div>}
        <div><label className="text-xs font-semibold text-[var(--muted)]">Expires on</label><input type="date" value={f.expires} onChange={e=>upd('expires',e.target.value)} className={inp} /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Total uses</label><input type="number" min="1" value={f.usage_limit} onChange={e=>upd('usage_limit',e.target.value)} placeholder="unlimited" className={inp} /></div>
        <div><label className="text-xs font-semibold text-[var(--muted)]">Uses per customer</label><input type="number" min="1" value={f.per_customer} onChange={e=>upd('per_customer',e.target.value)} className={inp} /></div>
        <div className="col-span-2"><label className="text-xs font-semibold text-[var(--muted)]">Message shown when applied (optional)</label><input value={f.description} onChange={e=>upd('description',e.target.value)} maxLength={60} placeholder="Welcome offer applied" className={inp} /></div>
      </div>
      <button onClick={create} disabled={saving} className="btn-primary w-full py-2.5 mt-3 text-sm focus-ring">{saving?'Creating…':'Create coupon'}</button>
      <div className="mt-4 space-y-2">
        {list===null ? <div className="text-xs text-[var(--muted)]">Loading…</div> : list.length===0 ? <div className="text-xs text-[var(--muted)]">No coupons yet.</div> : list.map(c=> {
          const expired = c.expires_at && new Date(c.expires_at) < new Date();
          return (
            <div key={c.code} className="flex items-center gap-3 p-2.5 rounded-xl bg-[var(--purple-light)]">
              <div className="flex-1 min-w-0">
                <div className="text-sm font-bold break-all">{c.code} <span className="font-normal text-[var(--muted)]">· {c.kind==='percent'?c.value+'% off':inr(c.value)+' off'}</span></div>
                <div className="text-[11px] text-[var(--muted)]">Used {c.used_count}{c.usage_limit?'/'+c.usage_limit:''} · {c.min_order>0?'min '+inr(c.min_order)+' · ':''}{c.expires_at?(expired?'expired ':'until ')+new Date(c.expires_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'no expiry'}</div>
              </div>
              <MiniSwitch on={c.active} onChange={()=>toggle(c)} label={'Enable '+c.code} />
              <button onClick={()=>remove(c)} aria-label={'Delete '+c.code} className="text-[var(--danger)] focus-ring flex-shrink-0">🗑️</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    sbAdmin.auth.getSession().then(({data})=> setAdminSession(data.session));
    const { data: sub } = sbAdmin.auth.onAuthStateChange((_event, sess)=> setAdminSession(sess));
    return ()=> sub.subscription.unsubscribe();
  },[]);

  if(adminSession===undefined){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center">
        <LogoBlock />
        <div className="text-xs text-[var(--muted)] mt-4">Loading…</div>
      </div>
    );
  }
  const isOwner = adminSession && adminSession.user.id === SHOP_OWNER_ID;
  if(!isOwner) return <AdminLogin onSuccess={()=>{}} />;
  return <AdminShell route={route} onExit={async ()=>{ await sbAdmin.auth.signOut(); navigate('#/home'); }} />;
}

function PageRouter({route}){
  const parts = route.parts;
  const top = parts[0] || 'home';
  let page;
  const { loggedIn } = useApp();
  if(!loggedIn){
    const gated = { checkout:'checkout', 'order-confirmation':'your order', orders:'your orders', account:'your account', rewards:'your rewards' };
    if(gated[top]) return <GuestGate what={gated[top]} />;
  }
  switch(top){
    case 'home': page = <HomePage />; break;
    case 'category': page = <CategoryPage route={route} />; break;
    case 'product': page = <ProductPage route={route} />; break;
    case 'cart': page = <CartPage />; break;
    case 'checkout':
      if(parts[1]==='payment') page = <CheckoutPaymentPage />;
      else if(parts[1]==='confirm') page = <CheckoutConfirmPage />;
      else page = <CheckoutAddressPage />;
      break;
    case 'order-confirmation': page = <OrderConfirmationPage route={route} />; break;
    case 'orders':
      page = parts[1] ? <OrderDetailPage route={route} /> : <OrdersPage />;
      break;
    case 'search': page = <SearchPage />; break;
    case 'wishlist': page = <WishlistPage />; break;
    case 'account': page = <AccountPage />; break;
    case 'rewards': page = <RewardsPage />; break;
    default: page = <HomePage />;
  }
  return <div key={parts.join('/')} className="page-transition">{page}</div>;
}

function friendlyAuthError(err){
  const m = String((err && err.message) || err || '');
  if(/rate limit|too many|seconds/i.test(m)) return 'Too many tries — please wait a minute and try again.';
  if(/invalid.*(token|otp|code)|expired/i.test(m)) return 'That code is wrong or has expired. Check it and try again, or ask for a new one.';
  if(/phone.*provider|sms/i.test(m)) return "Mobile verification isn't switched on yet. Please use your email.";
  if(/signups? not allowed/i.test(m)) return 'New sign-ups are switched off right now. Please contact the shop.';
  return m || 'Something went wrong. Please try again.';
}

function AuthSheet(){
  const { authSheet, closeAuthSheet, openAuthScreen, sendEmailCode, verifyEmailCode, sendPhoneCode, verifyPhoneCode, loggedIn, showToast } = useApp();
  const [via, setVia] = useState('email');
  const [step, setStep] = useState('start');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [wait, setWait] = useState(0);

  useEffect(()=>{ if(authSheet.open){ setStep('start'); setCode(''); setErr(''); setBusy(false); } },[authSheet.open]);
  useEffect(()=>{ if(wait<=0) return; const t = setTimeout(()=> setWait(w=>w-1), 1000); return ()=> clearTimeout(t); },[wait]);
  if(!authSheet.open || loggedIn) return null;

  const why = {
    cart: ['🛒','Sign in to add to your cart','Create a free account (it takes a minute) so your cart is saved and you can check out.'],
    wishlist: ['💜','Sign in to save to your wishlist','Create a free account so your wishlist is always with you, on any phone.'],
    notify: ['🔔',"Sign in to get notified","We'll tell you the moment this item is back in stock."],
  }[authSheet.reason] || ['👋','Sign in to continue','Create a free account or log in.'];

  const target = via==='email' ? email.trim() : phone;
  const valid = via==='email' ? /^\S+@\S+\.\S+$/.test(email.trim()) : /^\d{10}$/.test(phone);

  const send = async ()=>{
    if(!valid){ setErr(via==='email' ? 'Enter a valid email address.' : 'Enter a valid 10-digit mobile number.'); return; }
    setBusy(true); setErr('');
    const { error } = await (via==='email' ? sendEmailCode(target) : sendPhoneCode(target));
    setBusy(false);
    if(error){ setErr(friendlyAuthError(error)); return; }
    setStep('code'); setWait(45); setCode('');
  };
  const verify = async ()=>{
    if(code.trim().length<4){ setErr('Enter the code from your '+(via==='email'?'email':'SMS')+'.'); return; }
    setBusy(true); setErr('');
    const { error } = await (via==='email' ? verifyEmailCode(target, code.trim()) : verifyPhoneCode(target, code.trim()));
    setBusy(false);
    if(error){ setErr(friendlyAuthError(error)); return; }
    showToast('Verified ✅');
  };

  return (
    <SheetShell onClose={closeAuthSheet} label="Sign in">
      <div className="flex items-start gap-3">
        <span className="w-11 h-11 rounded-2xl bg-[var(--purple-light)] flex items-center justify-center text-xl flex-shrink-0">{why[0]}</span>
        <div className="flex-1 min-w-0">
          <h3 className="font-display font-bold text-lg leading-tight">{step==='start' ? why[1] : 'Enter the code'}</h3>
          <p className="text-xs text-[var(--muted)] mt-1">{step==='start' ? why[2] : (via==='email' ? <>We sent a code to <b>{target}</b>. It can take a minute to arrive — check spam too.</> : <>We sent an SMS to <b>+91 {target}</b>.</>)}</p>
        </div>
        <button onClick={closeAuthSheet} aria-label="Close" className="w-8 h-8 rounded-full hover:bg-black/5 flex items-center justify-center focus-ring"><Icon.Close /></button>
      </div>

      {step==='start' ? (
        <div className="mt-4 space-y-3">
          <GoogleButton onError={setErr} />
          <OrDivider />
          {PHONE_AUTH_ENABLED && (
            <div className="flex gap-1 p-1 rounded-xl bg-gray-100 text-sm font-semibold">
              {[['email','Email'],['phone','Mobile']].map(([k,l])=> <button key={k} onClick={()=>{ setVia(k); setErr(''); }} className={"flex-1 py-1.5 rounded-lg focus-ring "+(via===k?'bg-white shadow text-[var(--purple)]':'text-[var(--muted)]')}>{l}</button>)}
            </div>
          )}
          {via==='email'
            ? <AuthInput icon="✉️" type="email" autoComplete="email" inputMode="email" placeholder="Your email address" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') send(); }} />
            : <AuthInput icon="📱" type="tel" autoComplete="tel-national" inputMode="numeric" placeholder="10-digit mobile number" value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,'').slice(0,10))} onKeyDown={e=>{ if(e.key==='Enter') send(); }} />}
          {err && <div className="text-xs text-[var(--danger)] font-semibold bg-red-50 rounded-lg px-3 py-2">{err}</div>}
          <button onClick={send} disabled={busy} className="btn-primary w-full py-3 text-sm focus-ring">{busy ? 'Sending…' : 'Send me a code'}</button>
          <div className="text-center text-xs text-[var(--muted)]">We'll verify it's you, then you pick a password. No spam, ever.</div>
          <button onClick={openAuthScreen} className="block mx-auto text-sm font-bold text-[var(--purple)] focus-ring">Already have a password? Log in</button>
        </div>
      ) : (
        <div className="mt-4 space-y-3">
          <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,'').slice(0,8))} onKeyDown={e=>{ if(e.key==='Enter') verify(); }} inputMode="numeric" autoComplete="one-time-code" placeholder="••••••" autoFocus
            className="w-full text-center tracking-[0.5em] text-2xl font-bold border border-[var(--line)] rounded-xl py-3 focus-ring bg-[#FBFAFE]" />
          {err && <div className="text-xs text-[var(--danger)] font-semibold bg-red-50 rounded-lg px-3 py-2">{err}</div>}
          <button onClick={verify} disabled={busy} className="btn-primary w-full py-3 text-sm focus-ring">{busy ? 'Checking…' : 'Verify & continue'}</button>
          <div className="flex items-center justify-between text-xs">
            <button onClick={()=>{ setStep('start'); setErr(''); }} className="font-semibold text-[var(--muted)] focus-ring">← Change {via==='email'?'email':'number'}</button>
            <button onClick={send} disabled={wait>0||busy} className="font-bold text-[var(--purple)] disabled:text-gray-400 focus-ring">{wait>0 ? 'Resend in '+wait+'s' : 'Resend code'}</button>
          </div>
        </div>
      )}
    </SheetShell>
  );
}

        <button onClick={()=>setSetupHidden(true)} className="block mx-auto text-xs font-semibold text-[var(--muted)] focus-ring">Do this later</button>
      </div>

  );

function LoggedOutScreen(){
  const { signIn, showToast, skipAuth, sendEmailCode, verifyEmailCode, sendPasswordReset, verifyResetCode } = useApp();
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup' | 'forgot' | 'code-signup' | 'code-reset'
  const [code, setCode] = useState('');
  const [form, setForm] = useState({ email:'', password:'', fullName:'', phone:'', username:'' });
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const update = (k,v)=> setForm(prev=>({...prev,[k]:v}));

  const friendly = (err)=> friendlyAuthError(err);
  const submit = async (e)=>{
    e.preventDefault();
    setError('');
    const email = form.email.trim();
    if(mode==='code-signup' || mode==='code-reset'){
      if(code.trim().length<4){ setError('Enter the code from your email.'); return; }
      setSubmitting(true);
      const { error: err } = await (mode==='code-reset' ? verifyResetCode(email, code.trim()) : verifyEmailCode(email, code.trim()));
      setSubmitting(false);
      if(err){ setError(friendly(err)); return; }
      showToast(mode==='code-reset' ? 'Verified — choose a new password' : 'Verified ✅');
      return;
    }
    if(mode==='forgot' || mode==='signup'){
      if(!/^\S+@\S+\.\S+$/.test(email)){ setError(mode==='forgot' ? 'Enter the email you signed up with.' : 'Enter a valid email address.'); return; }
      setSubmitting(true);
      const { error: err } = await (mode==='forgot' ? sendPasswordReset(email) : sendEmailCode(email));
      setSubmitting(false);
      if(err){ setError(/signups? not allowed|not found/i.test(err.message||'') && mode==='forgot' ? "We couldn't find an account with that email." : friendly(err)); return; }
      setCode(''); setMode(mode==='forgot' ? 'code-reset' : 'code-signup'); return;
    }
    if(!email || !form.password){ setError('Email and password are required.'); return; }
    setSubmitting(true);
    const { error: err } = await signIn({ email, password: form.password });
    setSubmitting(false);
    if(err){ setError(err.message); return; }
    showToast('Welcome back! 👋','✨');
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 py-10 text-center fade-in relative">
      <AuthShellBackground />
      <div className="mb-6">
        <img src={MERAKI_LOGO_DATA_URI} alt="Meraki Stationery & Toys" className="w-28 h-28 mx-auto rounded-3xl shadow-lg pop" />
      </div>

      <div className="card w-full max-w-sm p-7 shadow-xl text-left rise-in">
        {(mode==='signin' || mode==='signup') && (
          <div className="flex gap-1 p-1 rounded-xl bg-gray-100 text-sm font-semibold mb-4">
            {[['signin','Log in'],['signup','Create account']].map(([k,l])=> <button key={k} type="button" onClick={()=>{ setMode(k); setError(''); }} className={"flex-1 py-2 rounded-lg focus-ring "+(mode===k?'bg-white shadow text-[var(--purple)]':'text-[var(--muted)]')}>{l}</button>)}
          </div>
        )}
        <h1 className="font-display font-bold text-xl text-center">{mode==='signin' ? 'Welcome back! 👋' : mode==='forgot' ? 'Forgot your password? 🔑' : mode==='signup' ? 'Create your account ✨' : 'Enter the code 📬'}</h1>
        <p className="text-sm text-[var(--muted)] mt-1 text-center">{mode==='signin' ? 'Log in to shop, track orders and manage your wishlist.' : mode==='forgot' ? "Enter your email and we'll send you a code to set a new password." : mode==='signup' ? "Enter your email — we'll send a code to verify it, then you choose a password." : <>We sent a 6-digit code to <b>{form.email}</b>. It can take a minute — check spam too.</>}</p>

        <form onSubmit={submit} className="mt-6 space-y-3">
          {(mode==='code-signup' || mode==='code-reset') ? (
            <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,'').slice(0,8))} inputMode="numeric" autoComplete="one-time-code" placeholder="••••••" autoFocus
              className="w-full text-center tracking-[0.5em] text-2xl font-bold border border-[var(--line)] rounded-xl py-3 focus-ring bg-[#FBFAFE]" />
          ) : (
            <div>
              <label className="text-xs font-semibold text-[var(--muted)]">Email</label>
              <div className="mt-1"><AuthInput icon="✉️" type="email" autoComplete="email" value={form.email} onChange={e=>update('email',e.target.value)} /></div>
            </div>
          )}
          {mode==='signin' && (
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Password</label>
            <div className="mt-1"><AuthInput icon="🔒" type="password" autoComplete="current-password" value={form.password} onChange={e=>update('password',e.target.value)} /></div>
            <button type="button" onClick={()=>{ setMode('forgot'); setError(''); }} className="text-xs font-bold text-[var(--purple)] mt-2 focus-ring">Forgot password?</button>
          </div>
          )}
          {error && <div className="text-xs text-[var(--danger)] font-semibold bg-red-50 rounded-lg px-3 py-2">{error}</div>}
          <button type="submit" disabled={submitting} className="btn-primary w-full py-3 text-sm focus-ring mt-1">
            {submitting ? 'Please wait…' : (mode==='signin' ? 'Log In' : (mode==='forgot' || mode==='signup') ? 'Send me a code' : 'Verify & continue')}
          </button>
        </form>

        {(mode==='signin' || mode==='signup') && (
          <div className="mt-4 space-y-3"><OrDivider /><GoogleButton onError={setError} /></div>
        )}
        {(mode==='code-signup' || mode==='code-reset') && <button onClick={()=>{ setMode(mode==='code-reset'?'forgot':'signup'); setError(''); }} className="text-sm font-bold text-[var(--purple)] mt-5 focus-ring block mx-auto">← Change email</button>}
        {mode==='forgot' && <button onClick={()=>{ setMode('signin'); setError(''); }} className="text-sm font-bold text-[var(--purple)] mt-5 focus-ring block mx-auto">← Back to Log In</button>}
      </div>
      <button onClick={skipAuth} className="mt-5 text-sm font-bold text-[var(--purple)] focus-ring px-6 py-2.5 rounded-full border border-[var(--purple)]/30 bg-white/70">Skip for now — just browse</button>

      <div className="text-[11px] text-[var(--muted)] mt-6">✨ Everything they need, delivered with care.</div>
    </div>
  );
}

/* ===== MERAKI COUNTER BOT ENGINE (pure functions, no React) ===== */
const MerakiBot = (function(){
  const STOP = new Set(('a an the is are was am be been of in on at to for from by with and or but if so as it its this that these those '+
    'i me my mine we our you your ur u he she they them any some all kuch koi sab '+
    'do does did can could would should will shall may might please plz pls kindly '+
    'show tell give get find search see look looking want wanna need needed have has had there here '+
    'what which who whom whose how much many when where why '+
    'price prices cost costs rate rates pricing mrp worth '+
    'available availability stock stocks instock item items product products thing things shop store dukaan '+
    'hai hain h ha kya ka ke ki ko me mein mai mujhe humein hume chahiye chahie dikhao dikha dikhaiye batao bata bataiye do dena dedo de '+
    'aur ye yeh wo woh kitna kitne kitni kimat dam na to bhi hi se par pe wala wali wale '+
    'ok okay yes no also too just only really very more another other one ones some thanks '+
    'under below above over less than upto up within around about between max maximum min minimum atleast least budget rs rupee rupees inr '+
    'cheap cheapest cheaper costly costliest expensive sasta sasti mehnga best top good nice popular '+
    'milega milenge milegi milti milta milte hoga hogi mil jayega sakta sakte sakti kaise kaisa suggest suggestion recommend recommendation something anything ideas idea options option stuff sell sells selling like likes near new latest').split(/\s+/));

  const SYN = { copy:'notebook', copies:'notebook', kitab:'book', kitaab:'book', rubber:'eraser', colors:'colour', color:'colour', colours:'colour',
    tiffin:'lunch', sharpner:'sharpener', pencile:'pencil', geomatry:'geometry', toy:'toy', toys:'toy', dolls:'doll', teddybear:'teddy',
    chocolates:'chocolate', choclate:'chocolate', chocolet:'chocolate', cadbury:'cadbury', skates:'skate', sketchpen:'sketch', marker:'marker',
    pencils:'pencil', pens:'pen', bag:'bag', bags:'bag', glue:'glue', gum:'glue', fevicol:'fevicol', crayons:'crayon', crayon:'crayon', waterbottle:'bottle',
    ball:'ball', balls:'ball', games:'game', puzzles:'puzzle', diaries:'diary', registers:'register' };

  const stem = t => {
    if(t.length>4 && t.endsWith('ies')) return t.slice(0,-3)+'y';
    if(t.length>4 && /(ch|sh|x|s)es$/.test(t)) return t.slice(0,-2);
    if(t.length>3 && t.endsWith('s') && !t.endsWith('ss')) return t.slice(0,-1);
    return t;
  };
  const norm = s => String(s||'').toLowerCase().replace(/₹/g,' rs ').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  const tokenize = s => norm(s).split(' ').filter(Boolean);
  const canon = t => stem(SYN[t] || t);

  function edit(a,b,max){
    if(Math.abs(a.length-b.length)>max) return max+1;
    const dp = Array.from({length:a.length+1},(_,i)=>[i]);
    for(let j=1;j<=b.length;j++) dp[0][j]=j;
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    }
    return dp[a.length][b.length];
  }

  /* ---------- product index ---------- */
  const indexCache = new WeakMap();
  function buildIndex(products){
    if(indexCache.has(products)) return indexCache.get(products);
    const idx = products.map(p=>({
      p,
      name: new Set(tokenize(p.name).map(canon)),
      brand: new Set(tokenize(p.brand && p.brand!=='Generic' ? p.brand : '').map(canon)),
      cat: new Set(tokenize((p.categoryLabel||'')+' '+(p.subcategory||'')).map(canon)),
      desc: new Set(tokenize(p.desc||'').map(canon)),
      lname: norm(p.name),
    }));
    indexCache.set(products, idx);
    return idx;
  }
  function matchSet(q, set){
    if(set.has(q)) return 1;
    if(q.length<4) return 0;
    let best = 0;
    for(const d of set){
      if(d.length>=q.length && d.startsWith(q) && d.length-q.length<=3){ best = Math.max(best, 0.85); continue; }
      if(q.length>=5){
        const e = edit(q,d, q.length>=8?2:1);
        if(e<= (q.length>=8?2:1)) best = Math.max(best, e===1?0.7:0.6);
      }
    }
    return best;
  }
  function scoreDoc(d, qTokens){
    let total = 0, matched = 0;
    for(const q of qTokens){
      const m = Math.max(matchSet(q,d.name)*3, matchSet(q,d.brand)*2.5, matchSet(q,d.cat)*2, matchSet(q,d.desc)*0.8);
      if(m>0){ matched++; total+=m; }
    }
    return {total, matched};
  }

  /* ---------- parsing helpers ---------- */
  function parseBudget(raw){
    let t = String(raw).toLowerCase().replace(/₹/g,' rs ').replace(/,/g,'');
    let min=null, max=null, m;
    const take = re => { const r = re.exec(t); if(r){ t = t.replace(r[0],' '); } return r; };
    if((m = take(/(?:between|from)\s*(?:rs\.?\s*)?(\d+)\s*(?:rs\.?|rupees?)?\s*(?:and|to|-)\s*(?:rs\.?\s*)?(\d+)/))){ min=+m[1]; max=+m[2]; if(min>max)[min,max]=[max,min]; }
    else if((m = take(/\b(\d+)\s*(?:-|to)\s*(\d+)\s*(?:rs|rupees?)?\b/)) && +m[2]>=+m[1]){ min=+m[1]; max=+m[2]; }
    else if((m = take(/(?:under|below|less than|upto|up to|within|max(?:imum)?|budget(?: of| is)?|not more than|cheaper than|<)\s*(?:rs\.?|inr)?\s*(\d+)/))) max=+m[1];
    else if((m = take(/\b(\d+)\s*(?:rs\.?|rupees?|inr)?\s*(?:se kam|se km|ke andar|ke ander|tak|or less|and below|or below|max)\b/))) max=+m[1];
    else if((m = take(/(?:above|over|more than|at ?least|min(?:imum)?|from|>)\s*(?:rs\.?|inr)?\s*(\d+)/))) min=+m[1];
    else if((m = take(/\b(\d+)\s*(?:rs\.?|rupees?|inr)?\s*(?:se zyada|se jyada|se upar|or more|and above|or above|plus|\+)/))) min=+m[1];
    else if((m = take(/(?:around|about|approx(?:imately)?|near|roughly)\s*(?:rs\.?|inr)?\s*(\d+)/))){ const v=+m[1]; min=Math.round(v*0.75); max=Math.round(v*1.25); }
    else if((m = take(/(?:\brs\.?|\binr)\s*(\d+)|\b(\d+)\s*(?:rs\.?|rupees?|inr)\b/))){ max = +(m[1]||m[2]); }
    return {min, max, rest:t};
  }

  function currentIST(now){
    const d = now || new Date();
    const parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(d);
    const g = k => parts.find(p=>p.type===k).value;
    return { day: g('weekday'), mins: (parseInt(g('hour'),10)%24)*60 + parseInt(g('minute'),10) };
  }
  function parseHours(str){
    const m = /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s*[–—-]\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i.exec(str||'');
    if(!m) return null;
    const cv = (h,mi,ap)=>{ h=parseInt(h,10)%12; if(/pm/i.test(ap)) h+=12; return h*60+(mi?parseInt(mi,10):0); };
    return { open: cv(m[1],m[2],m[3]), close: cv(m[4],m[5],m[6]) };
  }
  const fmtMin = m => { const h=Math.floor(m/60), mi=m%60, ap=h>=12?'PM':'AM'; const h12=h%12||12; return h12+':'+String(mi).padStart(2,'0')+' '+ap; };
  const inr = n => '₹'+Number(n).toLocaleString('en-IN');

  /* ---------- product search ---------- */
  function searchProducts(products, queryText, opts){
    opts = opts||{};
    const b = opts.budget || parseBudget(queryText);
    const qTokens = tokenize(b.rest||queryText).filter(t=>!STOP.has(t)).map(canon).filter(t=>t && !STOP.has(t));
    const idx = buildIndex(products);
    for(let i=qTokens.length-1;i>=0;i--){ if(/^\d{1,2}$/.test(qTokens[i]) && !idx.some(d=>d.name.has(qTokens[i]))) qTokens.splice(i,1); }
    let pool = idx;
    if(b.min!=null) pool = pool.filter(d=>d.p.price>=b.min);
    if(b.max!=null) pool = pool.filter(d=>d.p.price<=b.max);
    if(opts.excludeIds) pool = pool.filter(d=>!opts.excludeIds.includes(d.p.id));
    if(opts.onlyCats) pool = pool.filter(d=> opts.onlyCats.includes(d.p.categoryLabel));
    let exact = [], partial = [];
    if(qTokens.length){
      const phrase = norm((b.rest||queryText)).replace(/\b(show|me|do|you|have|any|a|the)\b/g,' ').replace(/\s+/g,' ').trim();
      for(const d of pool){
        const s = scoreDoc(d,qTokens);
        if(!s.matched) continue;
        let score = s.total + (phrase.length>2 && d.lname.includes(phrase) ? 4 : 0);
        const row = {p:d.p, score};
        if(s.matched===qTokens.length) exact.push(row);
        else if(s.matched/qTokens.length>=0.5 && qTokens.length>=2) partial.push(row);
      }
    } else {
      exact = pool.map(d=>({p:d.p, score:0}));
    }
    const sortFn = (x,y)=>{
      const xs = x.p.stock>0?1:0, ys = y.p.stock>0?1:0;
      if(xs!==ys) return ys-xs;
      if(opts.sort==='asc') return x.p.price-y.p.price || y.score-x.score;
      if(opts.sort==='desc') return y.p.price-x.p.price || y.score-x.score;
      if(y.score!==x.score) return y.score-x.score;
      const xf = x.p.tags && x.p.tags.includes('bestseller')?1:0, yf = y.p.tags && y.p.tags.includes('bestseller')?1:0;
      if(xf!==yf) return yf-xf;
      return x.p.name.length-y.p.name.length;
    };
    exact.sort(sortFn); partial.sort(sortFn);
    return { exact:exact.map(r=>r.p), partial:partial.map(r=>r.p), qTokens, budget:b };
  }

  /* ---------- reply building ---------- */
  const R = (text, extra) => Object.assign({text, products:[], chips:null, link:null, add:null, memory:null}, extra||{});
  const SHOW = 5;
  function budgetLabel(b){
    if(b.min!=null && b.max!=null) return inr(b.min)+'–'+inr(b.max);
    if(b.max!=null) return 'under '+inr(b.max);
    if(b.min!=null) return 'above '+inr(b.min);
    return '';
  }
  function stockNote(p){ return p.stock<=0 ? 'out of stock right now' : p.stock<=3 ? 'only '+p.stock+' left' : 'in stock'; }

  function categoryForTokens(qTokens, categories){
    if(!qTokens.length) return null;
    for(const c of categories){
      const ct = tokenize(c.name).map(canon).filter(t=>!STOP.has(t));
      if(ct.length && qTokens.length===ct.length && ct.every(t=>qTokens.includes(t))) return c;
    }
    return null;
  }

  function reply(text, ctx){
    const raw = String(text||'').trim();
    const t = norm(raw);
    const mem = ctx.memory || {};
    const products = ctx.products || [];
    const s = ctx.storeSettings || {};
    const cfg = ctx.cfg || {};
    const first = ctx.firstName ? ctx.firstName : '';
    const has = re => re.test(t);
    const phone = s.phone || '';

    // --- social ---
    const words = t.split(' ');
    if(/^(hi+|hello+|hey+|hola|namaste|namaskar|hlo|helo|good (morning|afternoon|evening))\b/.test(t) && words.length<=4){
      return R(`Hi${first?' '+first:''}! 👋 I'm the Meraki counter assistant. Ask me about products, prices, stock, delivery or shop timings.`, {chips:['Pens under ₹50','Gift ideas','Shop timings','Delivery charges']});
    }
    if(has(/^(thanks|thank you|thx|ty|shukriya|dhanyavad|ok thanks|okay thanks|great thanks)\b/)) return R("You're welcome! 😊 Anything else you'd like to look for?", {chips:['Show deals','Shop timings']});
    if(has(/^(bye|goodbye|see you|tata|ok bye|alvida)\b/)) return R('Bye! Come back anytime 💜');
    if(has(/\b(who are you|what can you do|what do you do|help me|help|kya kar sakte|how does this work)\b/) && words.length<=6){
      return R("I'm a virtual counter assistant for this shop. I can:\n• Find products and tell you the price & stock\n• Search by budget — e.g. “notebooks under ₹100”\n• Add things to your cart\n• Tell you about delivery, payments, timings & address\n• Check your orders and reward balance", {chips:['Pens under ₹50','Toys for gifting','Where is the shop?','My orders']});
    }

    // --- follow-ups using memory ---
    if(has(/^(show )?(more|aur|next|aur dikhao|more options|anything else|something else|others?)$/) && mem.lastSearch){
      const ls = mem.lastSearch;
      const r = searchProducts(products, ls.text, {excludeIds: ls.shown, sort: ls.sort, onlyCats: ls.onlyCats, budget: ls.budget});
      const list = r.exact.slice(0,SHOW);
      if(!list.length) return R("That's everything I have for that search. Want to try something different?", {chips:['Pens under ₹50','Gift ideas']});
      return R('Here are some more:', {products:list, memory:{...mem, lastSearch:{...ls, shown:[...ls.shown, ...list.map(p=>p.id)]}, lastProducts:list.map(p=>p.id)}});
    }
    if(has(/\b(cheaper|sasta|sasti|lower price|less expensive|kam price|kam dam)\b/) && words.length<=6 && mem.lastSearch){
      const ls = mem.lastSearch;
      const shownP = (mem.lastProducts||[]).map(id=>ctx.productMap[id]).filter(Boolean);
      const cap = shownP.length ? Math.min(...shownP.map(p=>p.price))-1 : (ls.budget.max||0);
      const nb = {min:ls.budget.min, max:cap, rest:ls.budget.rest};
      const r = searchProducts(products, ls.text, {budget:nb, sort:'desc', onlyCats:ls.onlyCats});
      const list = r.exact.filter(p=>p.stock>0).slice(0,SHOW);
      if(!list.length) return R("That's already the lowest price I have for that. 👍");
      return R(`Cheaper options (under ${inr(cap+1)}):`, {products:list, memory:{...mem, lastSearch:{...ls, budget:nb, shown:list.map(p=>p.id)}, lastProducts:list.map(p=>p.id)}});
    }

    // --- shop info ---
    if(has(/\b(deliver|delivery|shipping|courier|ghar pe|home delivery)\b/)){
      const thr = cfg.freeDeliveryThreshold, dc = cfg.deliveryCharge, pc = cfg.packagingCharge;
      return R(`🚚 Home delivery is ${inr(dc)}, and it's free on orders of ${inr(thr)} or more. There's also a ${inr(pc)} packaging charge. Most Jaipur orders arrive within 2–4 hours. You can also choose Store Pickup at checkout (ready in about 2 hours).`, {chips:['Payment methods','Shop timings','Where is the shop?']});
    }
    if(has(/\b(track|tracking|status|where is my|my orders?|mera order|last order|recent order|order history|parcel)\b/) || has(/^orders?$/)){
      const orders = ctx.orders || [];
      if(!ctx.loggedIn) return R('Please sign in to see your orders.');
      if(!orders.length) return R("You haven't placed any orders yet. Want me to help you find something?", {chips:['Pens under ₹50','Gift ideas']});
      const o = orders[0];
      const names = o.items.slice(0,3).map(i=>i.name+(i.qty>1?' ×'+i.qty:'')).join(', ') + (o.items.length>3?' +'+(o.items.length-3)+' more':'');
      return R(`Your latest order ${o.shortId} is **${o.status}** (${inr(o.total)})${names?'\nItems: '+names:''}.${orders.length>1?`\nYou have ${orders.length} orders in total.`:''}`, {link:{label:'Open my orders', href:'#/orders'}});
    }
    if(has(/\b(reward|rewards|points|loyalty|cashback|wallet)\b/)){
      if(!ctx.loggedIn) return R('Sign in to see your rewards.');
      return R(`💜 Your reward balance is **${inr(ctx.rewardBalance||0)}**. You earn 2% of every order's value once it's delivered, and you can use it at checkout.`, {link:{label:'View rewards', href:'#/rewards'}});
    }
    if(has(/\b(open|opens|opening|close|closes|closing|timing|timings|hours|khula|khulta|khulti|band|kab tak|kab khulta)\b/) && !has(/\b(order|delivery)\b/)){
      const wk = parseHours(s.hoursWeekday), sn = parseHours(s.hoursSunday);
      let status = '';
      if(wk && sn){
        const n = currentIST(ctx.now), h = n.day==='Sun' ? sn : wk;
        const isOpen = n.mins>=h.open && n.mins<h.close;
        status = isOpen ? `\n🟢 We're open right now — closing at ${fmtMin(h.close)}.` : `\n🔴 We're closed right now.`;
      }
      return R(`🕐 Mon–Sat: ${s.hoursWeekday}\nSunday: ${s.hoursSunday}${status}`, {chips:['Where is the shop?','Delivery charges']});
    }
    if(has(/\b(address|location|located|kahan|kaha|directions?|map|how to reach|visit)\b/) || has(/\bwhere\b.*\b(shop|store|you|located)\b/)){
      const addr = [s.addressLine, s.area, s.city].filter(Boolean).join(', ') + (s.pincode?' — '+s.pincode:'');
      return R(`📍 ${s.storeName||'Meraki'}\n${addr}`, {link:{label:'Open in Maps', href:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((s.storeName||'Meraki')+' '+addr)}, chips:['Shop timings','Contact number']});
    }
    if(has(/\b(phone|call|contact|number|whatsapp|email|mail)\b/) && !has(/\b(order|price)\b/)){
      return R(`📞 You can call or WhatsApp us on ${phone}${s.email?'\n✉️ '+s.email:''}`, {link: phone ? {label:'Call now', href:'tel:'+phone} : null});
    }
    if(has(/\b(pay|payment|payments|upi|cod|cash on delivery|card|paytm|phonepe|gpay|google pay|net banking)\b/)){
      const labels = Object.values(cfg.paymentLabels||{});
      return R('💳 You can pay with:\n'+labels.map(l=>'• '+l).join('\n'), {chips:['Delivery charges']});
    }
    if(has(/\b(return|returns|refund|exchange|replace|replacement|wapas|damaged|broken)\b/)){
      return R(`↩️ Unused items in original packaging can be returned within 7 days of delivery, and refunds go back to your original payment method in 3–5 business days. For a damaged item, please call or WhatsApp us on ${phone} with a photo.`);
    }
    if(has(/\b(offer|offers|discount|discounts|deal|deals|coupon|promo|sale)\b/)){
      const deals = products.filter(p=>p.discount>0 && p.stock>0).sort((a,b)=>b.discount-a.discount).slice(0,SHOW);
      const extra = `Delivery is free on orders of ${inr(cfg.freeDeliveryThreshold)}+, and you earn 2% rewards on delivered orders.`;
      if(deals.length) return R('🔥 Items currently marked down:', {products:deals, memory:{...mem, lastProducts:deals.map(p=>p.id)}});
      return R(`There are no marked-down items listed right now. ${extra}`, {chips:['Delivery charges','My rewards']});
    }
    if(has(/\b(checkout|place order|place my order|pay now)\b/)){
      return R('Ready when you are 👍', {link:{label:'Go to cart', href:'#/cart'}});
    }
    if(has(/\b(cart|basket)\b/) && !has(/\b(add|put)\b/)){
      const lines = ctx.cartLines || [];
      if(!lines.length) return R('Your cart is empty. Want some suggestions?', {chips:['Pens under ₹50','Gift ideas']});
      const sub = lines.reduce((a,l)=>a+l.product.price*l.qty,0);
      const need = Math.max(0,(cfg.freeDeliveryThreshold||0)-sub);
      return R(`🛒 You have ${lines.length} item${lines.length>1?'s':''} in your cart (${inr(sub)}):\n`+lines.slice(0,6).map(l=>`• ${l.product.name} ×${l.qty}`).join('\n')+(need>0?`\nAdd ${inr(need)} more for free delivery.`:'\nYou have free delivery! 🎉'), {link:{label:'Open cart', href:'#/cart'}});
    }

    // --- add to cart ---
    const addM = /^(?:please\s+|pls\s+)?(?:add|put|buy|order|get me|i(?:'| )?ll take|i want to buy|take)\s+(.+?)(?:\s+(?:to|in|into)\s+(?:my\s+)?(?:cart|basket))?$/.exec(t);
    const wantsAdd = !!addM || has(/\b(add (it|this|that)|add to cart|cart me daal|cart mein daal|le lo|lena hai)\b/);
    if(wantsAdd){
      let target = addM ? addM[1].replace(/^(\d+)\s*(?:x\s*)?/, '') : '';
      let qty = 1; const qm = addM && /^(\d+)\s*(?:x|pcs|pieces)?\s+/.exec(addM[1]); if(qm) qty = Math.min(20, +qm[1]);
      const lastIds = mem.lastProducts || [];
      const pronoun = !target || /^(it|this|that|this one|that one|first|1st|the first( one)?|second|2nd|the second( one)?|third|3rd|the third( one)?|cheapest( one)?|last( one)?)$/.test(target.trim());
      let chosen = null;
      if(pronoun){
        const cand = lastIds.map(id=>ctx.productMap[id]).filter(Boolean);
        if(!cand.length) return R('Which product should I add? Tell me its name, or search first.');
        const tt = target.trim();
        if(/^(second|2nd|the second)/.test(tt)) chosen = cand[1]; else if(/^(third|3rd|the third)/.test(tt)) chosen = cand[2];
        else if(/^cheapest/.test(tt)) chosen = [...cand].sort((a,b)=>a.price-b.price)[0];
        else if(/^last/.test(tt)) chosen = cand[cand.length-1];
        else if(cand.length===1 || /^(first|1st|the first)/.test(tt)) chosen = cand[0];
        else return R('Which one? Say “add the first one”, “add the second”, or tell me the name.', {products:cand.slice(0,SHOW)});
        if(!chosen) return R("I couldn't tell which one you meant — please tell me the product name.");
      } else {
        const r = searchProducts(products, target);
        const list = r.exact.length ? r.exact : [];
        if(!list.length) return R(`I couldn't find “${target}” in our catalog. Try another name or browse a category.`, {chips:['Pens under ₹50','Toys for gifting']});
        const top = list.filter(p=>p.stock>0);
        const clear = top.length===1 || (top.length>1 && list[0].stock>0 && norm(list[0].name)===norm(target));
        if(!top.length) return R(`“${list[0].name}” is out of stock right now. You can tap “Notify me” on its page to get alerted when it's back.`, {products:list.slice(0,3), memory:{...mem, lastProducts:list.slice(0,3).map(p=>p.id)}});
        if(!clear) return R(`I found a few matches for “${target}” — which one should I add?`, {products:top.slice(0,SHOW), memory:{...mem, lastProducts:top.slice(0,SHOW).map(p=>p.id)}});
        chosen = top[0];
      }
      if(chosen.stock<=0) return R(`“${chosen.name}” is out of stock right now.`, {products:[chosen]});
      const inCart = ((ctx.cartLines||[]).find(l=>l.id===chosen.id)||{qty:0}).qty;
      if(inCart>=chosen.stock) return R(`You already have all ${chosen.stock} of “${chosen.name}” that we have in your cart.`, {link:{label:'Open cart', href:'#/cart'}});
      const qOk = Math.min(qty, chosen.stock-inCart);
      return R(`Added ${qOk>1?qOk+' × ':''}**${chosen.name}** (${inr(chosen.price)}) to your cart 🛒${qOk<qty?`\n(Only ${chosen.stock} in stock, so I added what's available.)`:''}`, {add:{id:chosen.id, qty:qOk}, products:[], link:{label:'Open cart', href:'#/cart'}, chips:['Show my cart','Delivery charges'], memory:{...mem, lastProducts:[chosen.id]}});
    }

    // --- product search family ---
    const b = parseBudget(raw);
    const wantsCheap = has(/\b(cheapest|lowest price|sabse sasta|sabse sasti|most affordable|budget friendly|cheap)\b/);
    const wantsPricey = has(/\b(costliest|most expensive|highest price|sabse mehnga|premium|expensive|luxury)\b/);
    const gift = has(/\b(gift|gifts|gifting|present|birthday|return gift|return gifts)\b/);
    const sort = wantsCheap ? 'asc' : wantsPricey ? 'desc' : null;
    let onlyCats = null;
    let searchText = raw;
    if(gift){
      const rest = tokenize(b.rest).filter(x=>!STOP.has(x)).map(canon).filter(x=>!['gift','gifting','present','birthday','return','boy','girl','kid','child','children','baby','year','old','yr','age','friend','for','of'].includes(x) && !/^\d+$/.test(x));
      if(!rest.length){
        onlyCats = ['Gifts','Toys','Soft Toys','Art/Craft Toys','Chocolates'].filter(c=>products.some(p=>p.categoryLabel===c));
        searchText = '';
      }
    }
    const r = searchProducts(products, searchText||'', {budget:b, sort, onlyCats});
    const catHit = !gift ? categoryForTokens(r.qTokens, ctx.categories||[]) : null;
    const generic = !r.qTokens.length;

    // recommendation without product words (e.g. "suggest something", "best sellers")
    if(generic && !b.min && !b.max && !gift && !onlyCats){
      if(has(/\b(suggest|recommend|recommendation|best|popular|trending|bestseller|bestsellers|top|new|latest|show|what do you have|what do you sell|kya milta)\b/) || words.length<=3){
        const picks = (ctx.picks && ctx.picks.length ? ctx.picks : products.filter(p=>p.tags && p.tags.includes('bestseller')&&p.stock>0)).slice(0,SHOW);
        if(!picks.length) return R('What are you looking for? Tell me a product, a category or a budget — for example “notebooks under ₹100”.', {chips:(ctx.categories||[]).slice(0,4).map(c=>c.name)});
        if(picks.length) return R(ctx.picks && ctx.picks.length ? 'Based on what you like, you might enjoy:' : 'Some of our popular picks:', {products:picks, memory:{...mem, lastProducts:picks.map(p=>p.id)}, chips:['Pens under ₹50','Gift ideas','Show deals']});
      }
    }

    if(generic && !b.min && !b.max && !onlyCats) return R('Tell me what you\'re looking for — a product name, a category, or a budget like “pens under ₹50”.', {chips:(ctx.categories||[]).slice(0,4).map(c=>c.name)});
    let list = r.exact;
    let approx = false;
    if(!list.length && r.partial.length){ list = r.partial; approx = true; }

    if(!list.length){
      const bl = budgetLabel(b);
      if(r.qTokens.length && (b.min!=null||b.max!=null)){
        const wo = searchProducts(products, searchText, {budget:{min:null,max:null,rest:b.rest}, sort:'asc'});
        if(wo.exact.length){
          const cheapest = wo.exact.find(p=>p.stock>0) || wo.exact[0];
          return R(`I don't have “${r.qTokens.join(' ')}” ${bl}. The lowest price I have is ${inr(cheapest.price)}:`, {products:[cheapest], memory:{...mem, lastProducts:[cheapest.id]}});
        }
      }
      return R(`Sorry, I couldn't find ${r.qTokens.length?'“'+r.qTokens.join(' ')+'”':'anything'}${bl?' '+bl:''} in our catalog. 😕 Try another word, or call us on ${phone} — we may be able to arrange it.`, {chips:['Pens under ₹50','Gift ideas','Shop timings']});
    }

    const priceQ = has(/\b(price|cost|rate|how much|kitna|kitne|kimat|dam|mrp|kitni)\b/);
    const stockQ = has(/\b(stock|available|availability|hai kya|milega|mil jayega|in stock)\b/);
    const shown = list.slice(0,SHOW);
    const total = list.length;
    const bl = budgetLabel(b);

    // single confident product: answer directly
    if(!approx && total===1 || (priceQ||stockQ) && !approx && total>=1 && norm(shown[0].name)===norm(r.qTokens.join(' '))){
      const p = shown[0];
      const bits = [`**${p.name}** is ${inr(p.price)}`];
      if(p.mrp>p.price) bits[0]+=` (MRP ${inr(p.mrp)}, ${p.discount}% off)`;
      return R(bits[0]+` — ${stockNote(p)}.`, {products:[p], memory:{...mem, lastProducts:[p.id], lastSearch:{text:searchText, sort, onlyCats, budget:b, shown:[p.id]}}});
    }

    const label = catHit ? catHit.name : (r.qTokens.join(' ')||'items');
    let head;
    if(approx) head = `I couldn't find an exact match for “${label}”, but these are close:`;
    else if(sort==='asc') head = `Cheapest ${label}${bl?' '+bl:''}:`;
    else if(sort==='desc') head = `Premium ${label}${bl?' '+bl:''}:`;
    else if(gift) head = `🎁 Gift ideas${bl?' '+bl:''}:`;
    else head = `Found ${total} ${total===1?'match':'matches'} for “${label}”${bl?' '+bl:''}${total>SHOW?' — showing '+SHOW+':':':'}`;
    if(!shown.some(p=>p.stock>0) && !approx) head += ' (all currently out of stock)';

    const params = ['q='+encodeURIComponent(r.qTokens.join(' '))];
    if(b.max!=null) params.push('maxPrice='+b.max);
    if(b.min!=null) params.push('minPrice='+b.min);
    let link = null;
    if(total>SHOW){
      link = catHit && b.min==null && b.max==null ? {label:'See all in '+catHit.name, href:'#/category/'+catHit.id}
        : r.qTokens.length||b.min!=null||b.max!=null ? {label:'See all '+total+' results', href:'#/search?'+(r.qTokens.length?params.join('&'):params.slice(1).join('&'))} : null;
    }
    return R(head, {products:shown, link, chips: total>SHOW ? ['Show more','Anything cheaper?'] : null,
      memory:{...mem, lastProducts:shown.map(p=>p.id), lastSearch:{text:searchText, sort, onlyCats, budget:b, shown:shown.map(p=>p.id)}}});
  }

  return { reply, searchProducts, parseBudget, tokenize, norm };
})();

// Interest signals: orders (strongest), wishlist, cart, plus product views & category visits tracked
// locally. Everything stays on the shopper's own device/account — nothing new is sent anywhere.
const INTEREST_KEY = 'meraki_interest_v1';
function readInterest(){
  try{ const o = JSON.parse(localStorage.getItem(INTEREST_KEY)||'null'); if(o && o.cat && o.brand) return o; }catch(e){}
  return {cat:{}, brand:{}};
}
function bumpInterest(catSlug, brand, catAmt, brandAmt){
  try{
    const o = readInterest();
    if(catSlug) o.cat[catSlug] = Math.min(30, (o.cat[catSlug]||0) + catAmt);
    if(brand && brand!=='Generic' && brand!=='General') o.brand[brand] = Math.min(20, (o.brand[brand]||0) + brandAmt);
    localStorage.setItem(INTEREST_KEY, JSON.stringify(o));
  }catch(e){ /* storage unavailable — personalisation just relies on orders/wishlist/cart */ }
}
function buildInterestProfile({orders, wishlist, cartLines, productMap}){
  const local = readInterest();
  const cat = {...local.cat}, brand = {...local.brand};
  const bought = {}; // id -> {count, last}
  (orders||[]).forEach(o=>{
    if(o.status==='Cancelled') return;
    (o.items||[]).forEach(it=>{
      const p = productMap[it.id];
      const w = Math.min(it.qty||1, 3);
      if(p){ cat[p.category] = (cat[p.category]||0) + 4*w; if(p.brand && p.brand!=='Generic') brand[p.brand] = (brand[p.brand]||0) + 2*w; }
      const b = bought[it.id] || {count:0, last:0};
      b.count += it.qty||1; b.last = Math.max(b.last, new Date(o.date).getTime()||0);
      bought[it.id] = b;
    });
  });
  (wishlist||[]).forEach(id=>{ const p = productMap[id]; if(p){ cat[p.category]=(cat[p.category]||0)+2; } });
  (cartLines||[]).forEach(l=>{ if(l.product){ cat[l.product.category]=(cat[l.product.category]||0)+1.5; } });
  const topCats = Object.entries(cat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return { cat, brand, bought, topCats, signal: topCats.length>0 };
}
function dailyJitter(id){
  const day = Math.floor(Date.now()/86400000);
  let h = 0; const s = id+':'+day;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
  return (h%1000)/1000;
}
function rankForProfile(products, profile){
  const maxCat = profile.topCats.length ? profile.topCats[0][1] : 1;
  return products.map(p=>{
    let s = (profile.cat[p.category]||0)/maxCat*10 + Math.min(profile.brand[p.brand]||0, 8)*0.4;
    if(p.tags && p.tags.includes('bestseller')) s += 0.6;
    if(profile.bought[p.id]) s -= 4; // already bought: "Buy it again" covers these
    s += dailyJitter(p.id)*1.2;     // gentle daily variety, stable within a day
    return {p, s};
  }).sort((a,b)=>b.s-a.s).map(x=>x.p);
}
function usePersonalisation(){
  const {orders, wishlist, cartLines, productMap, products} = useApp();
  return useMemo(()=>{
    const profile = buildInterestProfile({orders, wishlist, cartLines, productMap});
    const inStock = products.filter(p=>p.stock>0);
    const ranked = profile.signal ? rankForProfile(inStock, profile) : [];
    const buyAgain = Object.entries(profile.bought)
      .sort((a,b)=>b[1].last-a[1].last)
      .map(([id])=>productMap[id]).filter(p=>p && p.stock>0).slice(0,8);
    const labelOf = slug => { const p = products.find(x=>x.category===slug); return p ? p.categoryLabel : slug; };
    const reason = profile.topCats.slice(0,2).map(([slug])=>labelOf(slug)).join(' & ');
    return { profile, ranked, buyAgain, reason, signal: profile.signal };
  }, [orders, wishlist, cartLines, productMap, products]);
}
// Personalised feed order: mostly your interests, with every 4th slot a "discovery" pick from elsewhere.
function personalisedFeedOrder(products, ranked){
  if(!ranked.length) return shuffleArray(products);
  const rankedIds = new Set(ranked.map(p=>p.id));
  const top = ranked.slice(0, Math.ceil(ranked.length*0.6));
  const topIds = new Set(top.map(p=>p.id));
  const discover = ranked.filter(p=>!topIds.has(p.id)).sort((a,b)=>dailyJitter(a.id)-dailyJitter(b.id));
  const out = []; let ti=0, di=0;
  while(ti<top.length || di<discover.length){
    for(let k=0;k<3 && ti<top.length;k++) out.push(top[ti++]);
    if(di<discover.length) out.push(discover[di++]);
    else if(ti>=top.length) break;
  }
  const outOfStock = products.filter(p=>!rankedIds.has(p.id));
  return [...out, ...outOfStock];
}

  const reg = await registerMerakiSW();
  if(!reg) return {reg:null, sub:null};
  await navigator.serviceWorker.ready;
  return {reg, sub: await reg.pushManager.getSubscription()};
}
async function saveSubscriptionToServer(sub){
  const j = sub.toJSON();
  return sb.rpc('register_push_subscription', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:navigator.userAgent});
}
// Called before sign-out so a shared phone doesn't keep receiving the previous customer's notifications.
async function detachPushFromThisDevice(){
  try{
    if(!pushApiSupported()) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub) await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
  }catch(e){}
}

function usePushNotifications(){
  const {session, showToast} = useApp();
  const [state, setState] = useState('checking'); // checking | unsupported | ios-install | denied | off | on | nosw
  const [promos, setPromosState] = useState(true);
  const [busy, setBusy] = useState(false);

  const refresh = useCallback(async ()=>{
    if(!pushApiSupported()){ setState(isIOSDevice() && !isStandaloneApp() ? 'ios-install' : 'unsupported'); return; }
    if(isIOSDevice() && !isStandaloneApp()){ setState('ios-install'); return; }
    if(Notification.permission==='denied'){ setState('denied'); return; }
    const {reg, sub} = await getPushSubscription();
    if(!reg){ setState(Notification.permission==='granted' ? 'nosw' : 'off'); return; }
    if(sub && Notification.permission==='granted'){
      setState('on');
      if(session){
        sb.from('push_subscriptions').select('promos').eq('endpoint', sub.endpoint).maybeSingle()
          .then(({data})=>{ if(data) setPromosState(data.promos); });
      }
    } else setState('off');
  },[session]);
  useEffect(()=>{ refresh(); },[refresh]);

  const enable = useCallback(async ()=>{
    if(!session){ showToast('Please sign in first','🔔'); return false; }
    setBusy(true);
    try{
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ setState(perm==='denied'?'denied':'off'); return false; }
      const reg = await registerMerakiSW();
      if(!reg){ setState('nosw'); return false; }
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToUint8(VAPID_PUBLIC_KEY)});
      const {error} = await saveSubscriptionToServer(sub);
      if(error) throw error;
      setState('on'); setPromosState(true);
      showToast('Notifications are on','🔔');
      return true;
    }catch(e){
      showToast("Couldn't turn on notifications",'⚠️'); return false;
    }finally{ setBusy(false); }
  },[session, showToast]);

  const disable = useCallback(async ()=>{
    setBusy(true);
    try{
      const {sub} = await getPushSubscription();
      if(sub){ await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
      setState('off'); showToast('Notifications turned off','🔕');
    }catch(e){ showToast("Couldn't turn off notifications",'⚠️'); }
    finally{ setBusy(false); }
  },[showToast]);

  const setPromos = useCallback(async (v)=>{
    setPromosState(v);
    try{
      const {sub} = await getPushSubscription();
      if(sub) await sb.from('push_subscriptions').update({promos:v}).eq('endpoint', sub.endpoint);
    }catch(e){}
  },[]);

  return {state, promos, setPromos, busy, enable, disable};
}

// Invisible: registers the service worker, keeps this device's subscription attached to whoever is signed in,
// and handles taps on notifications when the app is already open.
function PushSync(){
  const {session} = useApp();
  useEffect(()=>{
    registerMerakiSW();
    if(!('serviceWorker' in navigator)) return;
    const onMsg = e=>{ if(e.data && e.data.type==='navigate' && typeof e.data.url==='string' && e.data.url.startsWith('#/')) navigate(e.data.url); };
    navigator.serviceWorker.addEventListener('message', onMsg);
    return ()=> navigator.serviceWorker.removeEventListener('message', onMsg);
  },[]);
  useEffect(()=>{
    if(!session || !pushApiSupported() || Notification.permission!=='granted') return;
    getPushSubscription().then(({sub})=>{ if(sub) saveSubscriptionToServer(sub); }).catch(()=>{});
  },[session && session.user.id]);
  return null;
}

// Shows what happened the last time a notification was tapped (written by the service worker) —
// lets us see why a tap didn't open the app, instead of guessing.
function LastTapNote(){
  const [note, setNote] = useState(null);
  useEffect(()=>{
    if(!('caches' in window)) return;
    caches.open('meraki-diag').then(c=>c.match('last-tap')).then(r=> r ? r.json() : null).then(d=>{ if(d) setNote(d); }).catch(()=>{});
  },[]);
  if(!note) return null;
  const when = new Date(note.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  return <div className="text-[10px] text-[var(--muted)] mt-2">Last notification tap: {when} — {note.result}{note.err?(' ('+note.err+')'):''}</div>;
}
