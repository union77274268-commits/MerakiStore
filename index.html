<script>
  // Some mobile browsers' "Desktop site" mode forces a wide layout viewport, which makes our
  // `min-width:900px` breakpoint fire even on an actual phone — that's what shows the desktop
  // sidebar squeezed onto a phone screen, tiny and cramped. window.screen.width/height reflect the
  // real device size and aren't affected by that mode, so we use them as a second, more reliable
  // check and force mobile layout via this class regardless of what the browser is pretending the
  // viewport is.
  (function(){
    var w = Math.min(window.screen.width||9999, window.screen.height||9999);
    if(w < 480) document.documentElement.classList.add('force-mobile-layout');
  })();
</script>

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  if(days<7) return days+'d ago';
  const weeks = Math.floor(days/7);
  if(weeks<5) return weeks+'w ago';
  const months = Math.floor(days/30);
  if(months<12) return months+'mo ago';
  return Math.floor(days/365)+'y ago';
}

// Maps a row from the real `storefront_products` view (your actual POS
// inventory) into the shape the rest of the UI already expects. Real inventory
// has no MRP/discount/rating concept, so those are left honest (no discount,
// no fabricated rating) rather than invented.
function mapDbProduct(row, ratingAgg){
  const slug = slugify(row.category);
  const meta = getCategoryMeta(row.category);
  const price = Number(row.price);
  const rawMrp = row.mrp!=null ? Number(row.mrp) : price;
  const mrp = rawMrp > price ? rawMrp : price; // only a real, admin-set MRP counts as a discount
  const discount = mrp > price ? Math.round((1 - price/mrp)*100) : 0;
  return {
    id: row.id,
    name: row.name,
    category: slug,
    categoryLabel: row.category,
    subcategory: row.subcategory || null,
    sub: row.brand || 'General',
    brand: row.brand || 'Generic',
    price,
    mrp,
    discount,
    rating: ratingAgg ? ratingAgg.sum/ratingAgg.count : 0,
    reviews: ratingAgg ? ratingAgg.count : 0,
    stock: row.stock,
    emoji: meta.icon,
    bg: meta.color,
    image: row.image_url || null,
    desc: row.description || '',
    tags: row.is_featured ? ['bestseller'] : [],
    variants: null,
  };
}

const ORDER_STATUS_STEPS = ['Order Confirmed','Preparing Your Order','Out for Delivery','Delivered'];

// Maps a row from `online_orders` (with nested online_order_items / online_payments
// via Supabase's foreign-key embedding) into the order shape the rest of the UI
// already expects.
function mapDbOrder(row, productMap){
  const items = (row.online_order_items || []).map(it=>{
    const known = productMap ? productMap[it.product_id] : null;
    return {
      id: it.product_id,
      name: it.product_name,
      qty: it.quantity,
      price: Number(it.unit_price),
      emoji: known ? known.emoji : '📦',
      bg: known ? known.bg : '#F1EBFB',
      image: known ? known.image : null,
    };
  });
  const payment = (row.online_payments && row.online_payments[0]) || null;
  const isCancelled = row.status === 'Cancelled';
  const statusIndex = isCancelled ? 0 : Math.max(0, ORDER_STATUS_STEPS.indexOf(row.status));
  return {
    id: row.id,
    shortId: 'MERAKI'+row.id.slice(0,8).toUpperCase(),
    date: row.created_at,
    items,
    subtotal: Number(row.subtotal),
    deliveryCharge: Number(row.delivery_charge),
    packagingCharge: Number(row.packaging_charge),
    total: Number(row.total),
    rewardsUsed: Number(row.discount||0),
    couponCode: row.coupon_code || null,
    couponDiscount: Number(row.coupon_discount||0),
    slot: row.delivery_slot || null,
    deliveryType: row.delivery_type,
    deliveryOtp: row.delivery_otp || null,
    paymentMethod: row.payment_method,
    paymentLabel: row.payment_method,
    paymentVerified: row.payment_status === 'paid' || row.payment_status === 'cod',
    address: row.shipping_address || {},
    status: row.status,
    statusSteps: ORDER_STATUS_STEPS,
    statusIndex,
    paymentId: payment ? payment.id : null,
  };
}

/* ============================= STORAGE ============================= */

function useLocalState(key, initial){
  const [state, setState] = useState(()=>{
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    }catch(e){ return initial; }
  });
  useEffect(()=>{
    try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
  },[key,state]);
  return [state,setState];
}

/* ============================= ROUTER ============================= */

function useHashRoute(){
  const [hash, setHash] = useState(()=> window.location.hash || '#/home');
  useEffect(()=>{
    const onHash = () => setHash(window.location.hash || '#/home');
    window.addEventListener('hashchange', onHash);
    return ()=> window.removeEventListener('hashchange', onHash);
  },[]);
  return hash;
}
function navigate(path){
  window.location.hash = path;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function parseRoute(hash){
  const clean = hash.replace(/^#/,'');
  const [pathPart, queryPart] = clean.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart){
    queryPart.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
  }
  return {parts, query};
}

  const deactivateAccount = useCallback(async ()=>{
    if(!session) return { error: new Error('Not logged in') };
    if(hasActiveOrders) return { error: new Error('You have an order that is still on the way. You can deactivate once it is delivered.') };
    const { error } = await sb.from('customer_profiles').update({ deactivated_at: new Date().toISOString() }).eq('id', session.user.id);
    if(error) return { error };
    await signOut();
    return {};
  },[session, hasActiveOrders, signOut]);
  const deleteAccount = useCallback(async ()=>{
    if(!session) return { error: new Error('Not logged in') };
    try{
      const res = await fetch(SUPABASE_URL+'/functions/v1/delete-my-account', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},
        body: JSON.stringify({ confirm:'DELETE' }),
      });
      let j = {}; try{ j = await res.json(); }catch(e){}
      if(!res.ok) return { error: new Error(j.error || 'Could not delete your account') };
      await detachPushFromThisDevice();
      await sb.auth.signOut({ scope:'local' });
      try{ ['meraki_guest_cart','meraki_guest_wishlist','meraki_address','meraki_interest_v1'].forEach(k=> localStorage.removeItem(k)); }catch(e){}
      setCustomerProfile(null);
      return {};
    }catch(e){ return { error: e }; }
  },[session]);

  const updateProfile = useCallback(async (fields)=>{
    if(!session) return { error: new Error('Not logged in') };
    const { data, error } = await sb.from('customer_profiles').update(fields).eq('id', session.user.id).select().maybeSingle();
    if(!error) setCustomerProfile(data);
    return { data, error };
  },[session]);

  const loggedIn = Boolean(session);

  // ---- Real product catalog from your POS inventory ----
  const fetchProducts = useCallback(()=>{
    setProductsLoading(true);
    Promise.all([
      sb.from('storefront_products').select('*'),
      sb.from('product_reviews').select('product_id, rating'),
    ]).then(([{data, error}, reviewsRes])=>{
      if(!error && data){
        const ratingAgg = {};
        (reviewsRes.data||[]).forEach(r=>{
          const a = ratingAgg[r.product_id] || (ratingAgg[r.product_id]={sum:0,count:0});
          a.sum += r.rating; a.count += 1;
        });
        setProducts(data.map(row=> mapDbProduct(row, ratingAgg[row.id])));
      } else if(error){
        console.error('Failed to load products from Supabase, using demo fallback', error);
        setProducts(DEFAULT_PRODUCTS);
      }
      setProductsLoading(false);
    });
  },[]);

  useEffect(()=>{ fetchProducts(); },[fetchProducts]);

  const fetchCategories = useCallback(()=>{
    sb.from('storefront_categories').select('categories').eq('owner_id', SHOP_OWNER_ID).maybeSingle().then(({data, error})=>{
      if(!error && data && Array.isArray(data.categories) && data.categories.length){
        setCategories(data.categories.map(name=> ({ id: slugify(name), name, ...getCategoryMeta(name) })));
      }
    });
  },[]);

  useEffect(()=>{ fetchCategories(); },[fetchCategories]);

  const fetchBannersAndSettings = useCallback(()=>{
    sb.from('storefront_banners').select('*').eq('active', true).order('sort_order').then(({data, error})=>{
      if(!error && data && data.length){ setBanners(data.map(mapDbBanner)); }
    });
    sb.from('storefront_settings').select('*').eq('owner_id', SHOP_OWNER_ID).maybeSingle().then(({data, error})=>{
      if(!error && data){ setStoreSettings(mapDbStoreSettings(data)); }
    });
  },[]);

  useEffect(()=>{ fetchBannersAndSettings(); },[fetchBannersAndSettings]);

  // Realtime: live product catalog + categories + storefront config, no reload needed.
  useEffect(()=>{
    const channel = sb.channel('public-storefront-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items'}, ()=> fetchProducts())
      .on('postgres_changes', {event:'*', schema:'public', table:'product_images'}, ()=> fetchProducts())
      .on('postgres_changes', {event:'*', schema:'public', table:'app_settings', filter:'owner_id=eq.'+SHOP_OWNER_ID}, ()=> fetchCategories())
      .on('postgres_changes', {event:'*', schema:'public', table:'storefront_banners'}, ()=> fetchBannersAndSettings())
      .on('postgres_changes', {event:'*', schema:'public', table:'storefront_settings'}, ()=> fetchBannersAndSettings())
      .subscribe();
    return ()=> sb.removeChannel(channel);
  },[fetchProducts, fetchCategories, fetchBannersAndSettings]);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark', darkMode);
    const meta = document.getElementById('themeColorMeta');
    if(meta) meta.setAttribute('content', darkMode ? '#050506' : '#ffffff');
  },[darkMode]);

  const showToast = useCallback((msg, icon)=>{
    setToast({msg, icon, key: uid()});
    clearTimeout(window.__meraki_toast_timer);
    window.__meraki_toast_timer = setTimeout(()=> setToast(null), 1800);
  },[]);

  const productMap = useMemo(()=>{
    const m = {}; products.forEach(p=> m[p.id]=p); return m;
  },[products]);

  // Delivers "notify me when back in stock" requests — checked once per session once products and
  // login state are both settled. No email/SMS provider in this stack, so delivery is honestly
  // in-app: a toast next time the person is here, not a push notification while they're away.
  useEffect(()=>{
    if(!session || !products.length) return;
    let cancelled = false;
    sb.from('stock_notify_requests').select('id, product_id').eq('customer_id', session.user.id).is('notified_at', null)
      .then(({data, error})=>{
        if(cancelled || error || !data || !data.length) return;
        const readyOnes = data.filter(r=>{ const p = productMap[r.product_id]; return p && p.stock>0; });
        if(!readyOnes.length) return;
        readyOnes.forEach((r,i)=> setTimeout(()=>{
          const p = productMap[r.product_id];
          if(p) showToast(`🔔 ${p.name} is back in stock!`);
        }, i*2200));
        sb.from('stock_notify_requests').update({ notified_at: new Date().toISOString() }).in('id', readyOnes.map(r=>r.id))
          .then(({error})=>{ if(error) console.error('Failed to mark stock notification as delivered', error); });
      });
    return ()=>{ cancelled = true; };
  },[session, products.length]);

  const fetchShopRules = useCallback(()=>{
    sb.rpc('get_shop_rules').then(({data, error})=>{
      if(error || !data){ if(error) console.error('Failed to load shop rules', error); return; }
      setShopRules(prev=> ({...prev, ...data}));
    });
  },[]);
  useEffect(()=>{ fetchShopRules(); },[fetchShopRules]);

  const fetchRewardBalance = useCallback(()=>{
    if(!session){ setRewardBalance(0); return; }
    sb.from('loyalty_transactions').select('amount').eq('customer_id', session.user.id)
      .then(({data, error})=>{
        if(error){ console.error('Failed to load reward balance', error); return; }
        setRewardBalance((data||[]).reduce((s,t)=>s+Number(t.amount),0));
      });
  },[session]);
  useEffect(()=>{ fetchRewardBalance(); },[fetchRewardBalance]);
  useEffect(()=>{ if(!session) setRedeemAmount(0); },[session]);

  const fetchOrders = useCallback(()=>{
    if(!session){ setOrders([]); return; }
    setOrdersLoading(true);
    sb.from('online_orders')
      .select('*, online_order_items(*), online_payments(*)')
      .eq('customer_id', session.user.id)
      .order('created_at', {ascending:false})
      .then(({data, error})=>{
        if(!error && data){
          setOrders(data.map(row=> mapDbOrder(row, productMap)));
        }
        setOrdersLoading(false);
      });
  },[session, productMap]);

  useEffect(()=>{ fetchOrders(); },[fetchOrders]);

  const fetchCart = useCallback(()=>{
    if(!session) return;
    sb.from('customer_cart_items').select('product_id, quantity').eq('customer_id', session.user.id)
      .then(({data, error})=>{
        if(!error && data) setCart(data.map(r=> ({id:r.product_id, qty:r.quantity})));
      });
  },[session]);

  const fetchWishlist = useCallback(()=>{
    if(!session) return;
    sb.from('customer_wishlist').select('product_id').eq('customer_id', session.user.id)
      .then(({data, error})=>{
        if(!error && data) setWishlist(data.map(r=> r.product_id));
      });
  },[session]);

  useEffect(()=>{
    if(!session){
      // only wipe when someone actually logs out — not on first load, where guest items were just restored
      if(wasSignedIn.current){ wasSignedIn.current = false; setCart([]); setWishlist([]); }
      return;
    }
    wasSignedIn.current = true;
    let cancelled = false;
    (async ()=>{
      const uid = session.user.id;
      const gc = readGuest('meraki_guest_cart').filter(c=> c && c.id && c.qty>0);
      const gw = readGuest('meraki_guest_wishlist').filter(x=> typeof x==='string');
      if(gc.length || gw.length){
        try{
          if(gc.length){
            const { data: ex } = await sb.from('customer_cart_items').select('product_id, quantity').eq('customer_id', uid);
            const have = Object.fromEntries((ex||[]).map(r=> [r.product_id, r.quantity]));
            await sb.from('customer_cart_items').upsert(
              gc.map(c=> ({ customer_id: uid, product_id: c.id, quantity: Math.min(20, Math.max(have[c.id]||0, c.qty)) })),
              { onConflict: 'customer_id,product_id' });
          }
          if(gw.length){
            await sb.from('customer_wishlist').upsert(gw.map(id=> ({ customer_id: uid, product_id: id })), { onConflict: 'customer_id,product_id' });
          }
        }catch(e){ console.error('Merging guest cart failed', e); }
        writeGuest('meraki_guest_cart', []); writeGuest('meraki_guest_wishlist', []);
      }
      if(!cancelled){ fetchCart(); fetchWishlist(); }
    })();
    return ()=>{ cancelled = true; };
  },[session, fetchCart, fetchWishlist]);

  // Realtime: this customer's own orders, cart, wishlist and profile — updates
  // instantly across tabs/devices (and when the admin changes an order status)
  // without needing a page reload.
  useEffect(()=>{
    if(!session) return;
    const uid = session.user.id;
    const channel = sb.channel('customer-live-'+uid)
      .on('postgres_changes', {event:'*', schema:'public', table:'online_orders', filter:'customer_id=eq.'+uid}, ()=> fetchOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_order_items'}, ()=> fetchOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'online_payments'}, ()=> fetchOrders())
      .on('postgres_changes', {event:'*', schema:'public', table:'customer_cart_items', filter:'customer_id=eq.'+uid}, ()=> fetchCart())
      .on('postgres_changes', {event:'*', schema:'public', table:'customer_wishlist', filter:'customer_id=eq.'+uid}, ()=> fetchWishlist())
      .on('postgres_changes', {event:'*', schema:'public', table:'customer_profiles', filter:'id=eq.'+uid}, ()=> fetchProfile(uid))
      .subscribe();
    return ()=> sb.removeChannel(channel);
  },[session, fetchOrders, fetchCart, fetchWishlist, fetchProfile]);

  // Cart quantities are clamped to each product's known stock (never more than what's actually in
  // inventory) — this is a client-side check using the last-synced stock number, so it's not
  // perfectly atomic against another customer buying the last unit at the exact same moment; the
  // real backstop is the fresh stock re-check placeOrder does right before creating the order.
  const addToCart = useCallback((id, qty=1)=>{
    if(!session){ openAuthSheet('cart', {type:'cart', id, qty}); return; }
    const product = productMap[id];
    const stock = product ? product.stock : 20;
    if(stock<=0){ showToast("That's out of stock right now", '⚠️'); return; }
    let finalQty = qty;
    let hitLimit = false;
    setCart(prev=>{
      const existing = prev.find(c=>c.id===id);
      const desired = existing ? existing.qty+qty : qty;
      finalQty = clamp(desired, 1, Math.min(20, stock));
      hitLimit = desired > finalQty;
      if(existing) return prev.map(c=> c.id===id ? {...c, qty: finalQty} : c);
      return [...prev, {id, qty: finalQty}];
    });
    showToast(hitLimit ? `Only ${stock} in stock — added what's available` : 'Added to cart', hitLimit ? '⚠️' : '🛒');
    if(session){
      sb.from('customer_cart_items').upsert(
        { customer_id: session.user.id, product_id: id, quantity: finalQty },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, showToast, productMap, openAuthSheet]);

  const setCartQty = useCallback((id, qty)=>{
    const product = productMap[id];
    const stock = product ? Math.max(product.stock,0) : 20;
    const clamped = clamp(qty, 0, Math.min(20, stock));
    if(qty > clamped) showToast(`Only ${stock} in stock`, '⚠️');
    setCart(prev=>{
      if(clamped<=0) return prev.filter(c=>c.id!==id);
      return prev.map(c=> c.id===id ? {...c, qty: clamped} : c);
    });
    if(!session) return;
    if(clamped<=0){
      sb.from('customer_cart_items').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    } else {
      sb.from('customer_cart_items').upsert(
        { customer_id: session.user.id, product_id: id, quantity: clamped },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, productMap, showToast]);

  const removeFromCart = useCallback((id)=>{
    setCart(prev=> prev.filter(c=>c.id!==id));
    showToast('Removed from cart','🗑️');
    if(session){
      sb.from('customer_cart_items').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Cart sync failed', error); });
    }
  },[session, showToast]);

  const toggleWishlist = useCallback((id)=>{
    if(!session){ openAuthSheet('wishlist', {type:'wish', id}); return; }
    let adding = false;
    setWishlist(prev=>{
      if(prev.includes(id)){ showToast('Removed from wishlist','💔'); adding=false; return prev.filter(x=>x!==id); }
      showToast('Added to wishlist','💜'); adding=true; return [...prev, id];
    });
    if(!session) return;
    if(adding){
      sb.from('customer_wishlist').upsert(
        { customer_id: session.user.id, product_id: id },
        { onConflict: 'customer_id,product_id' }
      ).then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    } else {
      sb.from('customer_wishlist').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    }
  },[session, showToast, openAuthSheet]);

  const moveWishlistToCart = useCallback((id)=>{
    addToCart(id,1);
    setWishlist(prev=> prev.filter(x=>x!==id));
    if(session){
      sb.from('customer_wishlist').delete().eq('customer_id', session.user.id).eq('product_id', id)
        .then(({error})=>{ if(error) console.error('Wishlist sync failed', error); });
    }
  },[addToCart, session]);

  // Whatever the shopper tried to add before signing in happens automatically once they are in.
  const actionsRef = useRef({});
  actionsRef.current = { addToCart, toggleWishlist };
  useEffect(()=>{
    if(!session) return;
    if(!pendingActionRef.current){
      // came back from Google sign-in: pick up what they were trying to do before leaving the page
      try{
        const raw = localStorage.getItem('meraki_pending_oauth'); localStorage.removeItem('meraki_pending_oauth');
        const o = raw && JSON.parse(raw);
        if(o && o.p && Date.now()-o.t < 15*60*1000) pendingActionRef.current = o.p;
      }catch(e){}
    }
    if(!pendingActionRef.current) return;
    const p = pendingActionRef.current; pendingActionRef.current = null;
    const t = setTimeout(()=>{
      if(p.type==='cart') actionsRef.current.addToCart(p.id, p.qty||1);
      else if(p.type==='wish') actionsRef.current.toggleWishlist(p.id);
    }, 1500);
    return ()=> clearTimeout(t);
  },[session]);

  const cartLines = useMemo(()=> cart
    .map(c=> ({...c, product: productMap[c.id]}))
    .filter(c=> c.product), [cart, productMap]);

  const subtotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.price*c.qty, 0), [cartLines]);
  const mrpTotal = useMemo(()=> cartLines.reduce((s,c)=> s + c.product.mrp*c.qty, 0), [cartLines]);
  const savings = mrpTotal - subtotal;
  const freeAbove = Number(shopRules.free_delivery_above);
  const deliveryCharge = subtotal===0 || deliveryType==='pickup' ? 0 : (subtotal >= freeAbove ? 0 : Number(shopRules.delivery_charge));
  const packagingCharge = subtotal===0 ? 0 : Number(shopRules.packaging_charge);
  const couponDiscount = subtotal===0 || !coupon ? 0 : Math.min(coupon.discount, subtotal);
  const minOrder = Number(shopRules.min_order||0);
  const belowMinOrder = subtotal>0 && subtotal < minOrder;
  const preRewardTotal = subtotal + deliveryCharge + packagingCharge - couponDiscount;
  // Reward redemption is clamped to what's actually available and can never make the order free —
  // the database independently re-checks the balance when the redemption transaction is written,
  // so this clamp is about a sane UI, not the actual security boundary.
  const effectiveRedeemAmount = subtotal===0 ? 0 : Math.min(redeemAmount, rewardBalance, preRewardTotal);
  const total = preRewardTotal - effectiveRedeemAmount;
  const amountToFreeDelivery = Math.max(0, freeAbove - subtotal);
  const cartCount = cart.reduce((s,c)=> s+c.qty, 0);

  const applyCoupon = useCallback(async (code)=>{
    const c = String(code||'').trim();
    if(!c) return { ok:false, message:'Enter a code' };
    const { data, error } = await sb.rpc('validate_coupon', { p_code:c, p_subtotal:subtotal });
    if(error || !data) return { ok:false, message:'Could not check the code — try again' };
    if(data.ok) setCoupon({ code:data.code, discount:Number(data.discount), message:data.message });
    return data;
  },[subtotal]);
  const removeCoupon = useCallback(()=> setCoupon(null), []);
  // keep the discount right when the cart changes (or drop the code if it no longer qualifies)
  useEffect(()=>{
    if(!coupon) return;
    if(subtotal===0){ setCoupon(null); return; }
    let off=false;
    sb.rpc('validate_coupon', { p_code:coupon.code, p_subtotal:subtotal }).then(({data})=>{
      if(off || !data) return;
      if(data.ok){ if(Number(data.discount)!==coupon.discount) setCoupon({code:data.code, discount:Number(data.discount), message:data.message}); }
      else { setCoupon(null); showToast(data.message || 'Coupon removed','🏷️'); }
    });
    return ()=>{ off=true; };
    // eslint-disable-next-line
  },[subtotal]);

  const placeOrder = useCallback(async ()=>{
    if(!session) return { error: new Error('Not logged in') };
    if(!cartLines.length) return { error: new Error('Your cart is empty') };

    const needsVerification = paymentMethod==='upi' || paymentMethod==='upiApps';
    const paymentLabel = paymentMethod==='upiApps' && upiAppChoice ? upiAppChoice.label : PAYMENT_LABELS[paymentMethod] || paymentMethod;

    // The server prices the order (products, delivery rules, coupon, rewards, stock) — nothing the
    // phone calculates is trusted.
    const { data, error } = await sb.rpc('place_order', {
      p_items: cartLines.map(c=>({ id:c.id, qty:c.qty })),
      p_address: address,
      p_delivery_type: deliveryType,
      p_payment_label: paymentLabel,
      p_payment_kind: needsVerification ? 'upi' : 'cod',
      p_redeem: effectiveRedeemAmount,
      p_coupon: coupon ? coupon.code : null,
      p_slot: deliveryType==='home' && shopRules.slots_enabled ? slot : null,
      p_upi_app: upiAppChoice ? { id: upiAppChoice.id } : null,
    });
    if(error || !data || !data.order){
      const m = String((error && error.message) || '');
      if(m.includes('stock_changed')){
        const ids = cartLines.map(c=>c.id);
        const { data: freshRows } = await sb.from('storefront_products').select('id, stock').in('id', ids);
        const fs = {}; (freshRows||[]).forEach(r=>{ fs[r.id]=r.stock; });
        cartLines.forEach(c=>{ const av = fs[c.id]||0; if(av<=0) removeFromCart(c.id); else if(av<c.qty) setCartQty(c.id, av); });
        showToast('Stock just changed for something in your cart — please review it', '⚠️');
        return { error: new Error('stock_changed') };
      }
      if(m.includes('not_serviceable')) showToast("Sorry, we don't deliver to that PIN code yet", '📍');
      else if(m.includes('min_order')) showToast('Your cart is below the minimum order amount', '⚠️');
      else if(m.includes('slot_passed')) showToast('That delivery window has just passed — please pick another', '⏰');
      else if(m.includes('slot_invalid')) showToast('Please pick a delivery time slot again', '⏰');
      else if(m.includes('coupon:')){ setCoupon(null); showToast(m.split('coupon:')[1].trim().slice(0,80) || 'Coupon is no longer valid', '🏷️'); }
      else showToast('Could not place order — please try again','⚠️');
      return { error: error || new Error('place_failed') };
    }

    const orderRow = data.order;
    const itemRows = data.items || [];
    const fullOrder = mapDbOrder({...orderRow, online_order_items: itemRows, online_payments: []}, productMap);
    setOrders(prev=> [fullOrder, ...prev]);
    setCart([]);
    setUpiAppChoice(null);
    setRedeemAmount(0);
    setCoupon(null);
    setSlot(null);
    fetchOrders(); fetchRewardBalance();
    sb.from('customer_cart_items').delete().eq('customer_id', session.user.id)
      .then(({error})=>{ if(error) console.error('Failed to clear cart after order', error); });
    return { order: fullOrder };
  },[session, cartLines, effectiveRedeemAmount, deliveryType, paymentMethod, upiAppChoice, address, coupon, slot, shopRules, productMap, setCart, setCartQty, removeFromCart, setUpiAppChoice, fetchOrders, fetchRewardBalance, showToast]);

  const verifyOrderPayment = useCallback(async (orderId)=>{
    setOrders(prev=> prev.map(o=> o.id===orderId ? {...o, paymentVerified:true} : o));
    const { error: e1 } = await sb.from('online_orders').update({ payment_status: 'paid' }).eq('id', orderId);
    const { error: e2 } = await sb.from('online_payments').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('order_id', orderId);
    if(e1 || e2){ showToast('Could not update payment status','⚠️'); }
  },[showToast]);

  const refreshAll = useCallback(async ()=>{
    fetchProducts(); fetchCategories(); fetchBannersAndSettings(); fetchShopRules();
    if(session){ fetchOrders(); fetchRewardBalance(); }
    await new Promise(r=>setTimeout(r,900));
  },[fetchProducts, fetchCategories, fetchBannersAndSettings, fetchShopRules, session, fetchOrders, fetchRewardBalance]);
  const value = {
    refreshAll, shopRules, fetchShopRules, coupon, couponDiscount, applyCoupon, removeCoupon, slot, setSlot, minOrder, belowMinOrder,
    cart, cartLines, cartCount, subtotal, mrpTotal, savings, deliveryCharge, packagingCharge, total, amountToFreeDelivery,
    rewardBalance, redeemAmount, setRedeemAmount, effectiveRedeemAmount,
    addToCart, setCartQty, removeFromCart,
    wishlist, toggleWishlist, moveWishlistToCart,
    orders, ordersLoading, placeOrder, verifyOrderPayment,
    address, setAddress, deliveryType, setDeliveryType, paymentMethod, setPaymentMethod,
    upiAppChoice, setUpiAppChoice,
    loggedIn, authLoading, session, customerProfile, profileLoading,
    signUp, signIn, signOut, updateProfile,
    authSheet, openAuthSheet, closeAuthSheet, openAuthScreen, authScreenOpen, skipAuth, guestSkipped, recovering, setRecovering, setupHidden, setSetupHidden,
    sendEmailCode, verifyEmailCode, signInWithGoogle, sendPhoneCode, verifyPhoneCode, finishAccountSetup, sendPasswordReset, verifyResetCode, updatePassword, changeEmail, verifyEmailChange,
    reactivateAccount, deactivateAccount, deleteAccount, hasActiveOrders,
    darkMode, setDarkMode,
    showToast, toast, productMap, productsLoading,
    products, categories,
    banners, storeSettings,
    viewMode, setViewMode,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

  if(h<5) return 'Still up';
  if(h<12) return 'Good morning';

}

// Lightweight 3D tilt-on-hover for product cards — only on devices with a real mouse (hover +
// fine pointer), so it never interferes with touch scrolling/tapping on phones, and it backs off
// entirely if the person has motion reduction turned on.
const TILT_ENABLED = typeof window!=='undefined' && window.matchMedia &&
  window.matchMedia('(hover:hover) and (pointer:fine)').matches &&
  !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function useTilt(){
  const ref = useRef(null);
  const onMouseMove = (e)=>{
    if(!TILT_ENABLED || !ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = (e.clientX - rect.left)/rect.width - 0.5;
    const y = (e.clientY - rect.top)/rect.height - 0.5;
    ref.current.style.transform = `perspective(800px) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*7).toFixed(2)}deg) translateY(-4px)`;
  };
  const onMouseLeave = ()=>{ if(ref.current) ref.current.style.transform = ''; };
  return { ref, onMouseMove, onMouseLeave };
}

function QuantitySelector({qty, onChange, small, max}){
  const atMax = max!=null && qty>=max;
  return (
    <div className={"inline-flex items-center border border-[var(--line)] rounded-lg overflow-hidden bg-white "+(small?'h-8':'h-9')}>
      <button aria-label="Decrease quantity" onClick={()=>onChange(qty-1)}
        className="w-8 h-full flex items-center justify-center text-[var(--purple)] font-bold hover:bg-[var(--purple-light)] focus-ring">−</button>
      <span className="w-7 text-center text-sm font-bold">{qty}</span>
      <button aria-label="Increase quantity" disabled={atMax} onClick={()=>onChange(qty+1)}
        className={"w-8 h-full flex items-center justify-center font-bold focus-ring "+(atMax ? 'text-gray-300 cursor-not-allowed' : 'text-[var(--purple)] hover:bg-[var(--purple-light)]')}>+</button>
    </div>
  );
}

function ProductImg({product, className, iconClass}){
  if(product.image){
    return (
      <div className={"placeholder-img overflow-hidden "+className} style={{background:product.bg}}>
        <img src={product.image} alt={product.name} loading="lazy" decoding="async" className="w-full h-full object-cover relative z-[1]" />
      </div>
    );
  }
  return (
    <div className={"placeholder-img "+className} style={{background:product.bg}}>
      <span className={iconClass||''} style={{position:'relative', zIndex:1}}>{product.emoji}</span>
    </div>
  );
}

function ProductCard({product}){
  const {cart, addToCart, setCartQty, wishlist, toggleWishlist} = useApp();
  const line = cart.find(c=>c.id===product.id);
  const isWished = wishlist.includes(product.id);
  const tilt = useTilt();
  const quickBuy = (e)=>{
    e.preventDefault(); e.stopPropagation();
    addToCart(product.id,1);
    navigate('#/checkout/address');
  };
  return (
    <div ref={tilt.ref} onMouseMove={tilt.onMouseMove} onMouseLeave={tilt.onMouseLeave} className="card tilt-card p-2.5 flex flex-col relative group">
      <button aria-label="Toggle wishlist" onClick={()=>toggleWishlist(product.id)}
        className="absolute top-3 right-3 z-10 w-7 h-7 rounded-full bg-white/90 shadow flex items-center justify-center focus-ring hover:scale-110 transition-transform">
        <span key={isWished} className={"pop inline-block "+(isWished ? 'text-[var(--danger)]' : 'text-gray-300')}><Icon.Heart active={isWished} /></span>
      </button>
      <div className="relative">
        <a href={"#/product/"+product.id} className="block">
          <ProductImg product={product} className="w-full aspect-square text-4xl mb-2" />
          <div className="absolute top-3 left-3 flex flex-col gap-1 items-start">
            {product.tags.includes('bestseller') && <Badge tone="amber">Bestseller</Badge>}
            {product.stock>0 && product.stock<=5 && <Badge tone="danger">Only {product.stock} left</Badge>}
          </div>
        </a>
      </div>
      <a href={"#/product/"+product.id} className="block">
        <div className="text-[13px] font-semibold leading-snug line-clamp-2 min-h-[34px]">{product.name}</div>
      </a>
      {product.variants && (
        <div className="flex gap-1 mt-1">
          {product.variants.slice(0,4).map(v=> <span key={v.id} className="w-3.5 h-3.5 rounded-full border border-black/10" style={{background:v.color}}></span>)}
        </div>
      )}
      <div className="flex items-baseline gap-1.5 mt-1">
        <span className="font-bold text-[15px]">{inr(product.price)}</span>
        {product.discount>0 && <span className="text-xs text-gray-400 line-through">{inr(product.mrp)}</span>}
        {product.discount>0 && <span className="text-xs font-bold text-[var(--danger)]">{product.discount}% OFF</span>}
      </div>
      <div className="mt-2 flex gap-1.5 items-center">
        <div className="flex-1">
          {product.stock<=0 ? (
            <button disabled className="w-full py-1.5 text-sm rounded-lg bg-gray-100 text-gray-400 font-semibold cursor-not-allowed">Out of Stock</button>
          ) : !line ? (
            <button onClick={()=>addToCart(product.id,1)}
              className="btn-primary w-full py-1.5 text-sm flex items-center justify-center gap-1 focus-ring">
              <span>+</span> Add
            </button>
          ) : (
            <div className="w-full flex justify-center"><QuantitySelector qty={line.qty} onChange={(q)=>setCartQty(product.id,q)} max={product.stock} small /></div>
          )}
        </div>
        <button aria-label="Quick buy" onClick={quickBuy} title="Quick Buy" disabled={product.stock<=0}
          className={"w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center focus-ring transition-colors "+(product.stock<=0 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-[var(--purple-light)] text-[var(--purple)] hover:bg-[var(--purple)] hover:text-white')}>
          <Icon.Bolt />
        </button>
      </div>
    </div>
  );
}

function Toast(){
  const {toast} = useApp();
  const [current, setCurrent] = useState(null);
  const [visible, setVisible] = useState(false);
  const hideTimer = useRef(null);

  useEffect(()=>{
    if(toast){
      clearTimeout(hideTimer.current);
      setCurrent(toast);
      requestAnimationFrame(()=> requestAnimationFrame(()=> setVisible(true)));
    } else if(current){
      setVisible(false);
      hideTimer.current = setTimeout(()=> setCurrent(null), 320);
    }
    return ()=> clearTimeout(hideTimer.current);
  },[toast]);

  if(!current) return null;
  return (
    <div className={"fixed z-[80] left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 bg-[var(--ink)] text-white px-4 py-2.5 rounded-full shadow-xl text-sm font-semibold flex items-center gap-2 transition-all duration-300 ease-[cubic-bezier(.34,1.56,.64,1)] "+(visible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-3 scale-90')}>
      <span>{current.icon}</span><span>{current.msg}</span>
    </div>
  );
}

// Shared voice-search hook — wraps the browser's SpeechRecognition API (Chrome/Edge/most Android
// browsers; not Safari/iOS, which has no implementation) so both the desktop and mobile search bars
// can reuse the same mic behavior instead of duplicating it.
function useVoiceSearch(onResult){
  const {showToast} = useApp();
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const SR = typeof window!=='undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  const start = useCallback(()=>{
    if(!SR){ showToast("Voice search isn't supported on this browser", '🎤'); return; }
    if(listening){ recognitionRef.current && recognitionRef.current.stop(); return; }
    const rec = new SR();
    rec.lang = 'en-IN';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = ()=> setListening(true);
    rec.onend = ()=> setListening(false);
    rec.onerror = (e)=>{
      setListening(false);
      if(e.error==='not-allowed' || e.error==='service-not-allowed') showToast("Microphone access was blocked", '🎤');
      else if(e.error!=='no-speech' && e.error!=='aborted') showToast("Couldn't hear that — try again", '🎤');
    };
    rec.onresult = (e)=>{ const transcript = e.results[0][0].transcript; if(transcript.trim()) onResult(transcript.trim()); };
    recognitionRef.current = rec;
    rec.start();
  },[SR, listening, onResult, showToast]);

  useEffect(()=>()=>{ recognitionRef.current && recognitionRef.current.stop(); },[]);

  return { listening, start, supported: !!SR };
}

// Full-screen "command palette" style search — replaces the old inline dropdown with a proper
// overlay: instant results, quick category shortcuts when empty, voice search, and Esc/backdrop to

function SearchPalette({open, onClose}){
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);
  const {products, categories} = useApp();

  useEffect(()=>{
    if(open){
      setQuery('');
      document.body.style.overflow = 'hidden';
      const t = setTimeout(()=> inputRef.current && inputRef.current.focus(), 60);
      return ()=>{ clearTimeout(t); };
    }
    document.body.style.overflow = '';
  },[open]);

  useEffect(()=>{
    if(!open) return;
    const onKey = (e)=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return ()=> document.removeEventListener('keydown', onKey);
  },[open, onClose]);

  const runSearch = ()=>{ if(query.trim()){ navigate('#/search?q='+encodeURIComponent(query.trim())); onClose(); } };
  const {listening, start} = useVoiceSearch((transcript)=>{ setQuery(transcript); navigate('#/search?q='+encodeURIComponent(transcript)); onClose(); });

  if(!open) return null;

  const term = query.trim().toLowerCase();
  const results = term ? products.filter(p=>
    p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term) || p.brand.toLowerCase().includes(term)
  ).slice(0,8) : [];

    <div className="fixed inset-0 z-[200] flex items-start justify-center pt-[10vh] px-4" onClick={onClose}>

          <span className="text-[var(--muted)] flex-shrink-0"><Icon.Search /></span>
          <input ref={inputRef} value={query} onChange={e=>setQuery(e.target.value)}
            placeholder="Search products, categories, brands..."
            className="flex-1 bg-transparent outline-none text-base min-w-0" />
          <button type="button" aria-label={listening?"Stop voice search":"Search by voice"} onClick={start}
            className={"w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center focus-ring transition-colors "+(listening?'bg-[var(--danger)] text-white animate-pulse':'text-[var(--muted)] hover:bg-[var(--purple-light)] hover:text-[var(--purple)]')}>
            <Icon.Mic />
          </button>
          <button type="button" onClick={onClose} aria-label="Close search"
            className="hidden sm:flex flex-shrink-0 text-[10px] font-bold text-[var(--muted)] border border-[var(--line)] rounded-md px-1.5 py-1 hover:bg-gray-50 focus-ring">ESC</button>
        </form>
        <div className="max-h-[60vh] overflow-y-auto">
          {!term ? (
            <div className="p-5">
              <div className="text-[11px] font-bold text-[var(--muted)] uppercase tracking-wide mb-2.5">Browse Categories</div>
              <div className="grid grid-cols-3 gap-2">
                {categories.slice(0,6).map(c=> (
                  <a key={c.id} href={"#/category/"+c.id} onClick={onClose}
                    className="flex flex-col items-center gap-1.5 p-3 rounded-xl hover:bg-[var(--purple-light)] transition-colors focus-ring">
                    <span className="text-2xl">{c.icon}</span>
                    <span className="text-[11px] font-semibold text-center">{c.name}</span>
                  </a>
                ))}
              </div>
            </div>
          ) : results.length ? (
            <div className="py-2">
              {results.map(p=> (
                <a key={p.id} href={"#/product/"+p.id} onClick={onClose}
                  className="flex items-center gap-3 px-5 py-2.5 hover:bg-[var(--purple-light)] transition-colors focus-ring">
                  <ProductImg product={p} className="w-10 h-10 text-lg rounded-lg flex-shrink-0" />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold line-clamp-1">{p.name}</div>
                    <div className="text-xs text-[var(--muted)]">{inr(p.price)}</div>
                  </div>
                </a>
              ))}
              <button onClick={runSearch} className="w-full text-left px-5 py-3 text-sm font-bold text-[var(--purple)] hover:bg-[var(--purple-light)] border-t border-[var(--line)] focus-ring">
                See all results for "{query}" →

/* ---- Native-app feel: back button closes sheets, pull-to-refresh, haptics, offline bar ---- */
const __sheetStack = [];
let __ignorePops = 0, __sheetId = 0, __popBound = false;
function __bindSheetPop(){
  if(__popBound) return; __popBound = true;
  window.addEventListener('popstate', ()=>{
    if(__ignorePops>0){ __ignorePops--; return; }
    const top = __sheetStack.pop();
    if(top){ top.popped = true; try{ top.close(); }catch(e){} }
  });
}
// Phone back button / swipe-back closes the top-most sheet or dialog instead of leaving the page.
function useBackToClose(close){
  const closeRef = useRef(close); closeRef.current = close;
  useEffect(()=>{
    if(!window.history || !history.pushState) return;
    __bindSheetPop();
    const entry = { id: ++__sheetId, popped:false, close: ()=> closeRef.current && closeRef.current() };
    try{ history.pushState({ ...(history.state||{}), sheet: entry.id }, ''); }catch(e){ return; }
    __sheetStack.push(entry);
    return ()=>{
      const i = __sheetStack.indexOf(entry);
      if(i>=0) __sheetStack.splice(i,1);
      if(!entry.popped && history.state && history.state.sheet===entry.id){ __ignorePops++; try{ history.back(); }catch(e){ __ignorePops--; } }
    };
  },[]);
}

function NativeFeel(){
  const { refreshAll } = useApp();
  const [online, setOnline] = useState(typeof navigator==='undefined' ? true : navigator.onLine!==false);
  const [pull, setPull] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const st = useRef({ y:0, x:0, active:false, dist:0 });
  const busyRef = useRef(false);
  const refreshRef = useRef(refreshAll); refreshRef.current = refreshAll;

  useEffect(()=>{ registerMerakiSW(); },[]);

  useEffect(()=>{
    const on = ()=>setOnline(true), off = ()=>setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return ()=>{ window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  },[]);

  // light tap vibration on Android (ignored where unsupported or if the user prefers reduced motion)
  useEffect(()=>{
    if(!navigator.vibrate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const onClick = (e)=>{
      const t = e.target && e.target.closest && e.target.closest('button,a,[role=button]');
      if(t && !t.disabled && !t.closest('input,textarea')) { try{ navigator.vibrate(8); }catch(err){} }
    };
    document.addEventListener('click', onClick, true);
    return ()=> document.removeEventListener('click', onClick, true);
  },[]);

  // pull down from the top of a page to refresh
  useEffect(()=>{
    const start = (e)=>{
      if(busyRef.current || window.scrollY>0 || e.touches.length!==1) return;
      if(e.target.closest && e.target.closest('.fixed,input,textarea,select,[data-no-ptr]')) return;
      st.current = { y:e.touches[0].clientY, x:e.touches[0].clientX, active:true, dist:0 };
    };
    const move = (e)=>{
      const s = st.current; if(!s.active) return;
      const dy = e.touches[0].clientY - s.y, dx = Math.abs(e.touches[0].clientX - s.x);
      if(window.scrollY>0 || dy<=0 || dx>dy){ if(dy<=0 || dx>dy){ s.active=false; s.dist=0; setPull(0); } return; }
      s.dist = Math.min(dy*0.5, 110); setPull(s.dist);
    };
    const end = async ()=>{
      const s = st.current; if(!s.active) return;
      s.active = false;
      if(s.dist>=64 && !busyRef.current){
        busyRef.current = true; setRefreshing(true); setPull(56);
        try{ await refreshRef.current(); }catch(e){}
        setRefreshing(false); busyRef.current = false;
      }
      setPull(0); s.dist = 0;
    };
    document.addEventListener('touchstart', start, {passive:true});
    document.addEventListener('touchmove', move, {passive:true});
    document.addEventListener('touchend', end, {passive:true});
    document.addEventListener('touchcancel', end, {passive:true});
    return ()=>{ document.removeEventListener('touchstart', start); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', end); document.removeEventListener('touchcancel', end); };
  },[]);

  const showPull = pull>4 || refreshing;
  return (
    <React.Fragment>
      {showPull && (
        <div style={{position:'fixed', left:0, right:0, top:'env(safe-area-inset-top)', zIndex:250, display:'flex', justifyContent:'center', pointerEvents:'none', transform:'translateY('+(Math.max(pull,8)-34)+'px)', transition: pull===0 ? 'transform .2s ease':'none'}}>
          <div style={{width:36, height:36, borderRadius:'50%', background:'#fff', boxShadow:'0 4px 14px rgba(0,0,0,.18)', display:'flex', alignItems:'center', justifyContent:'center', opacity: Math.min(1, pull/40)}}>
            <span className={refreshing?'nf-spin':''} style={{display:'block', width:18, height:18, borderRadius:'50%', border:'2.5px solid var(--purple)', borderTopColor:'transparent', transform: refreshing ? undefined : 'rotate('+(pull*4)+'deg)'}}></span>
          </div>
        </div>
      )}
      {!online && (
        <div role="status" style={{position:'fixed', left:0, right:0, bottom:0, zIndex:260, background:'#241A38', color:'#fff', fontSize:12, fontWeight:700, textAlign:'center', padding:'8px 12px calc(8px + env(safe-area-inset-bottom))'}}>
          📡 You're offline — some things may not load
        </div>
      )}
    </React.Fragment>
  );
}

function Modal({onClose, title, children}){
  const [mounted, setMounted] = useState(false);
  const [closing, setClosing] = useState(false);

  useEffect(()=>{
    const raf = requestAnimationFrame(()=> requestAnimationFrame(()=> setMounted(true)));
    return ()=> cancelAnimationFrame(raf);
  },[]);

  const requestClose = useCallback(()=>{
    setClosing(true);
    setTimeout(()=> onClose(), 260);
  },[onClose]);
  useBackToClose(requestClose);

  useEffect(()=>{
    const onEsc = (e)=>{ if(e.key==='Escape') requestClose(); };
    document.addEventListener('keydown', onEsc);
    return ()=> document.removeEventListener('keydown', onEsc);
  },[requestClose]);

  const visible = mounted && !closing;

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] flex items-end md:items-center justify-center">
      <div className={"absolute inset-0 bg-black/40 transition-opacity duration-300 "+(visible?'opacity-100':'opacity-0')} onClick={requestClose}></div>
      <div className={"relative bg-white w-full md:w-[420px] md:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto transition-all duration-300 ease-[cubic-bezier(.22,.9,.32,1)] "+
        (visible ? 'translate-y-0 md:scale-100 opacity-100' : 'translate-y-full md:translate-y-3 md:scale-95 opacity-0')}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display font-bold text-lg">{title}</h3>
          <button onClick={requestClose} aria-label="Close" className="focus-ring w-7 h-7 flex items-center justify-center rounded-full hover:bg-black/5"><Icon.Close /></button>
        </div>
        {children}
      </div>
    </div>,
    document.body
  );
}

// Fades a section in once it actually scrolls into view (rather than all at once on page load) —
// used for the trust strip near the bottom of the homepage.
function RevealOnScroll({children, className}){
  const ref = useRef(null);
  const [revealed, setRevealed] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){ setRevealed(true); obs.disconnect(); }
    }, { threshold: 0.2 });
    obs.observe(el);
    return ()=> obs.disconnect();
  },[]);
  return <div ref={ref} className={"reveal-on-scroll "+(revealed?'revealed ':'')+(className||'')}>{children}</div>;
}

function ExitIntentGuard(){
  const [show, setShow] = useState(false);

  useEffect(()=>{
    window.history.pushState({merakiExitGuard:true}, '');
    const onPopState = ()=>{
      setShow(true);
      window.history.pushState({merakiExitGuard:true}, '');
    };
    window.addEventListener('popstate', onPopState);
    return ()=> window.removeEventListener('popstate', onPopState);
  },[]);

  const onStay = ()=> setShow(false);
  const onLeave = ()=>{
    setShow(false);
    setTimeout(()=>{ window.history.go(-2); }, 50);
  };

  if(!show) return null;
  return (
    <Modal onClose={onStay} title="Leaving so soon? 🥺">
      <div className="text-center">
        <div className="text-4xl mb-2">🧸</div>

          <button onClick={onLeave} className="flex-1 btn-secondary py-2.5 text-sm focus-ring">Leave</button>
        </div>
      </div>
    </Modal>
  );
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// Reads/writes the small "recently viewed" list kept in localStorage (most-recent-first, capped).
const RECENTLY_VIEWED_KEY = 'meraki_recently_viewed_v1';
function recordRecentlyViewed(id){
  try{
    const raw = localStorage.getItem(RECENTLY_VIEWED_KEY);
    let list = raw ? JSON.parse(raw) : [];
    list = [id, ...list.filter(x=>x!==id)].slice(0,12);
    localStorage.setItem(RECENTLY_VIEWED_KEY, JSON.stringify(list));
  } catch(e){ /* localStorage unavailable — recently viewed just won't persist, not fatal */ }
}
function useRecentlyViewedIds(){
  const [ids, setIds] = useState([]);
  useEffect(()=>{
    try{ const raw = localStorage.getItem(RECENTLY_VIEWED_KEY); setIds(raw ? JSON.parse(raw) : []); }
    catch(e){ setIds([]); }
  },[]);
  return ids;
}

    setPriceMax(null);
    setBrandFilter([]);

    setSort('popular');

  },[routeParam]);

  const matchedCategory = categories.find(c=>c.id===routeParam) || categories[0];

  const base = matchedCategory ? products.filter(p=>p.category===matchedCategory.id) : products;
  const headerLabel = matchedCategory ? matchedCategory.name : 'All Products';

  // Subcategories are whatever real values exist on this category's products (set either in the
  // POS or from the storefront admin's product editor) — no separate taxonomy to maintain.
  const subcategories = useMemo(()=>{
    const counts = {};
    base.forEach(p=>{ if(p.subcategory) counts[p.subcategory] = (counts[p.subcategory]||0)+1; });
    return Object.keys(counts).sort().map(name=>({name, count:counts[name]}));

  // The real ceiling for this category's price slider — never caps products by
  // default; a filter is only "active" once the shopper actually drags it down.
  const priceCeiling = useMemo(()=> Math.max(1000, ...base.map(p=>p.price), 0), [base]);
  const effectivePriceMax = priceMax==null ? priceCeiling : priceMax;
  const priceFilterActive = priceMax!=null && priceMax < priceCeiling;

  let list = base.filter(p=> p.price<=effectivePriceMax);
  if(subcat) list = list.filter(p=>p.subcategory===subcat);

  else if(sort==='price_high') list = [...list].sort((a,b)=>b.price-a.price);

  else if(sort==='discount') list = [...list].sort((a,b)=> b.discount-a.discount);
  else list = [...list].sort((a,b)=> (b.tags.includes('bestseller')?1:0) - (a.tags.includes('bestseller')?1:0));

  const sortLabels = {popular:'Popular', price_low:'Price: Low to High', price_high:'Price: High to Low', newest:'Newest', discount:'Discount'};

  return (

function ReviewsModal({product, onClose}){
  const {session, customerProfile, orders, showToast} = useApp();
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [myRating, setMyRating] = useState(5);
  const [myComment, setMyComment] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const loadReviews = useCallback(()=>{
    setLoading(true);
    sb.from('product_reviews').select('*').eq('product_id', product.id).order('created_at', {ascending:false})
      .then(({data, error})=>{ if(!error) setReviews(data||[]); setLoading(false); });
  },[product.id]);
  useEffect(()=>{ loadReviews(); },[loadReviews]);

  // Eligible to review = a delivered order containing this product that they haven't reviewed yet —
  // reuses the orders already loaded for the Orders page rather than firing another query.
  const myReviewedOrderIds = useMemo(()=> new Set(
    session ? reviews.filter(r=>r.customer_id===session.user.id).map(r=>r.order_id) : []
  ), [reviews, session]);
  const eligibleOrder = session ? orders.find(o=> o.status==='Delivered' && o.items.some(it=>it.id===product.id) && !myReviewedOrderIds.has(o.id)) : null;

  const submitReview = ()=>{
    if(!session || !eligibleOrder) return;
    setSubmitting(true);
    const name = (customerProfile && customerProfile.full_name) ? customerProfile.full_name.trim().split(/\s+/)[0] : 'A Meraki shopper';
    sb.from('product_reviews').insert({
      product_id: product.id, customer_id: session.user.id, order_id: eligibleOrder.id,
      customer_name: name, rating: myRating, comment: myComment.trim() || null,
    }).then(({error})=>{
      setSubmitting(false);
      if(error){ showToast("Couldn't submit your review", '⚠️'); return; }
      showToast('Thanks for your review! 🌟');
      setShowForm(false); setMyComment(''); setMyRating(5);
      loadReviews();
    });
  };

  return (
    <Modal onClose={onClose} title="Ratings & Reviews">
      <div className="flex items-center gap-4 mb-4">
        <div className="text-3xl font-bold font-display">{product.reviews>0 ? product.rating.toFixed(1) : '–'}</div>
        <div>
          <StarRating rating={product.rating} />
          <div className="text-xs text-[var(--muted)] mt-0.5">{product.reviews} rating{product.reviews!==1?'s':''}</div>
        </div>
      </div>

      {eligibleOrder && !showForm && (
        <button onClick={()=>setShowForm(true)} className="btn-secondary w-full py-2.5 text-sm mb-4 focus-ring">✍️ Write a Review</button>
      )}
      {showForm && (
        <div className="card p-3 mb-4">
          <div className="text-xs font-semibold mb-1.5">Your rating</div>
          <div className="flex gap-1 mb-3">
            {[1,2,3,4,5].map(n=> (
              <button key={n} type="button" onClick={()=>setMyRating(n)} aria-label={n+" star"+(n>1?'s':'')} className="text-2xl leading-none text-amber-500 focus-ring">{n<=myRating?'★':'☆'}</button>
            ))}
          </div>
          <textarea value={myComment} onChange={e=>setMyComment(e.target.value)} placeholder="Share your experience (optional)" rows={3}
            className="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring resize-none" />
          <div className="flex gap-2 mt-2">
            <button onClick={()=>setShowForm(false)} className="btn-secondary flex-1 py-2 text-sm focus-ring">Cancel</button>
            <button onClick={submitReview} disabled={submitting} className="btn-primary flex-1 py-2 text-sm focus-ring">{submitting?'Submitting…':'Submit Review'}</button>
          </div>
        </div>
      )}

      {loading ? (
        <div className="text-center text-sm text-[var(--muted)] py-6">Loading reviews…</div>
      ) : reviews.length===0 ? (
        <div className="text-center text-sm text-[var(--muted)] py-6">No reviews yet — be the first to share your experience!</div>
      ) : (
        <div className="flex flex-col gap-3">
          {reviews.map(r=> (
            <div key={r.id} className="border-t border-[var(--line)] pt-3 first:border-0 first:pt-0">
              <div className="flex items-center justify-between">
                <span className="text-sm font-semibold">{r.customer_name || 'A shopper'}</span>
                <span className="text-[11px] text-[var(--muted)]">{timeAgo(r.created_at)}</span>
              </div>
              <div className="text-amber-500 text-xs mt-0.5">{'★'.repeat(r.rating)}{'☆'.repeat(5-r.rating)}</div>
              {r.comment && <p className="text-xs text-[var(--muted)] mt-1">{r.comment}</p>}
            </div>
          ))}
        </div>
      )}
    </Modal>
  );
}

// No email/SMS provider exists in this stack, so "notify" is delivered in-app: the request is
// stored, and checkStockNotifications() (run once per session after products load) surfaces it as
// a toast the next time the person is actually using the app with that item back in stock.
function NotifyMeButton({product}){
  const {session, showToast, openAuthSheet} = useApp();
  const [subscribed, setSubscribed] = useState(false);
  const [checking, setChecking] = useState(true);

  useEffect(()=>{
    if(!session){ setChecking(false); return; }
    sb.from('stock_notify_requests').select('id').eq('product_id', product.id).eq('customer_id', session.user.id).maybeSingle()
      .then(({data})=>{ setSubscribed(!!data); setChecking(false); });
  },[session, product.id]);

  const subscribe = ()=>{
    if(!session){ openAuthSheet('notify'); return; }
    setSubscribed(true);
    sb.from('stock_notify_requests').upsert(
      { product_id: product.id, customer_id: session.user.id },
      { onConflict: 'product_id,customer_id' }
    ).then(({error})=>{
      if(error){ setSubscribed(false); showToast("Couldn't set that up — try again", '⚠️'); }
      else showToast("We'll let you know when it's back 🔔");
    });
  };

  if(checking) return <div className="flex-1"></div>;
  return subscribed ? (
    <button disabled className="flex-1 py-3 text-sm rounded-lg bg-[var(--purple-light)] text-[var(--purple)] font-semibold cursor-default">🔔 We'll notify you</button>
  ) : (
    <button onClick={subscribe} className="btn-secondary flex-1 py-3 text-sm focus-ring">🔔 Notify Me When Available</button>
  );
}

// Simple, honest bundle suggestion — no invented discount, just a convenient "add both at once"
// for a companion product from the same category. Picks the first in-stock candidate.
function FrequentlyBoughtTogether({product, candidates}){
  const {addToCart, cart} = useApp();
  // Both halves of the bundle must be in stock — otherwise "Add Both" would silently add only one.
  if(product.stock<=0) return null;
  const companion = candidates.find(p=> p.id!==product.id && p.stock>0);
  if(!companion) return null;
  const alreadyHaveBoth = cart.some(c=>c.id===product.id) && cart.some(c=>c.id===companion.id);
  const combined = product.price + companion.price;
  return (
    <div className="mt-8">
      <div className="font-bold text-lg mb-3 font-display">Frequently Bought Together</div>
      <div className="card p-4 flex flex-col sm:flex-row sm:items-center gap-4">
        <div className="flex items-center gap-3 flex-1">
          <ProductImg product={product} className="w-16 h-16 text-2xl rounded-xl flex-shrink-0" />
          <span className="text-xl text-[var(--muted)]">+</span>
          <a href={"#/product/"+companion.id} className="flex items-center gap-2 flex-1 min-w-0 focus-ring">
            <ProductImg product={companion} className="w-16 h-16 text-2xl rounded-xl flex-shrink-0" />
            <span className="text-xs font-semibold line-clamp-2">{companion.name}</span>
          </a>
        </div>
        <div className="flex-shrink-0 text-center sm:text-right">
          <div className="text-xs text-[var(--muted)]">Combined price</div>
          <div className="font-bold text-lg mb-2">{inr(combined)}</div>
          <button
            disabled={alreadyHaveBoth}
            onClick={()=>{ addToCart(product.id,1); addToCart(companion.id,1); }}
            className="btn-primary px-5 py-2 text-sm focus-ring disabled:opacity-50">
            {alreadyHaveBoth ? 'Both in cart ✓' : 'Add Both to Cart'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Product gallery (storefront): several photos + one short clip ---------- */
function useProductMedia(productId){
  const [media, setMedia] = useState({ images: [], video: null, loaded: false });
  useEffect(()=>{
    let cancelled = false;
    setMedia({ images: [], video: null, loaded: false });
    if(!productId) return;
    // Shoppers can't read the items table directly, so media comes through a small public function
    // that only returns pictures/video for products that are visible in the store.
    sb.rpc('get_product_media', { p_product_id: productId }).then(({data})=>{
      if(cancelled) return;
      setMedia({
        images: Array.isArray(data && data.images) ? data.images.filter(Boolean) : [],
        video: (data && data.video) || null,
        loaded: true,
      });
    }).catch(()=>{ if(!cancelled) setMedia(m=>({...m, loaded:true})); });
    return ()=>{ cancelled = true; };
  },[productId]);
  return media;
}

function ProductGallery({product, children}){
  const media = useProductMedia(product.id);
  const slides = useMemo(()=>{
    const list = media.images.map(u=>({type:'image', url:u}));
    if(!list.length && product.image) list.push({type:'image', url:product.image});
    if(media.video) list.push({type:'video', url:media.video});
    return list;
  },[media, product.image]);
  const [idx, setIdx] = useState(0);
  const trackRef = useRef(null);
  const videoRef = useRef(null);
  useEffect(()=>{ setIdx(0); if(trackRef.current) trackRef.current.scrollLeft = 0; },[product.id]);

  const goTo = (i)=>{
    const el = trackRef.current; if(!el) return;
    const n = Math.max(0, Math.min(slides.length-1, i));
    el.scrollTo({ left: n*el.clientWidth, behavior:'smooth' });
    setIdx(n);
  };
  const onScroll = ()=>{
    const el = trackRef.current; if(!el || !el.clientWidth) return;
    const n = Math.round(el.scrollLeft/el.clientWidth);
    if(n!==idx){ setIdx(n); if(videoRef.current) videoRef.current.pause(); }
  };

  // Nothing extra to show — keep the original single picture look.
  if(slides.length<=1 && !(slides[0] && slides[0].type==='video')){
    return (
      <div className="relative">
        <ProductImg product={product} className="w-full aspect-square text-7xl md:rounded-2xl" />
        {children}
      </div>
    );
  }
  return (
    <div>
      <div className="relative">
        <div ref={trackRef} onScroll={onScroll} className="flex overflow-x-auto snap-x snap-mandatory rounded-2xl" style={{scrollbarWidth:'none'}}>
          {slides.map((s,i)=>(
            <div key={i} className="min-w-full snap-center aspect-square bg-black/5 flex items-center justify-center overflow-hidden">
              {s.type==='image'
                ? <img src={s.url} alt={product.name+' photo '+(i+1)} loading={i===0?'eager':'lazy'} decoding="async" className="w-full h-full object-cover" />
                : <video ref={videoRef} src={s.url+'#t=0.1'} controls playsInline preload="metadata" className="w-full h-full bg-black" style={{objectFit:'cover'}} />}
            </div>
          ))}
        </div>
        {slides.length>1 && (
          <>
            <button aria-label="Previous" onClick={()=>goTo(idx-1)} disabled={idx===0} className="hidden md:flex absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 shadow items-center justify-center focus-ring disabled:opacity-30">‹</button>
            <button aria-label="Next" onClick={()=>goTo(idx+1)} disabled={idx===slides.length-1} className="hidden md:flex absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 shadow items-center justify-center focus-ring disabled:opacity-30">›</button>
            <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5 md:hidden pointer-events-none">
              {slides.map((_,i)=> <span key={i} className="rounded-full" style={{width:i===idx?16:6, height:6, background:i===idx?'var(--purple)':'rgba(0,0,0,.25)', transition:'all .2s'}}></span>)}
            </div>
          </>
        )}
        {children}
      </div>
      <div className="flex gap-2 mt-3 overflow-x-auto pb-1" style={{scrollbarWidth:'none'}}>
        {slides.map((s,i)=>(
          <button key={i} onClick={()=>goTo(i)} aria-label={s.type==='video'?'Play video':'Photo '+(i+1)}
            className={"relative w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 border-2 focus-ring "+(i===idx?'border-[var(--purple)]':'border-transparent')}>
            {s.type==='image'
              ? <img src={s.url} alt="" loading="lazy" className="w-full h-full object-cover" />
              : <span className="w-full h-full bg-[#1b1b1f] text-white flex items-center justify-center text-xl">▶</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- Admin: manage a product's photos (up to 8) and one clip ---------- */
const MAX_PRODUCT_PHOTOS = 8;
const MAX_VIDEO_MB = 30;

async function shrinkImageToJpeg(file, maxSide=1400){
  try{
    const bmp = await createImageBitmap(file);
    const r = Math.min(1, maxSide/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*r); c.height = Math.round(bmp.height*r);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(res=> c.toBlob(res,'image/jpeg',0.86));
    if(blob) return blob;
  }catch(e){}
  return file;
}

function ProductMediaEditor({item}){
  const { showToast } = useApp();
  const [photos, setPhotos] = useState([]);   // [{id, image_url, object_path, is_primary}]
  const [video, setVideo] = useState(null);   // {id, video_url, object_path}
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState('');       // '', 'photos', 'video'

  const load = useCallback(async ()=>{
    const [imgs, vid] = await Promise.all([
      sbAdmin.from('product_images').select('id, image_url, object_path, is_primary, sort_order').eq('product_id', item.id).order('is_primary', {ascending:false}).order('sort_order').order('created_at'),
      sbAdmin.from('product_videos').select('id, video_url, object_path').eq('product_id', item.id).maybeSingle(),
    ]);
    setPhotos(imgs.data||[]); setVideo(vid.data||null); setLoading(false);
  },[item.id]);
  useEffect(()=>{ load(); },[load]);

  const addPhotos = async (e)=>{
    const files = Array.from(e.target.files||[]); e.target.value='';
    if(!files.length) return;
    const room = MAX_PRODUCT_PHOTOS - photos.length;
    if(room<=0){ showToast('Up to '+MAX_PRODUCT_PHOTOS+' photos per product','⚠️'); return; }
    const chosen = files.slice(0, room);
    if(files.length>room) showToast('Only '+room+' more photo'+(room===1?'':'s')+' fit — added the first '+room,'⚠️');
    setBusy('photos');
    let added = 0, nextOrder = photos.reduce((m,p)=>Math.max(m,p.sort_order||0),0)+1, haveMain = photos.some(p=>p.is_primary);
    for(const f of chosen){
      if(!/^image\//.test(f.type)) continue;
      const blob = await shrinkImageToJpeg(f);
      if(blob.size > 5*1024*1024){ showToast(f.name+' is too large','⚠️'); continue; }
      const path = item.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
      const { error: upErr } = await sbAdmin.storage.from('product-images').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
      if(upErr){ showToast('Upload failed','⚠️'); continue; }
      const { data: pub } = sbAdmin.storage.from('product-images').getPublicUrl(path);
      const makeMain = !haveMain;
      const { error } = await sbAdmin.from('product_images').insert({ product_id:item.id, object_path:path, image_url:pub.publicUrl, is_primary:makeMain, sort_order: makeMain?0:nextOrder++ });
      if(error){ showToast('Could not save photo','⚠️'); continue; }
      haveMain = true; added++;
    }
    await load(); setBusy('');
    if(added) showToast(added+' photo'+(added===1?'':'s')+' added','📸');
  };

  const makeMain = async (p)=>{
    if(p.is_primary) return;
    await sbAdmin.from('product_images').update({ is_primary:false }).eq('product_id', item.id);
    await sbAdmin.from('product_images').update({ is_primary:true, sort_order:0 }).eq('id', p.id);
    await load();
  };

  const removePhoto = async (p)=>{
    await sbAdmin.from('product_images').delete().eq('id', p.id);
    if(p.object_path) sbAdmin.storage.from('product-images').remove([p.object_path]);
    if(p.is_primary){
      const next = photos.find(x=>x.id!==p.id);
      if(next) await sbAdmin.from('product_images').update({ is_primary:true, sort_order:0 }).eq('id', next.id);
    }
    await load();
  };

  const addVideo = async (e)=>{
    const f = e.target.files && e.target.files[0]; e.target.value='';
    if(!f) return;
    if(!/^video\//.test(f.type)){ showToast('Please choose a video file','⚠️'); return; }
    if(f.size > MAX_VIDEO_MB*1024*1024){ showToast('Video must be under '+MAX_VIDEO_MB+'MB — a short clip (10–20 seconds) works best','⚠️'); return; }
    setBusy('video');
    const ext = (f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5) || 'mp4';
    const path = 'videos/'+item.id+'/'+Date.now()+'.'+ext;
    const { error: upErr } = await sbAdmin.storage.from('product-images').upload(path, f, { upsert:true, contentType:f.type });
    if(upErr){ setBusy(''); showToast('Video upload failed — it may be too large','⚠️'); return; }
    const { data: pub } = sbAdmin.storage.from('product-images').getPublicUrl(path);
    const old = video;
    const { error } = await sbAdmin.from('product_videos').upsert({ product_id:item.id, object_path:path, video_url:pub.publicUrl }, { onConflict:'product_id' });
    if(error){ setBusy(''); showToast('Could not save video','⚠️'); return; }
    if(old && old.object_path) sbAdmin.storage.from('product-images').remove([old.object_path]);
    await load(); setBusy(''); showToast('Video added','🎬');
  };

  const removeVideo = async ()=>{
    if(!video) return;
    await sbAdmin.from('product_videos').delete().eq('id', video.id);
    if(video.object_path) sbAdmin.storage.from('product-images').remove([video.object_path]);
    await load();
  };

  return (
    <div className="space-y-3">
      <div>
        <div className="flex items-center justify-between">
          <label className="text-xs font-semibold text-[var(--muted)]">Product photos <span className="font-normal">({photos.length}/{MAX_PRODUCT_PHOTOS})</span></label>
        </div>
        {loading ? <div className="mt-1 h-24 rounded-lg skeleton"></div> : (
          <div className="grid grid-cols-4 gap-2 mt-1.5">
            {photos.map(p=>(
              <div key={p.id} className={"relative aspect-square rounded-lg overflow-hidden border-2 "+(p.is_primary?'border-[var(--purple)]':'border-[var(--line)]')}>
                <img src={p.image_url} alt="" className="w-full h-full object-cover" />
                <button type="button" aria-label="Remove photo" onClick={()=>removePhoto(p)} className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-xs flex items-center justify-center focus-ring">✕</button>
                {p.is_primary
                  ? <span className="absolute bottom-0 inset-x-0 text-[9px] font-bold text-center text-white bg-[var(--purple)] py-0.5">MAIN</span>
                  : <button type="button" onClick={()=>makeMain(p)} className="absolute bottom-0 inset-x-0 text-[9px] font-bold text-center text-white bg-black/60 py-0.5 focus-ring">Make main</button>}
              </div>
            ))}
            {photos.length<MAX_PRODUCT_PHOTOS && (
              <label className="aspect-square rounded-lg border-2 border-dashed border-[var(--line)] flex flex-col items-center justify-center gap-0.5 cursor-pointer text-[var(--muted)] focus-ring">
                <span className="text-lg">{busy==='photos'?'⏳':'＋'}</span>
                <span className="text-[10px] font-semibold">{busy==='photos'?'Uploading':'Add photos'}</span>
                <input type="file" accept="image/*" multiple onChange={addPhotos} disabled={!!busy} className="hidden" />
              </label>
            )}
          </div>
        )}
        <div className="text-[10px] text-[var(--muted)] mt-1">The main photo shows on cards and lists; shoppers swipe through the rest on the product page. Photos are resized automatically.</div>
      </div>
      <div>
        <label className="text-xs font-semibold text-[var(--muted)]">Product video <span className="font-normal">(1 short clip, under {MAX_VIDEO_MB}MB)</span></label>
        {loading ? null : video ? (
          <div className="mt-1.5 rounded-lg overflow-hidden border border-[var(--line)] relative bg-black">
            <video src={video.video_url+'#t=0.1'} controls playsInline preload="metadata" className="w-full max-h-52" />
            <button type="button" onClick={removeVideo} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 text-white text-xs flex items-center justify-center focus-ring" aria-label="Remove video">✕</button>
          </div>
        ) : (
          <label className="mt-1.5 flex items-center justify-center gap-2 border-2 border-dashed border-[var(--line)] rounded-lg py-4 cursor-pointer text-sm font-semibold text-[var(--muted)] focus-ring">
            {busy==='video' ? '⏳ Uploading video…' : '🎬 Add a video clip'}
            <input type="file" accept="video/*" onChange={addVideo} disabled={!!busy} className="hidden" />
          </label>
        )}
      </div>
    </div>
  );
}

function ProductPage({route}){

  useEffect(()=>{ setQty(1); setVariantIdx(0); }, [id]);
  useEffect(()=>{ if(id) recordRecentlyViewed(id); }, [id]);

function ProductMoreRows({product, excludeIds}){
  const {productMap} = useApp();
  const pers = usePersonalisation();
  const recentIds = useRecentlyViewedIds();
  const skip = new Set([product.id, ...excludeIds]);
  const recent = recentIds.map(id=>productMap[id]).filter(p=>p && p.id!==product.id).slice(0,8);
  const picks = pers.ranked.filter(p=>!skip.has(p.id)).slice(0,8);
  const row = (title, list)=> list.length>0 && (
    <div className="mt-8">
      <div className="font-bold text-lg mb-3 font-display">{title}</div>
      <div className="flex gap-3 overflow-x-auto scrollbar-none snap-x-row pb-1">
        {list.map(p=> <div key={p.id} className="snap-item flex-shrink-0 w-[150px]"><ProductCard product={p} /></div>)}
      </div>
    </div>
  );
  return <>{row('Recently viewed 👀', recent)}{row('Picked for you ✨', picks)}</>;
}

function FreeDeliveryBar(){
  const {subtotal, amountToFreeDelivery, shopRules} = useApp();
  const FREE_DELIVERY_THRESHOLD = Number(shopRules.free_delivery_above);
  const pct = clamp((subtotal / FREE_DELIVERY_THRESHOLD) * 100, 0, 100);

    <div className={"rounded-xl p-3 text-sm font-semibold mb-4 "+(amountToFreeDelivery===0 ? 'bg-[var(--green-light)] text-[var(--green)]' : 'bg-[#FFF8E9] text-amber-700')}>
      {amountToFreeDelivery===0 ? '🎉 You\'ve unlocked FREE delivery!' : <span>Add {inr(amountToFreeDelivery)} more to get FREE delivery! 🚚</span>}
      <div className="h-2 bg-white/70 rounded-full mt-2 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-500" style={{width:pct+'%', background: amountToFreeDelivery===0 ? 'var(--green)' : 'var(--amber)'}}></div>
      </div>
      <div className="text-[11px] font-medium mt-1 opacity-70">{inr(Math.min(subtotal,FREE_DELIVERY_THRESHOLD))} / {inr(FREE_DELIVERY_THRESHOLD)}</div>
    </div>
  );
}

// Smoothly animates a number from its previous value to a new one (ease-out) instead of just
// popping to the new figure — used for prices/totals that change as the cart updates.
function CountUp({value, formatFn}){
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  const rafRef = useRef(null);
  const reduceMotion = typeof window!=='undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  useEffect(()=>{
    const from = prevRef.current;
    const to = value;
    if(reduceMotion || from===to){ setDisplay(to); prevRef.current = to; return; }
    const duration = 450;
    const start = performance.now();
    cancelAnimationFrame(rafRef.current);
    const tick = (now)=>{
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      setDisplay(from + (to-from)*eased);
      if(t<1) rafRef.current = requestAnimationFrame(tick);
      else { setDisplay(to); prevRef.current = to; }
    };
    rafRef.current = requestAnimationFrame(tick);
    return ()=> cancelAnimationFrame(rafRef.current);
  },[value]);
  return <>{formatFn ? formatFn(display) : Math.round(display)}</>;
}
