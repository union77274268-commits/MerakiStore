              <div className="mt-1 relative"><img src={image} alt="" className="w-full rounded-xl border border-[var(--line)] block" /><button onClick={()=>setImage('')} className="absolute top-2 right-2 bg-white/90 rounded-full w-7 h-7 text-sm focus-ring" aria-label="Remove picture">✕</button></div>
            ) : (
              <label className="mt-1 flex items-center justify-center gap-2 border border-dashed border-[var(--line)] rounded-xl py-5 text-xs font-semibold text-[var(--muted)] cursor-pointer">{uploadingImg?'Uploading…':'📷 Add a picture'}<input type="file" accept="image/*" className="hidden" onChange={onPickImage} /></label>
            )}
          </div>
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Button text (leave blank for no button)</label>
            <input value={ctaLabel} maxLength={24} onChange={e=>setCtaLabel(e.target.value)} className={inp} />
          </div>
          {ctaLabel.trim() && (
            <div>
              <label className="text-xs font-semibold text-[var(--muted)]">Button opens</label>
              <select value={destKind} onChange={e=>{ const k=e.target.value; setDestKind(k); if(k==='page') setCtaUrl('#/home'); else if(k==='category' && categories && categories[0]) setCtaUrl('#/category/'+categories[0].id); else setCtaUrl('#/home'); }} className={inp}>
                <option value="page">A page</option><option value="category">A category</option><option value="product">A product</option>
              </select>
              {destKind==='page' && <select value={ctaUrl} onChange={e=>setCtaUrl(e.target.value)} className={inp}>{STATIC_PAGES.map(([u,l])=><option key={u} value={u}>{l}</option>)}</select>}
              {destKind==='category' && <select value={ctaUrl} onChange={e=>setCtaUrl(e.target.value)} className={inp}>{(categories||[]).map(c=><option key={c.id} value={'#/category/'+c.id}>{c.name}</option>)}</select>}
              {destKind==='product' && (
                <div>
                  <input value={prodQuery} onChange={e=>setProdQuery(e.target.value)} placeholder="Search product…" className={inp} />
                  {prodMatches.map(p=><button key={p.id} type="button" onClick={()=>{ setCtaUrl('#/product/'+p.id); setProdQuery(p.name); }} className={"block w-full text-left text-xs px-3 py-2 rounded-lg mt-1 focus-ring "+(ctaUrl==='#/product/'+p.id?'bg-[var(--purple-light)] font-semibold':'hover:bg-gray-50')}>{p.name}</button>)}
                </div>
              )}
            </div>
          )}
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">Send to</label>
            <select value={audience} onChange={e=>setAudience(e.target.value)} className={inp}>
              <option value="all">All opted-in customers{counts?` (${counts.all})`:''}</option>
              <option value="buyers">Customers who have ordered{counts?` (${counts.buyers})`:''}</option>
              <option value="never">Signed up but never ordered{counts?` (${counts.never})`:''}</option>
            </select>
            {counts && counts.all===0 && <div className="text-[11px] text-amber-700 mt-1">No customer has opted in to offer emails yet ({counts.customers_with_email} have an email address). New sign-ups are asked at account setup; existing customers can turn it on under Account → Email updates.</div>}
          </div>
          <div>
            <label className="text-xs font-semibold text-[var(--muted)]">When</label>
            <div className="flex gap-2 mt-1">
              <button type="button" onClick={()=>setWhen('now')} className={"chip focus-ring"} style={when==='now'?{background:'var(--purple)',color:'#fff'}:undefined}>Send now</button>
              <button type="button" onClick={()=>setWhen('later')} className={"chip focus-ring"} style={when==='later'?{background:'var(--purple)',color:'#fff'}:undefined}>Schedule</button>
            </div>
            {when==='later' && <input type="datetime-local" min={nowLocal} value={sendAt} onChange={e=>setSendAt(e.target.value)} className={inp} />}
            {when==='later' && <div className="text-[11px] text-[var(--muted)] mt-1">Time is in your device's timezone. Scheduled emails go out within a minute of the chosen time.</div>}
          </div>
          <div className="flex gap-2 pt-1">
            <button onClick={sendTest} disabled={!ready||busy==='test'||!cfg.configured} className="btn-secondary px-4 py-2.5 text-xs focus-ring flex-shrink-0">{busy==='test'?'…':'Send me a test'}</button>
            <button onClick={()=>setConfirm(true)} disabled={!ready||!cfg.configured||audCount===0} className="btn-primary flex-1 py-2.5 text-sm focus-ring">{when==='now'?'Send now':'Schedule'}</button>
          </div>
          {confirm && (
            <div className="rounded-xl p-3 border border-[var(--line)] bg-[var(--purple-light)] text-sm">
              {when==='now' ? <>Send this to <b>{audCount ?? '…'}</b> customer{audCount===1?'':'s'} right now? This can't be undone.</> : <>Schedule for <b>{sendAt?new Date(sendAt).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}):'—'}</b> to about <b>{audCount ?? '…'}</b> customer{audCount===1?'':'s'}?</>}
              <div className="flex gap-2 mt-2"><button onClick={submit} disabled={busy==='send'} className="btn-primary px-4 py-2 text-xs focus-ring">{busy==='send'?'Working…':'Yes, confirm'}</button><button onClick={()=>setConfirm(false)} className="btn-secondary px-4 py-2 text-xs focus-ring">Go back</button></div>
            </div>
          )}
        </div>
      )}

      {tab==='history' && (
        <div className="space-y-3">
          {history.length===0 && <div className="card p-5 text-sm text-[var(--muted)]">No campaigns yet.</div>}
          {history.map(h=>(
            <div key={h.id} className="card p-4">
              <div className="flex items-start gap-2">
                <div className="flex-1 min-w-0"><div className="text-sm font-semibold break-words">{h.subject}</div>
                  <div className="text-[11px] text-[var(--muted)] mt-0.5">{h.status==='scheduled' ? 'Goes out ' : 'Created '}{new Date(h.status==='scheduled'?h.send_at:h.created_at).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}</div></div>
                <span className={"text-[10px] font-bold uppercase px-2 py-1 rounded-full flex-shrink-0 "+(statusStyle[h.status]||'')}>{h.status}</span>
              </div>
              {(h.status==='sent'||h.status==='sending'||h.status==='failed') && <div className="text-xs mt-2">{h.sent} sent{h.failed?`, ${h.failed} failed`:''}{h.total?` of ${h.total}`:''}</div>}
              {h.last_error && h.failed>0 && <div className="text-[11px] text-[var(--danger)] mt-1 break-words">Last error: {h.last_error}</div>}
              {h.status==='scheduled' && <button onClick={()=>cancelCampaign(h.id)} className="btn-secondary px-3 py-1.5 text-xs mt-2 focus-ring">Cancel</button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---- Admin: send a notification to customers ---- */
function AdminNotify(){
  const {showToast, products, categories} = useApp();
  const [destKind, setDestKind] = useState('page');
  const [prodQuery, setProdQuery] = useState('');
  const [searchTerm, setSearchTerm] = useState('');
  const STATIC_PAGES = [
    ['#/home','Home page'],['#/cart','Cart'],['#/wishlist','Wishlist'],['#/orders','My orders'],
    ['#/rewards','Rewards'],['#/account','Account & notifications'],
  ];
  const prodMatches = useMemo(()=>{
    const q = prodQuery.trim().toLowerCase();
    if(!q) return [];
    return (products||[]).filter(p=> (p.name||'').toLowerCase().includes(q)).slice(0,6);
  },[prodQuery, products]);
  const PRESETS = [
    {label:'New arrivals', title:'🆕 New arrivals just landed!', body:'Fresh stationery & toys are on the shelves. Come take a look.', url:'#/home'},
    {label:'Sale / offer', title:'🔥 Special offer this week', body:'Great picks at friendly prices — tap to shop.', url:'#/home'},
    {label:'Back to school', title:'🎒 Back-to-school is here', body:'Everything on your school list, ready to go.', url:'#/category/notebooks-diaries'},
  ];
  const [title, setTitle] = useState('');
  const [text, setText] = useState('');
  const [url, setUrl] = useState('#/home');
  const [image, setImage] = useState('');
  const [cta, setCta] = useState('Shop now');
  const [uploadingImg, setUploadingImg] = useState(false);
  const pickedProduct = useMemo(()=> (products||[]).find(p=> url==='#/product/'+p.id), [url, products]);
  const [sending, setSending] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [result, setResult] = useState(null);

  // Notification pictures look best wide (2:1) — crop to 1024×512 JPEG before upload so it's light and never squashed.
  const onPickImage = async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(!/^image\//.test(file.type)){ showToast('Please choose an image','⚠️'); return; }
    setUploadingImg(true);
    try{
      let blob = file;
      try{
        const bmp = await createImageBitmap(file);
        const W=1024, H=512, c=document.createElement('canvas'); c.width=W; c.height=H;
        const r = Math.max(W/bmp.width, H/bmp.height), w = bmp.width*r, h = bmp.height*r;
        c.getContext('2d').drawImage(bmp,(W-w)/2,(H-h)/2,w,h);
        blob = await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
      }catch(err){ /* fall back to the original file */ }
      const path = 'notifications/'+Date.now()+'.jpg';
      const { error } = await sbAdmin.storage.from('banner-images').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
      if(error) throw error;
      setImage(sbAdmin.storage.from('banner-images').getPublicUrl(path).data.publicUrl);
    }catch(err){ showToast('Image upload failed','⚠️'); }
    finally{ setUploadingImg(false); }
  };
  const send = async ()=>{
    setSending(true); setResult(null);
    const post = async ()=>{
      const { data: sess } = await sbAdmin.auth.getSession();
      if(!sess || !sess.session) throw new Error('You were signed out of the admin panel — log in again.');
      return fetch(SUPABASE_URL+'/functions/v1/send-push', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token,'apikey':SUPABASE_ANON_KEY},
        body: JSON.stringify({type:'broadcast', title: title.trim(), body: text.trim(), url, image: image || undefined, cta: cta.trim() || undefined}),
      });
    };
    try{
      let res = await post();
      if(res.status===401 || res.status===403){ await sbAdmin.auth.refreshSession(); res = await post(); }
      let j = {};
      try{ j = await res.json(); }catch(e){}
      if(!res.ok){ const msg = (j && j.error) || ('The server said no (code '+res.status+')'); showToast(msg,'⚠️'); setResult({error:msg}); }
      else { setResult(j); showToast('Sent to '+j.sent+' device'+(j.sent===1?'':'s'),'📣'); setConfirm(false); }
    }catch(e){ const msg = (e && e.message) || 'Could not reach the server'; showToast(msg,'⚠️'); setResult({error:msg}); }
    finally{ setSending(false); }
  };
  const ready = title.trim().length>0 && text.trim().length>0;

  return (
    <div className="fade-in max-w-lg">
      <div className="card p-5 space-y-3">
        <div className="text-sm text-[var(--muted)]">Send a push notification to customers who have turned on offers &amp; new-arrival alerts. It reaches their phones even when the app is closed.</div>
        <div>
          <div className="text-xs font-semibold text-[var(--muted)] mb-1.5">Quick start</div>
          <div className="flex flex-wrap gap-2">
            {PRESETS.map(pr=> <button key={pr.label} type="button" onClick={()=>{ setTitle(pr.title); setText(pr.body); setUrl(pr.url); setDestKind(pr.url.startsWith('#/category/')?'category':'page'); setResult(null); }} className="chip focus-ring">{pr.label}</button>)}
          </div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Title <span className="font-normal">({title.length}/80)</span></label>
          <input value={title} maxLength={80} onChange={e=>setTitle(e.target.value)} placeholder="e.g. 🔥 Weekend sale" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Message <span className="font-normal">({text.length}/200)</span></label>
          <textarea value={text} maxLength={200} rows={3} onChange={e=>setText(e.target.value)} placeholder="Short and clear works best" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Opens when tapped</label>
          <div className="flex flex-wrap gap-2 mt-1.5">
            {[['page','A page'],['category','A category'],['product','A product'],['search','A search']].map(([k,l])=>(
              <button key={k} type="button" onClick={()=>{
                setDestKind(k);
                if(k==='page') setUrl('#/home');
                if(k==='category') setUrl(categories && categories[0] ? '#/category/'+categories[0].id : '#/home');
                if(k==='product') setUrl('#/home');
                if(k==='search') setUrl(searchTerm.trim() ? '#/search?q='+encodeURIComponent(searchTerm.trim()) : '#/home');
              }} className={'chip focus-ring '+(destKind===k?'active':'')}>{l}</button>
            ))}
          </div>
          {destKind==='page' && (
            <select value={url} onChange={e=>setUrl(e.target.value)} className="w-full mt-2 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
              {STATIC_PAGES.map(([v,l])=> <option key={v} value={v}>{l}</option>)}
            </select>
          )}
          {destKind==='category' && (
            <select value={url} onChange={e=>setUrl(e.target.value)} className="w-full mt-2 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring">
              {(categories||[]).map(c=> <option key={c.id} value={'#/category/'+c.id}>{c.name}</option>)}
            </select>
          )}
          {destKind==='product' && (
            <div className="mt-2">
              {pickedProduct ? (
                <div className="flex items-center gap-2 rounded-lg border border-[var(--line)] p-2">
                  <div className="text-sm font-semibold flex-1 min-w-0 truncate">{pickedProduct.name}</div>
                  <button type="button" onClick={()=>{ setUrl('#/home'); setProdQuery(''); }} className="text-xs font-semibold text-[var(--purple)] focus-ring">Change</button>
                </div>
              ) : (
                <>
                  <input value={prodQuery} onChange={e=>setProdQuery(e.target.value)} placeholder="Type a product name…" className="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
                  {prodMatches.length>0 && (
                    <div className="mt-1 rounded-lg border border-[var(--line)] divide-y divide-[var(--line)] overflow-hidden">
                      {prodMatches.map(p=> <button key={p.id} type="button" onClick={()=>{ setUrl('#/product/'+p.id); setProdQuery(''); }} className="w-full text-left px-3 py-2 text-sm hover:bg-[var(--purple-light)] focus-ring">{p.name}</button>)}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
          {destKind==='search' && (
            <input value={searchTerm} onChange={e=>{ setSearchTerm(e.target.value); const t=e.target.value.trim(); setUrl(t ? '#/search?q='+encodeURIComponent(t) : '#/home'); }} placeholder="e.g. gel pens" className="w-full mt-2 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
          )}
          <div className="text-[11px] text-[var(--muted)] mt-1.5">Opens: <span className="font-semibold">{url}</span></div>
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Picture <span className="font-normal">(optional — wide pictures look best, it's cropped to 2:1)</span></label>
          {image ? (
            <div className="mt-1.5 relative">
              <img src={image} alt="Notification picture" className="w-full rounded-xl border border-[var(--line)]" style={{aspectRatio:'2 / 1', objectFit:'cover'}} />
              <button type="button" onClick={()=>setImage('')} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 text-white text-sm focus-ring" aria-label="Remove picture">✕</button>
            </div>
          ) : (
            <label className="mt-1.5 flex items-center justify-center gap-2 rounded-xl border-2 border-dashed border-[var(--line)] py-5 text-sm font-semibold text-[var(--purple)] cursor-pointer">
              {uploadingImg ? 'Uploading…' : '🖼️ Add a picture'}
              <input type="file" accept="image/*" onChange={onPickImage} disabled={uploadingImg} className="sr-only" />
            </label>
          )}
        </div>
        <div>
          <label className="text-xs font-semibold text-[var(--muted)]">Button label <span className="font-normal">({cta.length}/20)</span></label>
          <input value={cta} maxLength={20} onChange={e=>setCta(e.target.value)} placeholder="e.g. Shop now" className="w-full mt-1 border border-[var(--line)] rounded-lg px-3 py-2 text-sm focus-ring" />
        </div>
        {ready && (
          <div>
            <div className="text-[10px] font-bold text-[var(--muted)] mb-1">PREVIEW (approximate — your phone's style may differ)</div>
            <div className="rounded-2xl p-3 text-white" style={{background:'#2b2b2f'}}>
              <div className="flex items-center gap-1.5 text-[11px] opacity-80 mb-1.5"><span className="w-4 h-4 rounded-full bg-[var(--purple)] text-white flex items-center justify-center text-[9px] font-bold">M</span>Meraki · now</div>
              <div className="flex gap-2.5 items-start">
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-bold leading-snug">{title}</div>
                  <div className="text-xs opacity-80 mt-0.5 leading-snug">{text}</div>
                </div>
                <div className="w-10 h-10 rounded-lg flex-shrink-0 bg-[var(--purple)] text-white flex items-center justify-center font-bold">M</div>
              </div>
              {image && <img src={image} alt="" className="w-full rounded-xl mt-2.5" style={{aspectRatio:'2 / 1', objectFit:'cover'}} />}
              {cta.trim() && <div className="text-xs font-bold mt-2.5" style={{color:'#B9A2FF'}}>{cta.trim().toUpperCase()}</div>}
            </div>
          </div>
        )}
        {!confirm ? (
          <button disabled={!ready} onClick={()=>setConfirm(true)} className="btn-primary w-full py-2.5 focus-ring">Review &amp; send</button>
        ) : (
          <div className="rounded-xl p-3 bg-[#FFF8E9] space-y-2">
            <div className="text-sm font-semibold">Send this to all opted-in customers? This can't be undone.</div>
            <div className="flex gap-2">
              <button onClick={()=>setConfirm(false)} disabled={sending} className="btn-secondary flex-1 py-2 text-sm focus-ring">Cancel</button>
              <button onClick={send} disabled={sending} className="btn-primary flex-1 py-2 text-sm focus-ring">{sending?'Sending…':'Send now'}</button>
            </div>
          </div>
        )}
        {result && result.error && (
          <div className="text-sm rounded-xl bg-red-50 text-[var(--danger)] p-3 font-semibold">Not sent: {result.error}</div>
        )}
        {result && !result.error && (
          <div className="text-sm rounded-xl bg-[var(--green-light)] text-[var(--green)] p-3 font-semibold">
            Sent to {result.sent} of {result.total} device{result.total===1?'':'s'}{result.removed?` · ${result.removed} expired removed`:''}{result.failed?` · ${result.failed} failed`:''}.{result.errors && result.errors.length>0 && <div className="text-xs mt-1 font-normal">Details: {result.errors[0]}</div>}
          </div>
        )}
        <div className="text-[11px] text-[var(--muted)]">Order updates (confirmed, packed, out for delivery, delivered) are sent automatically whenever an order's status changes — you don't need to send those.</div>
      </div>
    </div>
  );
}

function AppShell({route, hash}){
  const {loggedIn, authLoading, storeSettings, recovering, authScreenOpen, guestSkipped, customerProfile} = useApp();
  useEffect(()=>{
    window.scrollTo({top:0, left:0, behavior:'auto'});
  },[hash]);
  if(route.parts[0]==='admin') return <AdminRoot route={route} />;
  const isCheckoutOrConfirm = route.parts[0]==='checkout' || route.parts[0]==='order-confirmation';
  if(authLoading){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center">
        <LogoBlock />
        <div className="text-xs text-[var(--muted)] mt-4">Loading…</div>
      </div>
    );
  }
  if(recovering) return <ResetPasswordScreen />;
  if(!loggedIn && (authScreenOpen || !guestSkipped)) return <LoggedOutScreen />;
  if(loggedIn && customerProfile && customerProfile.deactivated_at) return <DeactivatedScreen />;
  const transitionKey = route.parts[0]==='category' ? 'category' : hash;
  return (
    <div className="min-h-screen flex flex-col">
      <a href="#main-content" className="sr-only focus:not-sr-only fixed top-2 left-2 z-[300] bg-[var(--purple)] text-white text-sm font-semibold px-4 py-2 rounded-lg focus-ring">Skip to content</a>
      <MobileHeader route={route} />
      <DesktopHeader route={route} />
      <div className="flex-1" id="main-content" tabIndex={-1}>
        <div key={transitionKey} className="page-transition">
          <PageRouter route={route} />
        </div>
      </div>
      {!isCheckoutOrConfirm && <div className="mobile-only h-14"></div>}
      {!isCheckoutOrConfirm && <BottomNav route={route} />}
      <PushSync />
      <NativeFeel />
      <AuthSheet />
      <FinishSetupSheet />
      {storeSettings.chatbotEnabled!==false && !isCheckoutOrConfirm && <MeraAssistant />}
      <Toast />
    </div>
  );
}

function App(){
  const hash = useHashRoute();
  const route = parseRoute(hash);
  return (
    <AppProvider>
      <AppShell route={route} hash={hash} />
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
